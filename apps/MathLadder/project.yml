# XcodeGen spec. On a Mac:  brew install xcodegen && cd apps/MathLadder && xcodegen
# then open MathLadder.xcodeproj in Xcode.
name: MathLadder
options:
  bundleIdPrefix: com.missiondentalimplants
  deploymentTarget:
    iOS: "17.0"
packages:
  TutorCore:
    path: ../../packages/TutorCore
targets:
  MathLadder:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../content/math-ladder/curriculum.json
        buildPhase: resources
      - path: ../../content/handwriting/templates.json
        buildPhase: resources
    dependencies:
      - package: TutorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missiondentalimplants.mathladder
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Math Ladder"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
