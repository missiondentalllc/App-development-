 t alone, which splits the PDE into two ordinary differential equations."},{"prompt":"Eigenfunctions on [0, π] with u = 0 at both ends?","choices":["sin nx","cos nx","a straight line"],"answer":"sin nx","tier":1,"why":"X″ = −λX with X(0) = X(π) = 0 has solutions sin nx, which vanish at 0 and at π for whole n. cos nx equals 1 at 0, so it fails the boundary condition."},{"prompt":"In the heat equation, high-frequency modes","choices":["decay fastest","grow","stay constant"],"answer":"decay fastest","tier":2,"why":"The mode sin nx decays like e^(−n²t), so larger n (higher frequency) dies off much faster. That is why heat smooths things out."},{"prompt":"Heat equation on [0, π], u(x, 0) = sin 2x. Then u = e^(−kt) sin 2x with k = ?","answer":"4","tier":2,"why":"Try u = T(t) sin 2x in u_t = u_xx: T′ sin 2x = −4T sin 2x, so T = e^(−4t). Thus k = 2² = 4."},{"prompt":"The maximum principle holds for the","choices":["heat and Laplace equations","wave equation only","neither"],"answer":"heat and Laplace equations","tier":3,"why":"Solutions of the heat and Laplace equations take their maximum on the boundary (or at the initial time). Waves do not obey this: they can focus and grow at interior points."},{"prompt":"Wave equation u_tt = u_xx on [0, π] with fixed ends: angular frequency of the mode sin 3x?","answer":"3","tier":3,"why":"Try u = T(t) sin 3x: T″ = −9T, so T oscillates like cos 3t and sin 3t. The angular frequency is √9 = 3."}]},"sightPaceSeconds":30},{"id":"pde-sobolev","stage":"pde","part":2,"title":"Sobolev spaces","summary":"Functions with weak derivatives in Lᵖ.","prerequisites":["ga-lp"],"lesson":{"explanation":"Functions with weak derivatives in Lᵖ. Embedding theorems trade derivatives for integrability or continuity.","example":"H¹ functions on an interval are continuous","approaches":{"show":"Show that |x| on (−1, 1) has weak derivative equal to the sign function: integrate |x|φ′ by parts on each half and the boundary terms cancel. Since the sign function is in L², |x| is in H¹.","together":"Test the step function on (−1, 1) together. Ask: what would its weak derivative have to be (a point mass at 0)? Is that an L² function (no)? So is the step in H¹ (no), which fits the rule that H¹ functions in one dimension are continuous.","alone":"Have the learner decide alone whether f(x) = x² is in H¹(0, 1) (yes). Hint if stuck: check that f and its derivative 2x are both square-integrable."}},"practice":{"items":[{"prompt":"In one dimension, H¹ functions are","choices":["continuous","always smooth","always discontinuous"],"answer":"continuous","tier":1,"why":"In one dimension, a function with a derivative in L² can be written as an integral of that derivative, and such integrals are continuous (even Hölder with exponent 1/2). They need not be smooth."},{"prompt":"Weak derivatives are defined by integrating by parts against","choices":["smooth test functions with compact support","polynomials only","constants"],"answer":"smooth test functions with compact support","tier":1,"why":"A weak derivative g of u is defined by ∫u φ′ = −∫g φ for every smooth φ vanishing near the boundary, which is integration by parts with no boundary terms."},{"prompt":"H¹(Ω) consists of L² functions whose weak first derivatives are in","choices":["L²","L¹","C¹"],"answer":"L²","tier":2,"why":"H¹ means the function and its weak first derivatives are all square-integrable, in L². The 1 counts the derivatives, the 2 is the power."},{"prompt":"Weak derivative of |x| on (−1, 1)?","choices":["the sign function","0","|x|"],"answer":"the sign function","tier":2,"why":"|x| has slope −1 for x < 0 and +1 for x > 0. Integrating by parts against test functions confirms its weak derivative is the sign function; the corner at 0 does not matter."},{"prompt":"Is |x| in H¹(−1, 1)?","choices":["Yes","No"],"answer":"Yes","tier":3,"why":"Yes: |x| is in L², and its weak derivative, the sign function, is bounded, hence also in L²(−1, 1)."},{"prompt":"Is the step function (0 for x < 0, 1 for x ≥ 0) in H¹(−1, 1)?","choices":["Yes","No"],"answer":"No","tier":3,"why":"No: its distributional derivative is the delta spike at 0, which is not a function, let alone one in L². This matches the rule that H¹ functions in one dimension are continuous, and the step has a jump."}]},"sightPaceSeconds":30},{"id":"pde-weak","stage":"pde","part":3,"title":"Weak solutions and variational methods","summary":"Lax–Milgram gives existence for elliptic problems; energy methods prove uniqueness.","prerequisites":["pde-sobolev","ga-banach-hilbert"],"lesson":{"explanation":"Lax–Milgram gives existence for elliptic problems; energy methods prove uniqueness.","example":"−Δu = f with zero boundary values has a unique H₀¹ solution","approaches":{"show":"Take −u″ = f on (0, 1) with u(0) = u(1) = 0, multiply by a test function v and integrate by parts to get ∫u′v′ = ∫fv. Say: this is the weak form, and Lax–Milgram gives a unique u in H₀¹ because ∫(u′)² controls the norm.","together":"Prove uniqueness for the heat equation with an energy argument together. Ask: what is the time derivative of ∫u² dx (2∫u u_t dx)? After substituting u_t = u_xx and integrating by parts, what sign do you get (−2∫u_x² dx ≤ 0)? So two solutions with the same data must agree.","alone":"Have the learner write the weak form of −u″ + u = f on (0, 1) with zero boundary values alone (∫u′v′ + ∫uv = ∫fv). Hint if stuck: multiply by v, integrate, and move one derivative onto v."}},"practice":{"items":[{"prompt":"Weak solutions satisfy the PDE…","choices":["after integrating against test functions","pointwise only","never"],"answer":"after integrating against test functions","tier":1,"why":"A weak solution satisfies ∫(equation) × v = 0 for all test functions v, after moving derivatives onto v by integrating by parts. It need not have enough derivatives to satisfy the equation at each point."},{"prompt":"Multiply −u″ = f by a test function v vanishing at the ends and integrate by parts. The left side becomes","choices":["∫u′v′","∫uv","∫u″v″"],"answer":"∫u′v′","tier":1,"why":"−∫u″v = ∫u′v′ − [u′v] from the left end to the right end, and the boundary term vanishes because v = 0 there. So the left side becomes ∫u′v′."},{"prompt":"Lax–Milgram guarantees existence for problems with a bounded…","choices":["coercive bilinear form","nonlinear term","hyperbolic operator"],"answer":"coercive bilinear form","tier":2,"why":"Lax–Milgram: if a(u, v) is bounded and coercive (a(u, u) ≥ c‖u‖²) on a Hilbert space, then a(u, v) = f(v) has a unique solution for each bounded linear f."},{"prompt":"Functions in H₀¹ have boundary values equal to?","answer":"0","tier":2,"why":"H₀¹ is the closure of smooth functions vanishing near the boundary, so its functions have boundary values (traces) equal to 0."},{"prompt":"Energy method: if u solves u_t = u_xx with zero boundary values, then ∫u² dx over time is","choices":["nonincreasing","increasing","constant"],"answer":"nonincreasing","tier":3,"why":"d/dt ∫u² = 2∫u u_xx = −2∫(u_x)² ≤ 0, after integrating by parts with zero boundary values. So the energy can only go down or stay put."},{"prompt":"The bilinear form for −Δu = f on H₀¹ is","choices":["∫∇u · ∇v","∫uv only","∫Δu Δv"],"answer":"∫∇u · ∇v","tier":3,"why":"Multiply −Δu = f by v and integrate by parts: −∫Δu v = ∫∇u · ∇v since v = 0 on the boundary. So a(u, v) = ∫∇u · ∇v."}]},"sightPaceSeconds":30},{"id":"rs-category","stage":"research","part":1,"title":"Category theory","summary":"Objects, morphisms, functors, natural transformations, adjunctions; universal properties define constructions.","prerequisites":["gal-tensor"],"lesson":{"explanation":"Objects, morphisms, functors, natural transformations, adjunctions; universal properties define constructions.","example":"Free ⊣ forgetful","approaches":{"show":"Show the product A × B in sets with its projections to A and B, and draw the diagram: any set C with maps to A and B has exactly one map to A × B making both triangles commute. Say: the universal property, not the construction, defines the product.","together":"Check together that the free group functor is left adjoint to the forgetful functor. Ask: what determines a homomorphism from the free group on S to a group G (where each element of S goes)? So homomorphisms from F(S) to G match functions from S to the underlying set of G.","alone":"Have the learner identify the coproduct of two sets alone (the disjoint union). Hint if stuck: reverse every arrow in the universal property of the product."}},"practice":{"items":[{"prompt":"A functor maps objects and…","choices":["morphisms","only objects","sets"],"answer":"morphisms","tier":1,"why":"A functor sends each object to an object and each morphism f: A → B to a morphism F(A) → F(B), preserving identities and composition."},{"prompt":"In the category of sets, the morphisms are","choices":["functions","subsets","numbers"],"answer":"functions","tier":1,"why":"In the category of sets, the objects are sets and the arrows between them are functions, which compose as usual."},{"prompt":"Products are defined by a…","choices":["universal property","basis","metric"],"answer":"universal property","tier":2,"why":"A product A × B is defined by a universal property: maps into it correspond exactly to pairs of maps into A and into B. This defines it up to unique isomorphism."},{"prompt":"In the category of sets, the product of A and B is","choices":["the Cartesian product A × B","the union","the intersection"],"answer":"the Cartesian product A × B","tier":2,"why":"A function into A × B is the same as a pair of functions into A and into B, using the two coordinate projections. So the Cartesian product satisfies the universal property."},{"prompt":"The free group functor is left adjoint to","choices":["the forgetful functor from groups to sets","the identity functor","abelianization"],"answer":"the forgetful functor from groups to sets","tier":3,"why":"A group homomorphism from the free group on a set S to G is the same as a plain function from S to the underlying set of G. That is the adjunction free ⊣ forgetful."},{"prompt":"In the category of sets, the coproduct of A and B is","choices":["the disjoint union","the Cartesian product","the intersection"],"answer":"the disjoint union","tier":3,"why":"A function out of the disjoint union of A and B is the same as a pair of functions, one from A and one from B. The disjoint union keeps the copies separate even if A and B overlap."}]},"sightPaceSeconds":30},{"id":"rs-homological","stage":"research","part":1,"title":"Homological algebra","summary":"Chain complexes, derived functors (Ext, Tor), long exact sequences, spectral sequences.","prerequisites":["rs-category","gt-homology"],"lesson":{"explanation":"Chain complexes, derived functors (Ext, Tor), long exact sequences, spectral sequences.","example":"Tor₁(ℤ/n, ℤ/m) = ℤ/gcd(n, m)","approaches":{"show":"Compute Tor₁(ℤ/2, ℤ/2): resolve ℤ/2 by 0 → ℤ → ℤ → ℤ/2 → 0 with the first map multiplication by 2, tensor with ℤ/2 to get multiplication by 2 on ℤ/2, which is zero, and read off Tor₁ = ℤ/2.","together":"Compute Tor₁(ℤ/4, ℤ/6) together. Ask: which free resolution of ℤ/4 do we use (ℤ → ℤ, multiply by 4)? After tensoring with ℤ/6, what is the kernel of multiplication by 4 on ℤ/6 (the elements 0 and 3, so ℤ/2)? Check it against gcd(4, 6) = 2.","alone":"Have the learner compute Ext¹(ℤ/3, ℤ) alone (ℤ/3). Hint if stuck: apply Hom(−, ℤ) to 0 → ℤ → ℤ → ℤ/3 → 0, where the first map multiplies by 3, and take the cokernel."}},"practice":{"items":[{"prompt":"Ext and Tor are…","choices":["derived functors","groups of units","metrics"],"answer":"derived functors","tier":1,"why":"Ext and Tor come from Hom and the tensor product by taking a projective (or injective) resolution, applying the functor, and taking homology. That makes them derived functors."},{"prompt":"In a chain complex, the composition of two consecutive boundary maps is","choices":["0","the identity","a projection"],"answer":"0","tier":1,"why":"Boundary of a boundary is zero: ∂ₙ ∘ ∂ₙ₊₁ = 0. This is what lets us define homology as cycles modulo boundaries."},{"prompt":"A short exact sequence induces a…","choices":["long exact sequence","spectral gap","basis"],"answer":"long exact sequence","tier":2,"why":"Applying a derived functor or taking homology turns a short exact sequence 0 → A → B → C → 0 into a long exact sequence linked by connecting maps."},{"prompt":"Tor₁(ℤ/4, ℤ/6) ≅ ℤ/?","answer":"2","tier":2,"why":"Tor₁(ℤ/m, ℤ/n) ≅ ℤ/gcd(m, n), and gcd(4, 6) = 2, so it is ℤ/2."},{"prompt":"Ext¹(ℤ/n, ℤ) ≅","choices":["ℤ/n","0","ℤ"],"answer":"ℤ/n","tier":3,"why":"Apply Hom(−, ℤ) to 0 → ℤ → ℤ → ℤ/n → 0 (first map times n). That gives ℤ → ℤ by times n, whose cokernel is Ext¹(ℤ/n, ℤ) = ℤ/n."},{"prompt":"Tor₁(ℤ/n, M) = 0 for every n exactly when the abelian group M is","choices":["torsion-free","finite","cyclic"],"answer":"torsion-free","tier":3,"why":"Tor₁(ℤ/n, M) is the n-torsion of M, the elements with n·m = 0. It vanishes for every n exactly when M has no nonzero torsion elements, meaning M is torsion-free."}]},"sightPaceSeconds":30},{"id":"rs-alg-geometry","stage":"research","part":1,"title":"Algebraic geometry","summary":"Zero sets of polynomials; schemes generalize varieties; sheaf cohomology measures global obstructions.","prerequisites":["gal-commutative","rs-category"],"lesson":{"explanation":"Zero sets of polynomials; schemes generalize varieties; sheaf cohomology measures global obstructions.","example":"Bézout: two plane curves of degrees m, n meet in mn points (counted properly)","approaches":{"show":"Intersect the parabola y = x² with the line y = 1 (two points) and with the line y = 0 (one point counted twice) to illustrate Bézout: degrees 2 and 1 give 2 intersections, counted properly.","together":"Intersect the conics x² + y² = 1 and x² + 4y² = 4 together. Ask: what does Bézout predict (2 × 2 = 4)? Subtracting gives 3y² = 3, so y = ±1 and x = 0. Why only two points (each is a tangency, counted twice)?","alone":"Have the learner find the genus of a smooth plane curve of degree 4 alone (3). Hint if stuck: use (d − 1)(d − 2)/2."}},"practice":{"items":[{"prompt":"Hilbert's Nullstellensatz relates ideals to","choices":["varieties","groups","norms"],"answer":"varieties","tier":1,"why":"The Nullstellensatz says, over an algebraically closed field, radical ideals correspond to varieties (common zero sets). This is the dictionary between algebra and geometry."},{"prompt":"A line and a conic in the projective plane meet in how many points (with multiplicity)?","answer":"2","tier":1,"why":"Bézout: a degree 1 curve and a degree 2 curve meet in 1 × 2 = 2 points, counted with multiplicity in the projective plane."},{"prompt":"By Bézout, a conic and a cubic in the projective plane meet in how many points (with multiplicity)?","answer":"6","tier":2,"why":"Bézout: the number of intersection points is the product of degrees, 2 × 3 = 6."},{"prompt":"Two cubics in the projective plane meet in how many points (with multiplicity)?","answer":"9","tier":2,"why":"Bézout: 3 × 3 = 9 intersection points, counted with multiplicity in the projective plane."},{"prompt":"Genus of a smooth plane cubic?","answer":"1","tier":3,"why":"A smooth plane curve of degree d has genus (d − 1)(d − 2)/2. For d = 3: 2 × 1 ÷ 2 = 1, so cubics are elliptic curves."},{"prompt":"Genus of a smooth plane curve of degree 4?","answer":"3","tier":3,"why":"Use genus = (d − 1)(d − 2)/2 with d = 4: 3 × 2 ÷ 2 = 3."}]},"sightPaceSeconds":30},{"id":"rs-alg-nt","stage":"research","part":1,"title":"Algebraic number theory","summary":"Rings of integers in number fields; unique factorization of ideals; class groups; ramification.","prerequisites":["gal-galois","nt-quadratic"],"lesson":{"explanation":"Rings of integers in number fields; unique factorization of ideals; class groups; ramification.","example":"ℤ[√−5]: 6 = 2·3 = (1 + √−5)(1 − √−5)","approaches":{"show":"Write 6 = 2·3 = (1 + √−5)(1 − √−5) in ℤ[√−5] and use the norm N(a + b√−5) = a² + 5b² to show that 2, 3 and 1 ± √−5 are irreducible, since no element has norm 2 or 3. Then show ideals restore uniqueness: (6) = P²·Q·Q′ with P = (2, 1 + √−5).","together":"Factor 5 in ℤ[i] together. Ask: can 5 be written as a sum of two squares (1 + 4)? So which elements have norm 5 (2 ± i)? Check that (2 + i)(2 − i) = 4 + 1 = 5.","alone":"Have the learner factor 13 in ℤ[i] alone ((3 + 2i)(3 − 2i)). Hint if stuck: write 13 as a sum of two squares."}},"practice":{"items":[{"prompt":"ℤ[√−5] has unique factorization of elements?","choices":["No","Yes"],"answer":"No","tier":1,"why":"6 = 2·3 = (1 + √−5)(1 − √−5), and all four factors are irreducible and not unit multiples of each other (norms 4, 9, 6, 6), so factorization is not unique."},{"prompt":"The ring of integers of ℚ(i) is","choices":["ℤ[i]","ℤ","ℚ[i]"],"answer":"ℤ[i]","tier":1,"why":"i is a root of x² + 1, a monic integer polynomial, so the integers of ℚ(i) are a + bi with a, b whole numbers: ℤ[i]. ℚ[i] contains non-integers like 1/2."},{"prompt":"The class group measures failure of…","choices":["unique factorization","commutativity","continuity"],"answer":"unique factorization","tier":2,"why":"The class group is fractional ideals modulo principal ones. It is trivial exactly when the ring is a principal ideal domain, which for rings of integers means unique factorization."},{"prompt":"Class number of ℤ[i]?","answer":"1","tier":2,"why":"ℤ[i] has division with remainder (Euclidean, using the norm a² + b²), so every ideal is principal and the class group is trivial: class number 1."},{"prompt":"Class number of ℤ[√−5]?","answer":"2","tier":3,"why":"ℤ[√−5] is not a unique factorization domain, so its class number is above 1. The Minkowski bound shows every class contains an ideal of norm at most 2, so there are exactly 2 classes."},{"prompt":"In ℤ[i], the prime 5 factors as","choices":["(2 + i)(2 − i)","5 stays prime","(1 + i)²"],"answer":"(2 + i)(2 − i)","tier":3,"why":"5 = 1 mod 4, so it splits: 5 = 2² + 1² = (2 + i)(2 − i). The prime that ramifies as a unit times (1 + i)² is 2, not 5."}]},"sightPaceSeconds":30},{"id":"rs-analytic-nt","stage":"research","part":1,"title":"Analytic number theory","summary":"Uses complex analysis on ζ(s) = Σ n⁻ˢ and L-functions to study primes.","prerequisites":["ca-residues","nt-primes"],"lesson":{"explanation":"Uses complex analysis on ζ(s) = Σ n⁻ˢ and L-functions to study primes. The Riemann hypothesis is open.","example":"ζ(2) = π²/6","approaches":{"show":"Expand the Euler product (1 + 1/2ˢ + 1/4ˢ + …)(1 + 1/3ˢ + 1/9ˢ + …)⋯ to show every 1/nˢ appears exactly once by unique factorization, so ζ(s) encodes the primes. Then state ζ(2) = π²/6 and point to the line Re(s) = 1/2.","together":"Use the Euler product at s = 1 together. Ask: what does Σ 1/n do (it diverges)? What does that force the product of 1/(1 − 1/p) over primes to do (diverge too)? So are there finitely or infinitely many primes (infinitely many)?","alone":"Have the learner estimate the number of primes up to 1000 alone using x/ln x (about 145; the true count is 168). Hint if stuck: ln 1000 is about 6.9."}},"practice":{"items":[{"prompt":"ζ(2) =","choices":["π²/6","π/4","e"],"answer":"π²/6","tier":1,"why":"Euler showed 1 + 1/4 + 1/9 + … = π²/6, for example by comparing the expansion of sin x / x with its product over roots. The value π/4 is the alternating sum of 1/(odd numbers)."},{"prompt":"ζ(s) = Σ 1/nˢ. At s = 1 the series","choices":["diverges","equals 1","equals π²/6"],"answer":"diverges","tier":1,"why":"At s = 1, ζ is the harmonic series 1 + 1/2 + 1/3 + …, which grows without bound (like ln n), so it diverges."},{"prompt":"The Riemann hypothesis concerns zeros of ζ on the line","choices":["Re(s) = 1/2","Re(s) = 1","Im(s) = 0"],"answer":"Re(s) = 1/2","tier":2,"why":"The Riemann hypothesis says all nontrivial zeros of ζ have real part 1/2. Re(s) = 1 is the edge where ζ has no zeros, which gives the prime number theorem."},{"prompt":"Euler product: ζ(s) is the product over primes p of","choices":["1/(1 − p⁻ˢ)","1 − p⁻ˢ","pˢ"],"answer":"1/(1 − p⁻ˢ)","tier":2,"why":"Expand each 1/(1 − p⁻ˢ) as 1 + p⁻ˢ + p⁻²ˢ + …; multiplying over all primes produces each n⁻ˢ exactly once by unique prime factorization."},{"prompt":"ζ(4) =","choices":["π⁴/90","π⁴/6","π²/12"],"answer":"π⁴/90","tier":3,"why":"ζ(4) = 1 + 1/16 + 1/81 + … = π⁴/90 ≈ 1.082. The choice π⁴/6 ≈ 16.2 is far too big."},{"prompt":"The prime number theorem: the number of primes up to x is asymptotic to","choices":["x/ln x","ln x","√x"],"answer":"x/ln x","tier":3,"why":"The prime number theorem says the count of primes up to x behaves like x/ln x: near x, about 1 in ln x numbers is prime."}]},"sightPaceSeconds":30},{"id":"rs-representation","stage":"research","part":2,"title":"Representation theory","summary":"Groups acting linearly on vector spaces.","prerequisites":["gal-modules","aa-sylow"],"lesson":{"explanation":"Groups acting linearly on vector spaces. Characters of finite groups are orthogonal; Σ (dim)² = |G|.","example":"S₃ has irreps of dimensions 1, 1, 2","approaches":{"show":"Show the three irreducible representations of S₃: trivial, sign, and the 2-dimensional action on the plane x + y + z = 0 by permuting coordinates. Check 1² + 1² + 2² = 6 = |S₃| and that there are 3 conjugacy classes.","together":"Find the missing dimension for S₄ together. Ask: how many conjugacy classes are there (5, one per cycle type)? Which dimensions do we know (1, 1, 2, 3)? What must the last one be so the squares sum to 24 (3)?","alone":"Have the learner find how many irreducible complex representations ℤ/7 has alone (7). Hint if stuck: in an abelian group every element is its own conjugacy class."}},"practice":{"items":[{"prompt":"The number of irreducible complex representations of a finite group equals its number of","choices":["conjugacy classes","elements","subgroups"],"answer":"conjugacy classes","tier":1,"why":"Irreducible characters form an orthonormal basis of the class functions, which are functions constant on conjugacy classes. So the two counts are equal."},{"prompt":"Every group has the trivial representation. Its dimension?","answer":"1","tier":1,"why":"The trivial representation sends every group element to the number 1 acting on a 1-dimensional space."},{"prompt":"Sum of squares of irreducible representation dimensions of a group of order 24?","answer":"24","tier":2,"why":"The regular representation contains each irreducible as many times as its dimension, so the sum of squared dimensions is the group order, 24."},{"prompt":"Number of irreducible complex representations of a cyclic group of order 5?","answer":"5","tier":2,"why":"A cyclic group is abelian, so each element is its own conjugacy class: 5 classes give 5 irreducible representations, all 1-dimensional."},{"prompt":"The irreducible representations of S₃ have dimensions 1, 1 and ?","answer":"2","tier":3,"why":"Squared dimensions sum to |S₃| = 6: 1 + 1 + d² = 6, so d = 2. That is the representation of S₃ as symmetries of a triangle in the plane."},{"prompt":"S₄ has irreducible representations of dimensions 1, 1, 2, 3 and ?","answer":"3","tier":3,"why":"Squared dimensions sum to |S₄| = 24: 1 + 1 + 4 + 9 + d² = 24, so d² = 9 and d = 3."}]},"sightPaceSeconds":30},{"id":"rs-lie","stage":"research","part":2,"title":"Lie groups and Lie algebras","summary":"Smooth groups like SO(3), SU(2); their tangent Lie algebras; the exponential map; classification of simple Lie algebras.","prerequisites":["gt-manifolds","rs-representation"],"lesson":{"explanation":"Smooth groups like SO(3), SU(2); their tangent Lie algebras; the exponential map; classification of simple Lie algebras.","example":"dim SO(3) = 3","approaches":{"show":"Show the Lie algebra of SO(3) as the 3 × 3 skew-symmetric matrices, which have 3 free entries, so the dimension of SO(3) is 3. Exponentiate the generator of rotation about the z-axis to get the familiar rotation matrix with cos θ and sin θ.","together":"Compute the dimension of SO(4) together. Ask: what is its Lie algebra (4 × 4 skew-symmetric matrices)? How many entries lie above the diagonal (6)? So what is the dimension (6)?","alone":"Have the learner find the dimension of SL(3, ℝ) alone (8). Hint if stuck: its Lie algebra is the 3 × 3 matrices with trace zero, which is 9 entries minus 1 condition."}},"practice":{"items":[{"prompt":"Dimension of SO(3)?","answer":"3","tier":1,"why":"A rotation in 3-space is fixed by an axis (2 numbers) and an angle (1 number), so SO(3) is 3-dimensional. Its Lie algebra is the 3 × 3 antisymmetric matrices, also 3 entries."},{"prompt":"The Lie algebra of a Lie group is its tangent space at","choices":["the identity","infinity","every point at once"],"answer":"the identity","tier":1,"why":"The Lie algebra is the tangent space at the identity element, with the bracket coming from the group multiplication. Other tangent spaces are just translates of it."},{"prompt":"SU(2) is a double cover of","choices":["SO(3)","U(1)","SL(2, ℝ)"],"answer":"SO(3)","tier":2,"why":"SU(2) acts on 3-space by rotations, and exactly two matrices, U and −U, give each rotation. So the map SU(2) → SO(3) is 2-to-1, a double cover."},{"prompt":"Dimension of SU(2)?","answer":"3","tier":2,"why":"SU(2) is the 3-sphere of unit quaternions, so its dimension is 3. Its Lie algebra is the traceless anti-Hermitian 2 × 2 matrices, with 3 real parameters."},{"prompt":"Dimension of SO(4)?","answer":"6","tier":3,"why":"SO(n) has dimension n(n − 1)/2, the number of entries above the diagonal of an antisymmetric matrix. For n = 4: 4 × 3 ÷ 2 = 6."},{"prompt":"Dimension of SL(3, ℝ)?","answer":"8","tier":3,"why":"3 × 3 real matrices have 9 entries, and det = 1 is one condition, so SL(3, ℝ) has dimension 9 − 1 = 8."}]},"sightPaceSeconds":30},{"id":"rs-harmonic","stage":"research","part":2,"title":"Harmonic analysis","summary":"Singular integrals, Calderón–Zygmund theory, Littlewood–Paley theory, restriction problems.","prerequisites":["ga-fourier"],"lesson":{"explanation":"Singular integrals, Calderón–Zygmund theory, Littlewood–Paley theory, restriction problems.","example":"The Hilbert transform is bounded on Lᵖ for 1 < p < ∞","approaches":{"show":"Write the Hilbert transform as the principal value of (1/π)∫ f(y)/(x − y) dy and show that on the Fourier side it multiplies by −i sign(ξ), so it is bounded on L² with norm 1. Then say: Calderón–Zygmund theory extends this to Lᵖ for 1 < p < ∞.","together":"Apply the Hilbert transform to the indicator of [0, 1] together. Ask: how does Hf behave near x = 0 (like (1/π) ln|x|, which is integrable)? How does it behave for large x (like 1/(πx), which is not integrable)? So does H map L¹ into L¹ (no)?","alone":"Have the learner decide alone whether the Hilbert transform is bounded on L¹ (no). Hint if stuck: Hf for the indicator of [0, 1] decays like 1/(πx)."}},"practice":{"items":[{"prompt":"Calderón–Zygmund theory studies","choices":["singular integral operators","finite groups","prime gaps"],"answer":"singular integral operators","tier":1,"why":"Calderón–Zygmund theory studies operators like f ↦ ∫K(x − y)f(y) dy whose kernels blow up on the diagonal, such as 1/(x − y). These are singular integral operators."},{"prompt":"The Hilbert transform is an example of a","choices":["singular integral operator","differential operator","finite-rank operator"],"answer":"singular integral operator","tier":1,"why":"The Hilbert transform is the principal value integral of f(y)/(x − y) divided by π, whose kernel is singular at y = x. So it is a singular integral operator."},{"prompt":"The Hilbert transform is bounded on Lᵖ for","choices":["1 < p < ∞","p = 1 only","p = ∞ only"],"answer":"1 < p < ∞","tier":2,"why":"M. Riesz proved the Hilbert transform is bounded on Lᵖ for 1 < p < ∞. It fails at both ends, p = 1 and p = ∞."},{"prompt":"On the Fourier side, the Hilbert transform multiplies by","choices":["−i sign(ξ)","ξ²","1"],"answer":"−i sign(ξ)","tier":2,"why":"The Fourier transform of the Hilbert transform of f is −i sign(ξ) times the transform of f: it rotates positive frequencies by −90° and negative ones by +90°."},{"prompt":"Is the Hilbert transform bounded on L¹?","choices":["Yes","No"],"answer":"No","tier":3,"why":"No: the Hilbert transform of the indicator of [0, 1] behaves like 1/|x| far away, which is not integrable. It is only weakly bounded from L¹."},{"prompt":"The Hardy–Littlewood maximal operator is bounded on Lᵖ for","choices":["1 < p ≤ ∞","p = 1 only","no p"],"answer":"1 < p ≤ ∞","tier":3,"why":"The maximal function is bounded on L^∞ trivially (an average never exceeds the supremum) and on Lᵖ for 1 < p < ∞ by interpolation. At p = 1 it is only weakly bounded."}]},"sightPaceSeconds":30},{"id":"rs-ergodic","stage":"research","part":2,"title":"Ergodic theory and dynamics","summary":"Long-term averages of measure-preserving systems; Birkhoff: time averages equal space averages for ergodic systems.","prerequisites":["gp-foundations","ga-lebesgue"],"lesson":{"explanation":"Long-term averages of measure-preserving systems; Birkhoff: time averages equal space averages for ergodic systems.","example":"Irrational rotations of the circle are ergodic","approaches":{"show":"Iterate x ↦ x + √2 mod 1 from x = 0 and mark 20 points on a circle to show they spread evenly. Then show rotation by 1/4 of a turn cycles through 4 points, so its orbits do not fill the circle and it is not ergodic.","together":"Apply Birkhoff to the irrational rotation together. Ask: what is the space average of the indicator of [0, 1/3) (1/3)? Is the rotation ergodic (yes)? So what fraction of time does a typical orbit spend in [0, 1/3) (1/3)?","alone":"Have the learner find alone the long-run fraction of iterates of x ↦ 2x mod 1 landing in [0, 1/2) for almost every x (1/2). Hint if stuck: the doubling map preserves Lebesgue measure and is ergodic."}},"practice":{"items":[{"prompt":"Birkhoff's theorem: for ergodic systems, time averages equal","choices":["space averages","zero","the initial value"],"answer":"space averages","tier":1,"why":"Birkhoff's ergodic theorem: for an ergodic system, the average of f along almost every orbit equals the integral of f over the space."},{"prompt":"A measure-preserving map T satisfies μ(T⁻¹A) =","choices":["μ(A)","0","2μ(A)"],"answer":"μ(A)","tier":1,"why":"Measure-preserving means pulling a set back by T does not change its size: μ(T⁻¹A) = μ(A)."},{"prompt":"Rotation of the circle by an irrational angle is","choices":["ergodic","periodic","not measure-preserving"],"answer":"ergodic","tier":2,"why":"With an irrational angle, every orbit is dense and spreads out evenly (Weyl), and the only invariant sets have measure 0 or 1, so the rotation is ergodic."},{"prompt":"Rotation of the circle by 1/4 of a turn is","choices":["periodic, not ergodic","ergodic","mixing"],"answer":"periodic, not ergodic","tier":2,"why":"After 4 quarter-turns every point returns, so the set formed by a small arc and its 3 rotated copies is invariant with measure strictly between 0 and 1. That rules out ergodic, and so mixing too."},{"prompt":"Rotation x ↦ x + √2 mod 1. Long-run fraction of time a typical orbit spends in [0, 1/3)? (fraction)","answer":"1/3","tier":3,"why":"√2 is irrational, so the rotation is ergodic and time averages equal space averages. The fraction of time spent in [0, 1/3) equals its length, 1/3."},{"prompt":"Doubling map x ↦ 2x mod 1. Long-run fraction of iterates in [0, 1/2) for almost every x? (fraction)","answer":"1/2","tier":3,"why":"The doubling map preserves length and is ergodic, so for almost every x the fraction of iterates in [0, 1/2) equals its length, 1/2. In binary this says half the digits are 0."}]},"sightPaceSeconds":30},{"id":"rs-logic","stage":"research","part":2,"title":"Mathematical logic","summary":"Completeness and compactness of first-order logic; Gödel's incompleteness: consistent strong systems can't prove all truths.","prerequisites":["dm-logic","dm-induction"],"lesson":{"explanation":"Completeness and compactness of first-order logic; Gödel's incompleteness: consistent strong systems can't prove all truths.","example":"Peano arithmetic cannot prove its own consistency","approaches":{"show":"Sketch the halting argument: suppose a program H decides halting, build a program D that runs H on itself and does the opposite, and show D halts exactly when it does not. Say: Gödel's theorem uses the same self-reference to build a true sentence the system cannot prove.","together":"Use compactness together to show no first-order theory has exactly the finite structures as models. Ask: can we write, for each n, a sentence saying there are at least n elements (yes)? If a theory has arbitrarily large finite models, does every finite piece of the theory plus these sentences have a model (yes)? So what kind of model must exist (an infinite one)?","alone":"Have the learner state alone what Gödel's second incompleteness theorem says about Peano arithmetic (if consistent, it cannot prove its own consistency). Hint if stuck: the unprovable sentence can be taken to say that the system is consistent."}},"practice":{"items":[{"prompt":"Gödel's second incompleteness theorem: a consistent strong system cannot prove its own…","choices":["consistency","completeness","axioms"],"answer":"consistency","tier":1,"why":"Gödel's second incompleteness theorem: a consistent system strong enough for arithmetic cannot prove the statement of its own consistency."},{"prompt":"Gödel's completeness theorem: every logically valid first-order sentence is","choices":["provable","false","undecidable"],"answer":"provable","tier":1,"why":"The completeness theorem says semantic truth in every model matches provability: every valid first-order sentence has a formal proof."},{"prompt":"The halting problem is","choices":["undecidable","decidable","NP-complete"],"answer":"undecidable","tier":2,"why":"Turing showed no algorithm decides for every program and input whether it halts, by a diagonal argument: such a decider could be fed itself and contradict its own answer."},{"prompt":"Compactness: if every finite subset of a set of first-order sentences has a model, then the whole set","choices":["has a model","is inconsistent","is finite"],"answer":"has a model","tier":2,"why":"A proof uses only finitely many sentences, so if the whole set were inconsistent some finite part would be too. Thus finite satisfiability implies satisfiability."},{"prompt":"Gödel's first incompleteness theorem: a consistent, effectively axiomatized system containing arithmetic is","choices":["incomplete","complete","inconsistent"],"answer":"incomplete","tier":3,"why":"Gödel's first theorem: such a system has a sentence it can neither prove nor disprove, so it is incomplete (assuming it is consistent)."},{"prompt":"By compactness, no first-order theory has as its models exactly the","choices":["finite structures","groups","rings"],"answer":"finite structures","tier":3,"why":"If a theory had finite models of every size, compactness would give it an infinite model too. So no theory can have exactly the finite structures as its models."}]},"sightPaceSeconds":30},{"id":"rs-set-theory","stage":"research","part":3,"title":"Set theory","summary":"ZFC axioms, ordinals and cardinals, forcing.","prerequisites":["rs-logic"],"lesson":{"explanation":"ZFC axioms, ordinals and cardinals, forcing. The continuum hypothesis is independent of ZFC.","example":"|ℝ| = 2^ℵ₀ > ℵ₀","approaches":{"show":"Run Cantor's diagonal argument on a list of binary sequences: flip the n-th digit of the n-th sequence to build one missing from the list, so |ℝ| > ℵ₀. Then show the same idea gives |P(X)| > |X| for every set X.","together":"Show |ℚ| = ℵ₀ together. Ask: can we arrange positive fractions p/q in a grid by numerator and denominator (yes)? If we walk the diagonals, skipping repeats like 2/4, does every positive fraction appear (yes)? So ℚ is countable.","alone":"Have the learner find |P({a, b, c, d})| alone (16). Hint if stuck: each element is either in or out of a subset, so there are 2⁴ choices."}},"practice":{"items":[{"prompt":"Cantor: |P(X)| compared to |X| is always","choices":["strictly larger","equal","smaller"],"answer":"strictly larger","tier":1,"why":"Cantor's diagonal argument: for any map f from X to P(X), the set {x : x ∉ f(x)} is missed, so there is no surjection and |P(X)| > |X|."},{"prompt":"Which is larger?","choices":["|ℝ|","|ℕ|","they are equal"],"answer":"|ℝ|","tier":1,"why":"Cantor's diagonal argument shows the reals cannot be listed as a sequence, so |ℝ| is strictly larger than |ℕ| = ℵ₀."},{"prompt":"Is the continuum hypothesis provable in ZFC?","choices":["No — it is independent","Yes","It is false in ZFC"],"answer":"No — it is independent","tier":2,"why":"Gödel showed the continuum hypothesis cannot be disproved in ZFC, and Cohen showed it cannot be proved. So it is independent: neither provable nor refutable."},{"prompt":"|P({1, 2, 3})| = ?","answer":"8","tier":2,"why":"Each of the 3 elements is either in a subset or not, giving 2 × 2 × 2 = 2³ = 8 subsets."},{"prompt":"Is |ℚ| = ℵ₀?","choices":["Yes","No"],"answer":"Yes","tier":3,"why":"Yes: list fractions p/q by increasing |p| + q and skip repeats. That lists all rationals in a sequence, so ℚ is countable, with size ℵ₀."},{"prompt":"Which technique did Cohen use to show the continuum hypothesis is not provable in ZFC?","choices":["forcing","diagonalization","induction"],"answer":"forcing","tier":3,"why":"Cohen invented forcing in 1963 to build models of ZFC where the continuum hypothesis fails. Diagonalization proves Cantor's theorem, not independence."}]},"sightPaceSeconds":30},{"id":"rs-stochastic-calc","stage":"research","part":3,"title":"Stochastic calculus","summary":"Itô integrals against Brownian motion; Itô's formula has an extra ½f″ term; SDEs model finance and physics.","prerequisites":["gp-brownian"],"lesson":{"explanation":"Itô integrals against Brownian motion; Itô's formula has an extra ½f″ term; SDEs model finance and physics.","example":"d(B_t²) = 2B_t dB_t + dt","approaches":{"show":"Apply Itô's formula to f(B_t) = B_t²: df = f′(B_t) dB_t + ½f″(B_t) dt = 2B_t dB_t + dt. Point out that the extra dt comes from (dB_t)² = dt, which ordinary calculus does not have.","together":"Compute d(B_t³) together. Ask: what are f′ and f″ for f(x) = x³ (3x² and 6x)? Plug into Itô's formula: what is the dt term (½ · 6B_t = 3B_t)? So d(B_t³) = 3B_t² dB_t + 3B_t dt.","alone":"Have the learner use d(B_t²) = 2B_t dB_t + dt alone to find E[B_t²] (t). Hint if stuck: the integral against dB_t has expected value 0."}},"practice":{"items":[{"prompt":"(dB_t)² =","choices":["dt","0","dB_t"],"answer":"dt","tier":1,"why":"Over a small time step, (ΔB)² has mean Δt and very small variance, so summed up it behaves like dt. This is the source of Itô's extra term."},{"prompt":"In Itô calculus, dB_t · dt =","choices":["0","dt","dB_t"],"answer":"0","tier":1,"why":"dB_t is of size about √dt, so dB_t · dt is of size dt^(3/2), which vanishes faster than dt. So it counts as 0."},{"prompt":"Itô's formula differs from the ordinary chain rule by a term with","choices":["the second derivative","the first derivative only","no extra term"],"answer":"the second derivative","tier":2,"why":"Itô's formula: df(B_t) = f′(B_t) dB_t + ½f″(B_t) dt. The extra ½f″ dt term comes from (dB_t)² = dt."},{"prompt":"By Itô's formula, d(B_t²) = 2B_t dB_t + (?) dt","answer":"1","tier":2,"why":"With f(x) = x², f′ = 2x and f″ = 2, so df = 2B_t dB_t + ½ · 2 dt = 2B_t dB_t + 1·dt."},{"prompt":"E[∫₀ᵀ B_t dB_t] = ?","answer":"0","tier":3,"why":"Itô integrals of adapted, square-integrable integrands are martingales starting at 0, so their mean is 0. Check: ∫B dB = (B_T² − T)/2, with mean (T − T)/2 = 0."},{"prompt":"By Itô's formula, d(B_t³) = 3B_t² dB_t + (?)·B_t dt","answer":"3","tier":3,"why":"With f(x) = x³, f′ = 3x² and f″ = 6x, so the dt term is ½ · 6B_t = 3B_t. The coefficient is 3."}]},"sightPaceSeconds":30},{"id":"rs-operator-algebras","stage":"research","part":3,"title":"Operator algebras","summary":"C*-algebras and von Neumann algebras of operators on Hilbert space; noncommutative geometry and quantum theory.","prerequisites":["ga-spectral"],"lesson":{"explanation":"C*-algebras and von Neumann algebras of operators on Hilbert space; noncommutative geometry and quantum theory.","example":"Gelfand: commutative C*-algebras are C₀(X)","approaches":{"show":"Show the 2 × 2 complex matrices with a* the conjugate transpose and check the C*-identity ‖a*a‖ = ‖a‖² on a = [[0, 1], [0, 0]], where a*a = [[0, 0], [0, 1]] and both sides equal 1. Then show continuous functions on [0, 1] as the basic commutative example.","together":"Work out together why continuous functions on [0, 1] form a commutative C*-algebra. Ask: what is the star operation (complex conjugation)? Which norm do we use (the sup norm)? Is the sup of |f̄f| equal to the square of the sup of |f| (yes)?","alone":"Have the learner identify alone the space X that Gelfand–Naimark gives for the algebra of continuous functions on [0, 1] ([0, 1] itself). Hint if stuck: the characters of the algebra are evaluations at points."}},"practice":{"items":[{"prompt":"The C*-identity says ‖a*a‖ =","choices":["‖a‖²","‖a‖","0"],"answer":"‖a‖²","tier":1,"why":"A C*-algebra is a Banach algebra with an involution satisfying ‖a*a‖ = ‖a‖². This one identity ties the algebra to the norm and forces operator-like behavior."},{"prompt":"The n × n complex matrices with the operator norm form a","choices":["C*-algebra","field","commutative ring"],"answer":"C*-algebra","tier":1,"why":"With the conjugate transpose as the star and the operator norm, matrices satisfy ‖A*A‖ = ‖A‖², so they form a C*-algebra. It is noncommutative for n ≥ 2 and has zero divisors, so it is not a field."},{"prompt":"Gelfand–Naimark: a commutative C*-algebra is isomorphic to","choices":["continuous functions on a locally compact space","a matrix algebra","a polynomial ring"],"answer":"continuous functions on a locally compact space","tier":2,"why":"Gelfand–Naimark: every commutative C*-algebra is isomorphic to C₀(X), the continuous functions vanishing at infinity on a locally compact Hausdorff space X (its maximal ideal space)."},{"prompt":"The algebra of continuous functions on [0, 1] is a C*-algebra that is","choices":["commutative","noncommutative","finite-dimensional"],"answer":"commutative","tier":2,"why":"Pointwise multiplication of functions is commutative: f(x)g(x) = g(x)f(x). The algebra is infinite-dimensional, since it contains 1, x, x², …."},{"prompt":"Von Neumann algebras are closed in the…","choices":["weak operator topology","discrete topology","Zariski topology"],"answer":"weak operator topology","tier":3,"why":"A von Neumann algebra is a *-algebra of operators on a Hilbert space that is closed in the weak (equivalently strong) operator topology, stronger than norm closure."},{"prompt":"Double commutant theorem: a unital *-algebra of operators containing the identity is a von Neumann algebra iff it equals","choices":["its double commutant","its commutant","its center"],"answer":"its double commutant","tier":3,"why":"Von Neumann's double commutant theorem: weak closure equals the double commutant M″ (operators commuting with everything that commutes with M). So M is a von Neumann algebra exactly when M = M″."}]},"sightPaceSeconds":30},{"id":"rs-arithmetic-geometry","stage":"research","part":3,"title":"Arithmetic geometry","summary":"Rational points on varieties.","prerequisites":["rs-alg-geometry","rs-alg-nt"],"lesson":{"explanation":"Rational points on varieties. Elliptic curves: Mordell–Weil (finitely generated rational points), modularity, the BSD conjecture.","example":"y² = x³ − x","approaches":{"show":"Plot y² = x³ − x and mark the rational points (0, 0), (1, 0), (−1, 0). Show the chord-and-tangent rule: the line through two points meets the curve in a third, which is how rational points add and form a group.","together":"Find the points of order 2 on y² = x³ − x together. Ask: which points equal their own negative (those with y = 0)? Solve x³ − x = 0 (x = 0, 1, −1). With the point at infinity, how big is that subgroup (4)?","alone":"Have the learner check alone whether (2, √6) is a rational point on y² = x³ − x (no, √6 is irrational). Hint if stuck: plug in x = 2 to get y² = 6."}},"practice":{"items":[{"prompt":"Fermat's Last Theorem was proved via the modularity of","choices":["elliptic curves","quadratic forms","primes"],"answer":"elliptic curves","tier":1,"why":"Ribet showed a counterexample to Fermat would give a non-modular elliptic curve (the Frey curve), and Wiles (with Taylor) proved the needed modularity, so no counterexample exists."},{"prompt":"Which is a rational point on y² = x³ − x?","choices":["(1, 0)","(2, 2)","(1, 1)"],"answer":"(1, 0)","tier":1,"why":"Plug in: for (1, 0), 0² = 1 − 1 = 0, true. For (2, 2), 4 ≠ 8 − 2 = 6. For (1, 1), 1 ≠ 0."},{"prompt":"Mordell–Weil: the rational points of an elliptic curve over ℚ form a…","choices":["finitely generated abelian group","field","finite set always"],"answer":"finitely generated abelian group","tier":2,"why":"Mordell–Weil: the rational points form an abelian group under the chord and tangent law, and it is finitely generated: ℤʳ times a finite torsion group."},{"prompt":"How many points on y² = x³ − x have y = 0?","answer":"3","tier":2,"why":"y = 0 means x³ − x = x(x − 1)(x + 1) = 0, so x = 0, 1 or −1: three points."},{"prompt":"The BSD conjecture relates the rank of an elliptic curve to","choices":["the order of vanishing of its L-function at s = 1","the number of its integer points","its degree"],"answer":"the order of vanishing of its L-function at s = 1","tier":3,"why":"BSD conjectures the rank of the group of rational points equals the order of vanishing of the curve's L-function at s = 1."},{"prompt":"Faltings: a curve of genus at least 2 over ℚ has","choices":["finitely many <script>
// TutorCore for the web: a line-by-line port of packages/TutorCore (Swift).
// Same rules as the iPhone apps: speed-weighted comprehension, gap-first repair,
// spaced review, placement test, question generators.
"use strict";

const DAY_MS = 86400000;

// ---------- Comprehension ----------
const Comprehension = {
  questionCapSeconds: 60,
  defaultSightPace: 5,
  smoothing: 0.3,
  passThreshold: 0.70,
  masteryThreshold: 0.85,
  sightThreshold: 0.95,
  minAttemptsForMastery: 5,

  speedScore(seconds, sightPace) {
    const pace = Math.max(1, sightPace);
    if (seconds <= pace) return 1;
    if (seconds >= this.questionCapSeconds) return 0;
    return (this.questionCapSeconds - seconds) / (this.questionCapSeconds - pace);
  },

  answerScore(correct, seconds, sightPace) {
    if (!correct) return 0;
    return 0.5 + 0.5 * this.speedScore(seconds, sightPace);
  },

  record(state, correct, seconds, sightPace, now = Date.now()) {
    const s = { ...newSkillState(), ...state };
    const pace = sightPace ?? this.defaultSightPace;
    const clamped = Math.min(Math.max(seconds, 0), this.questionCapSeconds);
    const score = this.answerScore(correct, clamped, pace);
    if (s.attempts === 0 || s.provisional) s.comprehension = score;
    else s.comprehension = this.smoothing * score + (1 - this.smoothing) * s.comprehension;
    s.provisional = false;
    s.attempts += 1;
    if (correct) s.correct += 1;
    s.averageSeconds = ((s.averageSeconds ?? clamped) * (s.attempts - 1) + clamped) / s.attempts;
    s.lastPracticed = now;
    Tiers.update(s, correct);
    return SpacedReview.schedule(s, correct, clamped <= pace * 1.5, now);
  },

  level(s) {
    s = s || newSkillState();
    if (s.attempts === 0 && !s.provisional) return "new";
    // Mastered and sight-level need the Challenge tier: the skill at full difficulty.
    const top = Tiers.current(s) === 3;
    if (top && s.comprehension >= this.sightThreshold && s.attempts >= this.minAttemptsForMastery) return "sight";
    if (top && s.comprehension >= this.masteryThreshold && (s.attempts >= this.minAttemptsForMastery || s.provisional)) return "mastered";
    if (s.comprehension >= this.passThreshold) return "passing";
    return "learning";
  },

  /** 100% mastered: sight-level (right, fast, at full difficulty). */
  isFullyMastered(s) { return this.level(s) === "sight"; },

  isPassed(s) { return (s?.comprehension ?? 0) >= this.passThreshold; },

  levelLabel: { new: "Not started", learning: "Learning", passing: "Passing", mastered: "Mastered", sight: "Sight-level" },
