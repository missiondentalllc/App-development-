ems":[{"prompt":"π₁ of the circle is","choices":["ℤ","trivial","ℤ₂"],"answer":"ℤ","tier":1,"why":"A loop on the circle is classified by how many times it winds around, counted with sign. Winding numbers add when loops are joined, giving ℤ."},{"prompt":"π₁ of a single point is","choices":["trivial","ℤ","ℤ × ℤ"],"answer":"trivial","tier":1,"why":"A point has only one loop, the constant loop. So the fundamental group has just one element: it is trivial."},{"prompt":"π₁ of the 2-sphere is","choices":["trivial","ℤ","ℤ × ℤ"],"answer":"trivial","tier":2,"why":"Any loop on the sphere can be slid off some point it misses and then shrunk down to a point. So every loop is trivial and π₁ is trivial."},{"prompt":"π₁ of the plane ℝ² is","choices":["trivial","ℤ","ℤ × ℤ"],"answer":"trivial","tier":2,"why":"The plane can be shrunk straight to a point: any loop can be pulled to the origin along straight lines. So π₁(ℝ²) is trivial."},{"prompt":"π₁ of the torus is","choices":["ℤ × ℤ","ℤ","trivial"],"answer":"ℤ × ℤ","tier":3,"why":"The torus is a circle times a circle, and π₁ of a product is the product of the π₁'s. So π₁ = ℤ × ℤ: one winding number around each circle."},{"prompt":"π₁ of the plane with the origin removed is","choices":["ℤ","trivial","ℤ × ℤ"],"answer":"ℤ","tier":3,"why":"The punctured plane shrinks down onto a circle around the origin. Loops are counted by how many times they wind around the missing point, so π₁ = ℤ."}]},"sightPaceSeconds":25},{"id":"na-floating","stage":"numerical","part":1,"title":"Floating point and error","summary":"Computers store numbers with limited precision; subtracting nearly equal numbers loses accuracy.","prerequisites":["g8-scientific"],"lesson":{"explanation":"Computers store numbers with limited precision; subtracting nearly equal numbers loses accuracy.","example":"0.1 + 0.2 ≠ 0.3 in binary floating point","approaches":{"show":"Type 0.1 + 0.2 into a calculator or programming language that shows 17 digits and read off 0.30000000000000004. Then compute 1.000001 − 1.000000 and show only one significant digit survives.","together":"Rewrite √(x + 1) − √x for x = 10⁸ together. Ask: what happens when we subtract two nearly equal numbers? What do we get if we multiply top and bottom by √(x + 1) + √x? (1/(√(x + 1) + √x).)","alone":"Have them choose how many decimal digits double precision holds alone. Hint if stuck: machine epsilon is about 10⁻¹⁶."}},"practice":{"items":[{"prompt":"Double precision has about how many decimal digits?","choices":["16","8","32"],"answer":"16","tier":1,"why":"Double precision stores a 53-bit binary significand. Since 2⁵³ is about 9 × 10¹⁵, that gives about 15 to 16 decimal digits."},{"prompt":"Is 0.1 stored exactly in binary floating point?","choices":["No","Yes"],"answer":"No","tier":1,"why":"In binary, 0.1 is 0.000110011001100… repeating forever, like 1/3 in decimal. A finite number of bits must cut it off, so it is stored only approximately."},{"prompt":"Subtracting two nearly equal numbers causes","choices":["catastrophic cancellation","overflow","exact results"],"answer":"catastrophic cancellation","tier":2,"why":"When two nearly equal numbers are subtracted, their matching leading digits cancel, and what remains is mostly rounding error. This is called catastrophic cancellation."},{"prompt":"Which computation loses the most relative accuracy?","choices":["1.000001 − 1.000000","1000 + 0.5","2 × 3"],"answer":"1.000001 − 1.000000","tier":2,"why":"1.000001 − 1.000000 cancels the first six matching digits, so any rounding error in the inputs becomes huge compared with the small answer 0.000001. Adding 0.5 to 1000 or multiplying 2 × 3 keeps full relative accuracy."},{"prompt":"To compute √(x + 1) − √x for large x without cancellation, use","choices":["1/(√(x + 1) + √x)","√(x + 1) + √x","1/√x"],"answer":"1/(√(x + 1) + √x)","tier":3,"why":"Multiply by (√(x + 1) + √x)/(√(x + 1) + √x): the top becomes (x + 1) − x = 1. So the expression equals 1/(√(x + 1) + √x), which has no subtraction of close numbers."},{"prompt":"Machine epsilon in double precision is about","choices":["10⁻¹⁶","10⁻⁸","10⁻³²"],"answer":"10⁻¹⁶","tier":3,"why":"Machine epsilon is the gap between 1 and the next double, 2⁻⁵² ≈ 2.2 × 10⁻¹⁶. That is about 10⁻¹⁶, matching about 16 correct digits."}]},"sightPaceSeconds":15},{"id":"na-newton","stage":"numerical","part":1,"title":"Newton's method","summary":"xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ).","prerequisites":["c1-chain-rule"],"lesson":{"explanation":"xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ). It converges quadratically near a simple root.","example":"√2 from x₀ = 1: 1.5, 1.4167, …","approaches":{"show":"For f(x) = x² − 2 start at x₀ = 1: f(1) = −1 and f′(1) = 2, so x₁ = 1 + 0.5 = 1.5. Draw the tangent line at x = 1 and show it crosses the axis at 1.5.","together":"Do f(x) = x² − 9 from x₀ = 1 together. Ask: what is f(1) (−8)? What is f′(1) (2)? What is −8/2 (−4)? So x₁ = 1 − (−4) = 5.","alone":"Have them compute x₁ for x² − 2 from x₀ = 1.5 alone. Hint if stuck: f(1.5) = 0.25 and f′(1.5) = 3, so subtract 0.25/3."}},"practice":{"items":[{"prompt":"Newton for x² − 2 from x₀ = 1: x₁ = ?","answer":"1.5","tier":1,"why":"f(x) = x² − 2, f′(x) = 2x. At x₀ = 1: f = −1, f′ = 2, so x₁ = 1 − (−1)/2 = 1.5."},{"prompt":"Newton's method: xₙ₊₁ = xₙ − …","choices":["f(xₙ)/f′(xₙ)","f′(xₙ)/f(xₙ)","f(xₙ)"],"answer":"f(xₙ)/f′(xₙ)","tier":1,"why":"Newton's method follows the tangent line to where it hits zero, which means stepping by f(xₙ)/f′(xₙ). So xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)."},{"prompt":"Near a simple root, Newton's method converges","choices":["quadratically","linearly","not at all"],"answer":"quadratically","tier":2,"why":"Near a simple root, the new error is roughly a constant times the old error squared. That is quadratic convergence, so the number of correct digits about doubles each step."},{"prompt":"Newton for x² − 9 from x₀ = 1: x₁ = ?","answer":"5","tier":2,"why":"f(x) = x² − 9, f′(x) = 2x. At x₀ = 1: f = −8, f′ = 2, so x₁ = 1 − (−8)/2 = 1 + 4 = 5."},{"prompt":"Newton for x² − 2 from x₀ = 1.5: x₁ = ? (round to 4 decimal places)","answer":"1.4167","tier":3,"why":"At x₀ = 1.5: f = 2.25 − 2 = 0.25 and f′ = 3. So x₁ = 1.5 − 0.25/3 = 1.5 − 0.08333… = 1.41667…, which rounds to 1.4167."},{"prompt":"With quadratic convergence, an error of 10⁻³ becomes roughly","choices":["10⁻⁶","10⁻⁴","10⁻³"],"answer":"10⁻⁶","tier":3,"why":"Quadratic convergence means the new error is about the old error squared: (10⁻³)² = 10⁻⁶."}]},"sightPaceSeconds":20},{"id":"na-interpolation","stage":"numerical","part":2,"title":"Interpolation","summary":"n + 1 points determine a unique polynomial of degree ≤ n.","prerequisites":["alg1-polynomials","la-systems"],"lesson":{"explanation":"n + 1 points determine a unique polynomial of degree ≤ n.","example":"Two points → a line","approaches":{"show":"Plot (0, 1) and (2, 5), draw the one line through them, and read off the value 3 at x = 1. Then add a third point and show a unique parabola through all three.","together":"Find the quadratic through (0, 0), (1, 1), (2, 4) together. Ask: which familiar function hits all three (x²)? Is a quadratic through 3 points unique? So what is its value at x = 3? (9.)","alone":"Have them find the degree of the interpolating polynomial through 5 points alone. Hint if stuck: 2 points give a line (degree 1), 3 points give degree 2."}},"practice":{"items":[{"prompt":"How many points determine a unique quadratic?","answer":"3","tier":1,"why":"A quadratic ax² + bx + c has 3 unknown coefficients. Each point gives one equation, so 3 points (with different x-values) pin it down."},{"prompt":"How many points determine a unique line?","answer":"2","tier":1,"why":"A line y = mx + b has 2 unknowns, m and b. Two points with different x-values give two equations, which fix the line."},{"prompt":"Highest possible degree of the interpolating polynomial through 5 points?","answer":"4","tier":2,"why":"With n + 1 points the interpolating polynomial has degree at most n. Here n + 1 = 5, so the degree is at most 4."},{"prompt":"The line through (0, 1) and (2, 5) has what value at x = 1?","answer":"3","tier":2,"why":"The slope is (5 − 1)/(2 − 0) = 2, so the line is y = 2x + 1. At x = 1, y = 2 + 1 = 3, which is also the average of 1 and 5 at the midpoint."},{"prompt":"High-degree interpolation on equally spaced points can oscillate badly (Runge's phenomenon)?","choices":["Yes","No"],"answer":"Yes","tier":3,"why":"Yes. With many equally spaced points, high-degree interpolants can swing wildly near the ends of the interval, as with 1/(1 + 25x²). Chebyshev points or splines avoid this."},{"prompt":"The quadratic through (0, 0), (1, 1), (2, 4) has what value at x = 3?","answer":"9","tier":3,"why":"The points (0, 0), (1, 1), (2, 4) all lie on y = x², and 3 points determine the quadratic uniquely. So at x = 3 the value is 3² = 9."}]},"sightPaceSeconds":15},{"id":"na-quadrature","stage":"numerical","part":2,"title":"Numerical integration","summary":"Trapezoid rule error is O(h²); Simpson's rule is O(h⁴).","prerequisites":["na-interpolation","c1-ftc"],"lesson":{"explanation":"Trapezoid rule error is O(h²); Simpson's rule is O(h⁴).","example":"Simpson is exact for cubics","approaches":{"show":"Approximate ∫₀² x² dx = 8/3 with one trapezoid: (2/2)(0 + 4) = 4. Then use Simpson with h = 1: (1/3)(0 + 4 × 1 + 4) = 8/3, exactly right because Simpson is exact for cubics.","together":"Compare errors together. Ask: if trapezoid error is about C·h², what happens when h is halved? ((h/2)² = h²/4, so the error drops by about 4.) What about Simpson's h⁴? (About 16.)","alone":"Have them apply the trapezoid rule with one interval to ∫₀² x dx alone. Hint if stuck: width times the average of the two end heights."}},"practice":{"items":[{"prompt":"Trapezoid rule with one interval for ∫₀² x dx gives?","answer":"2","tier":1,"why":"One trapezoid uses (width) × (average of the end heights): 2 × (0 + 2)/2 = 2. It is exact here because x is a straight line."},{"prompt":"For smooth functions and the same h, which is usually more accurate?","choices":["Simpson's rule","the trapezoid rule"],"answer":"Simpson's rule","tier":1,"why":"Simpson's rule has error about h⁴, the trapezoid rule about h². For small h, h⁴ is much smaller, so Simpson's rule is usually more accurate."},{"prompt":"Simpson's rule is exact for polynomials up to degree","choices":["3","2","1"],"answer":"3","tier":2,"why":"Simpson's rule is built to be exact for quadratics, and by symmetry the cubic errors cancel too. So it is exact for polynomials up to degree 3."},{"prompt":"Trapezoid rule with one interval for ∫₀² x² dx gives?","answer":"4","tier":2,"why":"One trapezoid: 2 × (0² + 2²)/2 = 2 × 2 = 4. The true value is 8/3, so the trapezoid overestimates because x² curves upward."},{"prompt":"Halving h in the trapezoid rule cuts the error by about","choices":["4","2","16"],"answer":"4","tier":3,"why":"The trapezoid error is about a constant times h². Halving h multiplies the error by (1/2)² = 1/4, so it shrinks by a factor of about 4."},{"prompt":"Halving h in Simpson's rule cuts the error by about","choices":["16","4","2"],"answer":"16","tier":3,"why":"Simpson's error is about a constant times h⁴. Halving h multiplies the error by (1/2)⁴ = 1/16, so it shrinks by a factor of about 16."},{"prompt":"Simpson's rule with h = 1 for ∫₀² x² dx gives?","answer":"8/3","tier":3,"why":"With h = 1 the points are 0, 1, 2 and Simpson gives (h/3)(f(0) + 4f(1) + f(2)) = (1/3)(0 + 4 + 4) = 8/3. This is exact, since x² is a polynomial of degree 2."}]},"sightPaceSeconds":20},{"id":"na-linear","stage":"numerical","part":3,"title":"Solving linear systems numerically","summary":"Gaussian elimination with pivoting, LU factorization, and iterative methods; conditioning limits accuracy.","prerequisites":["na-floating","la-systems"],"lesson":{"explanation":"Gaussian elimination with pivoting, LU factorization, and iterative methods; conditioning limits accuracy.","example":"Condition number large → sensitive","approaches":{"show":"Factor A = [[3, 1], [6, 6]] as L = [[1, 0], [2, 1]] times U = [[3, 1], [0, 4]], showing the multiplier 2 that eliminates the 6. Then show how a tiny pivot like 10⁻²⁰ would blow up the multiplier.","together":"Multiply L = [[1, 0], [2, 1]] by U = [[3, 1], [0, 4]] together. Ask: row 2 of L times column 1 of U? (2 × 3 + 1 × 0 = 6.) Row 2 times column 2? (2 × 1 + 1 × 4 = 6.)","alone":"Have them estimate correct digits when the condition number is 10⁸ and data has 16 digits, alone. Hint if stuck: you lose about as many digits as the power of 10 in the condition number."}},"practice":{"items":[{"prompt":"LU factorization writes A as","choices":["lower × upper triangular","orthogonal × diagonal","diagonal only"],"answer":"lower × upper triangular","tier":1,"why":"LU factorization writes A as L times U, where L is lower triangular (zeros above the diagonal) and U is upper triangular (zeros below it)."},{"prompt":"Gaussian elimination turns the matrix into","choices":["upper triangular form","its transpose","a matrix of zeros"],"answer":"upper triangular form","tier":1,"why":"Elimination subtracts multiples of rows to clear out the entries below each pivot, leaving zeros below the diagonal. That is upper triangular form, which is then solved by back substitution."},{"prompt":"A large condition number means the system is","choices":["sensitive to small errors","easy to solve exactly","singular"],"answer":"sensitive to small errors","tier":2,"why":"The condition number measures how much relative errors in the data can grow in the solution. A large one means small errors in the input can cause large errors in the answer."},{"prompt":"Why use partial pivoting?","choices":["to avoid dividing by tiny numbers","to make the matrix symmetric","to skip back substitution"],"answer":"to avoid dividing by tiny numbers","tier":2,"why":"If a pivot is tiny, dividing by it creates huge multipliers that blow up rounding errors. Partial pivoting swaps in the row with the largest entry in that column to avoid this."},{"prompt":"Condition number about 10⁸, data accurate to 16 digits. Roughly how many correct digits in the solution?","answer":"8","tier":3,"why":"A rule of thumb: you lose about log₁₀ of the condition number in digits. With 16 accurate digits and a condition number of 10⁸, about 16 − 8 = 8 digits remain correct."},{"prompt":"A = LU with L = [[1, 0], [2, 1]] and U = [[3, 1], [0, 4]]. Entry of A in row 2, column 1?","answer":"6","tier":3,"why":"Entry (2, 1) of A = LU is row 2 of L times column 1 of U: [2, 1] · [3, 0] = 2 × 3 + 1 × 0 = 6."}]},"sightPaceSeconds":20},{"id":"ms-estimators","stage":"mathstat","part":1,"title":"Estimators and bias","summary":"An estimator is unbiased if its expected value equals the parameter.","prerequisites":["pr-limit-theorems"],"lesson":{"explanation":"An estimator is unbiased if its expected value equals the parameter. The sample variance divides by n − 1.","example":"X̄ is unbiased for μ","approaches":{"show":"Write E[X̄] = (1/n)(E[X₁] + … + E[Xₙ]) = (1/n)(nμ) = μ on paper, saying each step aloud. Then show that dividing the squared deviations by n gives expected value (n − 1)σ²/n, which is why the unbiased version divides by n − 1.","together":"Take the sample 2, 4, 6, 8 together. Ask: what is the mean (5)? What are the squared deviations (9, 1, 1, 9)? Divide their sum 20 by n − 1 = 3 to get 20/3, and compare with 20/4 = 5 from dividing by n.","alone":"Have the learner decide alone whether (X₁ + 2X₂)/3 is unbiased for μ when both have mean μ. Hint if stuck: use linearity, E[aX + bY] = aE[X] + bE[Y]."}},"practice":{"items":[{"prompt":"X̄ is an unbiased estimator of","choices":["μ","σ²","the median"],"answer":"μ","tier":1,"why":"E[X̄] = (1/n)(E[X₁] + … + E[Xₙ]) = (1/n)(nμ) = μ. So the sample mean is unbiased for the population mean μ."},{"prompt":"An estimator is unbiased when its expected value equals","choices":["the parameter","zero","the sample size"],"answer":"the parameter","tier":1,"why":"By definition, an estimator is unbiased when, averaged over all possible samples, it equals the true parameter it is estimating."},{"prompt":"The unbiased sample variance divides by","choices":["n − 1","n","n + 1"],"answer":"n − 1","tier":2,"why":"Dividing by n − 1 corrects for using X̄ instead of the true μ, which makes the squared deviations a bit too small. With n − 1, the expected value is exactly σ²."},{"prompt":"Sample 2, 4, 6, 8. Unbiased sample variance? (fraction)","answer":"20/3","tier":2,"why":"The mean is (2 + 4 + 6 + 8)/4 = 5. The squared deviations are 9, 1, 1, 9, summing to 20. Dividing by n − 1 = 3 gives 20/3."},{"prompt":"For a sample of size n, E[(1/n)Σ(Xᵢ − X̄)²] equals σ² times","choices":["(n − 1)/n","n/(n − 1)","1"],"answer":"(n − 1)/n","tier":2,"why":"The expected sum of squared deviations from X̄ is (n − 1)σ². Dividing by n gives (n − 1)σ²/n, so the factor is (n − 1)/n."},{"prompt":"X₁ and X₂ are independent with mean μ. Is (X₁ + 2X₂)/3 unbiased for μ?","choices":["Yes","No"],"answer":"Yes","tier":3,"why":"E[(X₁ + 2X₂)/3] = (μ + 2μ)/3 = 3μ/3 = μ. Any weighted average whose weights add to 1 is unbiased, even if the weights are unequal."},{"prompt":"Dividing the sum of squared deviations by n instead of n − 1 gives an estimator of σ² that is","choices":["biased low","biased high","unbiased"],"answer":"biased low","tier":3,"why":"Dividing by n gives expected value (n − 1)σ²/n, which is less than σ². So on average it underestimates: it is biased low."}]},"sightPaceSeconds":20},{"id":"ms-mle","stage":"mathstat","part":1,"title":"Maximum likelihood","summary":"Choose the parameter that makes the observed data most likely.","prerequisites":["ms-estimators","c1-applications"],"lesson":{"explanation":"Choose the parameter that makes the observed data most likely.","example":"MLE of p for 7 heads in 10 flips is 0.7","approaches":{"show":"For 7 heads in 10 flips, write the likelihood L(p) = p⁷(1 − p)³, take the logarithm 7 ln p + 3 ln(1 − p), set its derivative 7/p − 3/(1 − p) to zero, and solve to get p = 0.7. Say: the estimate is the observed fraction of heads.","together":"Find the MLE for Poisson counts 2, 3, 7 together. Ask: what is the log-likelihood, ignoring constants (12 ln λ − 3λ)? What is its derivative (12/λ − 3)? Where is it zero (λ = 4, the sample mean)?","alone":"Have the learner find the MLE of p for 3 heads in 12 flips alone (1/4). Hint if stuck: maximize 3 ln p + 9 ln(1 − p)."}},"practice":{"items":[{"prompt":"The MLE for the mean of a normal sample is","choices":["the sample mean","the median","zero"],"answer":"the sample mean","tier":1,"why":"For a normal sample, the log-likelihood is a constant minus the sum of (xᵢ − μ)² over 2σ². Maximizing it means minimizing that sum, which happens at μ = the sample mean."},{"prompt":"The maximum likelihood estimate picks the parameter that makes the observed data","choices":["most likely","least likely","equally likely"],"answer":"most likely","tier":1,"why":"The maximum likelihood estimate chooses the parameter value under which the data you actually observed would have been most probable."},{"prompt":"7 heads in 10 flips. MLE of p?","answer":"0.7","tier":2,"why":"The likelihood is p⁷(1 − p)³. Setting the derivative of its log to zero gives 7/p = 3/(1 − p), so p = 7/10 = 0.7, the fraction of heads."},{"prompt":"3 heads in 12 flips. MLE of p? (fraction)","answer":"1/4","tier":2,"why":"For coin flips the MLE of p is the fraction of heads: 3/12 = 1/4."},{"prompt":"To find an MLE you usually set to zero the derivative of the","choices":["log-likelihood","prior","sample size"],"answer":"log-likelihood","tier":2,"why":"The log turns the product of probabilities into a sum, which is much easier to differentiate. Since log is increasing, maximizing the log-likelihood gives the same answer."},{"prompt":"Poisson counts 2, 3, 7. MLE of λ?","answer":"4","tier":3,"why":"For a Poisson sample, the MLE of λ is the sample mean: (2 + 3 + 7)/3 = 12/3 = 4."},{"prompt":"Exponential sample with sample mean 5. MLE of the rate λ? (fraction)","answer":"1/5","tier":3,"why":"For an exponential with rate λ, the mean is 1/λ, and the MLE is 1 divided by the sample mean. So λ = 1/5."}]},"sightPaceSeconds":20},{"id":"ms-testing","stage":"mathstat","part":2,"title":"Hypothesis testing theory","summary":"Type I error rejects a true null (rate α); Type II fails to reject a false null.","prerequisites":["ms-estimators","st-inference"],"lesson":{"explanation":"Type I error rejects a true null (rate α); Type II fails to reject a false null. Power = 1 − β.","example":"Neyman–Pearson: likelihood ratio tests are most powerful","approaches":{"show":"Draw two bell curves for X under μ = 0 and μ = 1 with a cutoff at 1.645. Shade the first curve past the cutoff and say: this is α, the Type I error rate; then shade the second curve before the cutoff and say: this is β, and power is 1 − β.","together":"Work the test of μ = 0 against μ = 1 with one Normal(μ, 1) observation together. Ask: where must the cutoff be for α = 0.05 (1.645)? What is the chance the alternative lands past it (about 0.26)? So what is β (about 0.74)?","alone":"Have the learner find the power alone when β = 0.2 (0.8), then say in words what a Type II error is. Hint if stuck: power is the chance of rejecting a false null."}},"practice":{"items":[{"prompt":"A Type I error is","choices":["rejecting a true null","accepting a false null","a computing mistake"],"answer":"rejecting a true null","tier":1,"why":"A Type I error is a false alarm: the null hypothesis is true, but the test rejects it. Its probability is the significance level α."},{"prompt":"A Type II error is","choices":["failing to reject a false null","rejecting a true null","rejecting a false null"],"answer":"failing to reject a false null","tier":1,"why":"A Type II error is a miss: the null hypothesis is false, but the test fails to reject it. Its probability is called β."},{"prompt":"Power of a test =","choices":["1 − P(Type II error)","α","1 − α"],"answer":"1 − P(Type II error)","tier":2,"why":"Power is the chance of correctly rejecting a false null. That is the opposite of a Type II error, so power = 1 − P(Type II error) = 1 − β."},{"prompt":"A test has α = 0.05. Probability of a Type I error when the null is true?","answer":"0.05","tier":2,"why":"The significance level α is defined as the probability of rejecting the null when it is true. So with α = 0.05 the Type I error probability is 0.05."},{"prompt":"β = 0.2. Power of the test?","answer":"0.8","tier":2,"why":"Power = 1 − β = 1 − 0.2 = 0.8."},{"prompt":"Neyman–Pearson: for a simple null against a simple alternative, the most powerful level-α test rejects for large values of the","choices":["likelihood ratio","sample size","prior"],"answer":"likelihood ratio","tier":3,"why":"The Neyman–Pearson lemma says the most powerful test of a simple null against a simple alternative rejects when the likelihood ratio, alternative over null, is large."},{"prompt":"One observation X ~ Normal(μ, 1). Test μ = 0 against μ = 1 by rejecting when X > 1.645. Power? (2 decimals)","answer":"0.26","tier":3,"why":"Under μ = 1, X − 1 is standard normal. Power = P(X > 1.645) = P(Z > 0.645) ≈ 1 − 0.7405 ≈ 0.26."}]},"sightPaceSeconds":20},{"id":"ms-bayesian","stage":"mathstat","part":3,"title":"Bayesian inference","summary":"Posterior ∝ likelihood × prior.","prerequisites":["ms-mle","pr-bayes"],"lesson":{"explanation":"Posterior ∝ likelihood × prior. Conjugate priors keep the same family.","example":"Beta prior + binomial data → Beta posterior","approaches":{"show":"Start with a Beta(1, 1) prior on a coin's p, the flat line. Flip 7 heads in 10, multiply the prior by p⁷(1 − p)³, and show the posterior Beta(8, 4) with mean 8/12 = 2/3, pulled slightly toward 1/2 from the MLE 0.7.","together":"Update a Beta(2, 2) prior with 3 heads and 1 tail together. Ask: what do heads add to (the first parameter, giving 5)? What do tails add to (the second, giving 3)? What is the posterior mean (5/8)?","alone":"Have the learner find the posterior mean of p alone for a Beta(1, 1) prior and 2 heads in 6 flips (3/8). Hint if stuck: the posterior is Beta(1 + heads, 1 + tails), with mean a/(a + b)."}},"practice":{"items":[{"prompt":"Posterior is proportional to","choices":["likelihood × prior","prior only","likelihood ÷ prior"],"answer":"likelihood × prior","tier":1,"why":"Bayes' theorem gives posterior = likelihood × prior ÷ P(data). The denominator does not depend on the parameter, so the posterior is proportional to likelihood × prior."},{"prompt":"In Bayesian inference, the prior describes beliefs","choices":["before seeing the data","after seeing the data","about the sample size"],"answer":"before seeing the data","tier":1,"why":"The prior is what you believe about the parameter before seeing data. Combining it with the data gives the posterior, which is the belief after."},{"prompt":"The conjugate prior for a binomial p is","choices":["Beta","Normal","Poisson"],"answer":"Beta","tier":2,"why":"The binomial likelihood is pᵏ(1 − p)ⁿ⁻ᵏ, and a Beta prior has the same shape, p^(a−1)(1 − p)^(b−1). Their product is again a Beta, so Beta is conjugate."},{"prompt":"Beta(2, 2) prior, then 3 heads and 1 tail. The posterior is Beta(5, ?)","answer":"3","tier":2,"why":"With a Beta(a, b) prior, add heads to a and tails to b. Beta(2 + 3, 2 + 1) = Beta(5, 3), so the missing number is 3."},{"prompt":"The conjugate prior for the mean of a normal with known variance is","choices":["Normal","Beta","Gamma"],"answer":"Normal","tier":2,"why":"A normal likelihood times a normal prior for the mean gives a normal posterior, since the exponents of both are quadratic in the mean. So the normal is conjugate here."},{"prompt":"Beta(1, 1) prior, 7 heads in 10 flips. Posterior mean of p? (fraction)","answer":"2/3","tier":3,"why":"Beta(1, 1) plus 7 heads and 3 tails gives Beta(8, 4). Its mean is 8/(8 + 4) = 8/12 = 2/3."},{"prompt":"Gamma prior with shape 2 and rate 1 on a Poisson rate; counts 3 and 5 observed. Posterior shape?","answer":"10","tier":3,"why":"For a Gamma prior on a Poisson rate, add the total count to the shape. 2 + (3 + 5) = 10. The rate becomes 1 + 2 = 3."}]},"sightPaceSeconds":20},{"id":"ga-measure","stage":"grad-analysis","part":1,"title":"Measure theory","summary":"A measure assigns sizes to sets in a σ-algebra, countably additive.","prerequisites":["ra-riemann","dm-sets"],"lesson":{"explanation":"A measure assigns sizes to sets in a σ-algebra, countably additive. Lebesgue measure extends length.","example":"λ([a, b]) = b − a; λ(ℚ) = 0","approaches":{"show":"Cover the rationals in [0, 1], listed as q₁, q₂, …, by intervals of length ε/2, ε/4, ε/8, …. Show the total length is at most ε, for every ε > 0, so λ(ℚ) = 0.","together":"Find the measure of the Cantor set together. Ask: how much length is removed at step one (1/3)? At step two (2/9)? Sum the series 1/3 + 2/9 + 4/27 + … = 1, so what is left has measure 0.","alone":"Have the learner find λ([0, 1] ∪ [3, 5]) alone (3). Hint if stuck: the intervals are disjoint, so their measures add."}},"practice":{"items":[{"prompt":"The Lebesgue measure of ℚ is","choices":["0","1","infinite"],"answer":"0","tier":1,"why":"ℚ is countable, and each single point has measure 0. By countable additivity, the measure of ℚ is a sum of countably many zeros, which is 0."},{"prompt":"Lebesgue measure of the interval [2, 7]?","answer":"5","tier":1,"why":"Lebesgue measure of an interval is its length: 7 − 2 = 5."},{"prompt":"Measures are additive over","choices":["countable disjoint unions","arbitrary unions","finite unions only"],"answer":"countable disjoint unions","tier":2,"why":"Countable additivity: the measure of a countable union of disjoint sets is the sum of their measures. Arbitrary unions fail, since [0, 1] is an uncountable union of points that each have measure 0."},{"prompt":"Lebesgue measure of [0, 1] ∪ [3, 5]?","answer":"3","tier":2,"why":"The intervals do not overlap, so add their lengths: (1 − 0) + (5 − 3) = 1 + 2 = 3."},{"prompt":"A σ-algebra must be closed under complements and","choices":["countable unions","arbitrary unions","products"],"answer":"countable unions","tier":2,"why":"A σ-algebra must contain the whole set and be closed under complements and countable unions. The σ means countable; arbitrary unions are not required."},{"prompt":"Lebesgue measure of the Cantor set?","choices":["0","1/2","1"],"answer":"0","tier":3,"why":"Building the Cantor set removes 1/3, then 2/9, then 4/27, …, which adds up to 1. So what remains has measure 1 − 1 = 0, even though it is uncountable."},{"prompt":"Lebesgue measure of the irrational numbers in [0, 1]?","answer":"1","tier":3,"why":"[0, 1] has measure 1 and the rationals in it have measure 0. The irrationals are what is left, so they have measure 1 − 0 = 1."}]},"sightPaceSeconds":25},{"id":"ga-lebesgue","stage":"grad-analysis","part":1,"title":"Lebesgue integration","summary":"Integrals of measurable functions; monotone and dominated convergence let you swap limits and integrals.","prerequisites":["ga-measure"],"lesson":{"explanation":"Integrals of measurable functions; monotone and dominated convergence let you swap limits and integrals.","example":"The Dirichlet function has Lebesgue integral 0 on [0, 1]","approaches":{"show":"Show the Lebesgue idea by slicing the range instead of the domain: for the indicator of ℚ on [0, 1], the value 1 is taken on a set of measure 0 and the value 0 on a set of measure 1, so the integral is 1·0 + 0·1 = 0.","together":"Take fₙ(x) = xⁿ on [0, 1] together. Ask: what does fₙ tend to pointwise (0 except at x = 1)? What function dominates it (the constant 1, which is integrable)? So dominated convergence gives ∫fₙ → 0; check with ∫xⁿ dx = 1/(n + 1).","alone":"Have the learner compute ∫fₙ alone for fₙ = n times the indicator of (0, 1/n) (1 for every n) and explain why this does not contradict dominated convergence. Hint if stuck: try to find one integrable g above every fₙ."}},"practice":{"items":[{"prompt":"Lebesgue integral over [0, 1] of the indicator of ℚ?","answer":"0","tier":1,"why":"The indicator of ℚ is 1 on a set of measure 0 and 0 everywhere else. Its integral is 1 × 0 = 0."},{"prompt":"Lebesgue integral of the constant 3 over [0, 2]?","answer":"6","tier":1,"why":"The integral of a constant is the constant times the measure of the set: 3 × (2 − 0) = 6."},{"prompt":"Dominated convergence requires |fₙ| ≤ g with g","choices":["integrable","continuous","bounded"],"answer":"integrable","tier":2,"why":"Dominated convergence needs one function g with ∫|g| finite that bounds every |fₙ|. Continuity or boundedness alone is not enough on spaces of infinite measure."},{"prompt":"The monotone convergence theorem applies to sequences that are nonnegative and","choices":["increasing","decreasing","continuous"],"answer":"increasing","tier":2,"why":"Monotone convergence needs 0 ≤ f₁ ≤ f₂ ≤ …, an increasing sequence of nonnegative functions. Then the limit of the integrals equals the integral of the limit."},{"prompt":"Lebesgue integral over [0, 1] of the function equal to 1 on the irrationals and 0 on the rationals?","answer":"1","tier":2,"why":"The function is 1 except on the rationals, which have measure 0. So its integral equals the integral of 1 over [0, 1], which is 1."},{"prompt":"Limit of ∫₀¹ xⁿ dx as n → ∞?","answer":"0","tier":3,"why":"∫₀¹ xⁿ dx = 1/(n + 1), which goes to 0 as n grows. This matches dominated convergence: xⁿ → 0 for x < 1, bounded by 1."},{"prompt":"fₙ = n times the indicator of (0, 1/n) on [0, 1]. Value of ∫fₙ for each n?","answer":"1","tier":3,"why":"fₙ has height n on an interval of length 1/n, so ∫fₙ = n × 1/n = 1. Yet fₙ → 0 at every point, showing why a dominating function is needed."}]},"sightPaceSeconds":25},{"id":"ga-lp","stage":"grad-analysis","part":2,"title":"Lᵖ spaces","summary":"‖f‖ₚ = (∫|f|ᵖ)^(1/p).","prerequisites":["ga-lebesgue"],"lesson":{"explanation":"‖f‖ₚ = (∫|f|ᵖ)^(1/p). Lᵖ is complete; Hölder: ∫|fg| ≤ ‖f‖ₚ‖g‖_q with 1/p + 1/q = 1.","example":"L² is a Hilbert space","approaches":{"show":"Compute ‖f‖ₚ for f(x) = x on [0, 1]: ∫xᵖ dx = 1/(p + 1), so ‖f‖ₚ = (1/(p + 1))^(1/p). Then show Hölder's pairing 1/p + 1/q = 1 with p = 3 and q = 3/2.","together":"Compute ‖f‖₂ for f(x) = x on [0, 1] together. Ask: what is |f|² (x²)? What is its integral (1/3)? So what is the norm (1/√3)? Then ask which inner product, ∫fg, gives this norm on L².","alone":"Have the learner find the Hölder conjugate of p = 5 alone (5/4). Hint if stuck: solve 1/5 + 1/q = 1 for q."}},"practice":{"items":[{"prompt":"Which Lᵖ is a Hilbert space?","choices":["L²","L¹","L^∞"],"answer":"L²","tier":1,"why":"L² has the inner product ⟨f, g⟩ = ∫ f ḡ, whose norm is the L² norm, and it is complete. The other Lᵖ norms fail the parallelogram law, so they do not come from an inner product."},{"prompt":"Hölder conjugate of p = 2?","answer":"2","tier":1,"why":"Hölder conjugates satisfy 1/p + 1/q = 1. With p = 2, 1/q = 1 − 1/2 = 1/2, so q = 2."},{"prompt":"Hölder conjugate of p = 3 is q = ? (fraction)","answer":"3/2","tier":2,"why":"1/q = 1 − 1/3 = 2/3, so q = 3/2."},{"prompt":"Hölder conjugate of p = 4? (fraction)","answer":"4/3","tier":2,"why":"1/q = 1 − 1/4 = 3/4, so q = 4/3."},{"prompt":"f(x) = x on [0, 1]. ‖f‖₁ = ? (fraction)","answer":"1/2","tier":2,"why":"‖f‖₁ = ∫₀¹ |x| dx = [x²/2] from 0 to 1 = 1/2."},{"prompt":"f(x) = x on [0, 1]. ‖f‖₂² = ? (fraction)","answer":"1/3","tier":3,"why":"‖f‖₂² = ∫₀¹ x² dx = [x³/3] from 0 to 1 = 1/3."},{"prompt":"On [0, 1] with Lebesgue measure, which inclusion holds?","choices":["L² ⊂ L¹","L¹ ⊂ L²","neither"],"answer":"L² ⊂ L¹","tier":3,"why":"On a set of measure 1, Cauchy–Schwarz gives ∫|f| ≤ (∫|f|²)^(1/2), so every L² function is in L¹. The reverse fails: 1/√x is in L¹ but not L²."}]},"sightPaceSeconds":25},{"id":"ga-banach-hilbert","stage":"grad-analysis","part":2,"title":"Banach and Hilbert spaces","summary":"Complete normed spaces.","prerequisites":["ga-lp","la-orthogonality"],"lesson":{"explanation":"Complete normed spaces. Hahn–Banach, open mapping, uniform boundedness; Riesz representation in Hilbert space.","example":"Every Hilbert space has an orthonormal basis","approaches":{"show":"Show continuous functions on [0, 1] steepening toward a step function: in the L² norm they form a Cauchy sequence with no continuous limit, so that space is not complete, while with the sup norm continuous functions form a Banach space. Say: completeness means every Cauchy sequence converges inside the space.","together":"Apply Riesz representation to φ(f) = ∫₀¹ x f(x) dx on L²[0, 1] together. Ask: is φ bounded (yes, by Cauchy–Schwarz)? Which fixed vector g gives φ(f) = ⟨f, g⟩ (g(x) = x)?","alone":"Have the learner decide alone whether ℓ², the square-summable sequences, is a Hilbert space and name its inner product (Σ xₙyₙ). Hint if stuck: check that it is complete and that its norm comes from an inner product."}},"practice":{"items":[{"prompt":"A Banach space is a complete…","choices":["normed vector space","inner product space only","metric group"],"answer":"normed vector space","tier":1,"why":"A Banach space is a normed vector space that is complete: every Cauchy sequence converges to a point in the space."},{"prompt":"A Hilbert space is a complete","choices":["inner product space","metric group","topological ring"],"answer":"inner product space","tier":1,"why":"A Hilbert space is an inner product space that is complete in the norm the inner product defines. Every Hilbert space is also a Banach space."},{"prompt":"Riesz representation: every bounded linear functional on a Hilbert space is","choices":["an inner product with a fixed vector","zero","unbounded"],"answer":"an inner product with a fixed vector","tier":2,"why":"The Riesz representation theorem says each bounded linear functional φ on a Hilbert space has the form φ(x) = ⟨x, y⟩ for exactly one fixed vector y."},{"prompt":"Is ℓ² (square-summable sequences) a Hilbert space?","choices":["Yes","No"],"answer":"Yes","tier":2,"why":"ℓ² has inner product ⟨a, b⟩ = Σ aₙb̄ₙ, which converges by Cauchy–Schwarz, and it is complete. So it is a Hilbert space."},{"prompt":"Continuous functions on [0, 1] with the L² norm form a space that is","choices":["not complete","a Hilbert space","finite-dimensional"],"answer":"not complete","tier":2,"why":"Continuous functions can converge in the L² norm to a step function, which is not continuous. So some Cauchy sequences have no limit in the space: it is not complete."},{"prompt":"Continuous functions on [0, 1] with the sup norm form","choices":["a Banach space but not a Hilbert space","a Hilbert space","an incomplete space"],"answer":"a Banach space but not a Hilbert space","tier":3,"why":"Under the sup norm, a uniform limit of continuous functions is continuous, so the space is complete (Banach). The sup norm fails the parallelogram law, so it does not come from an inner product."},{"prompt":"Uniform boundedness: a pointwise bounded family of bounded operators on a Banach space is","choices":["uniformly bounded in operator norm","compact","zero"],"answer":"uniformly bounded in operator norm","tier":3,"why":"The uniform boundedness principle: if sup over the family of ‖Tx‖ is finite for each x, then sup of ‖T‖ is finite. Completeness of the Banach space is what makes this work."}]},"sightPaceSeconds":30},{"id":"ga-spectral","stage":"grad-analysis","part":3,"title":"Spectral theory","summary":"Compact self-adjoint operators have real eigenvalues accumulating only at 0 and an orthonormal eigenbasis.","prerequisites":["ga-banach-hilbert","la-svd"],"lesson":{"explanation":"Compact self-adjoint operators have real eigenvalues accumulating only at 0 and an orthonormal eigenbasis.","example":"Fourier modes diagonalize d²/dx² on a circle","approaches":{"show":"Diagonalize the symmetric matrix [[2, 1], [1, 2]]: eigenvalues 1 and 3 with orthogonal eigenvectors (1, −1) and (1, 1). Then show the infinite version: the operator multiplying the n-th basis vector by 1/n is compact, with eigenvalues 1, 1/2, 1/3, … piling up at 0.","together":"Check together that e^(inx) is an eigenfunction of d²/dx² on the circle. Ask: what is its first derivative (in·e^(inx))? Its second derivative (−n²e^(inx))? So what is the eigenvalue (−n²), and why is it real?","alone":"Have the learner find the eigenvalues of [[3, 0], [0, −1]] alone (3 and −1) and say why they must be real. Hint if stuck: a real symmetric matrix is self-adjoint."}},"practice":{"items":[{"prompt":"Self-adjoint operators have spectrum in","choices":["ℝ","the unit circle","iℝ"],"answer":"ℝ","tier":1,"why":"If T is self-adjoint and Tv = λv, then λ⟨v, v⟩ = ⟨Tv, v⟩ = ⟨v, Tv⟩ = λ̄⟨v, v⟩, so λ is real. The whole spectrum lies in ℝ."},{"prompt":"Larger eigenvalue of the symmetric matrix [[2, 0], [0, 5]]?","answer":"5","tier":1,"why":"For a diagonal matrix, the eigenvalues are the diagonal entries, 2 and 5. The larger is 5."},{"prompt":"The eigenvalues of a compact self-adjoint operator can accumulate only at","choices":["0","1","infinity"],"answer":"0","tier":2,"why":"A compact operator can have only finitely many eigenvalues outside any interval around 0. So infinitely many eigenvalues can only pile up at 0."},{"prompt":"Eigenvectors of a self-adjoint operator for different eigenvalues are","choices":["orthogonal","parallel","equal"],"answer":"orthogonal","tier":2,"why":"If Tu = λu and Tv = μv with λ ≠ μ, then λ⟨u, v⟩ = ⟨Tu, v⟩ = ⟨u, Tv⟩ = μ⟨u, v⟩, using that μ is real. So ⟨u, v⟩ = 0: they are orthogonal."},{"prompt":"On the circle, e^(inx) is an eigenfunction of d²/dx² with eigenvalue","choices":["−n²","n²","n"],"answer":"−n²","tier":3,"why":"Differentiating e^(inx) once gives in e^(inx); twice gives (in)² e^(inx) = −n² e^(inx). So the eigenvalue is −n²."},{"prompt":"Is 0 always in the spectrum of a compact operator on an infinite-dimensional Hilbert space?","choices":["Yes","No"],"answer":"Yes","tier":3,"why":"If 0 were not in the spectrum, T would have a bounded inverse, and then the identity = T⁻¹T would be compact. The identity is not compact in infinite dimensions, so 0 is in the spectrum."}]},"sightPaceSeconds":30},{"id":"ga-fourier","stage":"grad-analysis","part":3,"title":"Fourier analysis","summary":"Functions decompose into frequencies.","prerequisites":["ga-lp","c2-taylor"],"lesson":{"explanation":"Functions decompose into frequencies. Plancherel: the Fourier transform preserves the L² norm.","example":"Convolution ↔ multiplication","approaches":{"show":"Write the square wave as (4/π)(sin x + sin 3x/3 + sin 5x/5 + …) and sketch the first two partial sums. Then show that convolving two periodic functions corresponds to multiplying their Fourier coefficients.","together":"Compute the sin x coefficient of f(x) = x on (−π, π) together. Ask: what formula gives it ((1/π)∫x sin x dx)? Integrate by parts to get 2π; so what is the coefficient (2)?","alone":"Have the learner use Parseval alone on f = sin x + 2 sin 2x over [−π, π] to get (1/π)∫|f|² dx = 5. Hint if stuck: the energy is the sum of squared coefficients, 1² + 2²."}},"practice":{"items":[{"prompt":"The Fourier transform turns convolution into","choices":["multiplication","addition","differentiation"],"answer":"multiplication","tier":1,"why":"The convolution theorem: the Fourier transform of f * g equals the product of their transforms. Convolution becomes pointwise multiplication."},{"prompt":"Fourier series write a periodic function as a sum of","choices":["sines and cosines","polynomials","step functions"],"answer":"sines and cosines","tier":1,"why":"A Fourier series writes a periodic function as a sum of sines and cosines (equivalently e^(inx)) at whole-number frequencies."},{"prompt":"Plancherel says the Fourier transform on L² is","choices":["unitary (norm-preserving)","compact","zero"],"answer":"unitary (norm-preserving)","tier":2,"why":"Plancherel's theorem says ‖f̂‖₂ = ‖f‖₂ (with the right normalization). A norm-preserving, onto linear map on L² is unitary."},{"prompt":"The function sin 3x on [−π, π] has a nonzero Fourier coefficient only at which frequency?","answer":"3","tier":2,"why":"sin 3x is itself one of the basis functions. By orthogonality, its only nonzero coefficient is the coefficient of sin 3x, at frequency 3."},{"prompt":"Fourier series of f(x) = x on (−π, π): coefficient of sin x?","answer":"2","tier":3,"why":"b₁ = (1/π)∫ x sin x dx over (−π, π). Integrating by parts gives (1/π)(2π) = 2. In general bₙ = 2(−1)^(n+1)/n."},{"prompt":"f = sin x + 2 sin 2x on [−π, π]. Value of (1/π)∫|f|² dx?","answer":"5","tier":3,"why":"By orthogonality the cross term integrates to 0. (1/π)∫sin² x dx = 1 and (1/π)∫4 sin² 2x dx = 4, so the total is 1 + 4 = 5, the sum of the squared coefficients."}]},"sightPaceSeconds":30},{"id":"gal-modules","stage":"grad-algebra","part":1,"title":"Modules","summary":"Modules are vector spaces over a ring.","prerequisites":["aa-rings","la-vector-spaces"],"lesson":{"explanation":"Modules are vector spaces over a ring. Finitely generated modules over a PID split into cyclic pieces.","example":"Abelian groups are ℤ-modules","approaches":{"show":"Show ℤ/12 splitting as ℤ/4 ⊕ ℤ/3 by sending 1 to (1, 1), and say: finitely generated modules over a PID such as ℤ break into cyclic pieces. Then list the abelian groups of order 8: ℤ/8, ℤ/4 ⊕ ℤ/2, and ℤ/2 ⊕ ℤ/2 ⊕ ℤ/2.","together":"Classify the abelian groups of order 36 together. Ask: what is the prime factorization (2² · 3²)? How many ways can the 2-part split (2: ℤ/4 or ℤ/2 ⊕ ℤ/2)? The 3-part (also 2)? So how many groups are there (4)?","alone":"Have the learner count the abelian groups of order 16 alone (5). Hint if stuck: count the ways to write 4 as a sum of positive whole numbers."}},"practice":{"items":[{"prompt":"A ℤ-module is the same as","choices":["an abelian group","a ring","a field"],"answer":"an abelian group","tier":1,"why":"A ℤ-module only needs addition plus repeated adding (n·m = m + m + … + m), which every abelian group already has, so the two ideas are the same. A ring or field would need its own multiplication of elements, which a module does not have."},{"prompt":"A module over a field is the same as","choices":["a vector space","a group","a ring"],"answer":"a vector space","tier":1,"why":"The module axioms over a field are exactly the vector space axioms: scalars from the field act on elements, distributing over addition. A group or ring is missing that scalar action."},{"prompt":"Finitely generated abelian groups are direct sums of","choices":["cyclic groups","simple groups","free groups only"],"answer":"cyclic groups","tier":2,"why":"Finitely generated abelian groups are ℤ-modules, and ℤ is a principal ideal domain, so the structure theorem splits them into cyclic pieces like ℤ and ℤ/n. Free groups are usually not abelian, and simple groups are not the building blocks here."},{"prompt":"ℤ/6 ≅ ℤ/2 ⊕ ℤ/?","answer":"3","tier":2,"why":"Since 6 = 2 × 3 and gcd(2, 3) = 1, the Chinese Remainder Theorem says ℤ/6 ≅ ℤ/2 ⊕ ℤ/3: each number mod 6 is pinned down by its remainders mod 2 and mod 3."},{"prompt":"Number of abelian groups of order 8, up to isomorphism?","answer":"3","tier":3,"why":"An abelian group of order 8 = 2³ corresponds to a way of writing the exponent 3 as a sum: 3, 2 + 1, 1 + 1 + 1. That gives ℤ/8, ℤ/4 ⊕ ℤ/2 and ℤ/2 ⊕ ℤ/2 ⊕ ℤ/2, so 3 groups."},{"prompt":"Number of abelian groups of order 36, up to isomorphism?","answer":"4","tier":3,"why":"Split 36 = 4 × 9. The 4-part can be ℤ/4 or ℤ/2 ⊕ ℤ/2 (2 ways) and the 9-part can be ℤ/9 or ℤ/3 ⊕ ℤ/3 (2 ways), giving 2 × 2 = 4 groups."}]},"sightPaceSeconds":30},{"id":"gal-galois","stage":"grad-algebra","part":1,"title":"Galois theory","summary":"Subgroups of the Galois group correspond to intermediate fields.","prerequisites":["aa-fields","aa-sylow"],"lesson":{"explanation":"Subgroups of the Galois group correspond to intermediate fields. A polynomial is solvable by radicals iff its Galois group is solvable.","example":"Gal(ℚ(√2)/ℚ) ≅ ℤ₂","approaches":{"show":"For ℚ(√2, √3), list the four automorphisms by where they send √2 and √3 (each to plus or minus itself). Match the three subgroups of order 2 with the three middle fields ℚ(√2), ℚ(√3), ℚ(√6) to show the correspondence.","together":"Find the Galois group of x³ − 2 together. Ask: what are its roots (∛2, ∛2·ω, ∛2·ω²)? What is the degree of ℚ(∛2, ω) over ℚ (3 · 2 = 6)? Which group of order 6 permutes three roots (S₃)?","alone":"Have the learner find [ℚ(√5) : ℚ] and the order of Gal(ℚ(√5)/ℚ) alone (2 and 2). Hint if stuck: the minimal polynomial of √5 is x² − 5."}},"practice":{"items":[{"prompt":"The general quintic is not solvable by radicals because S₅ is","choices":["not solvable","abelian","cyclic"],"answer":"not solvable","tier":1,"why":"A polynomial is solvable by radicals if and only if its Galois group is solvable. The general quintic has Galois group S₅, whose only proper nontrivial normal subgroup A₅ is simple and non-abelian, so S₅ is not solvable. It is certainly not abelian or cyclic."},{"prompt":"Order of Gal(ℚ(√2)/ℚ)?","answer":"2","tier":1,"why":"ℚ(√2) has degree 2 over ℚ, since x² − 2 is irreducible. The Galois group has the identity and the map √2 ↦ −√2, so its order is 2."},{"prompt":"Order of Gal(ℚ(√2, √3)/ℚ)?","answer":"4","tier":2,"why":"Adjoining √2 gives degree 2, and √3 is not in ℚ(√2), so adjoining it doubles again: degree 4. The extension is Galois, so the group has order 4, made of the sign flips of √2 and √3."},{"prompt":"Degree [ℚ(∛2) : ℚ]?","answer":"3","tier":2,"why":"The minimal polynomial of ∛2 is x³ − 2, which is irreducible over ℚ (Eisenstein at the prime 2). So the degree is 3."},{"prompt":"Order of the Galois group of the splitting field of x³ − 2 over ℚ?","answer":"6","tier":3,"why":"The splitting field is ℚ(∛2, ω) where ω is a primitive cube root of unity. That is degree 3 from ∛2 times degree 2 from ω (it is not real), so 6, and the group is S₃."},{"prompt":"Number of fields strictly between ℚ and ℚ(√2, √3)?","answer":"3","tier":3,"why":"The Galois group is ℤ₂ × ℤ₂, which has exactly three subgroups of order 2. By the Galois correspondence these give three intermediate fields: ℚ(√2), ℚ(√3) and ℚ(√6)."}]},"sightPaceSeconds":30},{"id":"gal-commutative","stage":"grad-algebra","part":2,"title":"Commutative algebra","summary":"Noetherian rings (every ideal finitely generated); Hilbert's basis theorem; localization; primary decomposition.","prerequisites":["aa-rings"],"lesson":{"explanation":"Noetherian rings (every ideal finitely generated); Hilbert's basis theorem; localization; primary decomposition.","example":"k[x₁, …, xₙ] is Noetherian","approaches":{"show":"Show the chain (x₁) ⊂ (x₁, x₂) ⊂ (x₁, x₂, x₃) ⊂ … in a polynomial ring with infinitely many variables, which never stops, so that ring is not Noetherian. Contrast with k[x], where every ideal is (f) for one polynomial f.","together":"Work through ℤ/(6) and ℤ/(5) together. Ask: is (6) prime (no, 2 · 3 lies in it but neither factor does)? Is ℤ/5 a field (yes, so (5) is maximal)? Then ask what localizing ℤ at (5) does (makes every integer not divisible by 5 invertible).","alone":"Have the learner decide alone whether ℤ[x] is Noetherian (yes). Hint if stuck: ℤ is Noetherian because every ideal is generated by one number; now apply Hilbert's basis theorem."}},"practice":{"items":[{"prompt":"A prime ideal P gives R/P that is","choices":["an integral domain","a field","nilpotent"],"answer":"an integral domain","tier":1,"why":"P prime means ab ∈ P forces a ∈ P or b ∈ P, which says exactly that R/P has no zero divisors, so it is an integral domain. It is a field only when P is also maximal."},{"prompt":"A Noetherian ring is one in which every ideal is","choices":["finitely generated","principal","maximal"],"answer":"finitely generated","tier":1,"why":"Noetherian means every ideal is generated by finitely many elements (equivalently, ascending chains of ideals stop). Principal would be the much stronger condition of one generator."},{"prompt":"Hilbert's basis theorem: if R is Noetherian then so is","choices":["R[x]","every subring of R","R × R only"],"answer":"R[x]","tier":2,"why":"Hilbert's basis theorem says R Noetherian implies R[x] Noetherian, so by induction k[x₁, …, xₙ] is Noetherian. Subrings of a Noetherian ring need not be Noetherian."},{"prompt":"For a maximal ideal M, the quotient R/M is","choices":["a field","never a field","the zero ring"],"answer":"a field","tier":2,"why":"M maximal means there is no ideal strictly between M and R, so every nonzero element of R/M has an inverse: R/M is a field."},{"prompt":"Is the polynomial ring k[x₁, x₂, x₃, …] in infinitely many variables Noetherian?","choices":["Yes","No"],"answer":"No","tier":3,"why":"No: the chain (x₁) ⊂ (x₁, x₂) ⊂ (x₁, x₂, x₃) ⊂ … grows forever, so the ideal (x₁, x₂, …) is not finitely generated."},{"prompt":"Localizing ℤ at the prime ideal (p) gives a ring with how many maximal ideals?","answer":"1","tier":3,"why":"Localizing at (p) makes every integer not divisible by p a unit. The result ℤ₍ₚ₎ is a local ring whose only maximal ideal is the one generated by p, so there is 1."}]},"sightPaceSeconds":30},{"id":"gal-tensor","stage":"grad-algebra","part":3,"title":"Tensor products and exact sequences","summary":"M ⊗ N linearizes bilinear maps.","prerequisites":["gal-modules"],"lesson":{"explanation":"M ⊗ N linearizes bilinear maps. Tensoring is right exact; Hom is left exact.","example":"ℤ/2 ⊗ ℤ/3 = 0","approaches":{"show":"Show that ℤ/2 ⊗ ℤ/3 = 0: 1 ⊗ 1 = 3(1 ⊗ 1) − 2(1 ⊗ 1) = (1 ⊗ 3) − (2 ⊗ 1) = 0 − 0. Then state the general rule ℤ/m ⊗ ℤ/n ≅ ℤ/gcd(m, n).","together":"Compute ℤ/4 ⊗ ℤ/6 together. Ask: what is gcd(4, 6) (2)? Why is 2(1 ⊗ 1) = 0 (it equals 6(1 ⊗ 1) − 4(1 ⊗ 1) = (1 ⊗ 6) − (4 ⊗ 1))? So the answer is ℤ/2.","alone":"Have the learner find dim(ℝ³ ⊗ ℝ⁴) alone (12). Hint if stuck: a basis is all eᵢ ⊗ fⱼ, so multiply the dimensions."}},"practice":{"items":[{"prompt":"dim (ℝ² ⊗ ℝ³)?","answer":"6","tier":1,"why":"Dimensions multiply under tensor products: a basis is all pairs eᵢ ⊗ fⱼ, so dim (ℝ² ⊗ ℝ³) = 2 × 3 = 6."},{"prompt":"dim (ℝ² ⊗ ℝ²)?","answer":"4","tier":1,"why":"Dimensions multiply: basis elements eᵢ ⊗ eⱼ with i, j in {1, 2} give 2 × 2 = 4."},{"prompt":"ℤ/2 ⊗_ℤ ℤ/3 =","choices":["0","ℤ/6","ℤ/2"],"answer":"0","tier":2,"why":"Any a ⊗ b: since 3b = 0 and 2a = 0, write a ⊗ b = (3a − 2a) ⊗ b = a ⊗ 3b − 2a ⊗ b = 0. Everything dies because gcd(2, 3) = 1."},{"prompt":"ℤ/4 ⊗_ℤ ℤ/6 ≅ ℤ/?","answer":"2","tier":2,"why":"ℤ/m ⊗ ℤ/n ≅ ℤ/gcd(m, n), and gcd(4, 6) = 2, so the answer is ℤ/2."},{"prompt":"ℤ/m ⊗_ℤ ℤ/n ≅ ℤ/d where d is","choices":["gcd(m, n)","lcm(m, n)","mn"],"answer":"gcd(m, n)","tier":2,"why":"ℤ/m ⊗ ℤ/n ≅ (ℤ/n)/m(ℤ/n), and multiplying by m in ℤ/n leaves a quotient of size gcd(m, n). The product mn would only appear for a direct sum when the numbers are coprime."},{"prompt":"ℚ ⊗_ℤ ℤ/5 =","choices":["0","ℤ/5","ℚ"],"answer":"0","tier":3,"why":"For q ⊗ b, write q = 5·(q/5), so q ⊗ b = (q/5) ⊗ 5b = (q/5) ⊗ 0 = 0. ℚ is divisible and ℤ/5 is torsion, so the product is 0."},{"prompt":"Tensoring with which ℤ-module preserves every exact sequence?","choices":["ℚ","ℤ/2","ℤ/6"],"answer":"ℚ","tier":3,"why":"Tensoring with ℚ is localization (inverting all nonzero integers), which preserves exactness, so ℚ is flat. ℤ/2 is not: the injection ℤ → ℤ given by times 2 becomes the zero map after tensoring with ℤ/2."}]},"sightPaceSeconds":30},{"id":"gt-covering","stage":"grad-geometry","part":1,"title":"Covering spaces","summary":"Covers of X correspond to subgroups of π₁(X).","prerequisites":["top-fundamental-group"],"lesson":{"explanation":"Covers of X correspond to subgroups of π₁(X). ℝ → S¹ is the universal cover.","example":"The universal cover of the torus is ℝ²","approaches":{"show":"Show the helix over the circle: t ↦ (cos 2πt, sin 2πt) wraps ℝ around S¹, and each loop around the circle lifts to a path from n to n + 1. Say: the universal cover is simply connected, and its deck transformations form π₁(S¹) ≅ ℤ.","together":"Study z ↦ z² on the unit circle together. Ask: how many points lie over each point (2)? Which subgroup of π₁(S¹) = ℤ does it correspond to (2ℤ)? What is its deck group (ℤ/2)?","alone":"Have the learner name the universal cover of ℝP² alone (S²). Hint if stuck: the sphere maps two-to-one onto ℝP² by identifying antipodal points."}},"practice":{"items":[{"prompt":"The universal cover of S¹ is","choices":["ℝ","S¹","a point"],"answer":"ℝ","tier":1,"why":"The map t ↦ (cos 2πt, sin 2πt) wraps ℝ around the circle, and ℝ is simply connected, so it is the universal cover. S¹ itself is not simply connected."},{"prompt":"π₁(S¹) ≅","choices":["ℤ","0","ℤ/2"],"answer":"ℤ","tier":1,"why":"Loops in the circle are classified by how many times they wind around, which can be any integer, so π₁(S¹) ≅ ℤ."},{"prompt":"The universal cover of the torus is","choices":["ℝ²","S²","the torus"],"answer":"ℝ²","tier":2,"why":"The torus is S¹ × S¹, and the universal cover of a product is the product of universal covers: ℝ × ℝ = ℝ². ℝ² is simply connected, unlike the torus."},{"prompt":"The map z ↦ z³ on the unit circle is a covering with how many sheets?","answer":"3","tier":2,"why":"Each point w on the circle has exactly three cube roots, so z ↦ z³ hits every point three times: a 3-sheeted cover."},{"prompt":"The universal cover of ℝP² is","choices":["S²","ℝ²","ℝP²"],"answer":"S²","tier":3,"why":"ℝP² is the sphere with opposite points glued together, so the quotient map S² → ℝP² is a 2-sheeted cover. S² is simply connected, so it is the universal cover."},{"prompt":"Number of connected 2-sheeted covers of S¹, up to isomorphism?","answer":"1","tier":3,"why":"Connected covers of S¹ correspond to subgroups of π₁ = ℤ, and the number of sheets is the index. ℤ has only one subgroup of index 2, namely 2ℤ, giving the cover z ↦ z²."}]},"sightPaceSeconds":30},{"id":"gt-homology","stage":"grad-geometry","part":1,"title":"Homology","summary":"Hₙ counts n-dimensional holes.","prerequisites":["top-fundamental-group","gal-modules"],"lesson":{"explanation":"Hₙ counts n-dimensional holes. Euler characteristic χ = Σ(−1)ⁿ rank Hₙ.","example":"χ(sphere) = 2, χ(torus) = 0","approaches":{"show":"Count V − E + F for a cube (8 − 12 + 6 = 2) and a tetrahedron (4 − 6 + 4 = 2) to show the sphere always gives 2. Then show the two loops around a torus that do not bound anything, which is why H₁(torus) ≅ ℤ².","together":"Compute the Euler characteristic of a genus-2 surface together. Ask: what are the ranks of H₀ (1), H₁ (4) and H₂ (1)? So what is χ = 1 − 4 + 1 (−2)? Check it against 2 − 2g.","alone":"Have the learner find χ for a closed orientable genus-3 surface alone (−4). Hint if stuck: use χ = 2 − 2g."}},"practice":{"items":[{"prompt":"Euler characteristic of the 2-sphere?","answer":"2","tier":1,"why":"Use vertices − edges + faces. A tetrahedron is a sphere: 4 − 6 + 4 = 2. Equivalently, the ranks of H₀, H₁, H₂ are 1, 0, 1, giving 1 − 0 + 1 = 2."},{"prompt":"H₁ of the circle is","choices":["ℤ","0","ℤ²"],"answer":"ℤ","tier":1,"why":"The circle has one 1-dimensional hole, the loop going around it, so H₁ is one copy of ℤ."},{"prompt":"Euler characteristic of the torus?","answer":"0","tier":2,"why":"The ranks of H₀, H₁, H₂ for the torus are 1, 2, 1, so χ = 1 − 2 + 1 = 0."},{"prompt":"H₁ of the torus is","choices":["ℤ²","ℤ","0"],"answer":"ℤ²","tier":2,"why":"The torus has two independent loops, one around each circle in S¹ × S¹, so H₁ = ℤ ⊕ ℤ = ℤ²."},{"prompt":"Euler characteristic of a closed orientable surface of genus 3?","answer":"-4","tier":3,"why":"For genus g, χ = 2 − 2g. With g = 3, χ = 2 − 6 = −4."},{"prompt":"Rank of H₁ of a closed orientable surface of genus 2?","answer":"4","tier":3,"why":"A genus-g surface has 2g independent loops in H₁ (two around each handle), so for g = 2 the rank is 4."}]},"sightPaceSeconds":30},{"id":"gt-manifolds","stage":"grad-geometry","part":2,"title":"Smooth manifolds","summary":"Spaces locally like ℝⁿ with smooth transition maps; tangent spaces, vector fields, the inverse function theorem.","prerequisites":["c3-gradient","top-homeomorphism"],"lesson":{"explanation":"Spaces locally like ℝⁿ with smooth transition maps; tangent spaces, vector fields, the inverse function theorem.","example":"The sphere Sⁿ is a smooth n-manifold","approaches":{"show":"Show two charts on the circle: one covering every point except (1, 0), the other every point except (−1, 0), each giving an angle. Show the transition between them is θ ↦ θ or θ ↦ θ − 2π, which is smooth, so S¹ is a smooth 1-manifold.","together":"Find the dimension of the set of 3 × 3 real matrices with determinant 1 together. Ask: what dimension is the space of all 3 × 3 matrices (9)? How many equations cut it down (1)? Is 1 a regular value (yes)? So what is the dimension (8)?","alone":"Have the learner find the dimension of the tangent space to S⁵ at a point alone (5). Hint if stuck: S⁵ is cut out of ℝ⁶ by one equation."}},"practice":{"items":[{"prompt":"Dimension of the sphere S² as a manifold?","answer":"2","tier":1,"why":"Near any point, the sphere's surface looks like a small piece of the flat plane ℝ², so it is a 2-dimensional manifold even though it sits in 3-dimensional space."},{"prompt":"A smooth n-manifold looks locally like","choices":["ℝⁿ","a point","a sphere"],"answer":"ℝⁿ","tier":1,"why":"That is the definition: every point has a neighborhood that looks like (is diffeomorphic to) an open piece of ℝⁿ."},{"prompt":"Hairy ball theorem: S² has no nowhere-zero continuous…","choices":["tangent vector field","function","metric"],"answer":"tangent vector field","tier":2,"why":"The hairy ball theorem says every continuous tangent vector field on S² vanishes somewhere: you cannot comb a hairy ball flat. Nonzero functions and metrics on S² exist without trouble."},{"prompt":"Dimension of the torus S¹ × S¹ as a manifold?","answer":"2","tier":2,"why":"Locally, a point on S¹ × S¹ is described by two angles, one per circle, so the torus is 2-dimensional (1 + 1)."},{"prompt":"Dimension of the tangent space at a point of S⁵?","answer":"5","tier":3,"why":"The tangent space at a point of an n-manifold is an n-dimensional vector space. S⁵ is a 5-manifold, so its tangent spaces have dimension 5."},{"prompt":"Dimension of the manifold of 3 × 3 real matrices with determinant 1?","answer":"8","tier":3,"why":"3 × 3 real matrices form a 9-dimensional space, and det = 1 is one equation whose gradient is nonzero there, so the solution set has dimension 9 − 1 = 8."}]},"sightPaceSeconds":30},{"id":"gt-forms","stage":"grad-geometry","part":2,"title":"Differential forms and de Rham cohomology","summary":"Forms integrate over manifolds; d² = 0; Stokes: ∫_M dω = ∫_∂M ω.","prerequisites":["gt-manifolds","c3-stokes"],"lesson":{"explanation":"Forms integrate over manifolds; d² = 0; Stokes: ∫_M dω = ∫_∂M ω.","example":"On ℝ² \\ {0}, dθ is closed but not exact","approaches":{"show":"Compute d(x dy) = dx ∧ dy and then d(dx ∧ dy) = 0 to show d ∘ d = 0. Then check Stokes on the unit disk: the integral of x dy around the circle is π, which equals the integral of dx ∧ dy over the disk, its area.","together":"Integrate dθ around the unit circle together. Ask: is dθ closed (d(dθ) = 0, yes)? What is the integral (2π)? If dθ were exact, equal to df, what would Stokes force the integral to be (0)? So dθ is closed but not exact.","alone":"Have the learner compute d(x² dy) alone (2x dx ∧ dy). Hint if stuck: d(f dy) = df ∧ dy and dy ∧ dy = 0."}},"practice":{"items":[{"prompt":"The exterior derivative satisfies d ∘ d =","choices":["0","d","identity"],"answer":"0","tier":1,"why":"Applying d twice always gives zero. In coordinates this comes from mixed partial derivatives being equal: ∂²f/∂x∂y − ∂²f/∂y∂x = 0."},{"prompt":"For a 1-form ω, the wedge product ω ∧ ω equals","choices":["0","2ω","ω"],"answer":"0","tier":1,"why":"The wedge of 1-forms is antisymmetric, so ω ∧ ω = −ω ∧ ω, which forces ω ∧ ω = 0."},{"prompt":"Generalized Stokes: ∫_M dω =","choices":["∫_∂M ω","0","∫_M ω"],"answer":"∫_∂M ω","tier":2,"why":"Stokes' theorem says the integral of dω over M equals the integral of ω over the boundary ∂M. It generalizes the fundamental theorem of calculus, Green's and the divergence theorem."},{"prompt":"d(x dy) =","choices":["dx ∧ dy","0","dy ∧ dx"],"answer":"dx ∧ dy","tier":2,"why":"d(x dy) = dx ∧ dy + x d(dy) = dx ∧ dy, since d(dy) = 0. Note dy ∧ dx = −dx ∧ dy, so that choice has the wrong sign."},{"prompt":"Integral of dθ once around the unit circle in ℝ² \\ {0}, divided by π?","answer":"2","tier":3,"why":"Going once around the circle, the angle θ increases by 2π, so the integral of dθ is 2π. Divided by π that gives 2."},{"prompt":"Dimension of the first de Rham cohomology of ℝ² \\ {0}?","answer":"1","tier":3,"why":"Closed 1-forms on the punctured plane are measured by one number: their integral around the origin. dθ is closed but not exact, and it spans the space, so the dimension is 1."}]},"sightPaceSeconds":30},{"id":"gt-riemannian","stage":"grad-geometry","part":3,"title":"Riemannian geometry","summary":"A metric measures lengths and angles; curvature is intrinsic.","prerequisites":["gt-forms","gt-homology"],"lesson":{"explanation":"A metric measures lengths and angles; curvature is intrinsic. Gauss–Bonnet: ∫K dA = 2πχ.","example":"Sphere of radius 1 has K = 1","approaches":{"show":"Roll a flat sheet of paper into a cylinder without stretching it and say: the curvature K stays 0 because it is intrinsic. Then show a sphere of radius r has K = 1/r² and area 4πr², so ∫K dA = 4π = 2π · 2.","together":"Use Gauss–Bonnet on a torus together. Ask: what is the Euler characteristic of the torus (0)? So what is the total curvature (0)? Where is K positive (the outer rim) and where negative (the inner rim)?","alone":"Have the learner find ∫K dA for a closed genus-2 surface alone (−4π). Hint if stuck: χ = 2 − 2g, then multiply by 2π."}},"practice":{"items":[{"prompt":"Gauss's Theorema Egregium says Gaussian curvature is","choices":["intrinsic","extrinsic only","always zero"],"answer":"intrinsic","tier":1,"why":"Gauss showed curvature can be computed from distances measured within the surface alone, so it is intrinsic. That is why a flat map of the round Earth must distort distances."},{"prompt":"Gaussian curvature of a flat plane?","answer":"0","tier":1,"why":"A plane has no bending in any direction: both principal curvatures are 0, and K is their product, so K = 0."},{"prompt":"Total curvature ∫K dA of a sphere, divided by π?","answer":"4","tier":2,"why":"A sphere of radius r has K = 1/r² and area 4πr², so the total is 4π for any radius. Also Gauss–Bonnet gives 2πχ = 2π × 2 = 4π. Divided by π: 4."},{"prompt":"Gaussian curvature of a sphere of radius 2? (fraction)","answer":"1/4","tier":2,"why":"For a sphere of radius r, K = 1/r². With r = 2, K = 1/4."},{"prompt":"Total curvature ∫K dA of a torus?","answer":"0","tier":3,"why":"Gauss–Bonnet: total curvature = 2πχ, and the torus has χ = 0, so the integral is 0. Positive curvature on the outside cancels negative curvature on the inside."},{"prompt":"Total curvature ∫K dA of a closed orientable genus-2 surface, divided by π?","answer":"-4","tier":3,"why":"For genus 2, χ = 2 − 2·2 = −2, so Gauss–Bonnet gives 2π × (−2) = −4π. Divided by π: −4."}]},"sightPaceSeconds":30},{"id":"gp-foundations","stage":"grad-probability","part":1,"title":"Measure-theoretic probability","summary":"A probability space (Ω, 𝓕, P); random variables are measurable functions; conditional expectation is a projection.","prerequisites":["ga-measure","pr-limit-theorems"],"lesson":{"explanation":"A probability space (Ω, 𝓕, P); random variables are measurable functions; conditional expectation is a projection.","example":"Kolmogorov's axioms","approaches":{"show":"Model one die roll: Ω = {1, …, 6}, 𝓕 all subsets, P uniform, X(ω) = ω. Show that the event {X even} is in 𝓕, so X is measurable, and that E[X | parity] equals 4 on the evens and 3 on the odds.","together":"Check the tower property with the die together. Ask: what is E[X | parity] on the evens (4) and on the odds (3)? Each has probability 1/2, so what is the average (3.5)? Does it match E[X] (yes)?","alone":"Have the learner compute E[X | 𝓖] alone for a die roll when 𝓖 tells whether the roll is at most 2 (1.5 on {1, 2}, 4.5 otherwise). Hint if stuck: average X over each piece of information separately."}},"practice":{"items":[{"prompt":"A random variable is a…","choices":["measurable function","probability","σ-algebra"],"answer":"measurable function","tier":1,"why":"A random variable is a measurable function from the sample space Ω to the real numbers, so that events like {X ≤ a} are in 𝓕 and have a probability."},{"prompt":"In a probability space (Ω, 𝓕, P), P(Ω) = ?","answer":"1","tier":1,"why":"Kolmogorov's axioms require the whole sample space to have probability 1: something in Ω always happens."},{"prompt":"E[E[X | 𝓖]] =","choices":["E[X]","0","X"],"answer":"E[X]","tier":2,"why":"This is the tower property: averaging the best guess E[X | 𝓖] over everything gives back the overall average E[X]. It is a number, not the random X."},{"prompt":"If X is 𝓖-measurable, E[X | 𝓖] =","choices":["X","E[X]","0"],"answer":"X","tier":2,"why":"If X is already determined by the information in 𝓖, then the best guess of X given 𝓖 is X itself."},{"prompt":"Roll a fair die; 𝓖 tells whether the roll is even. Value of E[roll | 𝓖] on the event that the roll is even?","answer":"4","tier":3,"why":"Given the roll is even, it is 2, 4 or 6 with equal chance, so the conditional average is (2 + 4 + 6) ÷ 3 = 4."},{"prompt":"For X in L², E[X | 𝓖] is the orthogonal projection onto","choices":["the 𝓖-measurable functions in L²","the constants only","the zero subspace"],"answer":"the 𝓖-measurable functions in L²","tier":3,"why":"In L², conditional expectation is the closest 𝓖-measurable function to X: the error X − E[X | 𝓖] is orthogonal to every 𝓖-measurable function in L². The constants only work when 𝓖 is trivial."}]},"sightPaceSeconds":30},{"id":"gp-markov","stage":"grad-probability","part":1,"title":"Markov chains","summary":"The future depends only on the present.","prerequisites":["gp-foundations","la-eigen"],"lesson":{"explanation":"The future depends only on the present. Irreducible aperiodic finite chains converge to a stationary distribution.","example":"πP = π","approaches":{"show":"Draw a two-state weather chain: sunny stays sunny with probability 0.9, rainy turns sunny with probability 0.5. Multiply the starting vector (1, 0) by P a few times, (0.9, 0.1), (0.86, 0.14), …, to show it settles at (5/6, 1/6).","together":"Find the stationary distribution of P = [[0.7, 0.3], [0.2, 0.8]] together. Ask: what balance equation must hold (0.3π₁ = 0.2π₂)? What ratio does that give (π₁ : π₂ = 2 : 3)? Normalize to (2/5, 3/5).","alone":"Have the learner find the stationary distribution alone for P(1 → 2) = 0.1 and P(2 → 1) = 0.5 ((5/6, 1/6)). Hint if stuck: in a two-state chain, the flow out of state 1 equals the flow into it."}},"practice":{"items":[{"prompt":"A stationary distribution π satisfies","choices":["πP = π","Pπ = 0","π = 0"],"answer":"πP = π","tier":1,"why":"Stationary means one more step leaves the distribution unchanged: starting from π and multiplying by the transition matrix P gives π again, so πP = π (π as a row vector)."},{"prompt":"In a Markov chain, the next state depends on","choices":["only the current state","the whole past","nothing"],"answer":"only the current state","tier":1,"why":"That is the Markov property: given the current state, the past adds no further information about the next step."},{"prompt":"A finite irreducible aperiodic chain","choices":["converges to a unique stationary distribution","never settles","has no stationary distribution"],"answer":"converges to a unique stationary distribution","tier":2,"why":"For a finite chain, irreducible gives a unique stationary distribution, and aperiodic rules out cycling, so the distribution converges to it from any starting point."},{"prompt":"Two states with P(1 → 2) = 0.5 and P(2 → 1) = 0.5. Stationary probability of state 1? (fraction)","answer":"1/2","tier":2,"why":"Balance the flow: π₁ × 0.5 = π₂ × 0.5, so π₁ = π₂. With π₁ + π₂ = 1, π₁ = 1/2."},{"prompt":"Two states with P(1 → 2) = 0.1 and P(2 → 1) = 0.5. Stationary probability of state 1? (fraction)","answer":"5/6","tier":3,"why":"Balance the flow: π₁ × 0.1 = π₂ × 0.5, so π₁ = 5π₂. With π₁ + π₂ = 1, 6π₂ = 1, π₂ = 1/6 and π₁ = 5/6."},{"prompt":"A chain that alternates deterministically between two states is","choices":["periodic with period 2","aperiodic","not irreducible"],"answer":"periodic with period 2","tier":3,"why":"Returns to a state happen only at steps 2, 4, 6, …, whose gcd is 2, so the period is 2. It is still irreducible, since each state reaches the other."}]},"sightPaceSeconds":30},{"id":"gp-martingales","stage":"grad-probability","part":2,"title":"Martingales","summary":"E[Xₙ₊₁ | past] = Xₙ: a fair game.","prerequisites":["gp-foundations"],"lesson":{"explanation":"E[Xₙ₊₁ | past] = Xₙ: a fair game. Optional stopping and martingale convergence theorems.","example":"A fair random walk is a martingale","approaches":{"show":"Play a fair coin game starting with 5 dollars, plus 1 on heads and minus 1 on tails, and record the fortune. Show that E[next fortune | history] = current fortune, so the expected fortune stays 5 forever.","together":"Solve gambler's ruin from 3 with targets 0 and 10 together. Ask: is the walk a martingale (yes)? By optional stopping, what is the expected stopped value (3)? If p is the chance of reaching 10, then 10p = 3, so what is p (3/10)?","alone":"Have the learner check alone that Sₙ² − n is a martingale for a fair ±1 walk. Hint if stuck: expand E[(Sₙ ± 1)² | Sₙ] = Sₙ² + 1."}},"practice":{"items":[{"prompt":"A martingale is the model of a…","choices":["fair game","favorable game","deterministic process"],"answer":"fair game","tier":1,"why":"E[Xₙ₊₁ | past] = Xₙ means your expected fortune after the next round equals what you have now, which is what a fair game means. A favorable game would be a submartingale."},{"prompt":"Win 1 dollar on heads, lose 1 on tails with a fair coin. Your fortune over time is a","choices":["martingale","strictly increasing process","constant"],"answer":"martingale","tier":1,"why":"Each step adds +1 or −1 with equal chance, so the expected change is 0 and the expected next fortune equals the current one: a martingale. It goes down half the time, so it is not increasing."},{"prompt":"For a martingale, E[Xₙ] is","choices":["constant in n","increasing","zero always"],"answer":"constant in n","tier":2,"why":"Taking expectations of E[Xₙ₊₁ | past] = Xₙ gives E[Xₙ₊₁] = E[Xₙ], so the mean never changes. It equals E[X₀], which need not be 0."},{"prompt":"Fair ±1 random walk started at 5. E[X₁₀]?","answer":"5","tier":2,"why":"A martingale keeps its mean: E[X₁₀] = E[X₀] = 5. Each step has expected change 0."},{"prompt":"Fair ±1 walk from 3, stopped on hitting 0 or 10. Probability of hitting 10 first? (fraction)","answer":"3/10","tier":3,"why":"Optional stopping: the stopped walk keeps mean 3, so 10 × p + 0 × (1 − p) = 3, giving p = 3/10."},{"prompt":"Sₙ is a fair ±1 walk from 0. Which is also a martingale?","choices":["Sₙ² − n","Sₙ²","Sₙ + n"],"answer":"Sₙ² − n","tier":3,"why":"E[Sₙ₊₁² | past] = Sₙ² + 2Sₙ·E[step] + 1 = Sₙ² + 1, so Sₙ² grows by 1 on average. Subtracting n removes that drift, making Sₙ² − n a martingale."}]},"sightPaceSeconds":30},{"id":"gp-brownian","stage":"grad-probability","part":3,"title":"Brownian motion","summary":"Continuous paths, independent Gaussian increments with variance equal to elapsed time; nowhere differentiable.","prerequisites":["gp-martingales","st-normal"],"lesson":{"explanation":"Continuous paths, independent Gaussian increments with variance equal to elapsed time; nowhere differentiable.","example":"Var(B_t) = t","approaches":{"show":"Build Brownian motion from a random walk: take coin-flip steps of size 1/√n, n per unit of time, and plot it for n = 4, 16, 100. Show the increments over [s, t] are roughly normal with variance t − s and the path gets rougher, never smooth.","together":"Compute E[B₂B₅] together. Ask: can you write B₅ = B₂ + (B₅ − B₂) (yes)? Are the two pieces independent (yes)? So E[B₂B₅] = E[B₂²] + 0, which is what (2)?","alone":"Have the learner find Var(B₅ − B₂) alone (3). Hint if stuck: an increment over an interval of length h is normal with mean 0 and variance h."}},"practice":{"items":[{"prompt":"Var(B_t) for standard Brownian motion =","choices":["t","t²","1"],"answer":"t","tier":1,"why":"B_t − B₀ is normal with mean 0 and variance equal to the elapsed time t. That is part of the definition."},{"prompt":"Standard Brownian motion starts at B₀ = ?","answer":"0","tier":1,"why":"Standard Brownian motion is defined to start at 0."},{"prompt":"Brownian paths are almost surely","choices":["continuous and nowhere differentiable","smooth","piecewise linear"],"answer":"continuous and nowhere differentiable","tier":2,"why":"Brownian paths are continuous, but they wiggle so much at every scale that they have no derivative anywhere (almost surely). They are not smooth or piecewise linear."},{"prompt":"Var(B₅ − B₂) for standard Brownian motion?","answer":"3","tier":2,"why":"Increments have variance equal to elapsed time: B₅ − B₂ covers 5 − 2 = 3 units of time, so the variance is 3."},{"prompt":"E[B₂B₅] for standard Brownian motion?","answer":"2","tier":3,"why":"Write B₅ = B₂ + (B₅ − B₂), with the increment independent of B₂ and mean 0. Then E[B₂B₅] = E[B₂²] + 0 = 2. In general E[B_sB_t] = min(s, t)."},{"prompt":"Is B_t² − t a martingale?","choices":["Yes","No"],"answer":"Yes","tier":3,"why":"Yes: E[B_t² | past at time s] = B_s² + (t − s), so subtracting t cancels the drift. Equivalently, Itô's formula gives d(B_t² − t) = 2B_t dB_t, with no dt term."}]},"sightPaceSeconds":30},{"id":"pde-classification","stage":"pde","part":1,"title":"The three classical PDEs (partial differential equations)","summary":"Laplace (elliptic), heat (parabolic), wave (hyperbolic) model equilibrium, diffusion and waves.","prerequisites":["de-second-order","c3-partials"],"lesson":{"explanation":"Laplace (elliptic), heat (parabolic), wave (hyperbolic) model equilibrium, diffusion and waves.","example":"u_t = u_xx is the heat equation","approaches":{"show":"Show the three models side by side: heat u_t = u_xx spreading a hot spot on a rod, wave u_tt = u_xx carrying a pluck along a string, and Laplace Δu = 0 as a drum skin at rest. Then show the test for A u_xx + B u_xy + C u_yy: B² − 4·A·C negative is elliptic, zero is parabolic, positive is hyperbolic.","together":"Classify u_xx + 2u_xy + u_yy = 0 together. Ask: what are the coefficients (1, 2, 1)? What is B² − 4·A·C (4 − 4 = 0)? So which type is it (parabolic)?","alone":"Have the learner classify u_xx − 9u_yy = 0 alone (hyperbolic). Hint if stuck: compute B² − 4·A·C = 0 − 4(1)(−9) and check its sign."}},"practice":{"items":[{"prompt":"u_t = u_xx is the…","choices":["heat equation","wave equation","Laplace equation"],"answer":"heat equation","tier":1,"why":"One time derivative equals the second space derivative: this models heat spreading out (diffusion). The wave equation has two time derivatives."},{"prompt":"u_tt = c² u_xx is the…","choices":["wave equation","heat equation","Laplace equation"],"answer":"wave equation","tier":1,"why":"Two time derivatives balanced by c² times two space derivatives describe waves moving at speed c."},{"prompt":"u_tt = c² u_xx is","choices":["hyperbolic","elliptic","parabolic"],"answer":"hyperbolic","tier":2,"why":"Write it as u_tt − c²u_xx = 0. The coefficients of the second derivatives have opposite signs (discriminant B² − 4·A·C = 4c² > 0), which is hyperbolic."},{"prompt":"Δu = 0 is","choices":["elliptic","parabolic","hyperbolic"],"answer":"elliptic","tier":2,"why":"Δu = u_xx + u_yy has both second-order coefficients equal to 1 (same sign, discriminant 0 − 4 < 0), which is elliptic."},{"prompt":"u_xx + 2u_xy + u_yy = 0 is","choices":["parabolic","elliptic","hyperbolic"],"answer":"parabolic","tier":3,"why":"With A = 1, B = 2, C = 1, the discriminant is B² − 4·A·C = 4 − 4 = 0, which is parabolic. Indeed the operator is (∂x + ∂y)², a perfect square."},{"prompt":"u_xx + 4u_yy = 0 is","choices":["elliptic","parabolic","hyperbolic"],"answer":"elliptic","tier":3,"why":"With A = 1, B = 0, C = 4, the discriminant is 0 − 16 < 0, so it is elliptic: both coefficients are positive, like a stretched Laplace equation."}]},"sightPaceSeconds":25},{"id":"pde-fourier","stage":"pde","part":1,"title":"Separation of variables and Fourier series","summary":"Split u(x, t) = X(x)T(t); boundary conditions give eigenfunctions like sin(nπx).","prerequisites":["pde-classification","ga-fourier"],"lesson":{"explanation":"Split u(x, t) = X(x)T(t); boundary conditions give eigenfunctions like sin(nπx).","example":"Heat on [0, π]: Σ bₙ e^(−n²t) sin nx","approaches":{"show":"Plug u = X(x)T(t) into u_t = u_xx, divide by X(x)T(t) to get T′/T = X″/X = −λ, and show that X(0) = X(π) = 0 forces X = sin nx with λ = n². Write the solution Σ bₙ e^(−n²t) sin nx and point out that larger n dies faster.","together":"Solve the heat equation on [0, π] with u(x, 0) = sin x + 3 sin 2x together. Ask: which modes appear (n = 1 and 2)? What decay factor goes with each (e^(−t) and e^(−4t))? So what is u (e^(−t) sin x + 3e^(−4t) sin 2x)?","alone":"Have the learner solve u_t = u_xx on [0, π] with zero boundary values and u(x, 0) = sin 2x alone (e^(−4t) sin 2x). Hint if stuck: each mode sin nx decays like e^(−n²t)."}},"practice":{"items":[{"prompt":"Separation of variables guesses a solution of the form","choices":["u(x, t) = X(x)T(t)","u = x + t","u = constant"],"answer":"u(x, t) = X(x)T(t)","tier":1,"why":"Separation of variables assumes u is a product of a function of x alone and a function of
