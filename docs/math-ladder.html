<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a workbook page on faint graph paper; sticky title bar; big touch targets. */
:root {
  --paper: #f5f8fa;
  --grid: rgba(31, 79, 163, 0.06);
  --surface: #ffffff;
  --ink: #15232e;
  --muted: #5b6b78;
  --line: #dbe3ea;
  --accent: #1f4fa3;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefb;
  --pencil: #f2b705;
  --good: #23864f;
  --warn: #c8641a;
  --lv-new: #a3adb6;
  --lv-learning: #e07a1f;
  --lv-passing: #c9a400;
  --lv-mastered: #2e9d5b;
  --lv-sight: #6a4bd1;
  --font: "Lexend", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161c; --grid: rgba(111, 155, 255, 0.05); --surface: #17212a; --ink: #e7edf2; --muted: #93a3b0;
    --line: #26333e; --accent: #6f9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --pencil: #f2c230;
    --good: #4cc27f; --warn: #f0954a; --lv-new: #5d6b77; --lv-learning: #f0954a; --lv-passing: #e2c23a;
    --lv-mastered: #4cc27f; --lv-sight: #9a82ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161c; --grid: rgba(111, 155, 255, 0.05); --surface: #17212a; --ink: #e7edf2; --muted: #93a3b0;
  --line: #26333e; --accent: #6f9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --pencil: #f2c230;
  --good: #4cc27f; --warn: #f0954a; --lv-new: #5d6b77; --lv-learning: #f0954a; --lv-passing: #e2c23a;
  --lv-mastered: #4cc27f; --lv-sight: #9a82ff; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: minmax(80px, 1fr) auto minmax(80px, 1fr); align-items: center; gap: 8px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-title { margin: 0; font-size: 1.05rem; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.bar-right { justify-self: end; }
.nav-btn { background: none; border: 0; color: var(--accent); font-weight: 500; padding: 6px 2px; justify-self: start; }

/* Page */
.wrap { max-width: 640px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.center { text-align: center; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.block { display: block; }
.grow { flex: 1; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.warn { color: var(--warn); }
.pad { padding: 16px; }
h2, h3, h4 { margin: 0; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.display { font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
.eyebrow { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.notice { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; font-size: 0.9rem; }
.error { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.list > * + * { border-top: 1px solid var(--line); }
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 4px 8px; font-size: 0.82rem;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

/* Today card: the one emphasized object on each home screen */
.today { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--pencil); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.today .btn { align-self: stretch; margin-top: 6px; }
.intro { display: flex; flex-direction: column; gap: 6px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-align: center; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 54px; font-size: 1.1rem; padding: 10px 22px; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 0.88rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.wide { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.center-row { justify-content: center; }
.ok-btn { background: var(--good); border-color: var(--good); color: #fff; }
.warn-btn { color: var(--warn); border-color: var(--warn); }
.icon-btn { background: none; border: 0; color: var(--muted); width: 44px; height: 44px; border-radius: 10px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.link-row, .skill-row, .stage-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; min-height: 44px; }
.link-row { justify-content: space-between; border-top: 1px solid var(--line); }
.skill-row, .stage-row { padding: 12px 16px; }
.stage-row { flex-direction: column; align-items: stretch; gap: 6px; }
.stage-top { display: flex; justify-content: space-between; gap: 8px; }

.row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.meter { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; background: var(--lv-new); }
.dot.lv-learning { background: var(--lv-learning); }
.dot.lv-passing { background: var(--lv-passing); }
.dot.lv-mastered { background: var(--lv-mastered); }
.dot.lv-sight { background: var(--lv-sight); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.skip-chip { font-size: 0.72rem; padding: 1px 8px; vertical-align: middle; color: var(--muted); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Learners */
.learner { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 0; }
.learner-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; text-align: left; padding: 10px 16px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; flex: none; }
.confirm { display: flex; gap: 4px; }
.add-row { display: flex; gap: 10px; }
.add-row .field { flex: 1; min-width: 0; }
.field { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 44px; width: 100%; }
textarea.field { font-size: 0.8rem; font-family: ui-monospace, Menlo, monospace; resize: vertical; }

/* Lessons */
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.lesson h3 { font-size: 1.25rem; }
.lesson.compact { background: var(--accent-soft); border-color: transparent; align-self: stretch; }
.lesson.compact h3 { font-size: 1rem; }
.lesson ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.example { background: var(--paper); border-left: 3px solid var(--pencil); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.label { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.subj { color: var(--accent); }
.approaches { display: flex; flex-direction: column; gap: 8px; }
.approaches h4:empty { display: none; }
.approaches ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; }
.approach-now { background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.stage-approaches summary { cursor: pointer; min-height: 28px; }
.stage-approaches[open] summary { margin-bottom: 10px; }
.parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.part { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.part .small:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.terms { margin: 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface);
  display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; text-align: left; align-self: stretch; }
.terms div { display: flex; gap: 8px; }
.terms dt { font-weight: 600; flex: none; min-width: 3.2em; }
.terms dd { margin: 0; color: var(--muted); min-width: 0; }

/* Practice */
.practice { display: flex; flex-direction: column; gap: 16px; }
.practice-head { display: flex; align-items: center; gap: 12px; }
.practice-head > div { flex: 1; min-width: 0; }
.count { font-weight: 600; }
.timer { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.timer span { display: block; height: 100%; background: var(--good); transition: width 0.25s linear; }
.timer span.late { background: var(--pencil); }
.prompt { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 600; line-height: 1.25; text-align: center; white-space: pre-line; overflow-wrap: anywhere; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.choice { min-height: 64px; font-size: 1.35rem; font-weight: 500; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); padding: 8px; }
.choice:active, .key:active { background: var(--accent-soft); border-color: var(--accent); }
.answer-box { min-height: 64px; font-size: 2rem; font-weight: 600; text-align: center; border-bottom: 3px solid var(--accent); padding: 6px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; width: 100%; margin: 0 auto; }
.key { min-height: 48px; font-size: 1.5rem; font-weight: 500; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.key.alt { background: var(--accent-soft); }
.big-field { font-size: 1.5rem; text-align: center; }
.feedback { align-items: center; text-align: center; }
.feedback.good .display { color: var(--good); }
.feedback.miss .display { color: var(--warn); }
.answer-reveal { font-size: 1.25rem; }
.answer-reveal .given { color: var(--warn); }
.why { align-self: stretch; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pencil);
  border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.big-num { font-size: 1.6rem; font-weight: 600; }

/* Writing pad */
.pad-wrap { display: flex; flex-direction: column; gap: 8px; align-self: stretch; }
.pad { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; touch-action: none; display: block; cursor: crosshair; }
.pad-boxes { height: 170px; }
.pad-free { height: 420px; }
.pad-tools { justify-content: flex-end; }
.say-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.writing-shot { margin: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; align-self: stretch; }
.writing-shot img { width: 100%; max-width: 480px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; max-width: calc(100% - 32px);
  transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .timer span, #toast { transition: none; } }

</style>
</head>

<script>window.CURRICULUM = {"id":"math-ladder","title":"Math Ladder","version":1,"glossary":[{"term":"gcd","meaning":"greatest common divisor: the largest whole number that divides both numbers with no remainder. gcd(12, 18) = 6"},{"term":"lcm","meaning":"least common multiple: the smallest number that both numbers divide into with no remainder. lcm(4, 6) = 12"},{"term":"mod","meaning":"modulo: the remainder after dividing. 17 mod 5 = 2, because 17 = 3 × 5 + 2"},{"term":"log","meaning":"logarithm: the power you raise the base to. log base 2 of 8 = 3, because 2 × 2 × 2 = 8"},{"term":"ln","meaning":"natural logarithm: a logarithm whose base is the number e (about 2.718)"},{"term":"SOH-CAH-TOA","meaning":"a memory aid: Sine = Opposite ÷ Hypotenuse, Cosine = Adjacent ÷ Hypotenuse, Tangent = Opposite ÷ Adjacent"},{"term":"sin","meaning":"sine: in a right triangle, the side opposite the angle divided by the hypotenuse"},{"term":"cos","meaning":"cosine: in a right triangle, the side next to the angle divided by the hypotenuse"},{"term":"tan","meaning":"tangent: in a right triangle, the side opposite the angle divided by the side next to it"},{"term":"opp","meaning":"opposite: the side across from the angle"},{"term":"adj","meaning":"adjacent: the side next to the angle that is not the hypotenuse"},{"term":"hyp","meaning":"hypotenuse: the longest side of a right triangle, across from the right angle"},{"term":"SSS","meaning":"Side-Side-Side: all three sides match, so the triangles are congruent (same size and shape)"},{"term":"SAS","meaning":"Side-Angle-Side: two sides and the angle between them match, so the triangles are congruent"},{"term":"ASA","meaning":"Angle-Side-Angle: two angles and the side between them match, so the triangles are congruent"},{"term":"AAS","meaning":"Angle-Angle-Side: two angles and a side not between them match, so the triangles are congruent"},{"term":"SSA","meaning":"Side-Side-Angle: two sides and an angle not between them. This does NOT prove triangles are congruent"},{"term":"d/dx","meaning":"the derivative with respect to x: how fast something changes as x changes"},{"term":"f′","meaning":"f prime: the derivative of f, how fast f is changing"},{"term":"dx","meaning":"a tiny step in x. In an integral it marks x as the variable being added up"},{"term":"dy","meaning":"a tiny step in y. In an integral it marks y as the variable being added up"},{"term":"dt","meaning":"a tiny step in t (often time). In an integral it marks t as the variable being added up"},{"term":"du","meaning":"a tiny step in u, the new variable after a substitution"},{"term":"dz","meaning":"a tiny step in z (or along a path in the complex plane)"},{"term":"dA","meaning":"a tiny piece of area"},{"term":"lim","meaning":"limit: the value something gets closer and closer to"},{"term":"iff","meaning":"if and only if: each statement is true exactly when the other one is"},{"term":"det","meaning":"determinant: a single number computed from a square matrix. For [[a, b], [c, d]] it is ad − bc"},{"term":"dim","meaning":"dimension: the number of independent directions in a space"},{"term":"div","meaning":"divergence: how much a flow spreads out from a point"},{"term":"max","meaning":"maximum: the largest value"},{"term":"min","meaning":"minimum: the smallest value"},{"term":"sup","meaning":"supremum: the smallest number that is greater than or equal to every value in the set"},{"term":"ker","meaning":"kernel: everything a map sends to zero (the identity)"},{"term":"im","meaning":"image: everything a map actually reaches"},{"term":"Re","meaning":"real part of a complex number: for 3 + 4i it is 3"},{"term":"Im","meaning":"imaginary part of a complex number: for 3 + 4i it is 4"},{"term":"Var","meaning":"variance: the average squared distance of the data from the mean"},{"term":"SD","meaning":"standard deviation: the typical distance of the data from the mean (the square root of the variance)"},{"term":"MLE","meaning":"maximum likelihood estimate: the value that makes the data you actually saw most likely"},{"term":"CLT","meaning":"Central Limit Theorem: averages of many random samples follow a bell-shaped (normal) curve"},{"term":"ODE","meaning":"ordinary differential equation: an equation involving the derivatives of a function of one variable"},{"term":"PDE","meaning":"partial differential equation: an equation involving derivatives in several variables"},{"term":"SDE","meaning":"stochastic differential equation: a differential equation that includes random noise"},{"term":"LU","meaning":"lower-upper: writing a matrix as a lower-triangular matrix times an upper-triangular matrix"},{"term":"SVD","meaning":"singular value decomposition: writing any matrix as rotate, stretch, rotate (A = UΣVᵀ)"},{"term":"PID","meaning":"principal ideal domain: a number system where every ideal comes from a single element"},{"term":"GL","meaning":"general linear group: all invertible matrices of a given size"},{"term":"SL","meaning":"special linear group: matrices whose determinant is 1"},{"term":"SO","meaning":"special orthogonal group: the rotations"},{"term":"SU","meaning":"special unitary group: complex matrices that preserve length and have determinant 1"},{"term":"Gal","meaning":"Galois group: the symmetries of the roots of a polynomial"},{"term":"Hom","meaning":"homomorphisms: the maps that preserve the structure"},{"term":"ℤ","meaning":"the integers (…, −2, −1, 0, 1, 2, …). ℤₙ means the numbers 0 to n − 1 with clock arithmetic"},{"term":"ZFC","meaning":"Zermelo–Fraenkel set theory with the axiom of Choice: the standard rules that most of mathematics is built on"},{"term":"NP","meaning":"nondeterministic polynomial time: problems whose answers can be checked quickly, even if finding them may be slow"},{"term":"BSD","meaning":"Birch and Swinnerton-Dyer: an unsolved conjecture about rational points on elliptic curves"},{"term":"CRT","meaning":"Chinese Remainder Theorem: a set of remainders for different divisors pins down one number"}],"stages":[{"id":"g1","title":"Grade 1","order":1,"level":"Elementary","description":"Counting, facts to 20, tens and ones","approaches":{"show":"Keep a bag of 20 counters and a ten-frame on the table all level. Model every idea with them first: count 8 counters touching each one, fill a ten-frame to show 7 + 3 = 10, and bundle 10 straws to show 34 as 3 tens and 4 ones.","together":"Take turns at every step: you move the counters, the child says the number, then switch. For 8 + 5, fill the ten-frame together with 8, ask how many more make 10, then add the last 3 and say 13 together.","alone":"Give one fact at a time, such as 9 + 4 or 12 − 5, and let the child solve it with counters before answering aloud. If stuck, offer only the ten-frame and ask: how many more to make 10?"}},{"id":"g2","title":"Grade 2","order":2,"level":"Elementary","description":"Numbers to 1000, adding and subtracting to 100, money, time, arrays","approaches":{"show":"Use base-ten blocks, real coins and a toy clock across this level. Build 352 with 3 flats, 5 rods and 2 cubes, trade a rod for 10 cubes to show 62 − 27, and count 2 quarters and a dime out loud as 25, 50, 60 cents.","together":"Solve one problem side by side each session, the child writing while you ask the next question. For 38 + 25 ask: how many ones? 13 ones, so what do we trade? Then add the tens to get 63.","alone":"Hand over one problem, such as 74 − 38 or setting the clock to 4:30, and let the child work it on paper or with blocks. If stuck, offer one prompt: start with the ones place."}},{"id":"g3","title":"Grade 3","order":3,"level":"Elementary","description":"Multiplication and division facts, fractions, area","approaches":{"show":"Draw arrays on grid paper all level: 7 rows of 8 squares shows 7 × 8 = 56, the same picture shows area, and splitting 20 dots into 4 equal groups shows 1/4 of 20 = 5. Say each matching division fact, 56 ÷ 8 = 7, aloud.","together":"Work one fact family or word problem together each day. For 6 × 4, ask the child to draw 6 rows of 4 while you skip count by 4s with them, then ask: so what is 24 ÷ 6?","alone":"Give one problem, such as the area of a 5 by 9 rectangle or 42 ÷ 7, and let the child solve it with no help first. If stuck, give one hint: draw it as rows of squares."}},{"id":"g4","title":"Grade 4","order":4,"level":"Elementary","description":"Multi-digit multiplication and division, factors, equivalent fractions, decimals","approaches":{"show":"Show the written methods step by step on paper this level: split 23 × 4 into 20 × 4 and 3 × 4, model divide-multiply-subtract-bring down for 84 ÷ 4, and shade fraction strips to show 2/3 = 8/12 and 0.7 = 7/10.","together":"Do one multi-step problem together, the child doing each step while you ask what comes next. For 156 ÷ 6 ask: how many 6s fit in 15? What is left? Bring down the 6, and how many 6s fit in 36?","alone":"Give one problem such as 34 × 12, 729 ÷ 9 or 3/4 = ?/20 to solve alone on paper. If stuck, offer one hint about the first step only, such as: what is 34 × 2?"}},{"id":"g5","title":"Grade 5","order":5,"level":"Elementary","description":"Order of operations, all fraction operations, decimals, volume, coordinates","approaches":{"show":"Model every fraction and decimal skill with drawings this level: a rectangle cut into sixths for 1/2 + 1/3 = 5/6, a grid shaded twice for 2/3 × 3/4, unit cubes stacked 2 by 3 by 4 for volume, and a grid with axes to plot (3, 2).","together":"Solve one problem together per skill, the child writing each step. For 1/4 + 2/3 ask: what denominator do 4 and 3 share? How many twelfths is each? So what is the sum?","alone":"Give a single problem, such as 5/6 − 1/4, 3 + 4 × 2, or the volume of a 5 by 3 by 4 box, to solve alone. If stuck, offer one hint: which step comes first?"}},{"id":"g6","title":"Grade 6","order":6,"level":"Middle school","description":"Ratios, percents, integers, exponents, expressions, data","approaches":{"show":"Show how a table of values ties this level together: list 2 hours, 120 miles beside 1 hour, 60 miles for unit rates, use a number line for −7 + 4 = −3, and solve x + 7 = 12 by writing minus 7 on both sides.","together":"Work one problem together, the learner explaining each step aloud while you ask questions. For 3x + 2 when x = 4 ask: what replaces x? Which do we do first, the times or the plus? What is 12 + 2?","alone":"Give one problem, such as 4x = 52, 25% of 80, or the median of 7, 2, 9, 4, 5, to solve alone with full work shown. If stuck, offer one hint: what operation undoes the one in the problem?"}},{"id":"g7","title":"Grade 7","order":7,"level":"Middle school","description":"Proportions, signed numbers, linear equations, probability, circles","approaches":{"show":"Use a balance drawing for equations, two-color counters for signed numbers, a real die for probability, and a string wrapped around a can for circles. In each topic, work one full example aloud, such as 3/4 = x/12 giving x = 9, before asking anything.","together":"For each topic, solve one problem as a team where the learner names each step: for 3x + 5 = 20 ask what to undo first, then what is left. Swap roles halfway so the learner explains the next step to you.","alone":"Give one problem per topic to do alone, such as (−4)(−5) or the probability of rolling a number above 4. Offer one hint only if stuck, like naming the rule for signs or asking how many outcomes there are in all."}},{"id":"g8","title":"Grade 8","order":8,"level":"Middle school","description":"Exponent rules, roots, slope, Pythagorean theorem, functions","approaches":{"show":"Build squares from grid paper to show √49 = 7 and to check 3² + 4² = 5². Plot (1, 2) and (3, 8) on graph paper and draw the rise and run to show slope 3, and write 2³·2⁴ as seven twos multiplied.","together":"Work one problem per topic together, with the learner choosing the next step: for legs 6 and 8, ask what to square, what to add, then what square root to take. For f(x) = 2x + 1, ask the learner to plug in 3 while you write.","alone":"Have the learner solve one item per topic alone, such as writing 52,000 in scientific notation or finding the slope from (0, 1) to (2, 7). One hint if stuck: count the places the decimal moves, or subtract the y values first."}},{"id":"alg1","title":"Algebra I","order":9,"level":"High school","description":"Equations, inequalities, systems, polynomials, quadratics","approaches":{"show":"Write each solution as a column of lines, saying the move beside each: subtract 2x from both sides, then add 3. Sketch two lines crossing to show what a system's solution is, and multiply out (x + 2)(x + 3) to show where factoring comes from.","together":"Solve one problem per topic together, such as 5x − 3 = 2x + 9 or x² + 7x + 12. Ask before each line: what is the goal, which move gets us closer, and how do we check the answer at the end.","alone":"Give one problem per topic to solve alone, such as −3x ≤ 12 or the discriminant of x² + 6x + 9. Hint only if stuck: did you divide by a negative, or which numbers are a, b and c."}},{"id":"geo","title":"Geometry","order":10,"level":"High school","description":"Angles, congruence, similarity, right-triangle trig, circles, proof","approaches":{"show":"Draw every figure large and label it: tear the corners off a paper triangle to show they make a straight line of 180°, and lay similar triangles side by side. For trig, mark opp, adj and hyp on a 3-4-5 triangle before writing any ratio.","together":"Work one figure per topic together, such as a triangle with angles 45° and 75°. Ask: what do we know, what rule connects it to what we want, and what is the result; the learner writes each reason.","alone":"Give one figure per topic to solve alone, such as an inscribed angle on a 140° arc or tan of the angle opposite 4 in a 3-4-5 triangle. One hint if stuck: point to the rule in the lesson by name."}},{"id":"alg2","title":"Algebra II","order":11,"level":"High school","description":"Complex numbers, exponentials and logarithms, rational functions, sequences","approaches":{"show":"Make tables of values and graph them: 100, 200, 400, 800 for doubling, and the steps 3, 7, 11 next to 2, 6, 18 for sequences. Rewrite each log as an exponent out loud, saying log base 2 of 8 is 3 because 2³ = 8.","together":"Do one problem per topic together, such as 80 grams with a half-life of 2 years. Ask: what is the starting amount, what factor is applied each step, how many steps are there; then compute together.","alone":"Have the learner solve one problem per topic alone, such as the 20th term of 4, 7, 10, … or simplifying log 2 + log 50. One hint if stuck: write the general rule first, then plug in."}},{"id":"precalc","title":"Precalculus","order":12,"level":"High school","description":"Trigonometric functions, identities, vectors, polar form, limits","approaches":{"show":"Draw a large unit circle with 0, π/6, π/4, π/3 and π/2 marked and read off each point as (cos θ, sin θ). Show a right triangle inside it to connect sin²θ + cos²θ = 1 to the Pythagorean theorem, and plot polar points by turning then walking out.","together":"Work one problem per topic together, such as converting (4, π/2) to Cartesian. Ask: which way do we turn, how far do we walk out, and what are x = r cos θ and y = r sin θ here.","alone":"Give one problem per topic to try alone, such as cos(π/3) or finding r for the point (6, 8). One hint if stuck: picture the unit circle, or use the Pythagorean theorem on x and y."}},{"id":"stats","title":"Statistics","order":13,"level":"High school / intro college","description":"Data, probability rules, normal distribution, inference, regression","approaches":{"show":"Run the whole level on one small data set you write down, such as quiz scores 60, 70, 80, 90, 100: find its range, mean and standard deviation in front of the learner, then flip two coins 20 times to show the share of double heads drifting toward 1/4.","together":"For each skill, work one problem side by side with the learner doing the arithmetic while you ask what each number means. For example, with mean 100 and SD 15, ask which value sits 2 SDs above the mean (130) and what percent lies between 70 and 130 (about 95%).","alone":"Give one problem per skill for the learner to finish without help, such as the range of 4, 9, 15, 20 (answer 16). Offer one hint only if they are stuck, such as: largest value minus smallest value."}},{"id":"calc1","title":"Calculus I","order":14,"level":"Undergraduate","description":"Limits, derivatives and their applications, the integral","approaches":{"show":"Draw y = x² on graph paper and show a secant line through x = 1 and x = 1.1 turning into the tangent line with slope 2. Use that same curve all level long: derivative rules, the minimum of x² − 4x at x = 2, and the area under 2x from 0 to 2 being 4.","together":"For each skill, solve one problem jointly, taking turns on each step. For example, find d/dx (3x⁴ + 2x) together: ask what the power rule does to x⁴, what it does to 2x, and then combine them into 12x³ + 2.","alone":"Have the learner solve one problem per skill alone, such as the integral of 2x from 1 to 3 (answer 8). Give one hint only if stuck, such as: find an antiderivative first, then subtract its value at 1 from its value at 3."}},{"id":"calc2","title":"Calculus II","order":15,"level":"Undergraduate","description":"Integration techniques, applications, sequences and series","approaches":{"show":"Show each technique on one worked integral before any practice: substitution on ∫ 2x cos(x²) dx, parts on ∫ x eˣ dx, and the geometric series 1 + 1/2 + 1/4 + … adding to 2 by shading halves of a square.","together":"Work one problem per skill together, with the learner proposing each move. For example, on ∫ x eˣ dx ask: which part gets simpler when you differentiate it? Set u = x and dv = eˣ dx, then finish uv − ∫ v du together.","alone":"Give one problem per skill to do alone, such as the area under y = x² from 0 to 3 (answer 9). Offer one hint only if stuck, such as: the antiderivative of x² is x³/3."}},{"id":"calc3","title":"Multivariable Calculus","order":16,"level":"Undergraduate","description":"Partial derivatives, gradients, multiple integrals, vector calculus","approaches":{"show":"Use one surface, f(x, y) = x² + y², for the whole level: sketch its circular level curves, show the gradient (2x, 2y) as arrows pointing outward across them, and find the area of the unit disk as π with polar coordinates.","together":"For each skill, do one problem together with the learner holding the pencil. For example, for ∂/∂x (x²y) ask: which letter is treated as a constant? What is the derivative of x²? Then write 2xy together.","alone":"Give one problem per skill for the learner to solve alone, such as the divergence of F = (x, y, z) (answer 3). Offer one hint only if stuck, such as: add ∂P/∂x, ∂Q/∂y and ∂R/∂z."}},{"id":"linalg","title":"Linear Algebra","order":17,"level":"Undergraduate","description":"Matrices, systems, vector spaces, eigenvalues, decompositions","approaches":{"show":"Keep two small matrices on the board all level, such as [[2, 1], [3, 4]] and [[2, 1], [0, 5]]. Use them to show multiplication row by column, the determinant 2·4 − 1·3 = 5, row reduction, and eigenvalues 2 and 5 read off the triangular one.","together":"Work one problem per skill together, letting the learner do each row operation or product while you ask what it means. For example, solve x + y = 5, x − y = 1 together: ask how to eliminate y, then what x and y are (3 and 2).","alone":"Give one problem per skill to solve alone, such as the determinant of [[3, 2], [1, 4]] (answer 10). Offer one hint only if stuck, such as: multiply down the main diagonal and subtract the other diagonal."}},{"id":"diffeq","title":"Differential Equations","order":18,"level":"Undergraduate","description":"First-order, linear, second-order, Laplace transforms, systems","approaches":{"show":"Show each method on one model equation: dy/dx = ky giving exponential growth, y′ + y = 0 with an integrating factor, y″ + y = 0 giving a cosine wave, and ℒ{1} = 1/s computed from the defining integral.","together":"Solve one equation per skill together, with the learner leading each step. For example, on dy/dx = 2y ask: how do you move all the y terms to one side? What is ∫ dy/y? Then reach y = Ce²ˣ together.","alone":"Give one equation per skill to solve alone, such as dy/dx = 2x (answer y = x² + C). Offer one hint only if stuck, such as: integrate both sides with respect to x."}},{"id":"discrete","title":"Discrete Math and Proofs","order":19,"level":"Undergraduate","description":"Logic, sets, induction, combinatorics, graphs, relations","approaches":{"show":"Show each idea with a small concrete object: a truth table for p → q, a Venn diagram for sets A and B, dominoes for induction, and a drawn tree with 5 vertices and 4 edges for graph counting.","together":"Do one problem per skill together, asking the learner to fill in each step. For example, count the edges in the complete graph on 5 vertices: ask how many edges leave each vertex (4), why you divide 5 × 4 by 2, and what you get (10).","alone":"Give one problem per skill for the learner to try alone, such as the number of subsets of a 3-element set (answer 8). Offer one hint only if stuck, such as: each element is either in or out of the subset."}},{"id":"probability","title":"Probability Theory","order":20,"level":"Undergraduate","description":"Random variables, distributions, conditioning, limit theorems","approaches":{"show":"Use one fair six-sided die for the whole level. Work its expected value (3.5) on paper, then reuse the die to show a Binomial count of sixes, a conditional probability given an even roll, and averages of many rolls drifting toward 3.5.","together":"Run each skill as a shared table: write the values and their probabilities in two columns, then fill in the products together. Ask at each step: what are the possible outcomes, what is each one's probability, and do the probabilities add to 1?","alone":"Give one problem per skill to solve alone, such as E[X + Y] with E[X] = 2 and E[Y] = 5, or P(A|B) from P(A and B) = 0.12 and P(B) = 0.4. Hint if stuck: write the formula from the lesson first, then plug in the numbers."}},{"id":"numtheory","title":"Number Theory","order":21,"level":"Upper undergraduate","description":"Divisibility, modular arithmetic, Fermat and Euler, Chinese Remainder Theorem, primes","approaches":{"show":"Work every skill in this level with small numbers you can check by hand: run the Euclidean algorithm on 84 and 36, list 17 mod 5, find the inverse of 3 mod 7, and count φ(12) = 4 by crossing out numbers on a written list from 1 to 12.","together":"Take turns on the steps of one computation per skill, for example finding 5¹⁰⁰ mod 7 together. Ask: what is 5⁶ mod 7, how many full groups of 6 fit into 100, and what is left over?","alone":"Have the learner solve one problem per skill alone, such as the smallest positive x with x ≡ 2 (mod 3) and x ≡ 3 (mod 5). Hint if stuck: list the numbers that leave remainder 3 when divided by 5 and test each one."}},{"id":"analysis","title":"Real Analysis","order":22,"level":"Upper undergraduate","description":"Rigorous limits, completeness, continuity, uniform convergence, integration, metric spaces","approaches":{"show":"For each definition in this level, sketch a concrete picture: an ε-band around 0 with the terms of 1/n falling inside it, the graph of xⁿ on [0, 1] bending into a step, and upper and lower rectangles under f(x) = x. Say the definition aloud while pointing at the picture.","together":"Prove one small fact per skill together, such as 1/n → 0. Ask: what is ε, how large must n be so that 1/n < ε, and which N can we choose? Then ask whether a counterexample would break the statement.","alone":"Give one question per skill alone, such as whether (0, 1) is compact or finding sup {1 − 1/n}. Hint if stuck: test the definition on a specific example, like the open cover by the intervals (1/n, 1)."}},{"id":"algebra","title":"Abstract Algebra","order":23,"level":"Upper undergraduate","description":"Groups, subgroups, homomorphisms, rings, fields","approaches":{"show":"Use ℤ₆ (addition mod 6) as the running example for this level: write its addition table, find the order of 4, list its subgroups {0}, {0, 3}, {0, 2, 4}, and show that 2 · 3 = 0 in the ring ℤ/6ℤ.","together":"For each skill, check one axiom or theorem on a small example together, such as Lagrange for a group of order 12. Ask: what is the group order, what are its divisors, and which subgroup sizes are allowed?","alone":"Have the learner answer one question per skill alone, for example whether ℤ/6ℤ is an integral domain or whether a field with 6 elements exists. Hint if stuck: look for two nonzero elements whose product is 0, or factor 6 into prime powers."}},{"id":"complex","title":"Complex Analysis","order":24,"level":"Upper undergraduate","description":"Holomorphic functions, Cauchy's theorem, residues, conformal maps","approaches":{"show":"Keep f(z) = z² and f(z) = 1/z on the board all level. Check the Cauchy–Riemann equations for z², compute ∮ 1/z dz = 2πi around the unit circle with z = e^(it), and show how z² doubles the angle at 0.","together":"Do one contour or derivative problem per skill together, such as the residue of 1/(z − 2) at 2. Ask: where are the poles, which ones are inside the curve, and what is the coefficient of 1/(z − a)?","alone":"Give one problem per skill alone, such as ∮ 1/(z − 3) dz around the unit circle. Hint if stuck: mark the pole on a sketch and ask whether it lies inside the circle."}},{"id":"topology","title":"Topology","order":25,"level":"Upper undergraduate","description":"Open sets, continuity, compactness, connectedness, the fundamental group","approaches":{"show":"Draw pictures for each skill: a two-point space with its possible topologies, an open cover of ℝ by (−n, n) with no finite subcover, ℝ split by removing 0, and loops on a circle and on a sphere.","together":"Decide one yes-or-no question per skill together, such as whether [0, 1] and ℝ are homeomorphic. Ask: which property (compactness, connectedness) differs, and does a homeomorphism preserve it?","alone":"Have the learner settle one question per skill alone, for example whether ℝ² minus the origin is connected. Hint if stuck: try to draw a path between any two points that avoids the missing point."}},{"id":"numerical","title":"Numerical Analysis","order":26,"level":"Upper undergraduate","description":"Floating point, root finding, interpolation, quadrature, linear solvers","approaches":{"show":"Run each method on a calculator or spreadsheet while the learner watches: compute 0.1 + 0.2 to 17 digits, take Newton steps toward √2 from x₀ = 1 (1.5, then 1.4167), and compare trapezoid and Simpson estimates of ∫₀² x² dx with the exact 8/3.","together":"Do one computation per skill by hand together, such as one Newton step for x² − 9 from x₀ = 1. Ask: what are f(x₀) and f′(x₀), what is their ratio, and how far did the new estimate move?","alone":"Give one problem per skill alone, such as how many points determine a unique quadratic, or by how much halving h cuts trapezoid error. Hint if stuck: recall the degree or error order from the lesson, like O(h²)."}},{"id":"mathstat","title":"Mathematical Statistics","order":27,"level":"Upper undergraduate","description":"Estimators, maximum likelihood, hypothesis testing, Bayesian inference","approaches":{"show":"Work one dataset through every idea of this level: 7 heads in 10 coin flips. Show the maximum likelihood estimate 0.7, a test of p = 0.5, and a Beta(1, 1) prior updating to a Beta(8, 4) posterior.","together":"For each skill, compute with the learner on one small dataset, such as the sample 2, 4, 6, 8. Ask: what is the sample mean (5), what does dividing the squared deviations by n − 1 give (20/3), and why is that estimator unbiased?","alone":"Give one fresh problem per skill, such as 3 heads in 12 flips: find the maximum likelihood estimate of p alone (1/4). Hint if stuck: write the likelihood p³(1 − p)⁹ and maximize its logarithm."}},{"id":"grad-analysis","title":"Graduate Analysis","order":28,"level":"Graduate","description":"Measure theory, Lebesgue integration, Lᵖ spaces, functional analysis","approaches":{"show":"Anchor each idea on [0, 1] with Lebesgue measure: show that the rationals have measure 0 because the n-th one can be covered by an interval of length ε/2ⁿ, so the indicator of ℚ integrates to 0.","together":"Work concrete examples with the learner: fₙ = xⁿ on [0, 1] (dominated by 1, integrals 1/(n + 1) tending to 0), the L² norm of f(x) = x (1/√3), and the Fourier coefficients of a square wave. Ask at each step which theorem justifies the move.","alone":"Have the learner do one computation per skill alone, such as the Hölder conjugate of p = 4 (4/3). Hint if stuck: solve 1/4 + 1/q = 1."}},{"id":"grad-algebra","title":"Graduate Algebra","order":29,"level":"Graduate","description":"Modules, Galois theory, commutative algebra, tensor products","approaches":{"show":"Use ℤ and ℚ(√2) as running examples: show ℤ/6 ≅ ℤ/2 ⊕ ℤ/3 as ℤ-modules, the automorphism sending √2 to −√2, and why ℤ/2 ⊗ ℤ/3 = 0, since 1 ⊗ 1 = 3(1 ⊗ 1) − 2(1 ⊗ 1) = (1 ⊗ 3) − (2 ⊗ 1) = 0.","together":"Compute the degree of ℚ(√2, √3) over ℚ together. Ask: what is the minimal polynomial of √2 (degree 2)? Does √3 lie in ℚ(√2) (no)? So the degree is 2 · 2 = 4, and the Galois group has order 4.","alone":"Have the learner find dim(ℝ⁴ ⊗ ℝ⁵) alone (20). Hint if stuck: tensor products of free modules multiply ranks."}},{"id":"grad-geometry","title":"Algebraic Topology and Differential Geometry","order":30,"level":"Graduate","description":"Homology, covering spaces, manifolds, differential forms, curvature","approaches":{"show":"Use the circle, sphere and torus throughout: show the covering ℝ → S¹ given by t ↦ (cos 2πt, sin 2πt), the Euler characteristic V − E + F of a cube (8 − 12 + 6 = 2), and the form dθ on the punctured plane.","together":"Triangulate the torus together as a square with opposite sides glued and one diagonal. Ask the learner to count vertices (1), edges (3) and triangles (2), then compute χ = 1 − 3 + 2 = 0.","alone":"Have the learner compute the total curvature ∫K dA of a sphere of radius 2 alone (4π). Hint if stuck: Gauss–Bonnet says it is 2π times the Euler characteristic, whatever the radius."}},{"id":"grad-probability","title":"Stochastic Processes","order":31,"level":"Graduate","description":"Measure-theoretic probability, martingales, Markov chains, Brownian motion","approaches":{"show":"Simulate a fair ±1 random walk with coin flips on paper: show that it is a Markov chain, that it is a martingale (the expected next value equals the current value), and that rescaled it looks like Brownian motion.","together":"Work the two-state chain P = [[0.9, 0.1], [0.5, 0.5]] together. Ask the learner to write πP = π, solve the balance equation 0.1π₁ = 0.5π₂, and normalize to π = (5/6, 1/6).","alone":"Have the learner find Var(B₃ − B₁) for standard Brownian motion alone (2). Hint if stuck: an increment over a time interval has variance equal to the length of that interval."}},{"id":"pde","title":"Partial Differential Equations","order":32,"level":"Graduate","description":"Classification, Fourier methods, weak solutions, Sobolev spaces","approaches":{"show":"Show one model of each type: the heat equation u_t = u_xx smoothing a spike, the wave equation u_tt = u_xx moving a bump, and Laplace's equation Δu = 0 giving a soap film. Then show separation of variables on [0, π] producing the modes sin nx.","together":"Solve the heat equation on [0, π] with u(x, 0) = sin 3x and zero boundary values together. Ask: if u = X(x)T(t), what ordinary differential equation does T satisfy? What is the solution (e^(−9t) sin 3x)?","alone":"Have the learner classify u_xx + 4u_yy = 0 alone (elliptic). Hint if stuck: for A u_xx + B u_xy + C u_yy, compute B² − 4·A·C and check its sign."}},{"id":"research","title":"Doctoral and Research Topics","order":33,"level":"Doctoral","description":"Fields where PhD research happens — each builds on the graduate core","approaches":{"show":"Each research topic rests on one flagship example: ζ(2) = π²/6, 6 = 2·3 = (1 + √−5)(1 − √−5) in ℤ[√−5], Itô's d(B_t²) = 2B_t dB_t + dt, and the curve y² = x³ − x. Show the example first, then name the theory it illustrates.","together":"For each topic, compute one invariant with the learner, such as the dimensions of the irreducible representations of S₃. Ask: how many conjugacy classes are there (3), and which three squares sum to 6 (1 + 1 + 4)?","alone":"Have the learner answer one key question per topic alone, such as how many points two conics meet in the projective plane (4). Hint if stuck: Bézout multiplies the degrees, 2 × 2."}}],"skills":[{"id":"g1-count","stage":"g1","part":1,"title":"Counting objects","summary":"Each object gets one number; the last number said is how many.","prerequisites":[],"lesson":{"explanation":"Each object gets one number; the last number said is how many.","example":"●●●●● = 5","approaches":{"show":"Put 7 buttons in a row. Touch each one as you say 1, 2, 3, 4, 5, 6, 7, then circle the whole row with your finger and say: there are 7 buttons.","together":"Count 9 blocks together. You touch each block while the child says the number, then swap roles. Ask: what was the last number we said? So how many blocks are there?","alone":"Have the child count a pile of 12 spoons alone and tell you how many. Hint if stuck: move each spoon to the side as you say its number."}},"practice":{"generator":"count","params":{"max":20}},"sightPaceSeconds":5},{"id":"g1-add10","stage":"g1","part":1,"title":"Addition facts to 10","summary":"Put groups together.","prerequisites":["g1-count"],"lesson":{"explanation":"Put groups together. Count on from the bigger number.","example":"6 + 3 = 9","approaches":{"show":"Hold up 6 crayons in one hand and 3 in the other. Start at 6 and count on, touching each extra crayon: 7, 8, 9. Say: 6 plus 3 is 9.","together":"Do 2 + 5 together. Ask: which number is bigger? Start at 5. Hold up 2 fingers and count on together: 6, 7. So 2 + 5 is 7.","alone":"Have them solve 4 + 3 alone. Hint if stuck: start at 4 and count on 3 more fingers."}},"practice":{"generator":"add","params":{"max":5}},"sightPaceSeconds":3},{"id":"g1-sub10","stage":"g1","part":1,"title":"Subtraction facts to 10","summary":"Take away, or think of the matching addition fact.","prerequisites":["g1-add10"],"lesson":{"explanation":"Take away, or think of the matching addition fact.","example":"9 − 4 = 5 because 4 + 5 = 9","approaches":{"show":"Lay out 9 grapes and take 4 away, counting the 5 that are left. Then say the matching fact: 4 plus 5 is 9, so 9 minus 4 is 5.","together":"Do 8 − 3 together with 8 pennies. Ask: how many do we start with? Take away 3 together. How many are left? Then ask: what plus 3 makes 8?","alone":"Have them solve 10 − 6 alone. Hint if stuck: what number do you add to 6 to make 10?"}},"practice":{"generator":"sub","params":{"max":10}},"sightPaceSeconds":3},{"id":"g1-make10","stage":"g1","part":2,"title":"Make ten","summary":"Know every pair that makes 10 instantly.","prerequisites":["g1-add10"],"lesson":{"explanation":"Know every pair that makes 10 instantly.","example":"7 + 3 = 10","approaches":{"show":"Fill a ten-frame with 7 red counters, then add yellow counters into the empty boxes while counting 8, 9, 10. Say: 7 and 3 make 10.","together":"Use a ten-frame for 6. Ask: how many boxes are empty? Fill them together and count. Say together: 6 and 4 make 10.","alone":"Ask: what goes with 8 to make 10? Let them answer alone. Hint if stuck: put 8 counters on the ten-frame and count the empty boxes."}},"practice":{"generator":"makeTen"},"sightPaceSeconds":3},{"id":"g1-add20","stage":"g1","part":2,"title":"Addition facts to 20","summary":"Make a ten first: 8 + 5 = 8 + 2 + 3 = 13.","prerequisites":["g1-make10"],"lesson":{"explanation":"Make a ten first: 8 + 5 = 8 + 2 + 3 = 13.","example":"9 + 6 = 15","approaches":{"show":"Show 8 + 5 on two ten-frames. Move 2 of the 5 counters to finish the first frame, then say: 10 and 3 more is 13, so 8 plus 5 is 13.","together":"Do 9 + 6 together. Ask: how many does 9 need to make 10? Take 1 from the 6. What is left? So 10 plus 5 is what?","alone":"Have them solve 7 + 6 alone. Hint if stuck: 7 needs 3 to make 10; how many of the 6 are left?"}},"practice":{"generator":"add","params":{"max":10}},"sightPaceSeconds":3},{"id":"g1-sub20","stage":"g1","part":2,"title":"Subtraction facts to 20","summary":"Go back through ten: 14 − 6 = 14 − 4 − 2 = 8.","prerequisites":["g1-sub10","g1-add20"],"lesson":{"explanation":"Go back through ten: 14 − 6 = 14 − 4 − 2 = 8.","example":"15 − 7 = 8","approaches":{"show":"Write 14 − 6. Count back 4 to reach 10 on a number line, then 2 more to reach 8. Say: 14 minus 6 is 8 because I went back through 10.","together":"Do 13 − 5 together on a number line. Ask: how many jumps back to get to 10? We used 3 of the 5, so how many more jumps? Where do we land?","alone":"Have them solve 15 − 7 alone. Hint if stuck: first jump back to 10, then take away the rest."}},"practice":{"generator":"sub","params":{"max":20}},"sightPaceSeconds":3},{"id":"g1-missing","stage":"g1","part":3,"title":"Missing addends","summary":"Find what you add to reach the total.","prerequisites":["g1-sub10"],"lesson":{"explanation":"Find what you add to reach the total.","example":"5 + ? = 9 → 4","approaches":{"show":"Write 5 + ? = 9. Put down 5 counters, then add one at a time while counting 6, 7, 8, 9. Count the added ones and say: I added 4, so the missing number is 4.","together":"Do 3 + ? = 8 together. Ask: where do we start? Count up to 8 together on fingers: 4, 5, 6, 7, 8. How many fingers did we put up?","alone":"Have them solve 6 + ? = 10 alone. Hint if stuck: start at 6 and count up to 10 on your fingers."}},"practice":{"generator":"missingAddend","params":{"max":10}},"sightPaceSeconds":4},{"id":"g1-placevalue","stage":"g1","part":3,"title":"Tens and ones","summary":"In 47 the 4 means 4 tens and the 7 means 7 ones.","prerequisites":["g1-count"],"lesson":{"explanation":"In 47 the 4 means 4 tens and the 7 means 7 ones.","example":"63 = 6 tens + 3 ones","approaches":{"show":"Build 47 with 4 bundles of 10 straws and 7 single straws. Point to the 4 and say: 4 tens is 40. Point to the 7 and say: 7 ones.","together":"Build 63 together with straw bundles. Ask: how many bundles of ten? How many loose straws? So 63 is how many tens and how many ones?","alone":"Ask: how many tens are in 52? Let them answer alone. Hint if stuck: build it with bundles of 10 and count the bundles."}},"practice":{"generator":"placeValue","params":{"digits":2}},"sightPaceSeconds":4},{"id":"g1-tenmore","stage":"g1","part":3,"title":"10 more, 10 less","summary":"Adding or taking 10 changes only the tens digit.","prerequisites":["g1-placevalue"],"lesson":{"explanation":"Adding or taking 10 changes only the tens digit.","example":"10 more than 58 is 68","approaches":{"show":"On a hundred chart, put a finger on 58 and slide straight down one row to 68. Say: 10 more changes only the tens digit, 5 tens becomes 6 tens.","together":"Start at 34 on the hundred chart together. Ask: if we go up one row, what number do we land on? Which digit changed? So 10 less than 34 is 24.","alone":"Ask: what is 10 more than 71? Let them answer alone. Hint if stuck: only the tens digit goes up by one."}},"practice":{"generator":"tenMore","params":{"max":100}},"sightPaceSeconds":4},{"id":"g2-skip","stage":"g2","part":1,"title":"Skip counting","summary":"Count by 2s, 5s and 10s without counting every number.","prerequisites":["g1-count"],"lesson":{"explanation":"Count by 2s, 5s and 10s without counting every number.","example":"5, 10, 15, 20","approaches":{"show":"Lay out nickels one at a time and count by 5s out loud: 5, 10, 15, 20, 25. Point out that every number ends in 5 or 0.","together":"Count dimes together by 10s up to 100, taking turns: you say 10, they say 20, you say 30. Ask: what comes after 60? How did you know?","alone":"Ask them to count by 5s from 35 to 60 alone. Hint if stuck: the numbers take turns ending in 5 and 0."}},"practice":{"generator":"countBy","params":{"step":5,"max":100}},"sightPaceSeconds":4},{"id":"g2-evenodd","stage":"g2","part":1,"title":"Even and odd","summary":"Even numbers split into pairs; they end in 0, 2, 4, 6, 8.","prerequisites":["g2-skip"],"lesson":{"explanation":"Even numbers split into pairs; they end in 0, 2, 4, 6, 8.","example":"14 is even","approaches":{"show":"Lay out 14 beans in pairs, two by two. Show every bean has a partner and say: 14 is even. Add one more bean and show it has no partner: 15 is odd.","together":"Check 11 together with counters. Ask: can we make pairs? Is any counter left alone? Then ask: what digit does 11 end in? Is that an even ending?","alone":"Ask: is 38 even or odd? Let them answer alone. Hint if stuck: look only at the last digit, 8."}},"practice":{"generator":"evenOdd","params":{"max":100}},"sightPaceSeconds":3},{"id":"g2-placevalue3","stage":"g2","part":1,"title":"Hundreds, tens, ones","summary":"Each place is worth 10 times the place to its right.","prerequisites":["g1-placevalue"],"lesson":{"explanation":"Each place is worth 10 times the place to its right.","example":"352 = 3 hundreds + 5 tens + 2 ones","approaches":{"show":"Build 352 with base-ten blocks: 3 flats, 5 rods and 2 cubes. Point to each digit and say: 3 hundreds, 5 tens, 2 ones.","together":"Build 407 together. Ask: how many flats? How many rods? Why are there no rods? Then ask: what does the 0 mean in 407?","alone":"Ask: what is the value of the 6 in 768? Let them answer alone. Hint if stuck: the 6 is in the tens place."}},"practice":{"generator":"placeValue","params":{"digits":3}},"sightPaceSeconds":4},{"id":"g2-compare","stage":"g2","part":2,"title":"Compare to 1000","summary":"Compare hundreds first, then tens, then ones.","prerequisites":["g2-placevalue3"],"lesson":{"explanation":"Compare hundreds first, then tens, then ones.","example":"481 > 418","approaches":{"show":"Write 481 and 418 one above the other. Point to the hundreds: both 4. Then the tens: 8 is more than 1. Say: so 481 is greater than 418.","together":"Compare 562 and 526 together. Ask: are the hundreds the same? Which has more tens? So which is greater, and which sign goes between them?","alone":"Ask them to compare 309 and 390 alone. Hint if stuck: start with the hundreds, then look at the tens."}},"practice":{"generator":"compare","params":{"max":1000}},"sightPaceSeconds":5},{"id":"g2-add100","stage":"g2","part":2,"title":"Add within 100","summary":"Add tens to tens and ones to ones; regroup 10 ones as a ten.","prerequisites":["g1-add20","g1-placevalue"],"lesson":{"explanation":"Add tens to tens and ones to ones; regroup 10 ones as a ten.","example":"38 + 25 = 63","approaches":{"show":"Write 38 + 25 in columns. Add the ones, 8 + 5 = 13, write 3 and carry 1 ten. Add the tens, 1 + 3 + 2 = 6. Say: 38 plus 25 is 63.","together":"Do 47 + 36 together with base-ten blocks. Ask: how many ones altogether? Can we trade 10 ones for a ten? Now how many tens?","alone":"Have them solve 29 + 44 alone. Hint if stuck: add the ones first and trade if you get 10 or more."}},"practice":{"generator":"add","params":{"max":50}},"sightPaceSeconds":8},{"id":"g2-sub100","stage":"g2","part":2,"title":"Subtract within 100","summary":"Subtract ones and tens; trade a ten for 10 ones when needed.","prerequisites":["g2-add100","g1-sub20"],"lesson":{"explanation":"Subtract ones and tens; trade a ten for 10 ones when needed.","example":"62 − 27 = 35","approaches":{"show":"Write 62 − 27 in columns. Show that 2 ones is not enough to take 7, trade a ten so you have 12 ones, then 12 − 7 = 5 and 5 − 2 = 3. Say: 35.","together":"Do 53 − 18 together with blocks. Ask: can we take 8 from 3? What do we trade? How many ones now? Then subtract the tens together.","alone":"Have them solve 71 − 46 alone. Hint if stuck: you need more ones, so trade one ten for 10 ones."}},"practice":{"generator":"sub","params":{"max":100}},"sightPaceSeconds":10},{"id":"g2-money","stage":"g2","part":3,"title":"Counting coins","summary":"Quarter 25¢, dime 10¢, nickel 5¢, penny 1¢.","prerequisites":["g2-skip","g2-add100"],"lesson":{"explanation":"Quarter 25¢, dime 10¢, nickel 5¢, penny 1¢. Count largest coins first.","example":"2 quarters + 1 dime = 60¢","approaches":{"show":"Lay out 2 quarters, 1 dime and 3 pennies. Count the biggest coins first: 25, 50, 60, 61, 62, 63. Say: that is 63 cents.","together":"Count 1 quarter, 2 dimes and 1 nickel together. Ask: which coin do we start with? Then count on: 25, 35, 45, 50. How many cents?","alone":"Give them 3 dimes, 1 nickel and 2 pennies to count alone. Hint if stuck: start with the dimes and count by 10s."}},"practice":{"generator":"money"},"sightPaceSeconds":12},{"id":"g2-time","stage":"g2","part":3,"title":"Telling time","summary":"The short hand is the hour; the long hand on 12 is o'clock, on 6 is half past.","prerequisites":["g2-skip"],"lesson":{"explanation":"The short hand is the hour; the long hand on 12 is o'clock, on 6 is half past.","example":"short hand 4, long hand 6 → 4:30","approaches":{"show":"Set a toy clock to 4:30. Point to the short hand near 4 and say: the hour is 4. Point to the long hand on 6 and say: half past, so 4:30.","together":"Set a clock to 7:00 together. Ask: where should the short hand point? Where does the long hand go for o'clock? Then move it to 7:30 and ask what changed.","alone":"Show 9:30 on the clock and ask them to read it alone. Hint if stuck: the long hand on 6 means half past."}},"practice":{"generator":"time"},"sightPaceSeconds":8},{"id":"g2-arrays","stage":"g2","part":3,"title":"Equal groups and arrays","summary":"Rows of equal size can be counted by skip counting: the start of multiplication.","prerequisites":["g2-skip","g1-add20"],"lesson":{"explanation":"Rows of equal size can be counted by skip counting: the start of multiplication.","example":"3 rows of 4 = 12","approaches":{"show":"Arrange 12 counters in 3 rows of 4. Skip count each row: 4, 8, 12. Say: 3 rows of 4 is 12.","together":"Build 2 rows of 5 counters together. Ask: how many in each row? How many rows? Skip count together: 5, 10. So 2 rows of 5 is how many?","alone":"Have them find 4 rows of 3 alone with counters. Hint if stuck: skip count by 3 for each row."}},"practice":{"generator":"mul","params":{"max":5}},"sightPaceSeconds":5},{"id":"g3-mult","stage":"g3","part":1,"title":"Multiplication facts","summary":"a × b means a groups of b.","prerequisites":["g2-arrays"],"lesson":{"explanation":"a × b means a groups of b. Know all facts to 10 × 10 by sight.","example":"7 × 8 = 56","approaches":{"show":"Draw 7 rows of 8 dots. Split them into 5 rows of 8 (40) and 2 rows of 8 (16), and say: 40 plus 16 is 56, so 7 times 8 is 56.","together":"Do 6 × 7 together. Ask: what is 5 × 7? Then add one more 7. Write 35 + 7 together and ask: so what is 6 × 7?","alone":"Have them solve 8 × 4 alone. Hint if stuck: double 4 × 4."}},"practice":{"generator":"mul","params":{"max":10}},"sightPaceSeconds":3},{"id":"g3-div","stage":"g3","part":1,"title":"Division facts","summary":"Division undoes multiplication: 56 ÷ 8 = 7 because 7 × 8 = 56.","prerequisites":["g3-mult"],"lesson":{"explanation":"Division undoes multiplication: 56 ÷ 8 = 7 because 7 × 8 = 56.","example":"42 ÷ 6 = 7","approaches":{"show":"Put 42 counters into 6 equal groups and count one group: 7. Say: 42 divided by 6 is 7, because 6 times 7 is 42.","together":"Do 24 ÷ 3 together. Ask: 3 times what makes 24? Skip count by 3s together: 3, 6, 9 up to 24. How many jumps?","alone":"Have them solve 63 ÷ 9 alone. Hint if stuck: think, 9 times what is 63?"}},"practice":{"generator":"div","params":{"max":10}},"sightPaceSeconds":4},{"id":"g3-round","stage":"g3","part":1,"title":"Rounding to tens","summary":"Look at the ones: 0–4 round down, 5–9 round up.","prerequisites":["g2-placevalue3"],"lesson":{"explanation":"Look at the ones: 0–4 round down, 5–9 round up.","example":"47 → 50","approaches":{"show":"On a number line from 40 to 50, mark 47. Show it is closer to 50 than 40 and say: the ones digit is 7, so 47 rounds up to 50.","together":"Round 63 together. Ask: which two tens is 63 between? Look at the ones digit: is 3 a round-up or round-down digit? So 63 rounds to what?","alone":"Ask them to round 85 to the nearest ten alone. Hint if stuck: a 5 in the ones place rounds up."}},"practice":{"generator":"roundTen","params":{"max":100}},"sightPaceSeconds":4},{"id":"g3-fractions","stage":"g3","part":2,"title":"Fractions of a set","summary":"1/d of a number means split it into d equal groups.","prerequisites":["g3-div"],"lesson":{"explanation":"1/d of a number means split it into d equal groups.","example":"1/4 of 20 = 5","approaches":{"show":"Deal 20 counters into 4 equal piles, one at a time like cards. Count one pile: 5. Say: one fourth of 20 is 5.","together":"Find 1/3 of 12 together. Ask: how many groups do we make? Deal the counters into 3 piles together. How many are in one pile?","alone":"Have them find 1/5 of 15 alone. Hint if stuck: deal 15 counters into 5 equal piles."}},"practice":{"generator":"fractionOf","params":{"maxDen":10}},"sightPaceSeconds":6},{"id":"g3-area","stage":"g3","part":2,"title":"Area of rectangles","summary":"Area counts unit squares inside: length × width.","prerequisites":["g3-mult"],"lesson":{"explanation":"Area counts unit squares inside: length × width.","example":"4 × 6 rectangle → 24 square units","approaches":{"show":"Draw a 4 by 6 rectangle on grid paper and count the squares in one row (6), then show there are 4 rows. Say: 4 rows of 6 is 24 square units.","together":"Find the area of a 3 by 5 rectangle on grid paper together. Ask: how many squares in one row? How many rows? So what is 3 × 5?","alone":"Have them find the area of a 6 by 7 rectangle alone. Hint if stuck: multiply the length by the width."}},"practice":{"items":[{"prompt":"Area of a rectangle 2 units by 3 units?","answer":"6","tier":1,"why":"Area is length times width. A 2 by 3 rectangle has 2 rows of 3 unit squares, and 2 × 3 = 6 square units."},{"prompt":"Area of a rectangle 2 units by 5 units?","answer":"10","tier":1,"why":"Multiply length by width: 2 × 5 = 10. That is 2 rows of 5 unit squares, 10 square units in all."},{"prompt":"Area of a rectangle 4 units by 6 units?","answer":"24","tier":2,"why":"Multiply the sides: 4 × 6 = 24. Four rows of 6 squares fill the rectangle with 24 square units."},{"prompt":"Area of a square with side 7?","answer":"49","tier":2,"why":"A square has all sides equal, so its area is side times side: 7 × 7 = 49 square units."},{"prompt":"A rectangle has area 36 and length 9. Width?","answer":"4","tier":3,"why":"Area = length × width, so width = area ÷ length. 36 ÷ 9 = 4, and you can check: 9 × 4 = 36."},{"prompt":"A rectangle has area 42 and width 6. Length?","answer":"7","tier":3,"why":"Area = length × width, so length = area ÷ width. 42 ÷ 6 = 7, and 7 × 6 = 42 checks out."}]},"sightPaceSeconds":8},{"id":"g3-perimeter","stage":"g3","part":3,"title":"Perimeter","summary":"Perimeter is the distance around: add all the sides.","prerequisites":["g2-add100"],"lesson":{"explanation":"Perimeter is the distance around: add all the sides.","example":"3 by 5 rectangle → 16","approaches":{"show":"Draw a 3 by 5 rectangle and label all four sides 3, 5, 3, 5. Trace around it with your finger, adding as you go: 3, 8, 11, 16. Say: the perimeter is 16.","together":"Find the perimeter of a 4 by 2 rectangle together. Ask: how many sides? What is each side? Add them together: 4 + 2 + 4 + 2.","alone":"Have them find the perimeter of a square with side 5 alone. Hint if stuck: a square has 4 equal sides."}},"practice":{"items":[{"prompt":"A triangle has sides 4, 5 and 6. Perimeter?","answer":"15","tier":1,"why":"Perimeter is the distance all the way around, so add the three sides: 4 + 5 + 6 = 15."},{"prompt":"A triangle has sides 2, 3 and 4. Perimeter?","answer":"9","tier":1,"why":"Add all three sides: 2 + 3 + 4 = 9."},{"prompt":"Perimeter of a rectangle 3 by 5?","answer":"16","tier":2,"why":"A rectangle has two sides of 3 and two sides of 5: 3 + 5 + 3 + 5 = 16. Don't multiply; 3 × 5 = 15 is the area."},{"prompt":"Perimeter of a square with side 6?","answer":"24","tier":2,"why":"A square has 4 equal sides, so add 6 four times: 6 + 6 + 6 + 6 = 24 (or 4 × 6 = 24)."},{"prompt":"A square has perimeter 20. How long is each side?","answer":"5","tier":3,"why":"A square has 4 equal sides that add to 20, so each side is 20 ÷ 4 = 5."},{"prompt":"A rectangle has perimeter 18 and length 6. Width?","answer":"3","tier":3,"why":"Two lengths use 6 + 6 = 12 of the 18. The other 6 is split between the two widths, so each width is 6 ÷ 2 = 3."}]},"sightPaceSeconds":10},{"id":"g3-wordmult","stage":"g3","part":3,"title":"Multiplication word problems","summary":"Look for equal groups: 'each', 'every', 'per' often mean multiply.","prerequisites":["g3-mult"],"lesson":{"explanation":"Look for equal groups: 'each', 'every', 'per' often mean multiply.","example":"5 bags with 6 apples each → 30","approaches":{"show":"Read aloud: 5 bags with 6 apples each. Underline the word each, draw 5 circles with 6 dots in every circle, and say: 5 groups of 6 is 30 apples.","together":"Solve together: 4 boxes with 3 toys in each box. Ask: what are the equal groups? How many groups? How many in each? So what do we multiply?","alone":"Have them solve alone: 6 cars with 4 wheels each, how many wheels? Hint if stuck: draw 6 cars and count the wheels by 4s."}},"practice":{"items":[{"prompt":"There are 3 bags with 2 apples each. How many apples?","answer":"6","tier":1,"why":"\"Each\" means equal groups: 3 bags of 2 apples is 2 + 2 + 2, which is 3 × 2 = 6."},{"prompt":"There are 2 boxes with 5 pencils each. How many pencils?","answer":"10","tier":1,"why":"2 equal groups of 5 pencils: 5 + 5 = 10, which is 2 × 5 = 10."},{"prompt":"There are 5 bags with 6 apples each. How many apples?","answer":"30","tier":2,"why":"5 equal groups of 6 apples: 5 × 6 = 30."},{"prompt":"24 cookies are shared by 4 kids equally. How many each?","answer":"6","tier":2,"why":"Sharing equally means dividing: 24 ÷ 4 = 6, because 4 kids × 6 cookies = 24."},{"prompt":"A box holds 8 crayons. How many crayons in 7 boxes?","answer":"56","tier":3,"why":"7 boxes with 8 crayons in each is 7 equal groups of 8: 7 × 8 = 56."},{"prompt":"A garden has 6 rows with 9 plants in every row. How many plants?","answer":"54","tier":3,"why":"6 rows with 9 plants in every row: 6 × 9 = 54."},{"prompt":"Each pack has 7 juice boxes. How many packs make 42 juice boxes?","answer":"6","tier":3,"why":"We need to know how many groups of 7 make 42, so divide: 42 ÷ 7 = 6, because 6 × 7 = 42."}]},"sightPaceSeconds":15},{"id":"g4-multidigit","stage":"g4","part":1,"title":"Multi-digit multiplication","summary":"Multiply each place and add the partial products.","prerequisites":["g3-mult","g2-placevalue3"],"lesson":{"explanation":"Multiply each place and add the partial products.","example":"23 × 4 = 80 + 12 = 92","approaches":{"show":"Write 23 × 4. Split 23 into 20 and 3, multiply each: 20 × 4 = 80 and 3 × 4 = 12, then add: 80 + 12 = 92. Draw it as an area box with two parts.","together":"Do 56 × 3 together. Ask: what are the tens and ones in 56? What is 50 × 3? What is 6 × 3? Now add the two partial products.","alone":"Have them solve 34 × 12 alone. Hint if stuck: find 34 × 10 and 34 × 2, then add them."}},"practice":{"items":[{"prompt":"23 × 4 = ?","answer":"92","tier":1,"why":"Split 23 into 20 + 3. Then 20 × 4 = 80 and 3 × 4 = 12, and 80 + 12 = 92."},{"prompt":"12 × 3 = ?","answer":"36","tier":1,"why":"Split 12 into 10 + 2: 10 × 3 = 30 and 2 × 3 = 6, so 30 + 6 = 36."},{"prompt":"56 × 3 = ?","answer":"168","tier":2,"why":"Split 56 into 50 + 6: 50 × 3 = 150 and 6 × 3 = 18, so 150 + 18 = 168."},{"prompt":"125 × 8 = ?","answer":"1000","tier":2,"why":"Split 125 into 100 + 25: 100 × 8 = 800 and 25 × 8 = 200, so 800 + 200 = 1000."},{"prompt":"34 × 12 = ?","answer":"408","tier":3,"why":"Split 12 into 10 + 2: 34 × 10 = 340 and 34 × 2 = 68, so 340 + 68 = 408."},{"prompt":"47 × 23 = ?","answer":"1081","tier":3,"why":"Split 23 into 20 + 3: 47 × 20 = 940 and 47 × 3 = 141, so 940 + 141 = 1081."},{"prompt":"2316 × 4 = ?","answer":"9264","tier":3,"why":"Multiply each place by 4: 2000 × 4 = 8000, 300 × 4 = 1200, 10 × 4 = 40, 6 × 4 = 24. Then 8000 + 1200 + 40 + 24 = 9264."}]},"sightPaceSeconds":20},{"id":"g4-longdiv","stage":"g4","part":1,"title":"Long division","summary":"Divide place by place: divide, multiply, subtract, bring down.","prerequisites":["g3-div","g4-multidigit"],"lesson":{"explanation":"Divide place by place: divide, multiply, subtract, bring down.","example":"84 ÷ 4 = 21","approaches":{"show":"Write 84 ÷ 4 in the long division frame. Say each step aloud: 4 goes into 8 two times, 2 × 4 = 8, subtract to get 0, bring down 4, 4 goes into 4 once. Answer 21.","together":"Do 96 ÷ 8 together. Ask: how many 8s fit in 9? Multiply and subtract: what is left? Bring down the 6: how many 8s fit in 16?","alone":"Have them solve 156 ÷ 6 alone. Hint if stuck: 6 does not fit into 1, so start with 15."}},"practice":{"items":[{"prompt":"84 ÷ 4 = ?","answer":"21","tier":1,"why":"Divide place by place: 8 tens ÷ 4 = 2 tens, and 4 ones ÷ 4 = 1 one. So 84 ÷ 4 = 21; check: 21 × 4 = 84."},{"prompt":"63 ÷ 3 = ?","answer":"21","tier":1,"why":"6 tens ÷ 3 = 2 tens and 3 ones ÷ 3 = 1 one, so 63 ÷ 3 = 21. Check: 21 × 3 = 63."},{"prompt":"96 ÷ 8 = ?","answer":"12","tier":2,"why":"9 ÷ 8 = 1 with 1 left over; bring down the 6 to make 16, and 16 ÷ 8 = 2. So 96 ÷ 8 = 12; check: 12 × 8 = 96."},{"prompt":"156 ÷ 6 = ?","answer":"26","tier":2,"why":"15 ÷ 6 = 2 with 3 left over; bring down the 6 to make 36, and 36 ÷ 6 = 6. So 156 ÷ 6 = 26; check: 26 × 6 = 156."},{"prompt":"729 ÷ 9 = ?","answer":"81","tier":3,"why":"72 ÷ 9 = 8 with nothing left; bring down the 9, and 9 ÷ 9 = 1. So 729 ÷ 9 = 81; check: 81 × 9 = 729."},{"prompt":"1848 ÷ 8 = ?","answer":"231","tier":3,"why":"18 ÷ 8 = 2 with 2 left; bring down 4 to make 24, 24 ÷ 8 = 3; bring down 8, 8 ÷ 8 = 1. So 231; check: 231 × 8 = 1848."}]},"sightPaceSeconds":25},{"id":"g4-factors","stage":"g4","part":1,"title":"Factors and primes","summary":"A prime has exactly two factors: 1 and itself.","prerequisites":["g3-mult"],"lesson":{"explanation":"A prime has exactly two factors: 1 and itself.","example":"Factors of 12: 1, 2, 3, 4, 6, 12","approaches":{"show":"Arrange 12 tiles into every possible rectangle: 1 by 12, 2 by 6, 3 by 4. List the factors 1, 2, 3, 4, 6, 12. Then show 7 tiles only make a 1 by 7 row, so 7 is prime.","together":"Find the factors of 18 together. Ask: does 1 divide 18? Does 2? Does 3? Write each pair as you find it: 1 and 18, 2 and 9, 3 and 6. Ask: is 18 prime?","alone":"Ask them to decide alone whether 21 is prime. Hint if stuck: try dividing 21 by 3."}},"practice":{"items":[{"prompt":"Which number is prime?","choices":["13","15","21"],"answer":"13","tier":1,"why":"13 can only be divided evenly by 1 and 13, so it is prime. 15 = 3 × 5 and 21 = 3 × 7 have extra factors."},{"prompt":"Which is a factor of 18?","choices":["6","4","8"],"answer":"6","tier":1,"why":"6 × 3 = 18, so 6 divides 18 evenly. 18 ÷ 4 and 18 ÷ 8 leave remainders."},{"prompt":"Which is composite?","choices":["27","29","31"],"answer":"27","tier":2,"why":"Composite means it has more than two factors. 27 = 3 × 9, so it is composite; 29 and 31 are prime."},{"prompt":"Which of these is a prime number?","choices":["17","25","33"],"answer":"17","tier":2,"why":"17 has only the factors 1 and 17, so it is prime. 25 = 5 × 5 and 33 = 3 × 11 are not."},{"prompt":"How many factors does 12 have?","answer":"6","tier":3,"why":"List factor pairs of 12: 1 × 12, 2 × 6, 3 × 4. That gives 1, 2, 3, 4, 6, 12, which is 6 factors."},{"prompt":"How many factors does 16 have?","answer":"5","tier":3,"why":"Factor pairs of 16: 1 × 16, 2 × 8, 4 × 4. The 4 is counted once, so the factors are 1, 2, 4, 8, 16, which is 5."}]},"sightPaceSeconds":10},{"id":"g4-equivfrac","stage":"g4","part":2,"title":"Equivalent fractions","summary":"Multiply top and bottom by the same number to get an equal fraction.","prerequisites":["g3-fractions"],"lesson":{"explanation":"Multiply top and bottom by the same number to get an equal fraction.","example":"2/3 = 8/12","approaches":{"show":"Fold a paper strip into thirds and shade 2. Fold each third into 4 parts and count: 8 of 12 parts are shaded. Say: 2/3 equals 8/12 because I multiplied top and bottom by 4.","together":"Do 3/4 = ?/20 together. Ask: what do we multiply 4 by to get 20? Then ask: so what must we multiply 3 by? What is the new top number?","alone":"Have them solve 2/5 = ?/15 alone. Hint if stuck: 5 times what is 15?"}},"practice":{"items":[{"prompt":"Which equals 1/2?","choices":["4/8","3/5","2/3"],"answer":"4/8","tier":1,"why":"Multiply top and bottom of 1/2 by 4 to get 4/8. 3/5 and 2/3 are both more than half."},{"prompt":"1/2 = ?/4","answer":"2","tier":1,"why":"The bottom went from 2 to 4, which is × 2, so multiply the top by 2 too: 1 × 2 = 2. So 1/2 = 2/4."},{"prompt":"2/3 = ?/12","answer":"8","tier":2,"why":"The bottom went from 3 to 12, which is × 4, so the top is 2 × 4 = 8. So 2/3 = 8/12."},{"prompt":"3/4 = ?/20","answer":"15","tier":2,"why":"The bottom went from 4 to 20, which is × 5, so the top is 3 × 5 = 15. So 3/4 = 15/20."},{"prompt":"10/15 in lowest terms is 2/?","answer":"3","tier":3,"why":"Divide top and bottom by 5, the biggest number that goes into both: 10 ÷ 5 = 2 and 15 ÷ 5 = 3, so 10/15 = 2/3."},{"prompt":"12/16 in lowest terms is ?/4","answer":"3","tier":3,"why":"Divide top and bottom by 4: 12 ÷ 4 = 3 and 16 ÷ 4 = 4, so 12/16 = 3/4."}]},"sightPaceSeconds":10},{"id":"g4-fraccompare","stage":"g4","part":2,"title":"Comparing fractions","summary":"Compare with a common denominator, or cross-multiply.","prerequisites":["g4-equivfrac"],"lesson":{"explanation":"Compare with a common denominator, or cross-multiply.","example":"3/4 > 2/3 because 9/12 > 8/12","approaches":{"show":"Shade 3/4 and 2/3 on two same-size fraction strips and show 3/4 is longer. Then rename both as twelfths, 9/12 and 8/12, and say: 9 twelfths is more, so 3/4 is greater.","together":"Compare 2/5 and 1/2 together. Ask: what denominator do 5 and 2 share? What is 2/5 in tenths? What is 1/2 in tenths? So which is greater?","alone":"Have them compare 5/8 and 2/3 alone. Hint if stuck: rename both as twenty-fourths."}},"practice":{"generator":"fractionCompare"},"sightPaceSeconds":10},{"id":"g4-fracadd","stage":"g4","part":2,"title":"Adding like fractions","summary":"Same denominator: add the numerators, keep the denominator.","prerequisites":["g4-equivfrac"],"lesson":{"explanation":"Same denominator: add the numerators, keep the denominator.","example":"2/7 + 3/7 = 5/7","approaches":{"show":"Fold a strip into 7 equal parts. Shade 2 parts, then 3 more, and count 5 of 7 shaded. Say: 2/7 plus 3/7 is 5/7; the parts stay sevenths.","together":"Do 1/5 + 3/5 together with a strip folded into fifths. Ask: how big is each part? How many parts do we shade in all? So what is the answer?","alone":"Have them solve 4/9 + 2/9 alone. Hint if stuck: add only the top numbers and keep the ninths."}},"practice":{"generator":"fractionAdd","params":{"maxDen":12}},"sightPaceSeconds":8},{"id":"g4-decimals","stage":"g4","part":3,"title":"Tenths and hundredths","summary":"0.7 = 7/10 and 0.07 = 7/100.","prerequisites":["g4-equivfrac"],"lesson":{"explanation":"0.7 = 7/10 and 0.07 = 7/100.","example":"0.25 = 25/100 = 1/4","approaches":{"show":"Shade 7 columns of a 10 by 10 grid and write 0.7 = 7/10. Then shade just 7 small squares on a new grid and write 0.07 = 7/100. Point out how much smaller 0.07 is.","together":"Compare 0.5 and 0.45 together on hundredth grids. Ask: how many hundredths is 0.5? How many is 0.45? So which one shades more of the grid?","alone":"Ask them to write 0.3 as a fraction alone. Hint if stuck: the 3 is in the tenths place."}},"practice":{"items":[{"prompt":"0.3 as a fraction:","choices":["3/10","3/100","1/3"],"answer":"3/10","tier":1,"why":"The first place after the decimal point is tenths, so 0.3 means 3 tenths, which is 3/10. 3/100 would be 0.03."},{"prompt":"0.9 = ?/10","answer":"9","tier":1,"why":"0.9 has 9 in the tenths place, so it means 9 tenths: 9/10."},{"prompt":"0.75 = ?/100","answer":"75","tier":2,"why":"Two places after the decimal point means hundredths, so 0.75 is 75 hundredths: 75/100."},{"prompt":"7/100 as a decimal:","choices":["0.07","0.7","7.0"],"answer":"0.07","tier":2,"why":"7/100 is 7 hundredths, so the 7 goes in the second place after the decimal point: 0.07. The number 0.7 would be 7 tenths."},{"prompt":"Which is greater?","choices":["0.5","0.45","0.05"],"answer":"0.5","tier":3,"why":"Compare tenths first: 0.5 has 5 tenths, 0.45 has 4 tenths, 0.05 has 0 tenths. So 0.5 is greatest, even though 45 looks bigger than 5."},{"prompt":"0.6 = ?/100","answer":"60","tier":3,"why":"0.6 is 6 tenths, and each tenth is 10 hundredths, so 0.6 = 0.60 = 60/100."}]},"sightPaceSeconds":10},{"id":"g4-angles","stage":"g4","part":3,"title":"Angles","summary":"A right angle is 90°; a straight line is 180°; a full turn is 360°.","prerequisites":["g3-area"],"lesson":{"explanation":"A right angle is 90°; a straight line is 180°; a full turn is 360°.","example":"Two right angles make 180°","approaches":{"show":"Hold two pencils to make the corner of a book: say this is a right angle, 90°. Open them into a straight line: 180°. Spin one all the way around: 360°.","together":"Look at an angle of 120° together. Ask: is it bigger or smaller than the corner of a page? So is it acute or o
