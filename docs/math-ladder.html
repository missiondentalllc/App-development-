btuse? Then ask how much more it needs to make 180°.","alone":"Ask: how many degrees are in a straight line? Let them answer alone. Hint if stuck: a straight line is two right angles."}},"practice":{"items":[{"prompt":"How many degrees in a right angle?","answer":"90","tier":1,"why":"A right angle is a square corner, like the corner of a page, and it measures 90 degrees."},{"prompt":"How many degrees in a full turn?","answer":"360","tier":1,"why":"Turning all the way around back to where you started is a full turn of 360 degrees, which is four right angles (4 × 90)."},{"prompt":"An angle of 120° is…","choices":["obtuse","acute","right"],"answer":"obtuse","tier":2,"why":"120° is more than a right angle (90°) but less than a straight line (180°), so it is obtuse."},{"prompt":"An angle of 45° is…","choices":["acute","obtuse","right"],"answer":"acute","tier":2,"why":"45° is less than 90°, so it is acute. It is half of a right angle."},{"prompt":"Two angles together make a straight line. One is 130°. The other?","answer":"50","tier":3,"why":"A straight line is 180°, so the other angle is 180 − 130 = 50 degrees."},{"prompt":"A right angle is split into two angles. One is 35°. The other?","answer":"55","tier":3,"why":"A right angle is 90°, so the other part is 90 − 35 = 55 degrees."}]},"sightPaceSeconds":8},{"id":"g5-orderops","stage":"g5","part":1,"title":"Order of operations","summary":"Parentheses, then × and ÷ left to right, then + and − left to right.","prerequisites":["g4-multidigit"],"lesson":{"explanation":"Parentheses, then × and ÷ left to right, then + and − left to right.","example":"3 + 4 × 2 = 11","approaches":{"show":"Write 3 + 4 × 2. Circle 4 × 2 first and write 8, then add 3 to get 11. Show that adding first would give 14, which is wrong.","together":"Do (6 + 2) × 3 together. Ask: is there a parenthesis? What is inside it? Now what operation is left? What is 8 × 3?","alone":"Have them solve 20 − 12 ÷ 4 alone. Hint if stuck: divide before you subtract."}},"practice":{"generator":"orderOps"},"sightPaceSeconds":8},{"id":"g5-fracadd-unlike","stage":"g5","part":1,"title":"Adding unlike fractions","summary":"Rewrite with a common denominator, then add.","prerequisites":["g4-fracadd","g4-factors"],"lesson":{"explanation":"Rewrite with a common denominator, then add.","example":"1/2 + 1/3 = 3/6 + 2/6 = 5/6","approaches":{"show":"Draw a rectangle split into halves and another split into thirds. Cut both into sixths: 1/2 = 3/6 and 1/3 = 2/6. Say: 3 sixths plus 2 sixths is 5/6.","together":"Do 1/4 + 2/3 together. Ask: what number do 4 and 3 both divide into? What is 1/4 in twelfths? What is 2/3 in twelfths? Now add the tops.","alone":"Have them solve 1/2 + 1/5 alone. Hint if stuck: rewrite both as tenths."}},"practice":{"items":[{"prompt":"1/2 + 1/3 = ?","answer":"5/6","tier":1,"why":"Use the common denominator 6: 1/2 = 3/6 and 1/3 = 2/6, so 3/6 + 2/6 = 5/6. Adding tops and bottoms (2/5) is wrong."},{"prompt":"1/2 + 1/4 = ?","answer":"3/4","tier":1,"why":"Rewrite 1/2 as 2/4, then 2/4 + 1/4 = 3/4."},{"prompt":"1/4 + 2/3 = ?","answer":"11/12","tier":2,"why":"Use 12: 1/4 = 3/12 and 2/3 = 8/12, so 3/12 + 8/12 = 11/12."},{"prompt":"3/5 − 1/2 = ?","answer":"1/10","tier":2,"why":"Use 10: 3/5 = 6/10 and 1/2 = 5/10, so 6/10 − 5/10 = 1/10."},{"prompt":"5/6 − 1/4 = ?","answer":"7/12","tier":3,"why":"Use 12: 5/6 = 10/12 and 1/4 = 3/12, so 10/12 − 3/12 = 7/12."},{"prompt":"3/4 + 1/6 = ?","answer":"11/12","tier":3,"why":"Use 12: 3/4 = 9/12 and 1/6 = 2/12, so 9/12 + 2/12 = 11/12."}]},"sightPaceSeconds":20},{"id":"g5-fracmult","stage":"g5","part":2,"title":"Multiplying fractions","summary":"Multiply tops and multiply bottoms.","prerequisites":["g4-equivfrac","g3-mult"],"lesson":{"explanation":"Multiply tops and multiply bottoms.","example":"2/3 × 3/4 = 6/12 = 1/2","approaches":{"show":"Draw a square, shade 3/4 of it with vertical lines, then shade 2/3 of that part with horizontal lines. Count 6 double-shaded out of 12 parts: 2/3 × 3/4 = 6/12 = 1/2.","together":"Do 1/2 × 4/5 together. Ask: what do we get when we multiply the tops? The bottoms? Can 4/10 be simplified? What is it in lowest terms?","alone":"Have them solve 2/3 × 1/4 alone. Hint if stuck: multiply 2 × 1 for the top and 3 × 4 for the bottom."}},"practice":{"items":[{"prompt":"1/2 × 4/5 = ?","answer":"2/5","tier":1,"why":"Multiply tops and bottoms: (1 × 4)/(2 × 5) = 4/10, which simplifies to 2/5."},{"prompt":"1/2 × 1/3 = ?","answer":"1/6","tier":1,"why":"Multiply tops and bottoms: (1 × 1)/(2 × 3) = 1/6. Half of a third is a sixth."},{"prompt":"2/3 × 3/4 = ?","answer":"1/2","tier":2,"why":"(2 × 3)/(3 × 4) = 6/12, and dividing top and bottom by 6 gives 1/2."},{"prompt":"3 × 2/9 = ?","answer":"2/3","tier":2,"why":"Write 3 as 3/1: (3 × 2)/(1 × 9) = 6/9, which simplifies to 2/3."},{"prompt":"1/2 ÷ 1/4 = ?","answer":"2","tier":3,"why":"Dividing by a fraction means multiplying by its flip: 1/2 × 4/1 = 4/2 = 2. There are two quarters in a half."},{"prompt":"2/5 × 5/6 = ?","answer":"1/3","tier":3,"why":"(2 × 5)/(5 × 6) = 10/30, which simplifies to 1/3."}]},"sightPaceSeconds":15},{"id":"g5-decimalops","stage":"g5","part":2,"title":"Adding decimals","summary":"Line up the decimal points, then add as usual.","prerequisites":["g4-decimals"],"lesson":{"explanation":"Line up the decimal points, then add as usual.","example":"2.4 + 1.7 = 4.1","approaches":{"show":"Write 2.4 + 1.7 in a column with the decimal points stacked. Add tenths: 4 + 7 = 11, write 1 and carry 1. Add ones: 1 + 2 + 1 = 4. Bring the point straight down: 4.1.","together":"Do 3.65 + 2.5 together. Ask: where do the decimal points go? Can we write 2.5 as 2.50 to fill the empty spot? Now add each column from the right.","alone":"Have them solve 5.8 + 0.47 alone. Hint if stuck: write 5.8 as 5.80 so both have two decimal places."}},"practice":{"generator":"decimalAdd"},"sightPaceSeconds":10},{"id":"g5-volume","stage":"g5","part":3,"title":"Volume","summary":"Volume of a box = length × width × height (cubic units).","prerequisites":["g3-area"],"lesson":{"explanation":"Volume of a box = length × width × height (cubic units).","example":"2 × 3 × 4 = 24","approaches":{"show":"Build a box from unit cubes, 2 long, 3 wide and 4 high. Count one layer (6 cubes), then show 4 layers. Say: 2 × 3 × 4 = 24 cubic units.","together":"Find the volume of a 3 by 2 by 5 box together. Ask: how many cubes in the bottom layer? How many layers? So what is 6 × 5?","alone":"Have them find the volume of a cube with edge 4 alone. Hint if stuck: multiply 4 × 4 × 4."}},"practice":{"items":[{"prompt":"Volume of a box 1 × 2 × 3?","answer":"6","tier":1,"why":"Volume = length × width × height = 1 × 2 × 3 = 6 cubic units."},{"prompt":"A box is 2 cubes long, 2 cubes wide and 1 cube high. How many unit cubes?","answer":"4","tier":1,"why":"One layer of 2 by 2 cubes holds 2 × 2 = 4 cubes, and there is only 1 layer, so 4 unit cubes."},{"prompt":"Volume of a box 2 × 3 × 4?","answer":"24","tier":2,"why":"Multiply all three: 2 × 3 = 6, then 6 × 4 = 24 cubic units."},{"prompt":"Volume of a cube with edge 5?","answer":"125","tier":2,"why":"A cube has all edges equal, so 5 × 5 × 5 = 25 × 5 = 125 cubic units."},{"prompt":"A box has volume 60, length 5, width 3. Height?","answer":"4","tier":3,"why":"Length × width = 5 × 3 = 15, so height = 60 ÷ 15 = 4. Check: 5 × 3 × 4 = 60."},{"prompt":"A cube has volume 27. How long is each edge?","answer":"3","tier":3,"why":"Find the number that multiplies by itself three times to make 27: 3 × 3 × 3 = 27, so each edge is 3."}]},"sightPaceSeconds":15},{"id":"g5-coordinate","stage":"g5","part":3,"title":"The coordinate plane","summary":"A point (x, y) is x across and y up from the origin (0, 0).","prerequisites":["g2-compare"],"lesson":{"explanation":"A point (x, y) is x across and y up from the origin (0, 0).","example":"(3, 2): right 3, up 2","approaches":{"show":"On grid paper with labeled axes, start at the origin (0, 0), move your finger right 3 and up 2, and mark the point. Say: this is (3, 2), across first, then up.","together":"Plot (4, 1) together. Ask: which number tells us how far across? Which way do we move first? Now how far up? Mark the dot together.","alone":"Have them plot (2, 5) alone. Hint if stuck: walk across the hall before you climb the stairs, so go right 2 first."}},"practice":{"items":[{"prompt":"The origin is…","choices":["(0, 0)","(1, 1)","(0, 1)"],"answer":"(0, 0)","tier":1,"why":"The origin is where the x-axis and y-axis cross, with 0 across and 0 up, so it is (0, 0)."},{"prompt":"What is the y-coordinate of (3, 8)?","answer":"8","tier":1,"why":"In (x, y) the second number is the y-coordinate, so for (3, 8) it is 8."},{"prompt":"Which point is on the x-axis?","choices":["(4, 0)","(0, 4)","(4, 4)"],"answer":"(4, 0)","tier":2,"why":"Points on the x-axis have not moved up or down, so their y-coordinate is 0: (4, 0). The point (0, 4) is on the y-axis."},{"prompt":"What is the x-coordinate of (7, −2)?","answer":"7","tier":2,"why":"In (x, y) the first number is the x-coordinate, so for (7, −2) it is 7."},{"prompt":"Start at the origin. Go right 5 and up 2. Which point are you at?","choices":["(5, 2)","(2, 5)","(5, 0)"],"answer":"(5, 2)","tier":3,"why":"Across comes first and up comes second, so right 5 and up 2 is (5, 2). The point (2, 5) mixes up the order."},{"prompt":"A point is at (2, 3). You move 4 units to the right. What is the new x-coordinate?","answer":"6","tier":3,"why":"Moving right adds to x and leaves y alone: 2 + 4 = 6, so the new point is (6, 3)."}]},"sightPaceSeconds":8},{"id":"g6-ratios","stage":"g6","part":1,"title":"Ratios and rates","summary":"A ratio compares two amounts; a unit rate is the amount per 1.","prerequisites":["g5-fracmult"],"lesson":{"explanation":"A ratio compares two amounts; a unit rate is the amount per 1.","example":"3 cups for 2 people = 1.5 cups per person","approaches":{"show":"Make a table: 2 people use 3 cups, so divide both by 2 to get 1 person uses 1.5 cups. Say: the unit rate is 1.5 cups per person.","together":"Solve together: 5 notebooks cost $10, what is the cost of 1? Ask: what do we divide by to get to 1 notebook? Do it to both numbers. What is the price per notebook?","alone":"Have them solve alone: 180 miles in 3 hours, how many miles per hour? Hint if stuck: divide both numbers by 3."}},"practice":{"items":[{"prompt":"There are 3 red and 5 blue marbles. What is the ratio of red to blue?","choices":["3:5","5:3","3:8"],"answer":"3:5","tier":1,"why":"Red to blue means red first, then blue: 3 red to 5 blue is 3:5. The ratio 3:8 compares red to all marbles."},{"prompt":"2 apples cost $4. Cost of 1 apple in dollars?","answer":"2","tier":1,"why":"Unit rate means the cost for 1: $4 ÷ 2 apples = $2 per apple."},{"prompt":"A car goes 120 miles in 2 hours. Miles per hour?","answer":"60","tier":2,"why":"Miles per hour is miles ÷ hours: 120 ÷ 2 = 60 miles per hour."},{"prompt":"4 pencils cost $2. Cost of 1 pencil in cents?","answer":"50","tier":2,"why":"$2 is 200 cents, and 200 ÷ 4 pencils = 50 cents per pencil."},{"prompt":"The ratio of cats to dogs is 2:3. If there are 6 cats, how many dogs?","answer":"9","tier":3,"why":"6 cats is 2 × 3, so scale the whole ratio by 3: dogs are 3 × 3 = 9. So 6:9 matches 2:3."},{"prompt":"3 cups of flour make 2 loaves. Cups of flour for 1 loaf?","answer":"1.5","tier":3,"why":"For 1 loaf, divide cups by loaves: 3 ÷ 2 = 1.5 cups."}]},"sightPaceSeconds":15},{"id":"g6-percent","stage":"g6","part":1,"title":"Percents","summary":"Percent means 'out of 100'.","prerequisites":["g5-fracmult","g5-decimalops"],"lesson":{"explanation":"Percent means 'out of 100'. 25% of 80 = 0.25 × 80 = 20.","example":"50% of 30 = 15","approaches":{"show":"Draw a 10 by 10 grid and shade 25 squares: 25 out of 100. Then show 25% of 80: write 0.25 × 80 = 20, and check that a quarter of 80 is 20.","together":"Find 10% of 70 together. Ask: what decimal is 10%? What is 0.1 × 70? Then ask: if 10% is 7, what is 30%?","alone":"Have them find 50% of 46 alone. Hint if stuck: 50% means half."}},"practice":{"generator":"percent"},"sightPaceSeconds":10},{"id":"g6-integers","stage":"g6","part":1,"title":"Adding integers","summary":"Same signs: add and keep the sign.","prerequisites":["g5-coordinate"],"lesson":{"explanation":"Same signs: add and keep the sign. Different signs: subtract and keep the sign of the larger.","example":"−7 + 4 = −3","approaches":{"show":"On a number line, start at −7 and jump 4 to the right, landing on −3. Say: the signs are different, so subtract 7 − 4 = 3 and keep the sign of the larger, negative.","together":"Do −5 + (−3) together on a number line. Ask: which way does adding a negative move us? Start at −5 and jump 3 left together. Where do we land?","alone":"Have them solve 9 + (−12) alone. Hint if stuck: the signs differ, so find 12 − 9 and keep the sign of 12."}},"practice":{"generator":"integerAdd","params":{"max":20}},"sightPaceSeconds":6},{"id":"g6-gcd","stage":"g6","part":1,"title":"Greatest common factor","summary":"The largest number dividing both.","prerequisites":["g4-factors"],"lesson":{"explanation":"The largest number dividing both.","example":"gcd(12, 18) = 6","approaches":{"show":"List the factors of 12 (1, 2, 3, 4, 6, 12) and 18 (1, 2, 3, 6, 9, 18). Circle the ones in both lists and point to the largest: gcd(12, 18) = 6.","together":"Find gcd(16, 24) together. Ask: what are the factors of 16? Which of those also divide 24? Which is the largest one we found?","alone":"Have them find gcd(15, 25) alone. Hint if stuck: list the factors of 15 and test each one on 25."}},"practice":{"generator":"gcd"},"sightPaceSeconds":8},{"id":"g6-lcm","stage":"g6","part":2,"title":"Least common multiple","summary":"The smallest number both divide into.","prerequisites":["g4-factors"],"lesson":{"explanation":"The smallest number both divide into.","example":"lcm(4, 6) = 12","approaches":{"show":"List multiples of 4 (4, 8, 12, 16) and of 6 (6, 12, 18). Circle 12, the first number in both lists, and say: lcm(4, 6) = 12.","together":"Find lcm(3, 5) together. Ask: what are the first few multiples of 5? Which of those does 3 divide into? What is the smallest one?","alone":"Have them find lcm(6, 8) alone. Hint if stuck: list multiples of 8 and check each one for 6."}},"practice":{"generator":"lcm"},"sightPaceSeconds":8},{"id":"g6-exponents","stage":"g6","part":2,"title":"Exponents","summary":"aⁿ means a multiplied by itself n times.","prerequisites":["g3-mult"],"lesson":{"explanation":"aⁿ means a multiplied by itself n times.","example":"2⁵ = 32","approaches":{"show":"Write 2⁵ and expand it as 2 × 2 × 2 × 2 × 2. Multiply step by step: 4, 8, 16, 32. Point out that 2⁵ is not 2 × 5.","together":"Do 3⁴ together. Ask: how many 3s do we write? Multiply them one at a time together: 3 × 3 is 9, then 27, then what?","alone":"Have them find 5³ alone. Hint if stuck: write out 5 × 5 × 5."}},"practice":{"generator":"exponent","params":{"maxBase":6}},"sightPaceSeconds":5},{"id":"g6-expressions","stage":"g6","part":2,"title":"Evaluating expressions","summary":"Replace the variable with its value, then follow the order of operations.","prerequisites":["g5-orderops"],"lesson":{"explanation":"Replace the variable with its value, then follow the order of operations.","example":"3x + 2 when x = 4 → 14","approaches":{"show":"Write 3x + 2 and x = 4. Cross out x and write (4) in its place: 3(4) + 2. Multiply first to get 12, then add 2 to get 14.","together":"Evaluate 4(y + 1) when y = 2 together. Ask: what do we put in place of y? What is inside the parentheses now? So what is 4 × 3?","alone":"Have them evaluate 5n − 3 when n = 6 alone. Hint if stuck: replace n with 6 and multiply before subtracting."}},"practice":{"items":[{"prompt":"x + 5 when x = 3?","answer":"8","tier":1,"why":"Replace x with 3: 3 + 5 = 8."},{"prompt":"3x + 2 when x = 4?","answer":"14","tier":1,"why":"3x means 3 times x: 3 × 4 = 12, then add 2 to get 14."},{"prompt":"2a − 5 when a = 10?","answer":"15","tier":2,"why":"2a means 2 × 10 = 20, then subtract 5: 20 − 5 = 15."},{"prompt":"x² + 1 when x = 3?","answer":"10","tier":2,"why":"Square first: 3² = 3 × 3 = 9, then add 1 to get 10. Don't compute 3 × 2."},{"prompt":"4(y + 1) when y = 2?","answer":"12","tier":3,"why":"Do the parentheses first: 2 + 1 = 3, then 4 × 3 = 12."},{"prompt":"2x² − 3 when x = 4?","answer":"29","tier":3,"why":"Exponent first: 4² = 16. Then multiply, 2 × 16 = 32, then subtract: 32 − 3 = 29."}]},"sightPaceSeconds":10},{"id":"g6-onestep","stage":"g6","part":3,"title":"One-step equations","summary":"Do the opposite operation to both sides.","prerequisites":["g6-expressions","g1-missing"],"lesson":{"explanation":"Do the opposite operation to both sides.","example":"x + 7 = 12 → x = 5","approaches":{"show":"Write x + 7 = 12. Write minus 7 under both sides, cross it out on the left, and show x = 5. Check it: 5 + 7 = 12.","together":"Solve 3x = 21 together. Ask: what is being done to x? What undoes multiplying by 3? Divide both sides together. Then check: is 3 × 7 equal to 21?","alone":"Have them solve x − 9 = 4 alone. Hint if stuck: add 9 to both sides."}},"practice":{"items":[{"prompt":"x + 7 = 12. x = ?","answer":"5","tier":1,"why":"Undo adding 7 by subtracting 7 from both sides: x = 12 − 7 = 5. Check: 5 + 7 = 12."},{"prompt":"x + 3 = 10. x = ?","answer":"7","tier":1,"why":"Subtract 3 from both sides: x = 10 − 3 = 7. Check: 7 + 3 = 10."},{"prompt":"3x = 21. x = ?","answer":"7","tier":2,"why":"3x means 3 times x, so divide both sides by 3: x = 21 ÷ 3 = 7."},{"prompt":"x − 9 = 4. x = ?","answer":"13","tier":2,"why":"Undo subtracting 9 by adding 9 to both sides: x = 4 + 9 = 13. Check: 13 − 9 = 4."},{"prompt":"x / 5 = 6. x = ?","answer":"30","tier":3,"why":"Undo dividing by 5 by multiplying both sides by 5: x = 6 × 5 = 30. Check: 30 ÷ 5 = 6."},{"prompt":"4x = 52. x = ?","answer":"13","tier":3,"why":"Divide both sides by 4: x = 52 ÷ 4 = 13. Check: 4 × 13 = 52."}]},"sightPaceSeconds":8},{"id":"g6-mean","stage":"g6","part":3,"title":"Mean","summary":"Add the values and divide by how many there are.","prerequisites":["g4-longdiv"],"lesson":{"explanation":"Add the values and divide by how many there are.","example":"mean of 2, 4, 9 = 5","approaches":{"show":"Stack blocks in towers of 2, 4 and 9. Move blocks from the tall tower to the short ones until all three are 5 high. Then show it on paper: 2 + 4 + 9 = 15 and 15 ÷ 3 = 5.","together":"Find the mean of 6, 8 and 10 together. Ask: what is the total? How many values are there? So what is 24 divided by 3?","alone":"Have them find the mean of 3, 7, 8 and 10 alone. Hint if stuck: add all four, then divide by 4."}},"practice":{"generator":"mean"},"sightPaceSeconds":15},{"id":"g6-median","stage":"g6","part":3,"title":"Median","summary":"Sort the values; the median is the middle one.","prerequisites":["g2-compare"],"lesson":{"explanation":"Sort the values; the median is the middle one.","example":"median of 3, 9, 1 = 3","approaches":{"show":"Write 3, 9, 1 on cards. Put them in order, 1, 3, 9, then point to the middle card: the median is 3.","together":"Find the median of 8, 2, 6, 4, 5 together. Ask: what order do they go in, smallest to largest? How many numbers are there? Which one is in the middle?","alone":"Have them find the median of 12, 7, 15 alone. Hint if stuck: sort them from smallest to largest first."}},"practice":{"generator":"median"},"sightPaceSeconds":12},{"id":"g7-proportion","stage":"g7","part":1,"title":"Proportions","summary":"Two equal ratios.","prerequisites":["g6-ratios","g4-equivfrac"],"lesson":{"explanation":"Two equal ratios. Cross-multiply to solve.","example":"3/4 = x/12 → x = 9","approaches":{"show":"Write 3/4 = x/12 and draw arrows across the equal sign. Multiply 3 × 12 = 36, then divide by 4 to get x = 9, and check that 9/12 reduces to 3/4.","together":"Solve 2/5 = x/15 together. Ask: what do we multiply across (2 × 15 = 30), what do we divide by (5), and does 6/15 reduce back to 2/5?","alone":"Have them solve 4/6 = 10/x alone. Hint if stuck: cross-multiply to get 4x = 60, then divide by 4."}},"practice":{"generator":"proportion"},"sightPaceSeconds":10},{"id":"g7-integer-mult","stage":"g7","part":1,"title":"Multiplying integers","summary":"Same signs give a positive product; different signs give a negative product.","prerequisites":["g6-integers","g3-mult"],"lesson":{"explanation":"Same signs give a positive product; different signs give a negative product.","example":"(−6)(−3) = 18","approaches":{"show":"Write (−6)(−3) and (−6)(3) side by side. Say: same signs give a positive, so 18; different signs give a negative, so −18. Multiply the plain numbers first, then decide the sign.","together":"Do (−7)(4) together. Ask: what is 7 × 4 without signs (28)? Are the signs the same or different? So is the answer positive or negative (−28)?","alone":"Have them find (−9)(−8) alone. Hint if stuck: two negatives are the same sign, so the product is positive."}},"practice":{"generator":"integerMul","params":{"max":12}},"sightPaceSeconds":5},{"id":"g7-linear","stage":"g7","part":2,"title":"Two-step linear equations","summary":"Undo addition/subtraction first, then multiplication/division.","prerequisites":["g6-onestep","g7-integer-mult"],"lesson":{"explanation":"Undo addition/subtraction first, then multiplication/division.","example":"3x + 5 = 20 → x = 5","approaches":{"show":"Solve 3x + 5 = 20 on a balance drawing. Take 5 off both sides to get 3x = 15, then split both sides into 3 groups to get x = 5, and check that 3 × 5 + 5 = 20.","together":"Solve 4x − 3 = 21 together. Ask: what is being done to x last (subtract 3)? Undo it by adding 3 to get 4x = 24. Now what undoes times 4?","alone":"Have them solve 2x + 7 = 19 alone. Hint if stuck: subtract 7 from both sides first."}},"practice":{"generator":"linearEq","params":{"max":10}},"sightPaceSeconds":15},{"id":"g7-probability","stage":"g7","part":2,"title":"Simple probability","summary":"Probability = favorable outcomes ÷ all equally likely outcomes.","prerequisites":["g4-equivfrac"],"lesson":{"explanation":"Probability = favorable outcomes ÷ all equally likely outcomes.","example":"P(even on a die) = 3/6 = 1/2","approaches":{"show":"Hold up a die and list its faces 1 to 6. Circle the even ones, 2, 4 and 6, and say: 3 favorable out of 6 equally likely, so the probability is 3/6 = 1/2.","together":"Find the probability of rolling a number greater than 4 together. Ask: how many outcomes are there in all (6)? Which ones are greater than 4 (5 and 6)? So what fraction is that (2/6 = 1/3)?","alone":"Have them find the probability of rolling a 1 or a 2 alone. Hint if stuck: count the favorable faces and put that over 6."}},"practice":{"generator":"probabilityDie"},"sightPaceSeconds":12},{"id":"g7-circles","stage":"g7","part":3,"title":"Circles","summary":"Circumference = 2πr; area = πr².","prerequisites":["g5-volume"],"lesson":{"explanation":"Circumference = 2πr; area = πr².","example":"r = 3 → area 9π","approaches":{"show":"Draw a circle with radius 3 and label it. Write area = π × 3 × 3 = 9π, then circumference = 2 × π × 3 = 6π, saying which formula squares r and which doubles it.","together":"Find the area of a circle with diameter 10 together. Ask: what is the radius (5)? Which formula gives area (πr²)? What is 5 squared (25), so the area is 25π.","alone":"Have them find the circumference of a circle with radius 7 alone. Hint if stuck: circumference is 2πr, so double 7."}},"practice":{"items":[{"prompt":"If the diameter is 8, the radius is…","choices":["4","16","8"],"answer":"4","tier":1,"why":"The radius is half the diameter: 8 ÷ 2 = 4. Doubling (16) would go the wrong way."},{"prompt":"If the radius is 6, the diameter is…","choices":["12","3","36"],"answer":"12","tier":1,"why":"The diameter is twice the radius: 6 × 2 = 12."},{"prompt":"Area of a circle with radius 3:","choices":["9π","6π","3π"],"answer":"9π","tier":2,"why":"Area = πr² = π × 3 × 3 = 9π. The answer 6π comes from doubling 3 instead of squaring it, which gives circumference."},{"prompt":"Circumference of a circle with radius 5:","choices":["10π","25π","5π"],"answer":"10π","tier":2,"why":"Circumference = 2πr = 2 × π × 5 = 10π. The answer 25π squares the radius, which is the area formula."},{"prompt":"Area of a circle with radius 4:","choices":["16π","8π","4π"],"answer":"16π","tier":2,"why":"Area = πr² = π × 4 × 4 = 16π. The answer 8π doubles 4 instead of squaring it."},{"prompt":"Area of a circle with diameter 10:","choices":["25π","100π","10π"],"answer":"25π","tier":3,"why":"First halve the diameter to get radius 5. Area = π × 5 × 5 = 25π. Using 10 as the radius gives 100π, which is too big."},{"prompt":"Circumference of a circle with diameter 9:","choices":["9π","18π","81π"],"answer":"9π","tier":3,"why":"Circumference = π × diameter, since 2r is the diameter: π × 9 = 9π. The answer 18π doubles the diameter by mistake."}]},"sightPaceSeconds":12},{"id":"g7-percent-change","stage":"g7","part":3,"title":"Percent change","summary":"Change ÷ original × 100%.","prerequisites":["g6-percent"],"lesson":{"explanation":"Change ÷ original × 100%.","example":"40 → 50 is a 25% increase","approaches":{"show":"Show 40 → 50: the change is 10, the original is 40, and 10 ÷ 40 = 0.25, which is 25%. Stress that you always divide by the starting number, not the new one.","together":"Find the percent decrease from 80 to 60 together. Ask: what is the change (20)? What was the original (80)? What is 20 ÷ 80 as a percent (25)?","alone":"Have them find the percent increase from 50 to 60 alone. Hint if stuck: the change is 10; divide it by 50."}},"practice":{"items":[{"prompt":"A price rises from 100 to 110. Percent increase?","answer":"10","tier":1,"why":"The change is 110 − 100 = 10, and 10 ÷ 100 = 0.10, which is a 10% increase."},{"prompt":"A $50 shirt is 10% off. Sale price?","answer":"45","tier":1,"why":"10% of $50 is $5, so the sale price is 50 − 5 = $45."},{"prompt":"A price rises from 40 to 50. Percent increase?","answer":"25","tier":2,"why":"The change is 50 − 40 = 10. Divide by the original: 10 ÷ 40 = 0.25, which is 25%. Dividing by 50 instead would give 20%."},{"prompt":"From 200 to 150 is what percent decrease?","answer":"25","tier":2,"why":"The drop is 200 − 150 = 50, and 50 ÷ 200 = 0.25, which is a 25% decrease."},{"prompt":"A price rises from 20 to 30. Percent increase?","answer":"50","tier":2,"why":"The change is 30 − 20 = 10, and 10 ÷ 20 = 0.5, which is a 50% increase."},{"prompt":"A $80 jacket is 25% off. Sale price?","answer":"60","tier":3,"why":"25% is one quarter, and a quarter of $80 is $20, so the sale price is 80 − 20 = $60."},{"prompt":"A town grows from 2,500 to 3,000 people. Percent increase?","answer":"20","tier":3,"why":"The change is 3,000 − 2,500 = 500, and 500 ÷ 2,500 = 0.2, which is 20%."},{"prompt":"From 80 to 68 is what percent decrease?","answer":"15","tier":3,"why":"The drop is 80 − 68 = 12, and 12 ÷ 80 = 0.15, which is a 15% decrease."}]},"sightPaceSeconds":20},{"id":"g8-sqrt","stage":"g8","part":1,"title":"Square roots","summary":"√n is the number that squared gives n.","prerequisites":["g6-exponents"],"lesson":{"explanation":"√n is the number that squared gives n.","example":"√81 = 9","approaches":{"show":"Draw a 9 by 9 square of dots and say: 81 dots make a square with side 9, so √81 = 9. Then check by squaring: 9 × 9 = 81.","together":"Find √144 together. Ask: what number times itself is near 144? Try 10 (100), then 12 (144). So √144 = 12.","alone":"Have them find √196 alone. Hint if stuck: it is between 13 and 15; square 14."}},"practice":{"generator":"sqrt","params":{"max":15}},"sightPaceSeconds":4},{"id":"g8-exponent-rules","stage":"g8","part":1,"title":"Exponent rules","summary":"aᵐ·aⁿ = aᵐ⁺ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1, a⁻ⁿ = 1/aⁿ.","prerequisites":["g6-exponents"],"lesson":{"explanation":"aᵐ·aⁿ = aᵐ⁺ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1, a⁻ⁿ = 1/aⁿ.","example":"2³·2⁴ = 2⁷","approaches":{"show":"Write 2³·2⁴ as (2·2·2)(2·2·2·2) and count seven twos, so 2⁷: multiplying adds exponents. Then write (x²)³ as x²·x²·x² to show the exponents multiply to x⁶.","together":"Simplify x⁵ · x² together. Ask: same base? Then what do we do with 5 and 2 (add)? So the answer is x⁷. Next do (x³)² and ask whether we add or multiply.","alone":"Have them write 3⁻² as a fraction alone. Hint if stuck: a negative exponent means 1 over the positive power, so 1/3²."}},"practice":{"items":[{"prompt":"5⁰ = ?","answer":"1","tier":1,"why":"Any nonzero number to the power 0 is 1. You can see it from 5³ ÷ 5³ = 5⁰, and anything divided by itself is 1."},{"prompt":"x² · x³ = ?","choices":["x⁵","x⁶","x¹"],"answer":"x⁵","tier":1,"why":"When multiplying the same base, add the exponents: x² · x³ = x²⁺³ = x⁵. Multiplying the exponents (x⁶) is the mistake."},{"prompt":"x³ · x⁴ = ?","choices":["x⁷","x¹²","x¹"],"answer":"x⁷","tier":2,"why":"Same base, so add the exponents: 3 + 4 = 7, giving x⁷. The answer x¹² multiplies them instead."},{"prompt":"(x²)⁵ = ?","choices":["x¹⁰","x⁷","x³²"],"answer":"x¹⁰","tier":2,"why":"A power of a power multiplies the exponents: (x²)⁵ = x²·⁵ = x¹⁰, because it is five copies of x² multiplied."},{"prompt":"(x³)⁴ = ?","choices":["x¹²","x⁷","x⁸¹"],"answer":"x¹²","tier":2,"why":"Power of a power: multiply 3 × 4 = 12, so (x³)⁴ = x¹². Adding gives x⁷, which is wrong here."},{"prompt":"2⁻³ as a fraction:","answer":"1/8","tier":3,"why":"A negative exponent means one over the positive power: 2⁻³ = 1/2³ = 1/8."},{"prompt":"10⁻² as a fraction:","answer":"1/100","tier":3,"why":"10⁻² = 1/10² = 1/100."},{"prompt":"a⁵ · a⁻⁵ = ?","answer":"1","tier":3,"why":"Add the exponents: 5 + (−5) = 0, so a⁵ · a⁻⁵ = a⁰ = 1 (for a not zero)."}]},"sightPaceSeconds":10},{"id":"g8-scientific","stage":"g8","part":2,"title":"Scientific notation","summary":"Write a number as a × 10ⁿ with 1 ≤ a < 10.","prerequisites":["g8-exponent-rules","g4-decimals"],"lesson":{"explanation":"Write a number as a × 10ⁿ with 1 ≤ a < 10.","example":"4,500 = 4.5 × 10³","approaches":{"show":"Take 4,500 and move the decimal left three places to get 4.5, saying each hop. Write 4.5 × 10³, and point out that 4.5 is between 1 and 10.","together":"Write 0.007 in scientific notation together. Ask: where must the decimal go so the number is between 1 and 10 (after the 7)? How many places did it move (3)? Which way, so is the exponent positive or negative?","alone":"Have them write 62,000 in scientific notation alone. Hint if stuck: move the decimal until you have 6.2, and count the hops."}},"practice":{"items":[{"prompt":"4.5 × 10³ written out:","answer":"4500","tier":1,"why":"10³ = 1000, so 4.5 × 1000 = 4500. Equivalently, move the decimal point 3 places right."},{"prompt":"Which is in scientific notation?","choices":["7.1 × 10⁴","71 × 10³","0.71 × 10⁵"],"answer":"7.1 × 10⁴","tier":1,"why":"Scientific notation needs the front number to be at least 1 and less than 10. Only 7.1 fits; 71 is too big and 0.71 is too small."},{"prompt":"3,200 in scientific notation:","choices":["3.2 × 10³","32 × 10²","3.2 × 10²"],"answer":"3.2 × 10³","tier":2,"why":"Move the decimal point in 3,200 three places left to get 3.2, so it is 3.2 × 10³. The form 32 × 10² is equal but 32 is not between 1 and 10."},{"prompt":"0.005 =","choices":["5 × 10⁻³","5 × 10³","0.5 × 10⁻²"],"answer":"5 × 10⁻³","tier":2,"why":"Move the decimal point 3 places right to get 5, so 0.005 = 5 × 10⁻³. A small number needs a negative exponent."},{"prompt":"58,000 in scientific notation:","choices":["5.8 × 10⁴","58 × 10³","5.8 × 10³"],"answer":"5.8 × 10⁴","tier":2,"why":"Move the decimal point in 58,000 four places left to get 5.8, so it is 5.8 × 10⁴."},{"prompt":"(2 × 10³)(3 × 10²) = ? × 10⁵","answer":"6","tier":3,"why":"Multiply the front numbers and add the exponents: 2 × 3 = 6 and 10³ × 10² = 10⁵, giving 6 × 10⁵."},{"prompt":"(4 × 10²)(2 × 10⁶) = ? × 10⁸","answer":"8","tier":3,"why":"Multiply the front numbers: 4 × 2 = 8. Add exponents: 2 + 6 = 8. So the product is 8 × 10⁸."},{"prompt":"0.00031 =","choices":["3.1 × 10⁻⁴","3.1 × 10⁴","31 × 10⁻³"],"answer":"3.1 × 10⁻⁴","tier":3,"why":"Move the decimal point 4 places right to get 3.1, so 0.00031 = 3.1 × 10⁻⁴. The form 31 × 10⁻⁵ would be equal, but 31 × 10⁻³ is not."}]},"sightPaceSeconds":15},{"id":"g8-slope","stage":"g8","part":2,"title":"Slope","summary":"Slope = rise ÷ run = (y₂ − y₁)/(x₂ − x₁).","prerequisites":["g7-linear","g5-coordinate"],"lesson":{"explanation":"Slope = rise ÷ run = (y₂ − y₁)/(x₂ − x₁).","example":"(1, 2) to (3, 8): slope 3","approaches":{"show":"Plot (1, 2) and (3, 8) on graph paper. Draw the step from one to the other: up 6, over 2. Say: rise ÷ run = 6 ÷ 2 = 3.","together":"Find the slope from (2, 1) to (6, 9) together. Ask: what is y₂ − y₁ (8)? What is x₂ − x₁ (4)? What is 8 ÷ 4 (2)?","alone":"Have them find the slope from (0, 5) to (4, −3) alone. Hint if stuck: the change in y is −3 − 5 = −8."}},"practice":{"generator":"slope"},"sightPaceSeconds":15},{"id":"g8-pythagorean","stage":"g8","part":3,"title":"Pythagorean theorem","summary":"In a right triangle a² + b² = c², where c is the hypotenuse.","prerequisites":["g8-sqrt"],"lesson":{"explanation":"In a right triangle a² + b² = c², where c is the hypotenuse.","example":"3, 4 → 5","approaches":{"show":"Draw a right triangle with legs 3 and 4 and squares on each side. Say 9 + 16 = 25 and √25 = 5, so the hypotenuse is 5.","together":"Find the hypotenuse for legs 6 and 8 together. Ask: what is 6² (36) and 8² (64)? What is the sum (100)? What is √100 (10)?","alone":"Have them find the missing leg when the hypotenuse is 13 and one leg is 5. Hint if stuck: subtract, 169 − 25, then take the square root."}},"practice":{"items":[{"prompt":"Legs 3 and 4. Hypotenuse?","answer":"5","tier":1,"why":"3² + 4² = 9 + 16 = 25, and √25 = 5."},{"prompt":"Legs 6 and 8. Hypotenuse?","answer":"10","tier":1,"why":"6² + 8² = 36 + 64 = 100, and √100 = 10."},{"prompt":"Legs 5 and 12. Hypotenuse?","answer":"13","tier":2,"why":"5² + 12² = 25 + 144 = 169, and √169 = 13."},{"prompt":"Legs 8 and 15. Hypotenuse?","answer":"17","tier":2,"why":"8² + 15² = 64 + 225 = 289, and √289 = 17."},{"prompt":"Legs 9 and 12. Hypotenuse?","answer":"15","tier":2,"why":"9² + 12² = 81 + 144 = 225, and √225 = 15."},{"prompt":"Hypotenuse 10, one leg 6. Other leg?","answer":"8","tier":3,"why":"Subtract the leg's square from the hypotenuse's square: 10² − 6² = 100 − 36 = 64, and √64 = 8."},{"prompt":"Hypotenuse 13, one leg 5. Other leg?","answer":"12","tier":3,"why":"13² − 5² = 169 − 25 = 144, and √144 = 12."},{"prompt":"Hypotenuse 25, one leg 7. Other leg?","answer":"24","tier":3,"why":"25² − 7² = 625 − 49 = 576, and √576 = 24."}]},"sightPaceSeconds":15},{"id":"g8-functions","stage":"g8","part":3,"title":"Functions","summary":"A function gives exactly one output for each input.","prerequisites":["g8-slope","g6-expressions"],"lesson":{"explanation":"A function gives exactly one output for each input. y = mx + b is a line with slope m and intercept b.","example":"f(x) = 2x + 1, f(3) = 7","approaches":{"show":"Draw an input-output machine for f(x) = 2x + 1. Drop in 3, say 2 × 3 + 1 = 7, and write f(3) = 7. Then point to y = 2x + 1 and name 2 as the slope and 1 as the intercept.","together":"Find f(4) for f(x) = 3x − 2 together. Ask: what replaces x (4)? What is 3 × 4 (12)? Then subtract 2 to get 10. Next ask what the slope and intercept of y = 3x − 2 are.","alone":"Have them find the slope and y-intercept of y = −2x + 6 alone. Hint if stuck: in y = mx + b, m is next to x and b stands alone."}},"practice":{"items":[{"prompt":"f(x) = x + 4. f(2) = ?","answer":"6","tier":1,"why":"Put 2 in for x: f(2) = 2 + 4 = 6."},{"prompt":"Slope of y = 4x + 1:","choices":["4","1","5"],"answer":"4","tier":1,"why":"In y = mx + b the slope is the number multiplying x, so here it is 4. The 1 is the y-intercept."},{"prompt":"f(x) = 2x + 1. f(3) = ?","answer":"7","tier":2,"why":"Put 3 in for x: 2 × 3 + 1 = 6 + 1 = 7."},{"prompt":"Slope of y = −3x + 4:","choices":["−3","4","3"],"answer":"−3","tier":2,"why":"The slope is the coefficient of x, including its sign, so it is −3. The 4 is the y-intercept."},{"prompt":"y-intercept of y = 5x − 2:","answer":"-2","tier":2,"why":"In y = mx + b the y-intercept is b. Here b = −2, so the line crosses the y-axis at (0, −2)."},{"prompt":"Which is NOT a function?","choices":["A circle x² + y² = 1","y = x²","y = 3x"],"answer":"A circle x² + y² = 1","tier":3,"why":"A function gives one output per input. On the circle, x = 0 gives both y = 1 and y = −1, so it is not a function."},{"prompt":"f(x) = −2x + 5. f(4) = ?","answer":"-3","tier":3,"why":"Put 4 in for x: −2 × 4 + 5 = −8 + 5 = −3."},{"prompt":"Which table is a function?","choices":["x: 1, 2, 3 → y: 5, 5, 5","x: 1, 1, 2 → y: 3, 4, 5","x: 2, 2, 2 → y: 1, 2, 3"],"answer":"x: 1, 2, 3 → y: 5, 5, 5","tier":3,"why":"Each input 1, 2, 3 has exactly one output (5), so it is a function; repeated outputs are fine. The others repeat an input with different outputs."}]},"sightPaceSeconds":12},{"id":"alg1-multistep","stage":"alg1","part":1,"title":"Multi-step equations","summary":"Simplify each side, collect x terms on one side, then isolate x.","prerequisites":["g7-linear"],"lesson":{"explanation":"Simplify each side, collect x terms on one side, then isolate x.","example":"5x − 3 = 2x + 9 → x = 4","approaches":{"show":"Solve 5x − 3 = 2x + 9 line by line. Subtract 2x from both sides (3x − 3 = 9), add 3 (3x = 12), divide by 3 (x = 4), then check both sides equal 17.","together":"Solve 2(x + 3) = x + 10 together. Ask: what do we do with the parentheses first (2x + 6)? Which x term do we move? What is left (x + 6 = 10), so x = 4.","alone":"Have them solve 7x + 2 = 3x + 18 alone. Hint if stuck: subtract 3x from both sides to get all the x terms on the left."}},"practice":{"generator":"linearEq","params":{"max":20}},"sightPaceSeconds":15},{"id":"alg1-inequalities","stage":"alg1","part":1,"title":"Inequalities","summary":"Solve like equations, but flip the sign when multiplying or dividing by a negative.","prerequisites":["alg1-multistep"],"lesson":{"explanation":"Solve like equations, but flip the sign when multiplying or dividing by a negative.","example":"−2x > 6 → x < −3","approaches":{"show":"Solve −2x > 6 on the board. Divide by −2 and flip the sign to get x < −3, then test x = −4: −2(−4) = 8, and 8 > 6 is true.","together":"Solve −3x + 1 ≤ 10 together. Ask: what do we undo first (subtract 1)? Now −3x ≤ 9; what happens to the sign when we divide by −3? So x ≥ −3.","alone":"Have them solve 4 − x > 7 alone. Hint if stuck: subtract 4, then remember dividing by −1 flips the sign."}},"practice":{"items":[{"prompt":"Solve x + 2 > 5:","choices":["x > 3","x < 3","x > 7"],"answer":"x > 3","tier":1,"why":"Subtract 2 from both sides: x > 5 − 2, so x > 3. Adding or subtracting never flips the sign."},{"prompt":"Solve 2x < 10:","choices":["x < 5","x > 5","x < 20"],"answer":"x < 5","tier":1,"why":"Divide both sides by positive 2: x < 5. The sign stays the same because 2 is positive."},{"prompt":"Solve x + 4 ≤ 1:","choices":["x ≤ −3","x ≥ −3","x ≤ 5"],"answer":"x ≤ −3","tier":2,"why":"Subtract 4 from both sides: x ≤ 1 − 4, so x ≤ −3."},{"prompt":"Solve 3x − 1 < 8:","choices":["x < 3","x > 3","x < 7/3"],"answer":"x < 3","tier":2,"why":"Add 1 to both sides to get 3x < 9, then divide by 3: x < 3."},{"prompt":"Solve −2x > 6:","choices":["x < −3","x > −3","x < 3"],"answer":"x < −3","tier":3,"why":"Divide both sides by −2, and flip the sign because you divided by a negative: x < 6 ÷ (−2), so x < −3."},{"prompt":"Solve −3x + 1 ≤ 10:","choices":["x ≥ −3","x ≤ −3","x ≥ 3"],"answer":"x ≥ −3","tier":3,"why":"Subtract 1: −3x ≤ 9. Divide by −3 and flip the sign: x ≥ −3. Forgetting to flip gives x ≤ −3."},{"prompt":"Solve 4 − x > 7:","choices":["x < −3","x > −3","x > 3"],"answer":"x < −3","tier":3,"why":"Subtract 4: −x > 3. Multiply by −1 and flip the sign: x < −3. Check: x = −4 gives 4 − (−4) = 8 > 7."}]},"sightPaceSeconds":15},{"id":"alg1-systems","stage":"alg1","part":1,"title":"Systems of equations","summary":"Find the point that satisfies both equations: substitute or eliminate.","prerequisites":["alg1-multistep","g8-slope"],"lesson":{"explanation":"Find the point that satisfies both equations: substitute or eliminate.","example":"x + y = 5, x − y = 1 → (3, 2)","approaches":{"show":"Show x + y = 5 and x − y = 1. Add the equations so y cancels: 2x = 6, x = 3. Put 3 back in to get y = 2, and check (3, 2) in both.","together":"Solve y = x + 1 and x + y = 7 together. Ask: what can we substitute for y (x + 1)? So x + x + 1 = 7; what is x (3)? Then what is y (4)?","alone":"Have them solve x + y = 10 and x − y = 4 alone for x. Hint if stuck: add the two equations so y disappears."}},"practice":{"items":[{"prompt":"x + y = 6 and x = 2. y = ?","answer":"4","tier":1,"why":"Substitute x = 2 into x + y = 6: 2 + y = 6, so y = 4."},{"prompt":"y = 3 and x + y = 8. x = ?","answer":"5","tier":1,"why":"Substitute y = 3 into x + y = 8: x + 3 = 8, so x = 5."},{"prompt":"x + y = 5 and x − y = 1. x = ?","answer":"3","tier":2,"why":"Add the equations so y cancels: 2x = 6, so x = 3 (and then y = 2)."},{"prompt":"y = 2x and x + y = 9. y = ?","answer":"6","tier":2,"why":"Substitute y = 2x: x + 2x = 9, so 3x = 9 and x = 3. Then y = 2 × 3 = 6."},{"prompt":"x + y = 10 and x − y = 4. x = ?","answer":"7","tier":2,"why":"Add the equations so y cancels: 2x = 14, so x = 7 (and y = 3)."},{"prompt":"2x + y = 7 and x − y = 2. x = ?","answer":"3","tier":3,"why":"Add the equations so y cancels: 3x = 9, so x = 3. Check: y = 7 − 6 = 1, and 3 − 1 = 2."},{"prompt":"Two parallel lines have how many solutions?","choices":["0","1","infinitely many"],"answer":"0","tier":3,"why":"Parallel lines never cross, so there is no point on both lines: 0 solutions. Infinitely many happens only when the lines are the same line."},{"prompt":"3x + 2y = 12 and x − y = −1. x = ?","answer":"2","tier":3,"why":"From x − y = −1, x = y − 1. Substitute: 3(y − 1) + 2y = 12, so 5y = 15, y = 3, and x = 2. Check: 6 + 6 = 12."}]},"sightPaceSeconds":30},{"id":"alg1-polynomials","stage":"alg1","part":2,"title":"Polynomials","summary":"Add, subtract and evaluate polynomials by combining like terms.","prerequisites":["g6-expressions","g7-integer-mult"],"lesson":{"explanation":"Add, subtract and evaluate polynomials by combining like terms.","example":"f(x) = x² − 3x + 2, f(4) = 6","approaches":{"show":"Evaluate f(x) = x² − 3x + 2 at x = 4 out loud: 16 − 12 + 2 = 6. Then add (2x² + 3x) + (x² − 5x) by grouping like terms to get 3x² − 2x.","together":"Find f(−2) for f(x) = x² + x − 1 together. Ask: what is (−2)² (4)? What is the x term (−2)? So 4 − 2 − 1 = 1.","alone":"Have them find f(3) for f(x) = 2x² − x + 5 alone. Hint if stuck: do the square first, 3² = 9, then multiply by 2."}},"practice":{"generator":"evalPoly"},"sightPaceSeconds":15},{"id":"alg1-factoring","stage":"alg1","part":2,"title":"Factoring","summary":"Write a polynomial as a product.","prerequisites":["alg1-polynomials"],"lesson":{"explanation":"Write a polynomial as a product. x² + bx + c = (x + p)(x + q) where pq = c, p + q = b.","example":"x² + 5x + 6 = (x + 2)(x + 3)","approaches":{"show":"Multiply (x + 2)(x + 3) to get x² + 5x + 6, then reverse it: list pairs that multiply to 6 (1 and 6, 2 and 3) and pick the pair that adds to 5.","together":"Factor x² + 7x + 12 together. Ask: which pairs multiply to 12 (1·12, 2·6, 3·4)? Which pair adds to 7 (3 and 4)? So (x + 3)(x + 4); multiply back to check.","alone":"Have them factor x² − 25 alone. Hint if stuck: it is a difference of squares, a² − b² = (a − b)(a + b)."}},"practice":{"items":[{"prompt":"Which multiplies out to x² + 3x + 2?","choices":["(x + 1)(x + 2)","(x + 3)(x + 2)","(x − 1)(x − 2)"],"answer":"(x + 1)(x + 2)","tier":1,"why":"(x + 1)(x + 2) = x² + 2x + x + 2 = x² + 3x + 2. The numbers 1 and 2 multiply to 2 and add to 3."},{"prompt":"Factor out the common factor: 2x + 6","choices":["2(x + 3)","2(x + 6)","x(2 + 6)"],"answer":"2(x + 3)","tier":1,"why":"Both terms share a factor of 2: 2x = 2 · x and 6 = 2 · 3, so 2x + 6 = 2(x + 3). Check: 2(x + 6) would give 2x + 12."},{"prompt":"Factor x² + 5x + 6:","choices":["(x + 2)(x + 3)","(x + 1)(x + 6)","(x − 2)(x − 3)"],"answer":"(x + 2)(x + 3)","tier":2,"why":"Find two numbers that multiply to 6 and add to 5: 2 and 3. So x² + 5x + 6 = (x + 2)(x + 3). The pair 1 and 6 adds to 7."},{"prompt":"Factor x² + 7x + 12:","choices":["(x + 3)(x + 4)","(x + 2)(x + 6)","(x + 1)(x + 12)"],"answer":"(x + 3)(x + 4)","tier":2,"why":"Find two numbers that multiply to 12 and add to 7: 3 and 4. The pair 2 and 6 adds to 8, and 1 and 12 adds to 13."},{"prompt":"Factor x² − 9:","choices":["(x − 3)(x + 3)","(x − 3)²","(x − 9)(x + 1)"],"answer":"(x − 3)(x + 3)","tier":3,"why":"This is a difference of squares, a² − b² = (a − b)(a + b), with a = x and b = 3. The middle terms −3x and +3x cancel."},{"prompt":"Factor x² − 4x + 4:","choices":["(x − 2)²","(x + 2)²","(x − 4)(x + 1)"],"answer":"(x − 2)²","tier":3,"why":"Two numbers that multiply to 4 and add to −4 are −2 and −2, so it is (x − 2)². The form (x + 2)² would give +4x."},{"prompt":"Factor x² − x − 6:","choices":["(x − 3)(x + 2)","(x + 3)(x − 2)","(x − 6)(x + 1)"],"answer":"(x − 3)(x + 2)","tier":3,"why":"Two numbers that multiply to −6 and add to −1 are −3 and 2, so (x − 3)(x + 2). The choice (x + 3)(x − 2) gives +x instead of −x."}]},"sightPaceSeconds":20},{"id":"alg1-quadratics","stage":"alg1","part":3,"title":"Solving quadratics by factoring","summary":"Set the equation to 0, factor, set each factor to 0.","prerequisites":["alg1-factoring"],"lesson":{"explanation":"Set the equation to 0, factor, set each factor to 0.","example":"x² − 5x + 6 = 0 → x = 2, 3","approaches":{"show":"Solve x² − 5x + 6 = 0: factor to (x − 2)(x − 3) = 0, then say if a product is 0, one factor is 0, so x = 2 or x = 3. Check by plugging 2 back in.","together":"Solve x² + x − 12 = 0 together. Ask: which pair multiplies to −12 and adds to 1 (4 and −3)? Write (x + 4)(x − 3) = 0. What makes each factor 0 (−4 and 3)?","alone":"Have them solve x² − 7x + 10 = 0 alone. Hint if stuck: find two numbers that multiply to 10 and add to −7."}},"practice":{"generator":"quadraticRoots"},"sightPaceSeconds":20},{"id":"alg1-quadformula","stage":"alg1","part":3,"title":"Quadratic formula","summary":"x = (−b ± √(b² − 4ac)) / 2a.","prerequisites":["alg1-quadratics","g8-sqrt"],"lesson":{"explanation":"x = (−b ± √(b² − 4ac)) / 2a. The discriminant b² − 4ac tells how many real roots.","example":"x² − 2x − 3 = 0 → x = 3, −1","approaches":{"show":"Solve x² − 2x − 3 = 0 with the formula: a = 1, b = −2, c = −3, so b² − 4ac = 4 + 12 = 16. Then x = (2 ± 4)/2 gives 3 and −1. Point out that 16 being positive means two roots.","together":"Find the discriminant of x² + 6x + 9 together. Ask: what are a, b and c (1, 6, 9)? What is b² (36) and 4ac (36)? So it is 0; how many real roots does that mean (one)?","alone":"Have them find the discriminant of 2x² + 5x − 3 alone. Hint if stuck: b² − 4ac = 25 − 4(2)(−3)."}},"practice":{"items":[{"prompt":"For x² + 3x − 4 = 0, what is b?","answer":"3","tier":1,"why":"In ax² + bx + c = 0, b is the number multiplying x. Here a = 1, b = 3 and c = −4."},{"prompt":"If b² − 4ac > 0, the real solutions number…","choices":["2","1","0"],"answer":"2","tier":1,"why":"A positive discriminant means ±√(b² − 4ac) gives two different real values, so there are 2 real solutions."},{"prompt":"Discriminant of x² + 4x + 4?","answer":"0","tier":2,"why":"Here a = 1, b = 4, c = 4: b² − 4ac = 16 − 16 = 0. This means one repeated root, since it is (x + 2)²."},{"prompt":"If b² − 4ac < 0, the real solutions number…","choices":["0","1","2"],"answer":"0","tier":2,"why":"A negative discriminant has no real square root, so the formula gives no real solutions: 0."},{"prompt":"Discriminant of x² − 4x + 1?","answer":"12","tier":2,"why":"Here a = 1, b = −4, c = 1: b² − 4ac = 16 − 4 = 12. Note (−4)² is +16."},{"prompt":"Larger root of x² − 2x − 3 = 0?","answer":"3","tier":3,"why":"x² − 2x − 3 = (x − 3)(x + 1), so the roots are 3 and −1. The larger is 3."},{"prompt":"Discriminant of 2x² + 3x − 2?","answer":"25","tier":3,"why":"Here a = 2, b = 3, c = −2: b² − 4ac = 9 − 4(2)(−2) = 9 + 16 = 25."},{"prompt":"Smaller root of x² − 2x − 8 = 0?","answer":"-2","tier":3,"why":"x² − 2x − 8 = (x − 4)(x + 2), so the roots are 4 and −2. The smaller is −2."}]},"sightPaceSeconds":25},{"id":"geo-angles","stage":"geo","part":1,"title":"Angle relationships","summary":"Triangle angles sum to 180°.","prerequisites":["g4-angles"],"lesson":{"explanation":"Triangle angles sum to 180°. Supplementary angles sum to 180°, complementary to 90°.","example":"Angles 50° and 60° → third is 70°","approaches":{"show":"Tear the three corners off a paper triangle and line them up to make a straight line, 180°. Then for angles 50° and 60°, say 180 − 50 − 60 = 70.","together":"Find the third angle of a triangle with angles 45° and 75° together. Ask: what do all three add to (180)? What do the two we know add to (120)? So the third is 60°.","alone":"Have them find the complement of 28° alone. Hint if stuck: complementary angles add to 90°."}},"practice":{"items":[{"prompt":"Supplement of 90°?","answer":"90","tier":1,"why":"Supplementary angles add to 180°, so the supplement of 90° is 180 − 90 = 90°."},{"prompt":"Complement of 60°?","answer":"30","tier":1,"why":"Complementary angles add to 90°, so the complement of 60° is 90 − 60 = 30°."},{"prompt":"Two angles of a triangle are 50° and 60°. The third?","answer":"70","tier":2,"why":"A triangle's angles add to 180°: 180 − 50 − 60 = 70°."},{"prompt":"Supplement of 110°?","answer":"70","tier":2,"why":"Supplementary angles add to 180°: 180 − 110 = 70°."},{"prompt":"Complement of 35°?","answer":"55","tier":2,"why":"Complementary angles add to 90°: 90 − 35 = 55°."},{"prompt":"Each angle of a regular hexagon (degrees)?","answer":"120","tier":3,"why":"A hexagon's angles add to (6 − 2) × 180 = 720°. Split equally over 6 angles: 720 ÷ 6 = 120°."},{"prompt":"Each angle of a regular pentagon (degrees)?","answer":"108","tier":3,"why":"A pentagon's angles add to (5 − 2) × 180 = 540°. Split equally over 5 angles: 540 ÷ 5 = 108°."},{"prompt":"A right triangle has one angle of 37°. The other acute angle?","answer":"53","tier":3,"why":"The right angle uses 90° of the 180°, so the two acute angles add to 90°: 90 − 37 = 53°."}]},"sightPaceSeconds":12},{"id":"geo-congruence","stage":"geo","part":1,"title":"Congruent triangles","summary":"SSS, SAS, ASA, AAS prove congruence; SSA does not.","prerequisites":["geo-angles"],"lesson":{"explanation":"SSS, SAS, ASA, AAS prove congruence; SSA does not.","example":"Two sides and the included angle equal → SAS","approaches":{"show":"Cut two paper triangles with two equal sides and the same angle between them, and lay one on the other to show they match: that is SAS. Then build an SSA pair with a swinging side to show two different triangles can fit.","together":"Look at two triangles marked with two equal angles and the side between them. Ask: what is marked (angle, side, angle)? Is the side between the angles? So which rule is it (ASA)?","alone":"Have them name the rule for two triangles with all three sides marked equal. Hint if stuck: say what is marked in order, side, side, side."}},"practice":{"items":[{"prompt":"All three pairs of sides are equal. Which rule?","choices":["SSS","SAS","AAS"],"answer":"SSS","tier":1,"why":"Three pairs of equal sides is Side-Side-Side, or SSS. SAS and AAS need angle information."},{"prompt":"Congruent triangles have the same…","choices":["size and shape","shape only","area only"],"answer":"size and shape","tier":1,"why":"Congruent means exactly the same size and same shape, so one triangle fits perfectly on the other. Same shape only is similar."},{"prompt":"Corresponding parts of congruent triangles are…","choices":["congruent","similar only","supplementary"],"answer":"congruent","tier":2,"why":"If two triangles are congruent, every matching side and angle is equal, so corresponding parts are congruent."},{"prompt":"Two sides and the included angle are equal. Which rule?","choices":["SAS","SSA","ASA"],"answer":"SAS","tier":2,"why":"Two sides with the angle between them (the included angle) is Side-Angle-Side, or SAS. SSA has the angle not between the sides."},{"prompt":"Which does NOT prove triangles congruent?","choices":["SSA","SAS","ASA"],"answer":"SSA","tier":3,"why":"SSA does not work: two sides and an angle not between them can form two different triangles. SAS and ASA always prove congruence."},{"prompt":"Two angles and the side between them are equal. Which rule?","choices":["ASA","AAS","SSA"],"answer":"ASA","tier":3,"why":"Two angles with the side between them is Angle-Side-Angle, or ASA. AAS has the side not between the angles."},{"prompt":"Two angles and a side not between them are equal. Which rule?","choices":["AAS","ASA","SAS"],"answer":"AAS","tier":3,"why":"Two angles and a side not between them is Angle-Angle-Side, or AAS. It works because the third angles must also match."}]},"sightPaceSeconds":15},{"id":"geo-similarity","stage":"geo","part":2,"title":"Similar figures","summary":"Similar figures have equal angles and proportional sides.","prerequisites":["geo-angles","g7-proportion"],"lesson":{"explanation":"Similar figures have equal angles and proportional sides. Areas scale by the square of the ratio.","example":"Scale 2 → area × 4","approaches":{"show":"Draw a triangle with sides 3, 4, 5 and a bigger one with sides 6, 8, 10. Say every side doubled, so the ratio is 2, then cover each with unit squares to show the area grows by 2 × 2 = 4.","together":"Two similar triangles have ratio 3. Together, ask: a side of 4 becomes what (12)? If the small area is 5, what is the big area (5 × 9 = 45)? Why 9 and not 3?","alone":"Have them find how the area changes with scale factor 4 alone. Hint if stuck: area scales by the ratio squared."}},"practice":{"items":[{"prompt":"Similar figures have equal…","choices":["angles","areas","perimeters"],"answer":"angles","tier":1,"why":"Similar figures are the same shape at different sizes, so every angle stays the same while the sides stretch by one ratio. Areas and perimeters change with the size, so they are not equal."},{"prompt":"Ratio 3. A side of 2 becomes?","answer":"6","tier":1,"why":"A ratio of 3 means every length is multiplied by 3: 2 × 3 = 6."},{"prompt":"Triangles are similar with ratio 2. A side of 5 becomes?","answer":"10","tier":2,"why":"With ratio 2, each side of the bigger triangle is twice the matching side: 5 × 2 = 10."},{"prompt":"Scale factor 3: area multiplies by?","answer":"9","tier":2,"why":"Area uses two lengths multiplied together, and each length grows by 3, so the area grows by 3 × 3 = 9."},{"prompt":"Small triangle side 4, big triangle side 12. Scale factor?","answer":"3","tier":2,"why":"The scale factor is the big side divided by the matching small side: 12 ÷ 4 = 3."},{"prompt":"Scale factor 2: volume multiplies by?","answer":"8","tier":3,"why":"Volume uses three lengths, and each one doubles, so the volume grows by 2 × 2 × 2 = 8."},{"prompt":"Scale factor 4: area multiplies by?","answer":"16","tier":3,"why":"Area grows by the square of the scale factor: 4 × 4 = 16."},{"prompt":"A figure with area 10 is scaled by 3. New area?","answer":"90","tier":3,"why":"Scaling lengths by 3 multiplies area by 3 × 3 = 9, so the new area is 10 × 9 = 90, not 30."}]},"sightPaceSeconds":15},{"id":"geo-trig","stage":"geo","part":2,"title":"Right-triangle trigonometry","summary":"SOH-CAH-TOA: sin = opp/hyp, cos = adj/hyp, tan = opp/adj.","prerequisites":["geo-similarity","g8-pythagorean"],"lesson":{"explanation":"SOH-CAH-TOA: sin = opp/hyp, cos = adj/hyp, tan = opp/adj.","example":"3-4-5 triangle: sin = 3/5","approaches":{"show":"Draw a 3-4-5 right triangle and mark the angle opposite 3. Label opp = 3, adj = 4, hyp = 5, and read SOH-CAH-TOA: sin = 3/5, cos = 4/5, tan = 3/4.","together":"Use a 5-12-13 triangle with the angle opposite 5. Together, ask: which side is the hypotenuse (13)? Which side is opposite (5)? So what is sin (5/13), and what is tan (5/12)?","alone":"Have them find cos of the angle opposite 3 in a 3-4-5 triangle alone. Hint if stuck: cos is adj/hyp, and the side next to the angle is 4."}},"practice":{"items":[{"prompt":"In a right triangle, the longest side is the…","choices":["hypotenuse","adjacent side","opposite side"],"answer":"hypotenuse","tier":1,"why":"The hypotenuse sits across from the right angle, the biggest angle in the triangle, so it is the longest side."},{"prompt":"sin θ =","choices":["opposite/hypotenuse","adjacent/hypotenuse","opposite/adjacent"],"answer":"opposite/hypotenuse","tier":1,"why":"By SOH-CAH-TOA, the S-O-H part says sine = opposite ÷ hypotenuse. Adjacent over hypotenuse is cosine, and opposite over adjacent is tangent."},{"prompt":"In a 3-4-5 right triangle, sin of the angle opposite 3:","choices":["3/5","4/5","3/4"],"answer":"3/5","tier":2,"why":"For the angle across from side 3, the opposite side is 3 and the hypotenuse is 5, so sin = 3/5. The choice 3/4 is tangent, not sine."},{"prompt":"tan θ =","choices":["opposite/adjacent","adjacent/hypotenuse","opposite/hypotenuse"],"answer":"opposite/adjacent","tier":2,"why":"By SOH-CAH-TOA, the T-O-A part says tangent = opposite ÷ adjacent."},{"prompt":"In a 3-4-5 right triangle, cos of the angle opposite 3:","choices":["4/5","3/5","3/4"],"answer":"4/5","tier":2,"why":"For the angle across from 3, the side next to it is 4 and the hypotenuse is 5, so cos = adjacent ÷ hypotenuse = 4/5."},{"prompt":"sin 30° =","choices":["1/2","√3/2","1"],"answer":"1/2","tier":3,"why":"In a 30-60-90 triangle the side opposite 30° is half the hypotenuse, so sin 30° = 1/2. The value √3/2 is sin 60°."},{"prompt":"cos 60° =","choices":["1/2","√3/2","0"],"answer":"1/2","tier":3,"why":"In a 30-60-90 triangle, the side next to the 60° angle is the short side, half the hypotenuse, so cos 60° = 1/2."},{"prompt":"tan 45° =","choices":["1","1/2","√2/2"],"answer":"1","tier":3,"why":"A 45-45-90 triangle has two equal legs, so opposite ÷ adjacent = 1. That makes tan 45° = 1."}]},"sightPaceSeconds":12},{"id":"geo-circles","stage":"geo","part":3,"title":"Circle theorems","summary":"An inscribed angle is half its intercepted arc; an angle inscribed in a semicircle is 90°.","prerequisites":["g7-circles","geo-angles"],"lesson":{"explanation":"An inscribed angle is half its intercepted arc; an angle inscribed in a semicircle is 90°.","example":"Arc 100° → inscribed angle 50°","approaches":{"show":"Draw a circle, mark a 100° arc, and draw an angle from a point on the far side to the arc's ends. Say the inscribed angle is half the arc, 50°, then draw one on a diameter to show 90°.","together":"An arc measures 140°. Together, ask: is the vertex on the circle (yes, so it is inscribed)? What is the rule (half the arc)? So the angle is 70°.","alone":"Have them find the arc for an inscribed angle of 35° alone. Hint if stuck: the arc is double the inscribed angle."}},"practice":{"items":[{"prompt":"An arc measures 60°. The inscribed angle on it?","answer":"30","tier":1,"why":"An inscribed angle is half the arc it cuts off: 60 ÷ 2 = 30 degrees."},{"prompt":"A diameter cuts a circle into two arcs of how many degrees each?","answer":"180","tier":1,"why":"A diameter splits the circle exactly in half, and a full circle is 360°, so each arc is 360 ÷ 2 = 180 degrees."},{"prompt":"An arc measures 100°. The inscribed angle on it?","answer":"50","tier":2,"why":"An inscribed angle is half its intercepted arc: 100 ÷ 2 = 50 degrees."},{"prompt":"An angle inscribed in a semicircle (degrees)?","answer":"90","tier":2,"why":"A semicircle is an arc of 180°, and the inscribed angle is half of that: 180 ÷ 2 = 90 degrees."},{"prompt":"An inscribed angle is 40°. Its intercepted arc?","answer":"80","tier":2,"why":"The arc is twice the inscribed angle: 40 × 2 = 80 degrees."},{"prompt":"A tangent line meets the radius at…","choices":["90°","45°","180°"],"answer":"90°","tier":3,"why":"A tangent touches the circle at one point, and the radius drawn to that point is always perpendicular to it, making a 90° angle."},{"prompt":"An arc measures 250°. The inscribed angle on it?","answer":"125","tier":3,"why":"The inscribed angle is still half its arc, even for an arc over 180°: 250 ÷ 2 = 125 degrees."}]},"sightPaceSeconds":15},{"id":"geo-proof","stage":"geo","part":3,"title":"Proof and logic","summary":"A proof chains statements, each justified by a definition, postulate or earlier theorem.","prerequisites":["geo-congruence"],"lesson":{"explanation":"A proof chains statements, each justified by a definition, postulate or earlier theorem.","example":"If p then q; p; therefore q","approaches":{"show":"Write a two-column proof: Given that a triangle has two equal sides, and the reason for each line beside it. Then write 'if it rains, the ground is wet' and show its converse and its contrapositive, marking which one always matches the original.","together":"Take 'if a shape is a square, then it has four sides' together. Ask: what is the converse (if it has four sides, it is a square)? Is that always true (no)? What is the contrapositive, and is it true?","alone":"Have them write the contrapositive of 'if x = 2, then x² = 4' alone. Hint if stuck: swap the parts and put 'not' in front of both."}},"practice":{"items":[{"prompt":"In 'if p then q', p is called the…","choices":["hypothesis","conclusion","converse"],"answer":"hypothesis","tier":1,"why":"In 'if p then q', the part after 'if' is the hypothesis (what is assumed) and the part after 'then' is the conclusion."},{"prompt":"If p then q; p is true. So…","choices":["q is true","p is false","q is false"],"answer":"q is true","tier":1,"why":"If 'p implies q' is true and p is true, then q must be true. This reasoning is called modus ponens."},{"prompt":"The converse of 'if p then q' is…","choices":["if q then p","if not p then not q","if not q then not p"],"answer":"if q then p","tier":2,"why":"The converse swaps the two parts: 'if q then p'. 'If not q then not p' is the contrapositive, a different statement."},{"prompt":"Each step in a proof must have a…","choices":["reason","diagram","guess"],"answer":"reason","tier":2,"why":"Every statement in a proof must be backed by a reason: a definition, a postulate, a given fact, or an earlier theorem."},{"prompt":"Which is logically equivalent to 'if p then q'?","choices":["if not q then not p","if q then p","p and q"],"answer":"if not q then not p","tier":3,"why":"The contrapositive 'if not q then not p' always has the same truth value as the original. The converse 'if q then p' can be false, for example: every square has four sides, but not every four-sided shape is a square."},{"prompt":"The contrapositive of 'if a shape is a square then it has four sides' is…","choices":["if it does not have four sides then it is not a square","if it has four sides then it is a square","if it is not a square then it does not have four sides"],"answer":"if it does not have four sides then it is not a square","tier":3,"why":"The contrapositive swaps the two parts and negates both: 'if it does not have four sides, then it is not a square.' The choice 'if it has four sides then it is a square' is the converse, which is false."}]},"sightPaceSeconds":20},{"id":"alg2-complex","stage":"alg2","part":1,"title":"Complex numbers","summary":"i² = −1.","prerequisites":["alg1-quadformula","g8-pythagorean"],"lesson":{"explanation":"i² = −1. a + bi has modulus √(a² + b²).","example":"|3 + 4i| = 5","approaches":{"show":"Plot 3 + 4i as the point (3, 4) on a grid, draw the line from the origin, and use the Pythagorean theorem: √(9 + 16) = 5. Also show i² = −1 by writing i·i.","together":"Find |6 + 8i| together. Ask: which is the real part (6) and the imaginary part (8)? What are their squares (36, 64)? What is √100 (10)?","alone":"Have them find |5 − 12i| alone. Hint if stuck: square 5 and 12, add, then take the square root; the minus sign does not matter."}},"practice":{"generator":"complexModulus"},"sightPaceSeconds":10},{"id":"alg2-exponential","stage":"alg2","part":1,"title":"Exponential functions","summary":"f(x) = a·bˣ grows (b > 1) or decays (0 < b < 1) by a constant factor.","prerequisites":["g8-exponent-rules","g8-functions"],"lesson":{"explanation":"f(x) = a·bˣ grows (b > 1) or decays (0 < b < 1) by a constant factor.","example":"Doubling: 100 · 2ᵗ","approaches":{"show":"Make a table for 100 · 2ᵗ: 100, 200, 400, 800 for t = 0 to 3. Say each year multiplies by 2, then do a decay table for 80 grams halving: 80, 40, 20.","together":"A population of 50 triples each year. Together, ask: what is the starting amount (50)? What factor each year (3)? After 2 years, 50 × 3 × 3 is what (450)?","alone":"Have them find what 64 g becomes after 3 half-lives alone. Hint if stuck: halve it three times."}},"practice":{"items":[{"prompt":"f(x) = 3(2)ˣ shows…","choices":["growth","decay","neither"],"answer":"growth","tier":1,"why":"The base is 2, which is bigger than 1, so each step in x multiplies the value by 2. That is growth."},{"prompt":"In f(x) = 100(1.5)ˣ, the starting value is?","answer":"100","tier":1,"why":"When x = 0, (1.5)⁰ = 1, so f(0) = 100 × 1 = 100. The number in front is the starting value."},{"prompt":"A population of 100 doubles each year. After 3 years?","answer":"800","tier":2,"why":"Doubling each year: 100 → 200 → 400 → 800. That is 100 × 2³ = 800."},{"prompt":"f(x) = 5(0.8)ˣ shows…","choices":["decay","growth","neither"],"answer":"decay","tier":2,"why":"The base 0.8 is between 0 and 1, so each step keeps only 80% of the value. That is decay."},{"prompt":"A population of 50 triples each year. After 2 years?","answer":"450","tier":2,"why":"Tripling each year: 50 → 150 → 450. That is 50 × 3² = 450."},{"prompt":"Half-life 2 years, 80 g. After 4 years?","answer":"20","tier":3,"why":"Four years is two half-lives of 2 years each: 80 → 40 → 20 grams."},{"prompt":"Half-life 3 years, 64 g. After 9 years?","answer":"8","tier":3,"why":"Nine years is three half-lives of 3 years: 64 → 32 → 16 → 8 grams."}]},"sightPaceSeconds":15},{"id":"alg2-logs","stage":"alg2","part":2,"title":"Logarithms","summary":"log_b(x) = y means bʸ = x.","prerequisites":["alg2-exponential"],"lesson":{"explanation":"log_b(x) = y means bʸ = x. Logs undo exponentials.","example":"log₂ 8 = 3","approaches":{"show":"Write log₂ 8 = ? and say: 2 to what power is 8? Count 2, 4, 8, which is three multiplications, so log₂ 8 = 3. Write it both ways: 2³ = 8.","together":"Find log₃ 81 together. Ask: what is the base (3)? Count powers of 3 together: 3, 9, 27, 81. How many steps was that (4)?","alone":"Have them find log₅ 125 alone. Hint if stuck: rewrite it as 5 to what power equals 125."}},"practice":{"generator":"logBase"},"sightPaceSeconds":8},{"id":"alg2-log-rules","stage":"alg2","part":2,"title":"Logarithm rules","summary":"log(ab) = log a + log b, log(a/b) = log a − log b, log(aⁿ) = n log a.","prerequisites":["alg2-logs"],"lesson":{"explanation":"log(ab) = log a + log b, log(a/b) = log a − log b, log(aⁿ) = n log a.","example":"log 100 = 2 log 10 = 2","approaches":{"show":"Show log 100 two ways: 100 = 10², so log 100 = 2 log 10 = 2. Then show log 2 + log 50 = log(2 × 50) = log 100 = 2.","together":"Simplify log 4 + log 25 together. Ask: which rule turns a sum of logs into one log (product rule)? What is 4 × 25 (100)? What is log 100 (2)?","alone":"Have them simplify log 500 − log 5 alone. Hint if stuck: subtracting logs means dividing inside, 500 ÷ 5."}},"practice":{"items":[{"prompt":"log₁₀ 100 = ?","answer":"2","tier":1,"why":"The log base 10 asks what power of 10 gives 100. Since 10² = 100, the answer is 2."},{"prompt":"log₁₀ 10 = ?","answer":"1","tier":1,"why":"10¹ = 10, so the power needed is 1."},{"prompt":"log a + log b =","choices":["log(ab)","log(a + b)","(log a)(log b)"],"answer":"log(ab)","tier":2,"why":"Adding logs multiplies the inputs, because powers add when you multiply: log a + log b = log(ab). There is no rule that turns a sum into log(a + b)."},{"prompt":"log(x³) =","choices":["3 log x","log 3x","(log x)³"],"answer":"3 log x","tier":2,"why":"A power inside a log comes out front as a multiplier: log(x³) = log(x·x·x) = log x + log x + log x = 3 log x."},{"prompt":"log a − log b =","choices":["log(a/b)","log(a − b)","log a / log b"],"answer":"log(a/b)","tier":2,"why":"Subtracting logs divides the inputs, because powers subtract when you divide: log a − log b = log(a/b)."},{"prompt":"log₁₀ 1000 = ?","answer":"3","tier":3,"why":"10³ = 1000, so log base 10 of 1000 is 3."},{"prompt":"log 4 + log 25 = ?","answer":"2","tier":3,"why":"Combine using the product rule: log 4 + log 25 = log(4 × 25) = log 100 = 2."},{"prompt":"log 500 − log 5 = ?","answer":"2","tier":3,"why":"Combine using the quotient rule: log 500 − log 5 = log(500 ÷ 5) = log 100 = 2."}]},"sightPaceSeconds":15},{"id":"alg2-rational","stage":"alg2","part":3,"title":"Rational functions","summary":"Quotients of polynomials.","prerequisites":["alg1-factoring"],"lesson":{"explanation":"Quotients of polynomials. Vertical asymptotes where the denominator is 0 (after canceling).","example":"1/(x − 2) has asymptote x = 2","approaches":{"show":"Graph 1/(x − 2) by making a table near x = 2: at 2.1 it is 10, at 1.9 it is −10. Draw the dashed line x = 2 and say the denominator is 0 there.","together":"Find the vertical asymptote of (x + 1)/(x² − 9) together. Ask: what makes the denominator 0 (3 and −3)? Does anything cancel with the top (no)? So the asymptotes are x = 3 and x = −3.","alone":"Have them simplify (x² − 4)/(x − 2) alone. Hint if stuck: factor the top as (x − 2)(x + 2)."}},"practice":{"items":[{"prompt":"For which x is 1/(x − 5) undefined?","answer":"5","tier":1,"why":"A fraction is undefined when its denominator is 0. x − 5 = 0 when x = 5."},{"prompt":"Vertical asymptote of 1/x:","choices":["x = 0","y = 0","x = 1"],"answer":"x = 0","tier":1,"why":"The denominator x is 0 at x = 0, and 1/x grows without bound near there, so the vertical line x = 0 is the asymptote. The line y = 0 is the horizontal asymptote."},{"prompt":"Vertical asymptote of 1/(x − 2):","choices":["x = 2","x = −2","y = 2"],"answer":"x = 2","tier":2,"why":"The denominator x − 2 equals 0 when x = 2, so the vertical asymptote is x = 2."},{"prompt":"Vertical asymptote of 3/(x + 4):","choices":["x = −4","x = 4","y = 3"],"answer":"x = −4","tier":2,"why":"Solve x + 4 = 0 to get x = −4. The sign flips: x + 4 is zero at negative 4, not positive 4."},{"prompt":"Horizontal asymptote of (2x + 1)/(x − 3):","choices":["y = 2","y = 0","none"],"answer":"y = 2","tier":3,"why":"Top and bottom are both degree 1, so for large x the function behaves like 2x/x = 2. The horizontal asymptote is y = 2."},{"prompt":"(x² − 1)/(x − 1) simplifies to","choices":["x + 1","x − 1","x"],"answer":"x + 1","tier":3,"why":"Factor the top as a difference of squares: x² − 1 = (x − 1)(x + 1). Cancel (x − 1) to get x + 1 (for x ≠ 1)."},{"prompt":"Horizontal asymptote of 5/(x + 1):","choices":["y = 0","y = 5","x = −1"],"answer":"y = 0","tier":3,"why":"The top is a constant and the bottom grows with x, so the fraction shrinks toward 0 as x gets large. The horizontal asymptote is y = 0; x = −1 is the vertical one."}]},"sightPaceSeconds":20},{"id":"alg2-sequences","stage":"alg2","part":3,"title":"Sequences and series","summary":"Arithmetic: add d each time.","prerequisites":["g8-functions"],"lesson":{"explanation":"Arithmetic: add d each time. Geometric: multiply by r each time.","example":"2, 6, 18, 54 (r = 3)","approaches":{"show":"Write 3, 7, 11, 15 and mark +4 between each pair, then write 2, 6, 18, 54 and mark ×3. Show the arithmetic term rule: 10th term of 5, 8, 11 is 5 + 9 × 3 = 32.","together":"Find the 20th term of 4, 7, 10, … together. Ask: what is added each time (3)? How many jumps from the 1st term to the 20th (19)? So 4 + 19 × 3 is what (61)?","alone":"Have them find the next term of 1, 4, 16, 64 alone. Hint if stuck: check whether you add or multiply to get from one term to the next."}},"practice":{"items":[{"prompt":"Next term: 5, 10, 15, 20, ?","answer":"25","tier":1,"why":"Each term adds 5, so the next term is 20 + 5 = 25."},{"prompt":"Next term: 1, 2, 4, 8, ?","answer":"16","tier":1,"why":"Each term is doubled, so the next term is 8 × 2 = 16."},{"prompt":"Next term: 3, 7, 11, 15, ?","answer":"19","tier":2,"why":"Each term adds 4 (3, 7, 11, 15), so the next is 15 + 4 = 19."},{"prompt":"Next term: 2, 6, 18, ?","answer":"54","tier":2,"why":"Each term is multiplied by 3, so the next is 18 × 3 = 54."},{"prompt":"Common ratio of 3, 12, 48, …?","answer":"4","tier":2,"why":"Divide a term by the one before it: 12 ÷ 3 = 4 and 48 ÷ 12 = 4. The common ratio is 4."},{"prompt":"Sum 1 + 2 + … + 100?","answer":"5050","tier":3,"why":"Pair the first and last numbers: 1 + 100, 2 + 99, and so on, each making 101. There are 50 pairs, so 50 × 101 = 5050."},{"prompt":"10th term of 5, 8, 11, …?","answer":"32","tier":3,"why":"The common difference is 3. The 10th term is the first term plus 9 steps: 5 + 9 × 3 = 32."},{"prompt":"Sum 2 + 4 + 8 + 16 + 32?","answer":"62","tier":3,"why":"Add them: 2 + 4 = 6, + 8 = 14, + 16 = 30, + 32 = 62. Or use the geometric sum 2(2⁵ − 1) = 62."}]},"sightPaceSeconds":20},{"id":"pc-unit-circle","stage":"precalc","part":1,"title":"The unit circle","summary":"On the unit circle, a point at angle θ is (cos θ, sin θ).","prerequisites":["geo-trig"],"lesson":{"explanation":"On the unit circle, a point at angle θ is (cos θ, sin θ). Radians: 180° = π.","example":"sin(π/2) = 1","approaches":{"show":"Draw a large unit circle and mark 0, π/2, π and 3π/2 with their points (1, 0), (0, 1), (−1, 0), (0, −1). Say the point is (cos θ, sin θ), so sin(π/2) is the y value, 1.","together":"Find cos(π/3) together. Ask: how many degrees is π/3 (60°)? Where is that point on the circle (1/2, √3/2)? Which coordinate is cosine (x, so 1/2)?","alone":"Have them find sin(3π/2) alone. Hint if stuck: 3π/2 is 270°, straight down, at the point (0, −1)."}},"practice":{"items":[{"prompt":"90° in radians:","choices":["π/2","π","2π"],"answer":"π/2","tier":1,"why":"180° equals π radians, so 90°, half of that, is π/2."},{"prompt":"cos(0) =","choices":["1","0","−1"],"answer":"1","tier":1,"why":"At angle 0 the point on the unit circle is (1, 0), and cos is the x-coordinate, so cos(0) = 1."},{"prompt":"sin(π/2) =","choices":["1","0","−1"],"answer":"1","tier":2,"why":"π/2 is 90°, straight up, at the point (0, 1). Sin is the y-coordinate, so sin(π/2) = 1."},{"prompt":"cos(π) =","choices":["−1","0","1"],"answer":"−1","tier":2,"why":"π is 180°, pointing left, at the point (−1, 0). Cos is the x-coordinate, so cos(π) = −1."},{"prompt":"180° in radians:","choices":["π","2π","π/2"],"answer":"π","tier":2,"why":"Half a full turn is 180°, and a full turn is 2π radians, so 180° = π."},{"prompt":"sin(π/6) =","choices":["1/2","√3/2","√2/2"],"answer":"1/2","tier":3,"why":"π/6 is 30°. The point there is (√3/2, 1/2), and sin is the y-coordinate, so sin(π/6) = 1/2."},{"prompt":"cos(π/3) =","choices":["1/2","√3/2","√2/2"],"answer":"1/2","tier":3,"why":"π/3 is 60°. The point there is (1/2, √3/2), and cos is the x-coordinate, so cos(π/3) = 1/2."},{"prompt":"sin(3π/2) =","choices":["−1","0","1"],"answer":"−1","tier":3,"why":"3π/2 is 270°, straight down, at the point (0, −1). Sin is the y-coordinate, so sin(3π/2) = −1."}]},"sightPaceSeconds":10},{"id":"pc-identities","stage":"precalc","part":1,"title":"Trig identities","summary":"sin²θ + cos²θ = 1; sin 2θ = 2 sin θ cos θ.","prerequisites":["pc-unit-circle"],"lesson":{"explanation":"sin²θ + cos²θ = 1; sin 2θ = 2 sin θ cos θ.","example":"If sin θ = 3/5 then cos θ = ±4/5","approaches":{"show":"Draw a right triangle inside the unit circle with legs cos θ and sin θ and hypotenuse 1, then apply the Pythagorean theorem to get sin²θ + cos²θ = 1. Use it on sin θ = 3/5: cos²θ = 1 − 9/25 = 16/25, so cos θ = ±4/5.","together":"If cos θ = 5/13, find sin²θ together. Ask: which identity links them (sin²θ + cos²θ = 1)? What is cos²θ (25/169)? So sin²θ = 144/169.","alone":"Have them check sin 2θ for θ = 30° alone. Hint if stuck: use 2 sin θ cos θ with sin 30° = 1/2 and cos 30° = √3/2."}},"practice":{"items":[{"prompt":"sin²θ + cos²θ = 1. If sin²θ = 0.36, cos²θ = ?","answer":"0.64","tier":1,"why":"Since sin²θ + cos²θ = 1, cos²θ = 1 − 0.36 = 0.64."},{"prompt":"1 − sin²θ =","choices":["cos²θ","tan²θ","sin θ"],"answer":"cos²θ","tier":1,"why":"Rearranging sin²θ + cos²θ = 1 gives cos²θ = 1 − sin²θ."},{"prompt":"sin²θ + cos²θ =","choices":["1","0","2"],"answer":"1","tier":2,"why":"A point on the unit circle is (cos θ, sin θ), and its distance from the center is 1, so by the Pythagorean theorem sin²θ + cos²θ = 1."},{"prompt":"tan θ =","choices":["sin θ / cos θ","cos θ / sin θ","1 / sin θ"],"answer":"sin θ / cos θ","tier":2,"why":"tan θ is opposite ÷ adjacent. Dividing both by the hypotenuse gives sin θ ÷ cos θ. The choice cos θ / sin θ is the cotangent."},{"prompt":"sin 2θ =","choices":["2 sin θ cos θ","2 sin θ","sin²θ − cos²θ"],"answer":"2 sin θ cos θ","tier":3,"why":"The double-angle formula is sin 2θ = 2 sin θ cos θ. It is not 2 sin θ, because doubling the angle does not double the sine."},{"prompt":"If sin θ = 3/5 and cos θ = 4/5, sin 2θ = ?","answer":"24/25","tier":3,"why":"Use sin 2θ = 2 sin θ cos θ: 2 × (3/5) × (4/5) = 24/25."}]},"sightPaceSeconds":12},{"id":"pc-vectors","stage":"precalc","part":2,"title":"Vectors and dot product","summary":"u · v = u₁v₁ + u₂v₂ + u₃v₃; it is 0 exactly when the vectors are perpendicular.","prerequisites":["g8-pythagorean","g7-integer-mult"],"lesson":{"explanation":"u · v = u₁v₁ + u₂v₂ + u₃v₃; it is 0 exactly when the vectors are perpendicular.","example":"(1,2,3)·(4,5,6) = 32","approaches":{"show":"Write (1, 2, 3)·(4, 5, 6) and multiply matching parts: 4 + 10 + 18 = 32. Then show (1, 0)·(0, 1) = 0 and draw the two arrows at a right angle.","together":"Find (2, −1, 3)·(1, 4, 2) together. Ask: what is the first pair's product (2)? The second (−4)? The third (6)? What is the total (4)?","alone":"Have them check whether (3, −2) and (4, 6) are perpendicular alone. Hint if stuck: compute 3·4 + (−2)·6 and see if it is 0."}},"practice":{"generator":"dot"},"sightPaceSeconds":15},{"id":"pc-polar","stage":"precalc","part":2,"title":"Polar coordinates","summary":"A point is (r, θ): distance r from the origin at angle θ.","prerequisites":["pc-unit-circle"],"lesson":{"explanation":"A point is (r, θ): distance r from the origin at angle θ. x = r cos θ, y = r sin θ.","example":"(2, π/2) is (0, 2)","approaches":{"show":"Plot (2, π/2): face along the positive x-axis, turn a quarter turn to straight up, and walk out 2 to land at (0, 2). Then check with x = 2 cos(π/2) = 0 and y = 2 sin(π/2) = 2.","together":"Find r for the point (6, 8) together. Ask: what is r (the distance from the origin)? Which theorem gives distance (Pythagorean)? What is √(36 + 64) (10)?","alone":"Have them convert polar (3, π) to Cartesian alone. Hint if stuck: π means facing straight left, so walk 3 to the left."}},"practice":{"items":[{"prompt":"Polar (5, 0) in Cartesian:","choices":["(5, 0)","(0, 5)","(5, 5)"],"answer":"(5, 0)","tier":1,"why":"x = r cos θ = 5 cos 0 = 5 and y = r sin θ = 5 sin 0 = 0, so the point is (5, 0)."},{"prompt":"The r of the point (0, 7)?","answer":"7","tier":1,"why":"r is the distance from the origin. The point (0, 7) is 7 units straight up, so r = 7."},{"prompt":"The r of the point (3, 4)?","answer":"5","tier":2,"why":"r = √(x² + y²) = √(9 + 16) = √25 = 5."},{"prompt":"The r of the point (6, 8)?","answer":"10","tier":2,"why":"r = √(6² + 8²) = √(36 + 64) = √100 = 10."},{"prompt":"Polar (2, π/2) in Cartesian:","choices":["(0, 2)","(2, 0)","(2, 2)"],"answer":"(0, 2)","tier":3,"why":"x = 2 cos(π/2) = 0 and y = 2 sin(π/2) = 2, so the point is (0, 2).
