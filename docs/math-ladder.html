"},{"prompt":"Polar (3, π) in Cartesian:","choices":["(−3, 0)","(3, 0)","(0, −3)"],"answer":"(−3, 0)","tier":3,"why":"x = 3 cos π = −3 and y = 3 sin π = 0, so the point is (−3, 0): 3 units to the left."}]},"sightPaceSeconds":15},{"id":"pc-limits","stage":"precalc","part":3,"title":"Intro to limits","summary":"lim x→a f(x) is the value f(x) approaches as x approaches a.","prerequisites":["alg2-rational"],"lesson":{"explanation":"lim x→a f(x) is the value f(x) approaches as x approaches a.","example":"lim x→3 (x² − 9)/(x − 3) = 6","approaches":{"show":"Show lim x→3 of (x² − 9)/(x − 3): plugging in 3 gives 0/0, so factor to (x − 3)(x + 3)/(x − 3), cancel, and plug 3 into x + 3 to get 6. Back it up with a table at 2.9 and 3.1.","together":"Find lim x→2 of (x² − 4)/(x − 2) together. Ask: what happens if we plug in 2 (0/0)? How does the top factor ((x − 2)(x + 2))? After canceling, what is 2 + 2 (4)?","alone":"Have them find lim x→1 of (x² − 1)/(x − 1) alone. Hint if stuck: factor the top as a difference of squares."}},"practice":{"generator":"limit"},"sightPaceSeconds":15},{"id":"pc-binomial","stage":"precalc","part":3,"title":"Binomial coefficients","summary":"C(n, k) counts ways to choose k of n; they are the coefficients of (a + b)ⁿ.","prerequisites":["alg2-sequences"],"lesson":{"explanation":"C(n, k) counts ways to choose k of n; they are the coefficients of (a + b)ⁿ.","example":"C(5, 2) = 10","approaches":{"show":"List the ways to choose 2 letters from A, B, C, D, E and count 10, then compute C(5, 2) = (5 × 4)/(2 × 1) = 10. Show the row 1, 5, 10, 10, 5, 1 of Pascal's triangle as the coefficients of (a + b)⁵.","together":"Find C(6, 2) together. Ask: what is 6 × 5 (30)? Why divide by 2 × 1 (order does not matter)? So the answer is 15.","alone":"Have them find C(7, 3) alone. Hint if stuck: compute (7 × 6 × 5)/(3 × 2 × 1)."}},"practice":{"generator":"binomial","params":{"max":10}},"sightPaceSeconds":10},{"id":"st-spread","stage":"stats","part":1,"title":"Measures of spread","summary":"Range, interquartile range and standard deviation measure how spread out data are.","prerequisites":["g6-mean","g6-median"],"lesson":{"explanation":"Range, interquartile range and standard deviation measure how spread out data are.","example":"SD of 2, 2, 2 is 0","approaches":{"show":"Write 3, 9, 4, 12 and circle the largest and smallest to show the range is 12 − 3 = 9. Then write 5, 5, 5, 5 and point out that no value differs from the mean, so the standard deviation is 0.","together":"Find the range of 15, 2, 8, 20, 11 together. Ask: Which value is largest? Which is smallest? What is 20 − 2? Then ask whether one huge value like 200 would change the median or the range more.","alone":"Have them find the population standard deviation of 4 and 8 alone (answer 2). Hint if stuck: the mean is 6, so each value is 2 away from it."}},"practice":{"items":[{"prompt":"The standard deviation of 5, 5, 5, 5 is","choices":["0","5","1"],"answer":"0","tier":1,"why":"Every value equals the mean of 5, so no value is any distance from the mean. The standard deviation is 0."},{"prompt":"Range of 3, 9, 4, 12?","answer":"9","tier":1,"why":"Range = largest − smallest = 12 − 3 = 9."},{"prompt":"Which is resistant to outliers?","choices":["median","mean","range"],"answer":"median","tier":2,"why":"The median only depends on the middle value, so one extreme value barely moves it. The mean and range both shift a lot with an outlier."},{"prompt":"Range of 15, 2, 8, 20, 11?","answer":"18","tier":2,"why":"Range = largest − smallest = 20 − 2 = 18."},{"prompt":"First quartile 10, third quartile 25. Interquartile range?","answer":"15","tier":2,"why":"Interquartile range = third quartile − first quartile = 25 − 10 = 15."},{"prompt":"Population standard deviation of 2, 4, 4, 4, 5, 5, 7, 9?","answer":"2","tier":3,"why":"The mean is 40 ÷ 8 = 5. Squared distances from 5 are 9, 1, 1, 1, 0, 0, 4, 16, which add to 32. Divide by 8 to get 4, and √4 = 2."},{"prompt":"Population standard deviation of 4, 8?","answer":"2","tier":3,"why":"The mean is 6, and each value is 2 away from it. The squared distances are 4 and 4, their average is 4, and √4 = 2."},{"prompt":"Adding 10 to every value makes the standard deviation…","choices":["unchanged","10 larger","10 times larger"],"answer":"unchanged","tier":3,"why":"Adding 10 moves every value and the mean up by the same amount, so the distances from the mean do not change. The standard deviation stays the same."}]},"sightPaceSeconds":12},{"id":"st-prob-rules","stage":"stats","part":1,"title":"Probability rules","summary":"P(A or B) = P(A) + P(B) − P(A and B).","prerequisites":["g7-probability"],"lesson":{"explanation":"P(A or B) = P(A) + P(B) − P(A and B). Independent: P(A and B) = P(A)P(B).","example":"Two coin flips both heads: 1/4","approaches":{"show":"Flip two coins and list the four outcomes on paper: heads-heads, heads-tails, tails-heads, tails-tails. Circle heads-heads and say: one out of four, so P(both heads) = 1/2 × 1/2 = 1/4.","together":"Do this together: P(A) = 0.5, P(B) = 0.4, P(A and B) = 0.2. Ask: What do we add first? Why subtract P(A and B)? Then compute 0.5 + 0.4 − 0.2 = 0.7 together.","alone":"Have them find P(A and B) when P(A) = 0.6, P(B) = 0.5 and the events are independent (answer 0.3). Hint if stuck: for independent events, multiply."}},"practice":{"items":[{"prompt":"Two fair coins. P(both heads)? (fraction)","answer":"1/4","tier":1,"why":"The coins are independent, so multiply: 1/2 × 1/2 = 1/4. Of the four outcomes (heads-heads, heads-tails, tails-heads, tails-tails), only one is both heads."},{"prompt":"P(A) = 0.5, P(B) = 0.4, independent. P(A and B)?","answer":"0.2","tier":2,"why":"For independent events, multiply: 0.5 × 0.4 = 0.2."},{"prompt":"P(A) = 0.3. P(not A)?","answer":"0.7","tier":1,"why":"A either happens or not, so the chances add to 1: 1 − 0.3 = 0.7."},{"prompt":"P(A) = 0.6, P(B) = 0.5, independent. P(A and B)?","answer":"0.3","tier":2,"why":"For independent events, multiply: 0.6 × 0.5 = 0.3."},{"prompt":"Three fair coins. P(all heads)? (fraction)","answer":"1/8","tier":2,"why":"Each coin has a 1/2 chance of heads, independently: 1/2 × 1/2 × 1/2 = 1/8."},{"prompt":"P(A) = 0.5, P(B) = 0.4, P(A and B) = 0.2. P(A or B)?","answer":"0.7","tier":3,"why":"Add the two chances, then subtract the overlap so it is not counted twice: 0.5 + 0.4 − 0.2 = 0.7."},{"prompt":"A and B cannot both happen. P(A) = 0.25, P(B) = 0.35. P(A or B)?","answer":"0.6","tier":3,"why":"A and B cannot happen together, so the overlap is 0 and the chances just add: 0.25 + 0.35 = 0.6."}]},"sightPaceSeconds":15},{"id":"st-counting","stage":"stats","part":2,"title":"Counting and combinations","summary":"Combinations ignore order: C(n, k) = n! / (k!(n − k)!).","prerequisites":["pc-binomial"],"lesson":{"explanation":"Combinations ignore order: C(n, k) = n! / (k!(n − k)!).","example":"C(10, 3) = 120","approaches":{"show":"Choose 2 of 4 fruits (apple, banana, cherry, date) and list every pair on paper: apple-banana, apple-cherry, apple-date, banana-cherry, banana-date, cherry-date. Show that this matches C(4, 2) = 4!/(2!·2!) = 6, because order does not matter.","together":"Work out C(5, 3) together. Ask: What is 5!? What are 3! and 2!? Then divide 120 by 6 × 2 together to get 10.","alone":"Have them compute C(6, 2) alone (answer 15). Hint if stuck: 6 × 5 counts ordered pairs, so divide by 2."}},"practice":{"generator":"binomial","params":{"max":12}},"sightPaceSeconds":10},{"id":"st-normal","stage":"stats","part":2,"title":"The normal distribution","summary":"About 68% of data lie within 1 SD of the mean, 95% within 2, 99.7% within 3.","prerequisites":["st-spread"],"lesson":{"explanation":"About 68% of data lie within 1 SD of the mean, 95% within 2, 99.7% within 3.","example":"Mean 100, SD 15: 95% between 70 and 130","approaches":{"show":"Draw a bell curve with mean 100 and SD 15 and mark 85, 115, 70, 130, 55 and 145. Shade the middle band and label it 68%, then 95% and 99.7% for the wider bands.","together":"Find the z-score of 130 when the mean is 100 and SD is 15 together. Ask: How far is 130 from the mean? How many SDs is 30? Then say z = 2 and ask what percent lies within 2 SDs (95%).","alone":"Have them find the z-score of 35 when the mean is 50 and SD is 10 alone (answer −1.5). Hint if stuck: subtract the mean, then divide by the SD."}},"practice":{"items":[{"prompt":"About what percent lies within 1 SD of the mean?","choices":["68%","95%","50%"],"answer":"68%","tier":1,"why":"By the 68-95-99.7 rule, about 68% of a normal distribution lies within 1 SD of the mean. 95% is the share within 2 SD."},{"prompt":"Mean 100, SD 15. z-score of 130?","answer":"2","tier":2,"why":"z = (value − mean) ÷ SD = (130 − 100) ÷ 15 = 30 ÷ 15 = 2."},{"prompt":"A z-score of 0 means the value equals the…","choices":["mean","median only","SD"],"answer":"mean","tier":1,"why":"z measures how many SDs a value is from the mean. z = 0 means a distance of 0, so the value equals the mean."},{"prompt":"Mean 50, SD 10. z-score of 35?","answer":"-1.5","tier":2,"why":"z = (35 − 50) ÷ 10 = −15 ÷ 10 = −1.5. It is negative because 35 is below the mean."},{"prompt":"About what percent lies within 2 SD of the mean?","choices":["68%","95%","99.7%"],"answer":"95%","tier":2,"why":"By the 68-95-99.7 rule, about 95% of values lie within 2 SD of the mean."},{"prompt":"Mean 100, SD 15. About what percent of values lie above 130?","choices":["2.5%","5%","16%"],"answer":"2.5%","tier":3,"why":"130 is 2 SD above the mean. About 95% lie within 2 SD, leaving 5% outside, split evenly between the two tails: 2.5% above 130."},{"prompt":"Mean 70, SD 5. About what percent of values lie between 65 and 80?","choices":["81.5%","68%","95%"],"answer":"81.5%","tier":3,"why":"65 is 1 SD below the mean and 80 is 2 SD above. From −1 to 0 is half of 68% = 34%; from 0 to 2 is half of 95% = 47.5%. Together, 81.5%."}]},"sightPaceSeconds":15},{"id":"st-inference","stage":"stats","part":3,"title":"Confidence intervals and tests","summary":"A p-value is the chance of data at least this extreme if the null hypothesis were true.","prerequisites":["st-normal"],"lesson":{"explanation":"A p-value is the chance of data at least this extreme if the null hypothesis were true.","example":"p = 0.01 is strong evidence against H₀","approaches":{"show":"Tell a story: a coin lands heads 9 times out of 10. Show that if the coin were fair, a result this extreme happens only about 2% of the time, so the p-value is small and we doubt the fair-coin null hypothesis.","together":"Decide one test together: p = 0.03 with significance level 0.05. Ask: Is 0.03 smaller than 0.05? What do we do with the null hypothesis then? Agree that we reject it, but have not proven anything for certain.","alone":"Have them decide alone whether a 99% confidence interval is wider or narrower than a 95% one for the same data (answer wider). Hint if stuck: to be more sure you caught the true value, do you need a bigger or smaller net?"}},"practice":{"items":[{"prompt":"A small p-value is evidence…","choices":["against the null hypothesis","for the null hypothesis","that the sample is too small"],"answer":"against the null hypothesis","tier":1,"why":"A small p-value means data like this would be rare if the null hypothesis were true, so the data cast doubt on the null hypothesis."},{"prompt":"Larger sample size makes a confidence interval…","choices":["narrower","wider","unchanged"],"answer":"narrower","tier":2,"why":"The margin of error shrinks as the sample grows (it depends on 1 ÷ √n, where n is the sample size), so a bigger sample gives a narrower interval."},{"prompt":"The null hypothesis usually says there is…","choices":["no effect or no difference","a large effect","a proven effect"],"answer":"no effect or no difference","tier":1,"why":"The null hypothesis is the default claim of no effect or no difference, which the test tries to find evidence against."},{"prompt":"p = 0.03 with significance level 0.05. Decision?","choices":["reject the null hypothesis","fail to reject the null hypothesis","the alternative is proven true"],"answer":"reject the null hypothesis","tier":2,"why":"0.03 is smaller than the significance level 0.05, so we reject the null hypothesis. This is evidence, not proof, so 'the alternative is proven true' goes too far."},{"prompt":"Sample mean 50, margin of error 3. The confidence interval is","choices":["47 to 53","50 to 53","44 to 56"],"answer":"47 to 53","tier":2,"why":"A confidence interval is the estimate plus or minus the margin of error: 50 − 3 = 47 and 50 + 3 = 53."},{"prompt":"Raising the confidence level from 95% to 99% makes the interval…","choices":["wider","narrower","unchanged"],"answer":"wider","tier":3,"why":"To be more confident of capturing the true value, the interval must cover more ground, so a 99% interval is wider than a 95% one."},{"prompt":"A p-value of 0.04 means…","choices":["if the null hypothesis were true, data this extreme would happen about 4% of the time","there is a 4% chance the null hypothesis is true","the effect size is 4%"],"answer":"if the null hypothesis were true, data this extreme would happen about 4% of the time","tier":3,"why":"A p-value assumes the null hypothesis is true and gives the chance of data at least this extreme: about 4%. It is not the chance that the null hypothesis is true."}]},"sightPaceSeconds":20},{"id":"st-regression","stage":"stats","part":3,"title":"Correlation and regression","summary":"r measures linear association from −1 to 1.","prerequisites":["st-spread","g8-slope"],"lesson":{"explanation":"r measures linear association from −1 to 1. Correlation does not imply causation.","example":"r = −0.9 is a strong negative link","approaches":{"show":"Sketch two scatter plots: hours studied against test score rising tightly (r near 0.9) and hours of television against score falling (r near −0.9). Then mention ice cream sales and sunburns rising together because of summer heat, not because one causes the other.","together":"Use the line ŷ = 3 + 2x together. Ask: What is ŷ when x = 0? What happens to ŷ when x goes up by 1? Then predict ŷ at x = 5 together (13).","alone":"Have them predict y from ŷ = 10 − 0.5x at x = 4 alone (answer 8). Hint if stuck: replace x with 4 and multiply before subtracting."}},"practice":{"items":[{"prompt":"r = −0.95 means a…","choices":["strong negative linear relationship","weak relationship","strong positive relationship"],"answer":"strong negative linear relationship","tier":2,"why":"r near −1 means the points lie close to a straight line that slopes downward: a strong negative linear relationship."},{"prompt":"Correlation proves causation?","choices":["No","Yes"],"answer":"No","tier":1,"why":"No. Two things can move together because of a third factor or by chance, so correlation alone does not prove one causes the other."},{"prompt":"r is always between","choices":["−1 and 1","0 and 1","−100 and 100"],"answer":"−1 and 1","tier":1,"why":"r is scaled so that a perfect downward line gives −1 and a perfect upward line gives 1. It can never go past those limits."},{"prompt":"Which r shows the strongest linear relationship?","choices":["−0.9","0.5","0.1"],"answer":"−0.9","tier":2,"why":"Strength depends on how close r is to −1 or 1, not its sign. |−0.9| = 0.9 is bigger than 0.5 or 0.1."},{"prompt":"Regression line ŷ = 3 + 2x. Predict ŷ when x = 5.","answer":"13","tier":3,"why":"Substitute x = 5: ŷ = 3 + 2 × 5 = 3 + 10 = 13."},{"prompt":"In ŷ = 10 − 0.5x, the slope −0.5 means…","choices":["ŷ drops 0.5 for each 1-unit rise in x","ŷ starts at −0.5","x drops 0.5 for each 1-unit rise in y"],"answer":"ŷ drops 0.5 for each 1-unit rise in x","tier":3,"why":"The slope is the change in ŷ for each 1-unit increase in x. A slope of −0.5 means ŷ goes down 0.5. The starting value is the intercept, 10."},{"prompt":"r = 0.8. What share of the variation in y does the line explain (r²)?","answer":"0.64","tier":3,"why":"Square r: 0.8 × 0.8 = 0.64, so the line explains 64% of the variation in y."}]},"sightPaceSeconds":15},{"id":"c1-limits","stage":"calc1","part":1,"title":"Limits","summary":"Limits describe behavior near a point; they handle 0/0 forms by simplifying.","prerequisites":["pc-limits"],"lesson":{"explanation":"Limits describe behavior near a point; they handle 0/0 forms by simplifying.","example":"lim x→0 sin x / x = 1","approaches":{"show":"Make a table for (x² − 1)/(x − 1) at x = 0.9, 0.99, 1.01, 1.1 and show the values closing in on 2. Then factor to (x + 1) to show why the limit is 2 even though x = 1 gives 0/0.","together":"Find lim x→2 of (x² − 4)/(x − 2) together. Ask: What happens if you plug in 2? How does x² − 4 factor? What is left after canceling? Then plug in 2 to get 4.","alone":"Have them find lim x→3 of (x² − 9)/(x − 3) alone (answer 6). Hint if stuck: factor the top as a difference of squares."}},"practice":{"generator":"limit"},"sightPaceSeconds":15},{"id":"c1-derivative-def","stage":"calc1","part":1,"title":"The derivative","summary":"f′(a) = lim h→0 (f(a + h) − f(a))/h: the slope of the tangent line, the instantaneous rate of change.","prerequisites":["c1-limits"],"lesson":{"explanation":"f′(a) = lim h→0 (f(a + h) − f(a))/h: the slope of the tangent line, the instantaneous rate of change.","example":"f(x) = x² → f′(x) = 2x","approaches":{"show":"On the graph of y = x², draw the secant line from x = 3 to x = 3 + h for h = 1, 0.1 and 0.01, with slopes 7, 6.1 and 6.01. Show the slopes heading to 6, the tangent slope f′(3).","together":"Compute f′(3) for f(x) = x² from the definition together. Ask: What is (3 + h)² − 9? What is left after dividing by h? Then let h go to 0 together to get 6.","alone":"Have them find lim h→0 ((2 + h)² − 4)/h alone (answer 4). Hint if stuck: expand (2 + h)² as 4 + 4h + h²."}},"practice":{"items":[{"prompt":"The derivative at a point is the slope of the…","choices":["tangent line","secant line","normal line"],"answer":"tangent line","tier":1,"why":"The derivative is the limit of secant slopes as the two points move together, which gives the slope of the tangent line at that point."},{"prompt":"d/dx of a constant is","choices":["0","1","the constant"],"answer":"0","tier":1,"why":"A constant never changes, so its graph is a flat line with slope 0."},{"prompt":"d/dx (sin x) =","choices":["cos x","−cos x","−sin x"],"answer":"cos x","tier":2,"why":"The slope of sin x at each point equals cos x; for example, at x = 0 sin x rises with slope 1 = cos 0."},{"prompt":"f(x) = x². Using the limit definition, f′(3) = ?","answer":"6","tier":2,"why":"((3 + h)² − 9)/h = (6h + h²)/h = 6 + h, which approaches 6 as h goes to 0."},{"prompt":"f(x) = 5x + 1. f′(2) = ?","answer":"5","tier":2,"why":"f(x) = 5x + 1 is a straight line with slope 5 everywhere, so f′(2) = 5."},{"prompt":"lim h→0 ((2 + h)² − 4)/h = ?","answer":"4","tier":3,"why":"(2 + h)² − 4 = 4h + h², and dividing by h gives 4 + h, which goes to 4. This is the derivative of x² at x = 2."},{"prompt":"lim h→0 (√(9 + h) − 3)/h = ? (fraction)","answer":"1/6","tier":3,"why":"Multiply top and bottom by √(9 + h) + 3: the top becomes h, leaving 1/(√(9 + h) + 3), which goes to 1/(3 + 3) = 1/6."}]},"sightPaceSeconds":12},{"id":"c1-power-rule","stage":"calc1","part":1,"title":"Power rule","summary":"d/dx xⁿ = n xⁿ⁻¹.","prerequisites":["c1-derivative-def","alg1-polynomials"],"lesson":{"explanation":"d/dx xⁿ = n xⁿ⁻¹. Derivatives add term by term.","example":"d/dx (3x⁴ + 2x) = 12x³ + 2","approaches":{"show":"Write d/dx x⁴ and show the two moves: bring the 4 down in front and lower the power by one to get 4x³. Then do 3x⁴ + 2x term by term to get 12x³ + 2.","together":"Differentiate 5x³ − 2x² + 7 together. Ask: What does the power rule give for 5x³? For −2x²? What happens to the constant 7? Then write 15x² − 4x together.","alone":"Have them find d/dx (2x⁵ + x) alone (answer 10x⁴ + 1). Hint if stuck: x is x¹, so its derivative is 1."}},"practice":{"generator":"derivative"},"sightPaceSeconds":15},{"id":"c1-chain-rule","stage":"calc1","part":2,"title":"Product, quotient and chain rules","summary":"(fg)′ = f′g + fg′; (f(g(x)))′ = f′(g(x))·g′(x).","prerequisites":["c1-power-rule"],"lesson":{"explanation":"(fg)′ = f′g + fg′; (f(g(x)))′ = f′(g(x))·g′(x).","example":"d/dx sin(x²) = 2x cos(x²)","approaches":{"show":"Write sin(x²) and box the inside, x². Show the chain rule out loud: derivative of the outside, cos(x²), times the derivative of the inside, 2x, giving 2x cos(x²).","together":"Differentiate (x² + 1)³ together. Ask: What is the outside function? What is its derivative, keeping the inside? What is the derivative of x² + 1? Then multiply to get 6x(x² + 1)².","alone":"Have them find d/dx (x · sin x) alone (answer sin x + x cos x). Hint if stuck: use the product rule, first times derivative of second plus second times derivative of first."}},"practice":{"items":[{"prompt":"d/dx sin(x²) =","choices":["2x cos(x²)","cos(x²)","2x sin(x²)"],"answer":"2x cos(x²)","tier":3,"why":"Chain rule: the derivative of the outside sin is cos(x²), times the derivative of the inside x², which is 2x. So 2x cos(x²)."},{"prompt":"d/dx eˣ =","choices":["eˣ","x eˣ⁻¹","1"],"answer":"eˣ","tier":1,"why":"eˣ is its own derivative: its slope at each point equals its value. The power rule does not apply because x is in the exponent."},{"prompt":"d/dx (x·eˣ) =","choices":["eˣ + x eˣ","x eˣ","eˣ"],"answer":"eˣ + x eˣ","tier":2,"why":"Product rule: (x)′ · eˣ + x · (eˣ)′ = 1 · eˣ + x eˣ = eˣ + x eˣ."},{"prompt":"d/dx ln x =","choices":["1/x","ln x","x"],"answer":"1/x","tier":1,"why":"ln x is the inverse of eˣ, and its slope at x is 1/x."},{"prompt":"d/dx (x² + 1)³ =","choices":["6x(x² + 1)²","3(x² + 1)²","6x(x² + 1)³"],"answer":"6x(x² + 1)²","tier":2,"why":"Chain rule: 3(x² + 1)² times the inside derivative 2x gives 6x(x² + 1)². Forgetting the 2x gives 3(x² + 1)²."},{"prompt":"d/dx (sin x / x) =","choices":["(x cos x − sin x)/x²","cos x","(sin x − x cos x)/x²"],"answer":"(x cos x − sin x)/x²","tier":3,"why":"Quotient rule: (top′ · bottom − top · bottom′)/bottom² = (cos x · x − sin x · 1)/x² = (x cos x − sin x)/x². The order of the top matters."},{"prompt":"d/dx e³ˣ at x = 0 = ?","answer":"3","tier":3,"why":"By the chain rule, d/dx e³ˣ = 3e³ˣ. At x = 0 that is 3 · e⁰ = 3 · 1 = 3."}]},"sightPaceSeconds":15},{"id":"c1-applications","stage":"calc1","part":2,"title":"Applications of derivatives","summary":"Maxima and minima occur where f′ = 0 or is undefined; f″ > 0 means concave up (a minimum).","prerequisites":["c1-chain-rule"],"lesson":{"explanation":"Maxima and minima occur where f′ = 0 or is undefined; f″ > 0 means concave up (a minimum).","example":"f(x) = x² − 4x has a minimum at x = 2","approaches":{"show":"Sketch f(x) = x² − 4x. Show that f′(x) = 2x − 4 is zero at x = 2, and that f″ = 2 > 0, so the curve is cupped upward and x = 2 is a minimum.","together":"Find the critical points of f(x) = x³ − 3x together. Ask: What is f′(x)? When is 3x² − 3 zero? Then check f″(x) = 6x at x = 1 and x = −1 together to label the minimum and the maximum.","alone":"Have them find the width that gives the largest area for a rectangle with perimeter 20 alone (answer 5). Hint if stuck: write the area as w(10 − w) and set its derivative to 0."}},"practice":{"items":[{"prompt":"f(x) = x² − 4x. x at the minimum?","answer":"2","tier":1,"why":"f′(x) = 2x − 4 = 0 gives x = 2, and the parabola opens upward, so this is the minimum."},{"prompt":"If f′(c) = 0 and f″(c) < 0, c is a…","choices":["local maximum","local minimum","inflection point"],"answer":"local maximum","tier":2,"why":"f′(c) = 0 means a flat tangent, and f″(c) < 0 means the curve bends downward (concave down), like the top of a hill. So c is a local maximum."},{"prompt":"f(x) = x³ − 3x. Positive critical point?","answer":"1","tier":2,"why":"f′(x) = 3x² − 3 = 0 gives x² = 1, so x = ±1. The positive critical point is 1."},{"prompt":"If f′(c) = 0 and f″(c) > 0, c is a…","choices":["local minimum","local maximum","inflection point"],"answer":"local minimum","tier":1,"why":"A flat tangent with f″(c) > 0 means the curve bends upward like a bowl, so c is a local minimum."},{"prompt":"f(x) = x³ − 12x. x at the local minimum?","answer":"2","tier":3,"why":"f′(x) = 3x² − 12 = 0 gives x = ±2. f″(x) = 6x is positive at x = 2, so x = 2 is the local minimum (x = −2 is the maximum)."},{"prompt":"A rectangle has perimeter 20. Width that gives the largest area?","answer":"5","tier":3,"why":"With width w, length = 10 − w and area = w(10 − w). Setting the derivative 10 − 2w = 0 gives w = 5, so a 5 by 5 square has the largest area."},{"prompt":"Maximum value of f(x) = −x² + 6x?","answer":"9","tier":3,"why":"f′(x) = −2x + 6 = 0 gives x = 3. Then f(3) = −9 + 18 = 9, the maximum since the parabola opens downward."}]},"sightPaceSeconds":20},{"id":"c1-integral","stage":"calc1","part":3,"title":"Definite integrals","summary":"∫ₐᵇ f(x) dx is the signed area under f.","prerequisites":["c1-power-rule"],"lesson":{"explanation":"∫ₐᵇ f(x) dx is the signed area under f. Antiderivative of xⁿ is xⁿ⁺¹/(n + 1).","example":"∫₀² 2x dx = 4","approaches":{"show":"Draw y = 2x from 0 to 2 and shade the triangle under it. Show its area, 1/2 × 2 × 4 = 4, then show the antiderivative x² gives 2² − 0² = 4 too.","together":"Compute the integral of 3x² from 0 to 2 together. Ask: What is an antiderivative of 3x²? What is it at 2? At 0? Then subtract together to get 8.","alone":"Have them find the integral of 4x from 0 to 3 alone (answer 18). Hint if stuck: an antiderivative of 4x is 2x²."}},"practice":{"generator":"integral"},"sightPaceSeconds":15},{"id":"c1-ftc","stage":"calc1","part":3,"title":"Fundamental theorem of calculus","summary":"If F′ = f then ∫ₐᵇ f = F(b) − F(a).","prerequisites":["c1-integral"],"lesson":{"explanation":"If F′ = f then ∫ₐᵇ f = F(b) − F(a). Differentiation and integration undo each other.","example":"∫₁³ 2x dx = 9 − 1 = 8","approaches":{"show":"Write ∫ from 1 to 3 of 2x dx. Show the two steps: the antiderivative is x², and x² at 3 minus x² at 1 is 9 − 1 = 8.","together":"Compute ∫ from 0 to 2 of x² dx together. Ask: What function has derivative x²? What is (2)³/3? What is the value at 0? Then agree on 8/3.","alone":"Have them compute ∫ from 0 to π of sin x dx alone (answer 2). Hint if stuck: an antiderivative of sin x is −cos x."}},"practice":{"items":[{"prompt":"∫ from 1 to 3 of 2x dx = ?","answer":"8","tier":2,"why":"An antiderivative of 2x is x². Evaluate: 3² − 1² = 9 − 1 = 8."},{"prompt":"d/dx ∫ₐˣ f(t) dt =","choices":["f(x)","F(x)","f′(x)"],"answer":"f(x)","tier":3,"why":"The fundamental theorem says that the rate at which the accumulated area grows at x equals the height f(x) there."},{"prompt":"∫ from 0 to 1 of 3x² dx = ?","answer":"1","tier":1,"why":"An antiderivative of 3x² is x³. Evaluate: 1³ − 0³ = 1."},{"prompt":"∫ from 0 to 2 of 1 dx = ?","answer":"2","tier":1,"why":"This is the area of a rectangle with height 1 and width 2: 1 × 2 = 2. Or, x from 0 to 2 gives 2 − 0."},{"prompt":"∫ from 0 to 2 of x² dx = ? (fraction)","answer":"8/3","tier":2,"why":"An antiderivative of x² is x³/3. Evaluate: 8/3 − 0 = 8/3."},{"prompt":"∫ from 0 to π of sin x dx = ?","answer":"2","tier":3,"why":"An antiderivative of sin x is −cos x. Evaluate: −cos π − (−cos 0) = 1 + 1 = 2."},{"prompt":"d/dx ∫ from 0 to x² of cos t dt =","choices":["2x cos(x²)","cos(x²)","sin(x²)"],"answer":"2x cos(x²)","tier":3,"why":"The fundamental theorem gives cos(x²), and the chain rule multiplies by the derivative of the upper limit x², which is 2x. So 2x cos(x²)."}]},"sightPaceSeconds":15},{"id":"c2-substitution","stage":"calc2","part":1,"title":"Substitution","summary":"Reverse the chain rule: let u = g(x), du = g′(x) dx.","prerequisites":["c1-ftc","c1-chain-rule"],"lesson":{"explanation":"Reverse the chain rule: let u = g(x), du = g′(x) dx.","example":"∫ 2x cos(x²) dx = sin(x²) + C","approaches":{"show":"Write ∫ 2x cos(x²) dx and circle x² and 2x. Show u = x², du = 2x dx, so the integral becomes ∫ cos u du = sin u + C = sin(x²) + C.","together":"Do ∫ cos(3x) dx together. Ask: What should u be? What is du? How do you replace dx with du/3? Then finish with (1/3) sin(3x) + C together.","alone":"Have them find ∫ x e^(x²) dx alone (answer (1/2) e^(x²) + C). Hint if stuck: let u = x², so x dx = du/2."}},"practice":{"items":[{"prompt":"∫ 2x cos(x²) dx =","choices":["sin(x²) + C","cos(x²) + C","2 sin(x²) + C"],"answer":"sin(x²) + C","tier":2,"why":"Let u = x², so du = 2x dx. The integral becomes ∫ cos u du = sin u + C = sin(x²) + C."},{"prompt":"∫ eˣ dx =","choices":["eˣ + C","x eˣ + C","eˣ⁺¹ + C"],"answer":"eˣ + C","tier":1,"why":"eˣ is its own derivative, so it is also its own antiderivative: eˣ + C."},{"prompt":"∫ 1/x dx =","choices":["ln|x| + C","1/x² + C","x + C","x²/2 + C"],"answer":"ln|x| + C","tier":1,"why":"The derivative of ln|x| is 1/x (for positive and negative x), so ∫ 1/x dx = ln|x| + C. The power rule fails here because it would divide by 0."},{"prompt":"∫ cos(3x) dx =","choices":["(1/3) sin(3x) + C","3 sin(3x) + C","sin(3x) + C"],"answer":"(1/3) sin(3x) + C","tier":2,"why":"Let u = 3x, du = 3 dx, so dx = du/3. Then ∫ cos u du/3 = (1/3) sin(3x) + C. Check: the derivative is cos(3x)."},{"prompt":"∫ x e^(x²) dx =","choices":["(1/2) e^(x²) + C","e^(x²) + C","2x e^(x²) + C"],"answer":"(1/2) e^(x²) + C","tier":3,"why":"Let u = x², du = 2x dx, so x dx = du/2. Then (1/2)∫ eᵘ du = (1/2) e^(x²) + C."},{"prompt":"∫ from 0 to 1 of 2x(x² + 1)³ dx = ? (fraction)","answer":"15/4","tier":3,"why":"Let u = x² + 1, du = 2x dx; u runs from 1 to 2. ∫ u³ du = u⁴/4, giving (16 − 1)/4 = 15/4."}]},"sightPaceSeconds":20},{"id":"c2-parts","stage":"calc2","part":1,"title":"Integration by parts","summary":"∫ u dv = uv − ∫ v du.","prerequisites":["c2-substitution"],"lesson":{"explanation":"∫ u dv = uv − ∫ v du.","example":"∫ x eˣ dx = x eˣ − eˣ + C","approaches":{"show":"Write ∫ x eˣ dx and label u = x and dv = eˣ dx, so du = dx and v = eˣ. Plug into uv − ∫ v du to get x eˣ − eˣ + C, then differentiate it to show you get x eˣ back.","together":"Do ∫ x cos x dx together. Ask: Which factor gets simpler when differentiated? What are du and v? What is ∫ sin x dx? Then write x sin x + cos x + C together.","alone":"Have them compute ∫ from 0 to 1 of x eˣ dx alone (answer 1). Hint if stuck: use the antiderivative x eˣ − eˣ and evaluate it at 1 and 0."}},"practice":{"items":[{"prompt":"∫ x eˣ dx =","choices":["x eˣ − eˣ + C","x eˣ + C","eˣ + C"],"answer":"x eˣ − eˣ + C","tier":2,"why":"Take u = x and dv = eˣ dx, so du = dx and v = eˣ. Then x eˣ − ∫ eˣ dx = x eˣ − eˣ + C."},{"prompt":"∫ ln x dx =","choices":["x ln x − x + C","1/x + C","ln x + C"],"answer":"x ln x − x + C","tier":3,"why":"Take u = ln x and dv = dx, so du = dx/x and v = x. Then x ln x − ∫ x · (1/x) dx = x ln x − x + C."},{"prompt":"Integration by parts comes from reversing the…","choices":["product rule","chain rule","power rule"],"answer":"product rule","tier":1,"why":"The product rule (uv)′ = u′v + uv′, integrated and rearranged, gives ∫ u dv = uv − ∫ v du."},{"prompt":"For ∫ x cos x dx, a good choice of u is","choices":["x","cos x","sin x"],"answer":"x","tier":1,"why":"Choose u = x because its derivative is 1, which makes the new integral ∫ sin x dx simpler. Choosing u = cos x would make it harder."},{"prompt":"∫ x cos x dx =","choices":["x sin x + cos x + C","x sin x − cos x + C","x cos x + C"],"answer":"x sin x + cos x + C","tier":2,"why":"u = x, dv = cos x dx gives v = sin x. Then x sin x − ∫ sin x dx = x sin x + cos x + C, since −∫ sin x dx = +cos x."},{"prompt":"∫ from 0 to 1 of x eˣ dx = ?","answer":"1","tier":3,"why":"Using x eˣ − eˣ from 0 to 1: (e − e) − (0 − 1) = 0 + 1 = 1."}]},"sightPaceSeconds":25},{"id":"c2-geometric","stage":"calc2","part":2,"title":"Geometric series","summary":"a + ar + ar² + … = a/(1 − r) when |r| < 1.","prerequisites":["alg2-sequences","c1-limits"],"lesson":{"explanation":"a + ar + ar² + … = a/(1 − r) when |r| < 1.","example":"1 + 1/2 + 1/4 + … = 2","approaches":{"show":"Draw a square, shade half, then half of what is left, then half again. Show the shaded total approaching the whole: 1/2 + 1/4 + 1/8 + … = 1, which matches a/(1 − r) with a = 1/2 and r = 1/2.","together":"Sum 3 + 1 + 1/3 + 1/9 + … together. Ask: What is the first term? What do you multiply by each time? Is |r| less than 1? Then compute 3/(1 − 1/3) = 9/2 together.","alone":"Have them sum 4 + 2 + 1 + 1/2 + … alone (answer 8). Hint if stuck: a = 4 and r = 1/2."}},"practice":{"generator":"geometricSeries"},"sightPaceSeconds":15},{"id":"c2-convergence","stage":"calc2","part":2,"title":"Convergence tests","summary":"p-series Σ1/nᵖ converges iff p > 1.","prerequisites":["c2-geometric"],"lesson":{"explanation":"p-series Σ1/nᵖ converges iff p > 1. Ratio test: limit < 1 converges.","example":"Σ1/n² converges; Σ1/n diverges","approaches":{"show":"Group the harmonic series as 1 + 1/2 + (1/3 + 1/4) + (1/5 + … + 1/8) + … and show each group is at least 1/2, so the sum grows without bound. Then contrast Σ 1/n², which settles near 1.64.","together":"Apply the ratio test to Σ 2ⁿ/n! together. Ask: What is the next term divided by this term? What does 2/(n + 1) approach? Is that limit below 1? Then conclude it converges.","alone":"Have them decide whether Σ 1/√n converges alone (answer: it diverges). Hint if stuck: it is a p-series with p = 1/2."}},"practice":{"items":[{"prompt":"Σ 1/n (harmonic series)…","choices":["diverges","converges to 1","converges to 2"],"answer":"diverges","tier":1,"why":"Group the terms: 1/3 + 1/4 > 1/2, 1/5 through 1/8 > 1/2, and so on. You keep adding at least 1/2, so the sum grows without bound."},{"prompt":"Σ 1/n² …","choices":["converges","diverges"],"answer":"converges","tier":1,"why":"This is a p-series with p = 2, which is greater than 1, so it converges (to π²/6)."},{"prompt":"Σ 1/nᵖ converges exactly when","choices":["p > 1","p ≥ 1","p > 0"],"answer":"p > 1","tier":2,"why":"The p-series test: Σ 1/nᵖ converges if and only if p > 1. At p = 1 it is the harmonic series, which diverges."},{"prompt":"Ratio test limit is 1/2. The series…","choices":["converges","diverges","cannot be decided by this test"],"answer":"converges","tier":2,"why":"A ratio test limit below 1 means the terms eventually shrink at least like a geometric series with ratio under 1, so the series converges."},{"prompt":"Ratio test limit is 1. The test…","choices":["is inconclusive","shows convergence","shows divergence"],"answer":"is inconclusive","tier":3,"why":"When the limit is exactly 1 the ratio test cannot tell: Σ 1/n diverges and Σ 1/n² converges, yet both have limit 1."},{"prompt":"Σ 1/√n …","choices":["diverges","converges"],"answer":"diverges","tier":3,"why":"1/√n = 1/n^(1/2) is a p-series with p = 1/2, which is not greater than 1, so it diverges."},{"prompt":"Σ 2ⁿ/n! …","choices":["converges","diverges"],"answer":"converges","tier":3,"why":"Ratio test: the ratio of term n + 1 to term n is 2/(n + 1), which goes to 0. Since 0 < 1, the series converges (to e² − 1)."}]},"sightPaceSeconds":15},{"id":"c2-taylor","stage":"calc2","part":3,"title":"Taylor series","summary":"f(x) = Σ f⁽ⁿ⁾(a)(x − a)ⁿ / n!.","prerequisites":["c2-convergence","c1-chain-rule"],"lesson":{"explanation":"f(x) = Σ f⁽ⁿ⁾(a)(x − a)ⁿ / n!. eˣ = 1 + x + x²/2! + …","example":"sin x = x − x³/3! + x⁵/5! − …","approaches":{"show":"Write eˣ = 1 + x + x²/2! + x³/3! + … and plug in x = 1 term by term: 1, 2, 2.5, 2.667, 2.708. Show the partial sums closing in on e ≈ 2.718.","together":"Build the first terms of cos x together. Ask: What are cos 0, −sin 0, −cos 0 and sin 0? Which derivatives give nonzero terms? Then write 1 − x²/2! + x⁴/4! together.","alone":"Have them estimate e^0.2 with 1 + x + x²/2 alone (answer 1.22). Hint if stuck: x² is 0.04, so x²/2 is 0.02."}},"practice":{"items":[{"prompt":"The Maclaurin series of eˣ is","choices":["Σ xⁿ/n!","Σ xⁿ","Σ (−1)ⁿxⁿ"],"answer":"Σ xⁿ/n!","tier":1,"why":"Every derivative of eˣ is eˣ, which equals 1 at x = 0, so each coefficient is 1/n!: Σ xⁿ/n!."},{"prompt":"The x³ coefficient for sin x is","choices":["−1/6","1/6","1/3"],"answer":"−1/6","tier":2,"why":"sin x = x − x³/3! + …, and 3! = 6, so the x³ coefficient is −1/6. The minus sign comes from the third derivative of sin x, −cos x, being −1 at 0."},{"prompt":"1/(1 − x) = Σ xⁿ for which x?","choices":["|x| < 1","all x","x > 1"],"answer":"|x| < 1","tier":2,"why":"This is a geometric series with ratio x, which converges only when |x| < 1."},{"prompt":"The Maclaurin series of cos x begins","choices":["1 − x²/2! + x⁴/4! − …","x − x³/3! + x⁵/5! − …","1 + x + x²/2! + …"],"answer":"1 − x²/2! + x⁴/4! − …","tier":1,"why":"cos x is even, so it has only even powers, starting from cos 0 = 1: 1 − x²/2! + x⁴/4! − …. The second choice is sin x."},{"prompt":"The x² coefficient in the Maclaurin series of e²ˣ?","answer":"2","tier":3,"why":"Put 2x in for x in eˣ: the x² term is (2x)²/2! = 4x²/2 = 2x². The coefficient is 2."},{"prompt":"The x⁴ coefficient for cos x is","choices":["1/24","−1/24","1/4"],"answer":"1/24","tier":3,"why":"The x⁴ term of cos x is +x⁴/4!, and 4! = 24, so the coefficient is 1/24. The signs go +, −, +, so this term is positive."},{"prompt":"Estimate e^0.2 using 1 + x + x²/2 (two decimal places).","answer":"1.22","tier":3,"why":"1 + 0.2 + (0.2)²/2 = 1 + 0.2 + 0.02 = 1.22. The true value is about 1.2214."}]},"sightPaceSeconds":20},{"id":"c2-applications","stage":"calc2","part":3,"title":"Areas and volumes","summary":"Area between curves = ∫(top − bottom).","prerequisites":["c1-ftc"],"lesson":{"explanation":"Area between curves = ∫(top − bottom). Disk method volume = ∫ π r² dx.","example":"Area under y = x² on [0, 3] is 9","approaches":{"show":"Sketch y = x² from 0 to 3 and shade under it. Show ∫ from 0 to 3 of x² dx = 27/3 = 9, then spin the line y = x around the x-axis to show each slice is a disk of area πx².","together":"Find the area between y = x and y = x² from 0 to 1 together. Ask: Which curve is on top? What is ∫ (x − x²) dx? What are 1/2 − 1/3? Then agree on 1/6.","alone":"Have them find the volume when y = x from 0 to 3 is spun around the x-axis alone (answer 9π). Hint if stuck: each disk has radius x, so integrate πx²."}},"practice":{"items":[{"prompt":"Area under y = x² from 0 to 3?","answer":"9","tier":1,"why":"∫ x² dx from 0 to 3 is x³/3 evaluated: 27/3 − 0 = 9."},{"prompt":"The disk method volume formula is","choices":["∫ π r(x)² dx","∫ 2π r(x) dx","∫ r(x) dx"],"answer":"∫ π r(x)² dx","tier":1,"why":"Each slice is a disk of radius r(x) with area π r(x)², and thickness dx. Adding up the slices gives ∫ π r(x)² dx."},{"prompt":"Area between y = x and y = x² from 0 to 1? (fraction)","answer":"1/6","tier":2,"why":"On [0, 1], x is above x². Area = ∫ (x − x²) dx = 1/2 − 1/3 = 1/6."},{"prompt":"Area under y = 4x³ from 0 to 1?","answer":"1","tier":2,"why":"An antiderivative of 4x³ is x⁴. Evaluate: 1⁴ − 0⁴ = 1."},{"prompt":"Volume when y = x from 0 to 3 is rotated about the x-axis","choices":["9π","3π","27π"],"answer":"9π","tier":3,"why":"Disk method: ∫ π x² dx from 0 to 3 = π · 27/3 = 9π. This is a cone with radius 3 and height 3: (1/3)π · 9 · 3 = 9π."},{"prompt":"Volume when y = √x from 0 to 2 is rotated about the x-axis","choices":["2π","4π","π"],"answer":"2π","tier":3,"why":"Disk method: ∫ π (√x)² dx = ∫ π x dx from 0 to 2 = π · 4/2 = 2π."}]},"sightPaceSeconds":20},{"id":"c3-partials","stage":"calc3","part":1,"title":"Partial derivatives","summary":"Differentiate in one variable while holding the others fixed.","prerequisites":["c1-chain-rule"],"lesson":{"explanation":"Differentiate in one variable while holding the others fixed.","example":"∂/∂x (x²y) = 2xy","approaches":{"show":"Write f = x²y and cover the y with your finger, saying: y is just a number now. Differentiate x² to get 2x and put y back to show ∂f/∂x = 2xy.","together":"Find ∂/∂y (x²y + y³) together. Ask: Which letter is frozen now? What is the derivative of x²y with x fixed? Of y³? Then write x² + 3y² together.","alone":"Have them find f_xy for f = x²y³ alone (answer 6xy²). Hint if stuck: first find f_x = 2xy³, then differentiate that with respect to y."}},"practice":{"items":[{"prompt":"∂/∂x (x²y) =","choices":["2xy","x²","2x"],"answer":"2xy","tier":1,"why":"Treat y as a constant: the derivative of x² is 2x, so ∂/∂x (x²y) = 2x · y = 2xy."},{"prompt":"∂/∂y (x²y + y³) =","choices":["x² + 3y²","2xy","3y²"],"answer":"x² + 3y²","tier":2,"why":"Treat x as a constant: ∂/∂y (x²y) = x² and ∂/∂y (y³) = 3y². Together, x² + 3y²."},{"prompt":"Clairaut: for smooth f, f_xy equals","choices":["f_yx","f_xx","0"],"answer":"f_yx","tier":2,"why":"Clairaut's theorem says the mixed partials of a smooth function are equal, so the order does not matter: f_xy = f_yx."},{"prompt":"∂/∂x (3x + 5y) =","choices":["3","5","3 + 5y"],"answer":"3","tier":1,"why":"Treat y as a constant: 5y has no x, so its partial is 0, and 3x gives 3."},{"prompt":"f = x²y³. f_xy =","choices":["6xy²","2xy³","6x²y"],"answer":"6xy²","tier":3,"why":"First f_x = 2xy³ (y held fixed). Then differentiate in y: 2x · 3y² = 6xy²."},{"prompt":"f = eˣʸ. ∂f/∂x at (0, 2) = ?","answer":"2","tier":3,"why":"Treat y as a constant: ∂f/∂x = y eˣʸ. At (0, 2): 2 · e⁰ = 2."}]},"sightPaceSeconds":15},{"id":"c3-gradient","stage":"calc3","part":1,"title":"Gradient and directional derivatives","summary":"∇f points in the direction of steepest increase; its length is that rate.","prerequisites":["c3-partials","pc-vectors"],"lesson":{"explanation":"∇f points in the direction of steepest increase; its length is that rate.","example":"∇(x² + y²) = (2x, 2y)","approaches":{"show":"Draw circles x² + y² = 1, 4, 9 as level curves. At the point (1, 2) draw the gradient arrow (2, 4) pointing straight outward, crossing the circle at a right angle.","together":"Find the directional derivative of f = x² + y² at (1, 2) in direction (3/5, 4/5) together. Ask: What is ∇f there? Is the direction a unit vector? Then take the dot product (2)(3/5) + (4)(4/5) = 22/5 together.","alone":"Have them find the largest rate of increase of f = x² + y² at (3, 4) alone (answer 10). Hint if stuck: it is the length of the gradient (6, 8)."}},"practice":{"items":[{"prompt":"∇(x² + y²) =","choices":["(2x, 2y)","(x, y)","2x + 2y"],"answer":"(2x, 2y)","tier":1,"why":"The gradient lists the partial derivatives: ∂/∂x = 2x and ∂/∂y = 2y, giving (2x, 2y). It is a vector, not a sum like 2x + 2y."},{"prompt":"The gradient is perpendicular to…","choices":["level curves","the x-axis","itself"],"answer":"level curves","tier":2,"why":"Along a level curve f does not change, so the directional derivative there is 0. That happens only when the direction is perpendicular to the gradient."},{"prompt":"∇(3x + 4y) =","choices":["(3, 4)","(4, 3)","7"],"answer":"(3, 4)","tier":1,"why":"The partials of 3x + 4y are 3 (in x) and 4 (in y), so the gradient is (3, 4)."},{"prompt":"The gradient points in the direction of…","choices":["steepest increase","steepest decrease","no change"],"answer":"steepest increase","tier":2,"why":"The directional derivative in unit direction u is ∇f · u, which is largest when u points the same way as ∇f. So the gradient points toward steepest increase."},{"prompt":"f = x² + y². Directional derivative at (1, 2) in direction (3/5, 4/5)?","answer":"4.4","tier":3,"why":"∇f = (2x, 2y) = (2, 4) at (1, 2). Dot it with the unit vector: 2 × 3/5 + 4 × 4/5 = 1.2 + 3.2 = 4.4."},{"prompt":"f = x² + y². Largest rate of increase at (3, 4)?","answer":"10","tier":3,"why":"The largest rate equals the length of the gradient. ∇f = (6, 8) at (3, 4), and √(36 + 64) = 10."}]},"sightPaceSeconds":15},{"id":"c3-multiple","stage":"calc3","part":2,"title":"Multiple integrals","summary":"Integrate over regions; change variables with the Jacobian (polar: dA = r dr dθ).","prerequisites":["c3-partials","c1-ftc"],"lesson":{"explanation":"Integrate over regions; change variables with the Jacobian (polar: dA = r dr dθ).","example":"Area of unit disk = ∫∫ r dr dθ = π","approaches":{"show":"Draw a 2 by 3 rectangle and show ∫ from 0 to 2 ∫ from 0 to 3 of 1 dx dy = 6 as its area. Then draw a thin polar wedge and show its area is about r times dr times dθ, which is why dA = r dr dθ.","together":"Compute ∫ from 0 to 2 ∫ from 0 to 2 of xy dx dy together. Ask: What is the inner integral with y held fixed? What is left to integrate in y? Then reach 4 together.","alone":"Have them find the area of a disk of radius 2 using ∫∫ r dr dθ alone (answer 4π). Hint if stuck: r goes from 0 to 2 and θ from 0 to 2π."}},"practice":{"items":[{"prompt":"In polar coordinates dA =","choices":["r dr dθ","dr dθ","r² dr dθ"],"answer":"r dr dθ","tier":2,"why":"Switching to polar coordinates stretches area: a small patch is about dr wide and r dθ long, so dA = r dr dθ."},{"prompt":"∫₀¹∫₀¹ 1 dx dy = ?","answer":"1","tier":1,"why":"Integrating 1 over the unit square gives its area: 1 × 1 = 1."},{"prompt":"∫₀²∫₀³ 1 dx dy = ?","answer":"6","tier":1,"why":"Integrating 1 over a rectangle 3 wide (x from 0 to 3) and 2 tall (y from 0 to 2) gives its area: 3 × 2 = 6."},{"prompt":"∫₀²∫₀² xy dx dy = ?","answer":"4","tier":2,"why":"The integrand splits: (∫ x dx from 0 to 2)(∫ y dy from 0 to 2) = 2 × 2 = 4."},{"prompt":"Area of a disk of radius 2 using ∫∫ r dr dθ","choices":["4π","2π","8π"],"answer":"4π","tier":3,"why":"∫ r dr from 0 to 2 is 2²/2 = 2, and ∫ dθ from 0 to 2π is 2π, so the area is 4π, matching π · 2²."},{"prompt":"∫ from 0 to 2π ∫ from 0 to 1 of r² dr dθ =","choices":["2π/3","π","π/3"],"answer":"2π/3","tier":3,"why":"∫ r² dr from 0 to 1 is 1/3, and ∫ dθ from 0 to 2π is 2π. Multiply: 2π/3."}]},"sightPaceSeconds":20},{"id":"c3-vector-fields","stage":"calc3","part":2,"title":"Divergence and curl","summary":"div F = ∇·F measures spreading; curl F = ∇×F measures rotation.","prerequisites":["c3-gradient"],"lesson":{"explanation":"div F = ∇·F measures spreading; curl F = ∇×F measures rotation.","example":"div (x, y, z) = 3","approaches":{"show":"Sketch F = (x, y) as arrows pointing away from the origin to show spreading, with div F = 1 + 1 = 2. Then sketch F = (−y, x) swirling around the origin to show rotation, with curl (0, 0, 2).","together":"Find the divergence of F = (x², yz, z) at (1, 1, 1) together. Ask: What is ∂/∂x of x²? ∂/∂y of yz? ∂/∂z of z? Then add 2 + 1 + 1 = 4 together.","alone":"Have them find the divergence of F = (2x, 3y, 0) alone (answer 5). Hint if stuck: differentiate each component by its own variable and add."}},"practice":{"items":[{"prompt":"div of F = (x, y, z)?","answer":"3","tier":1,"why":"Divergence adds the partial derivative of each component with respect to its own variable: ∂x/∂x + ∂y/∂y + ∂z/∂z = 1 + 1 + 1 = 3."},{"prompt":"curl of a gradient field is","choices":["0","1","undefined"],"answer":"0","tier":2,"why":"A gradient field is ∇f, and curl(∇f) = 0 because mixed partial derivatives are equal (∂²f/∂x∂y = ∂²f/∂y∂x), so every component cancels. Gradient fields have no rotation."},{"prompt":"div of a curl is","choices":["0","1","the field"],"answer":"0","tier":2,"why":"div(curl F) = 0 always: writing it out, each mixed second partial derivative appears twice with opposite signs, so everything cancels."},{"prompt":"div of F = (2x, 3y, 0)?","answer":"5","tier":1,"why":"Add each component's derivative with respect to its own variable: ∂(2x)/∂x + ∂(3y)/∂y + ∂(0)/∂z = 2 + 3 + 0 = 5."},{"prompt":"div of F = (x², yz, z) at (1, 1, 1)?","answer":"4","tier":3,"why":"div F = ∂(x²)/∂x + ∂(yz)/∂y + ∂z/∂z = 2x + z + 1. At (1, 1, 1) that is 2 + 1 + 1 = 4."},{"prompt":"curl of F = (−y, x, 0) is","choices":["(0, 0, 2)","(0, 0, 0)","(0, 0, −2)"],"answer":"(0, 0, 2)","tier":3,"why":"The z-component of curl is ∂Q/∂x − ∂P/∂y = ∂(x)/∂x − ∂(−y)/∂y = 1 − (−1) = 2; the other components are 0 since nothing depends on z. The field spins counterclockwise, so the sign is positive."}]},"sightPaceSeconds":15},{"id":"c3-stokes","stage":"calc3","part":3,"title":"Green, Stokes and divergence theorems","summary":"Each relates an integral over a region to one over its boundary.","prerequisites":["c3-vector-fields","c3-multiple"],"lesson":{"explanation":"Each relates an integral over a region to one over its boundary.","example":"∮ F·dr = ∬ (curl F)·n dS","approaches":{"show":"Draw a region in the plane with its boundary curve arrowed counterclockwise. Say: Green's theorem trades the line integral around the edge for a double integral of ∂Q/∂x − ∂P/∂y over the inside; Stokes and divergence do the same in three dimensions.","together":"Use Green's theorem on F = (−y, x) around the unit circle together. Ask: What is ∂Q/∂x − ∂P/∂y? What is the area of the unit disk? Then multiply to get 2π together.","alone":"Have them find the flux of F = (x, y, z) out of the unit cube alone (answer 3). Hint if stuck: by the divergence theorem, integrate div F over the cube's volume."}},"practice":{"items":[{"prompt":"The divergence theorem relates a flux through a closed surface to…","choices":["a volume integral of div F","a line integral","curl F on the surface"],"answer":"a volume integral of div F","tier":2,"why":"The divergence theorem says the outward flux through a closed surface equals the triple integral of div F over the solid inside: total spreading inside equals total flow out."},{"prompt":"Green's theorem is the planar case of…","choices":["Stokes' theorem","the divergence theorem","the chain rule"],"answer":"Stokes' theorem","tier":2,"why":"Green's theorem is Stokes' theorem for a flat region in the plane: the surface is the region itself, and curl F · n becomes ∂Q/∂x − ∂P/∂y."},{"prompt":"Green's theorem relates a line integral around a closed curve to…","choices":["a double integral over the region inside","a triple integral","a derivative at one point"],"answer":"a double integral over the region inside","tier":1,"why":"Green's theorem: ∮ P dx + Q dy around a closed curve equals the double integral of (∂Q/∂x − ∂P/∂y) over the flat region it encloses."},{"prompt":"Stokes' theorem relates the surface integral of curl F to…","choices":["a line integral around the surface's boundary","a volume integral","a single point value"],"answer":"a line integral around the surface's boundary","tier":1,"why":"Stokes' theorem: the flux of curl F through a surface equals the circulation ∮ F·dr around that surface's boundary curve. Only the edge matters."},{"prompt":"F = (−y, x). By Green's theorem, ∮ F·dr around the unit circle =","choices":["2π","π","0"],"answer":"2π","tier":3,"why":"Green gives ∬ (∂Q/∂x − ∂P/∂y) dA = ∬ (1 − (−1)) dA = 2 × (area of the unit disk) = 2 × π = 2π. π is tempting, but it forgets the factor 2."},{"prompt":"F = (x, y, z). Flux out of the unit cube by the divergence theorem?","answer":"3","tier":3,"why":"div F = 1 + 1 + 1 = 3 everywhere, so the flux equals 3 × the cube's volume = 3 × 1 = 3."}]},"sightPaceSeconds":20},{"id":"la-matrices","stage":"linalg","part":1,"title":"Matrix operations","summary":"An m×n matrix times an n×p matrix is m×p.","prerequisites":["g7-integer-mult"],"lesson":{"explanation":"An m×n matrix times an n×p matrix is m×p. Matrix multiplication is not commutative.","example":"(2×3)(3×4) = 2×4","approaches":{"show":"Write a 2×3 matrix next to a 3×4 matrix and circle the inner 3s to show they must match and the outer 2 and 4 give the size 2×4. Then compute one entry by sliding row 1 across column 1.","together":"Multiply [[1, 2], [3, 4]] by [[5, 6], [7, 8]] together, one entry at a time. Ask: Which row and column give the top-left entry? What is 1·5 + 2·7? Then fill the rest in turns to get [[19, 22], [43, 50]].","alone":"Have them decide alone whether a 3×2 matrix times a 3×2 matrix is defined (answer: not defined). Hint if stuck: compare the number of columns of the first with the number of rows of the second."}},"practice":{"items":[{"prompt":"A 2×3 matrix times a 3×4 matrix is","choices":["2×4","3×3","not defined"],"answer":"2×4","tier":1,"why":"The inner sizes match (3 and 3), so the product is defined, and the result takes the outer sizes: 2 rows and 4 columns, 2×4."},{"prompt":"Is AB = BA always?","choices":["No","Yes"],"answer":"No","tier":2,"why":"Matrix multiplication is not commutative. For example, if A is 2×3 and B is 3×2, AB is 2×2 but BA is 3×3. Even square matrices usually give AB ≠ BA."},{"prompt":"The identity matrix I satisfies","choices":["AI = A","AI = 0","AI = I"],"answer":"AI = A","tier":1,"why":"The identity matrix has 1s on the diagonal and 0s elsewhere, so multiplying by it leaves any matrix unchanged: AI = A, just like multiplying a number by 1."},{"prompt":"A 3×2 matrix times a 3×2 matrix is","choices":["not defined","3×2","2×3"],"answer":"not defined","tier":2,"why":"To multiply, the first matrix's columns (2) must equal the second's rows (3). Since 2 ≠ 3, the product is not defined."},{"prompt":"[[1, 2], [3, 4]] × [[1, 0], [0, 2]] =","choices":["[[1, 4], [3, 8]]","[[1, 2], [6, 8]]","[[1, 0], [0, 8]]"],"answer":"[[1, 4], [3, 8]]","tier":3,"why":"Each entry is a row times a column. Row (1, 2) times columns (1, 0) and (0, 2) gives 1 and 4; row (3, 4) gives 3 and 8. Multiplying on the right by this diagonal matrix doubles the second column."},{"prompt":"Row 1, column 1 entry of [[1, 2], [3, 4]] × [[5, 6], [7, 8]]?","answer":"19","tier":3,"why":"Take row 1 of the first matrix, (1, 2), times column 1 of the second, (5, 7): 1 × 5 + 2 × 7 = 5 + 14 = 19."}]},"sightPaceSeconds":12},{"id":"la-det","stage":"linalg","part":1,"title":"Determinants","summary":"det [[a, b], [c, d]] = ad − bc.","prerequisites":["la-matrices"],"lesson":{"explanation":"det [[a, b], [c, d]] = ad − bc. A matrix is invertible iff its determinant is nonzero.","example":"det [[2, 1], [3, 4]] = 5","approaches":{"show":"Write [[2, 1], [3, 4]] and draw an arrow down the main diagonal (2·4 = 8) and up the other (1·3 = 3). Show det = 8 − 3 = 5, and that a nonzero determinant means the matrix has an inverse.","together":"Compute det [[5, 2], [3, 1]] together. Ask: What is the product down the main diagonal? The other diagonal? Then subtract 5 − 6 = −1 together.","alone":"Have them compute det [[4, 6], [2, 3]] alone (answer 0). Hint if stuck: ad − bc is 12 − 12."}},"practice":{"generator":"det2"},"sightPaceSeconds":12},{"id":"la-systems","stage":"linalg","part":1,"title":"Solving linear systems","summary":"Row-reduce the augmented matrix.","prerequisites":["la-matrices","alg1-systems"],"lesson":{"explanation":"Row-reduce the augmented matrix. A system has 0, 1 or infinitely many solutions.","example":"Rank = number of pivots","approaches":{"show":"Write x + y = 5 and x − y = 1 as the augmented matrix [[1, 1 | 5], [1, −1 | 1]]. Subtract row 1 from row 2 to get −2y = −4, so y = 2 and x = 3, and point out the two pivots.","together":"Solve x + 2y = 7, 3x − y = 7 together. Ask: Which row operation clears x from the second row? What is y then? Then substitute back together to get x = 3, y = 2.","alone":"Have them decide alone how many solutions a system has if row reduction gives the row [0 0 | 4] (answer: none). Hint if stuck: read that row as the equation 0 = 4."}},"practice":{"items":[{"prompt":"A linear system can have exactly how many solutions?","choices":["0, 1 or infinitely many","any finite number","always exactly 1"],"answer":"0, 1 or infinitely many","tier":1,"why":"Each equation is a line, plane or flat piece. They can miss each other (0 solutions), meet once (1), or overlap along a line or more (infinitely many). If two solutions exist, every point between them on the line through them also works, so 2 or 3 is impossible."},{"prompt":"If det A ≠ 0, Ax = b has","choices":["exactly one solution","no solution","infinitely many"],"answer":"exactly one solution","tier":2,"why":"A nonzero determinant means A is invertible, so x = A⁻¹b is the one and only solution."},{"prompt":"Solve x + y = 5, x − y = 1. x = ?","answer":"3","tier":1,"why":"Add the equations: (x + y) + (x − y) = 5 + 1, so 2x = 6 and x = 3. Check: y = 2, and 3 − 2 = 1."},{"prompt":"Row reduction gives the row [0 0 0 | 4]. The system has","choices":["no solution","exactly one solution","infinitely many solutions"],"answer":"no solution","tier":2,"why":"That row says 0x + 0y + 0z = 4, which is 0 = 4, impossible. So no choice of variables works: no solution."},{"prompt":"Solve x + 2y = 7, 3x − y = 7. y = ?","answer":"2","tier":3,"why":"From the second equation, x = (7 + y)/3. Easier: multiply the second by 2 to get 6x − 2y = 14 and add the first: 7x = 21, x = 3. Then 3 + 2y = 7 gives y = 2."},{"prompt":"3 equations, 3 unknowns, rank 2, consistent. How many free variables?","answer":"1","tier":3,"why":"Free variables = unknowns − rank = 3 − 2 = 1. Since it is consistent, there are infinitely many solutions with one free parameter."}]},"sightPaceSeconds":15},{"id":"la-vector-spaces","stage":"linalg","part":2,"title":"Vector spaces, basis, dimension","summary":"A basis is a linearly independent spanning set; every basis has the same size (the dimension).","prerequisites":["la-systems"],"lesson":{"explanation":"A basis is a linearly independent spanning set; every basis has the same size (the dimension).","example":"dim ℝ³ = 3","approaches":{"show":"Show that (1, 0, 0), (0, 1, 0), (0, 0, 1) build any vector, such as (2, −1, 5) = 2(1, 0, 0) − 1(0, 1, 0) + 5(0, 0, 1). Say: three vectors, none redundant, so the dimension of ℝ³ is 3.","together":"Find the dimension of polynomials of degree at most 3 together. Ask: What is the simplest list that builds any such polynomial? Are 1, x, x², x³ independent? Then count them to get 4.","alone":"Have them find the nullity of a 4×6 matrix with rank 3 alone (answer 3). Hint if stuck: rank plus nullity equals the number of columns."}},"practice":{"items":[{"prompt":"Dimension of ℝ⁵?","answer":"5","tier":1,"why":"ℝ⁵ has the standard basis of 5 vectors (one 1 in each position), so its dimension is 5."},{"prompt":"Dimension of polynomials of degree ≤ 3?","answer":"4","tier":2,"why":"A basis is 1, x, x², x³: four polynomials. So the dimension is 4, one more than the degree. 3 is the tempting wrong answer."},{"prompt":"Rank + nullity of an m×n matrix =","choices":["n","m","m + n"],"answer":"n","tier":3,"why":"Rank–nullity: rank (dimension of the image) + nullity (dimension of the kernel) = n, the number of columns, since each column variable is either a pivot or free."},{"prompt":"How many vectors are in a basis of ℝ³?","answer":"3","tier":1,"why":"Every basis of ℝ³ has exactly 3 vectors, for example (1, 0, 0), (0, 1, 0), (0, 0, 1). That number is the dimension."},{"prompt":"Are (1, 2) and (2, 4) linearly independent?","choices":["No","Yes"],"answer":"No","tier":2,"why":"(2, 4) = 2 × (1, 2), so one is a multiple of the other. They lie on the same line, so they are dependent."},{"prompt":"A 4×6 matrix has rank 3. Nullity?","answer":"3","tier":3,"why":"Nullity = columns − rank = 6 − 3 = 3, by rank–nullity."}]},"sightPaceSeconds":15},{"id":"la-eigen","stage":"linalg","part":2,"title":"Eigenvalues and eigenvectors","summary":"Av = λv.","prerequisites":["la-det"],"lesson":{"explanation":"Av = λv. Eigenvalues solve det(A − λI) = 0. Triangular matrices show them on the diagonal.","example":"[[2, 1], [0, 5]] → 2 and 5","approaches":{"show":"Multiply [[2, 1], [0, 5]] by (1, 0) to get (2, 0), which is 2 times (1, 0). Say: this vector only stretched, so 2 is an eigenvalue; for triangular matrices the eigenvalues sit on the diagonal, 2 and 5.","together":"Find the eigenvalues of [[4, 1], [2, 3]] together. Ask: What is det(A − λI)? How does λ² − 7λ + 10 factor? Then name the roots 2 and 5 together.","alone":"Have them find the eigenvalues of [[3, 0], [4, −1]] alone (answer 3 and −1). Hint if stuck: the matrix is triangular, so look at the diagonal."}},"practice":{"generator":"eigenTriangular"},"sightPaceSeconds":12},{"id":"la-orthogonality","stage":"linalg","part":3,"title":"Orthogonality and inner products","summary":"Orthogonal vectors have inner product 0.","prerequisites":["la-vector-spaces","pc-vectors"],"lesson":{"explanation":"Orthogonal vectors have inner product 0. Gram–Schmidt builds an orthonormal basis; projections minimize distance.","example":"(1, 0)·(0, 1) = 0","approaches":{"show":"Draw (2, 1) and (−1, 2) on graph paper and show they meet at a right angle. Compute (2)(−1) + (1)(2) = 0 to confirm, then drop a perpendicular from (2, 3) onto the x-axis to show its projection (2, 0).","together":"Check whether (1, 2) and (3, 4) are orthogonal together. Ask: What is the dot product? Is 11 zero? Then find the length of (3, 4) together as √(9 + 16) = 5.","alone":"Have them decide alone whether (2, 1) and (−1, 2) are orthogonal (answer yes). Hint if stuck: multiply matching entries and add."}},"practice":{"items":[{"prompt":"A real symmetric matrix has","choices":["real eigenvalues and orthogonal eigenvectors","only complex eigenvalues","no eigenvalues"],"answer":"real eigenvalues and orthogonal eigenvectors","tier":3,"why":"The spectral theorem: a real symmetric matrix has only real eigenvalues, and eigenvectors for different eigenvalues are orthogonal, so it can be diagonalized by an orthogonal matrix."},{"prompt":"An orthogonal matrix Q satisfies","choices":["QᵀQ = I","Q² = I","det Q = 0"],"answer":"QᵀQ = I","tier":2,"why":"An orthogonal matrix has orthonormal columns, so each column dotted with itself is 1 and with any other column is 0. That is exactly QᵀQ = I. Q² = I describes reflections, not all orthogonal matrices."},{"prompt":"(1, 2)·(3, 4) = ?","answer":"11","tier":1,"why":"Multiply matching entries and add: 1 × 3 + 2 × 4 = 3 + 8 = 11."},{"prompt":"Are (2, 1) and (−1, 2) orthogonal?","choices":["Yes","No"],"answer":"Yes","tier":1,"why":"Their dot product is 2 × (−1) + 1 × 2 = −2 + 2 = 0, so they are orthogonal (perpendicular)."},{"prompt":"Length of (3, 4)?","answer":"5","tier":2,"why":"Length = √(3² + 4²) = √(9 + 16) = √25 = 5."},{"prompt":"Projection of (2, 3) onto (1, 0) is","choices":["(2, 0)","(0, 3)","(2, 3)"],"answer":"(2, 0)","tier":3,"why":"Projection onto u = (v·u / u·u) u = (2/1)(1, 0) = (2, 0). Projecting onto the x-axis keeps the x-part and drops the y-part."}]},"sightPaceSeconds":15},{"id":"la-svd","stage":"linalg","part":3,"title":"Diagonalization and SVD (singular value decomposition)","summary":"A = PDP⁻¹ when there are n independent eigenvectors.","prerequisites":["la-eigen","la-orthogonality"],"lesson":{"explanation":"A = PDP⁻¹ when there are n independent eigenvectors. Every matrix has an SVD A = UΣVᵀ.","example":"Singular values are √eigenvalues of AᵀA","approaches":{"show":"Write A = PDP⁻¹ for A = [[2, 1], [0, 5]] with eigenvalues 2 and 5 on the diagonal of D. Then show [[3, 0], [0, −4]]: AᵀA = [[9, 0], [0, 16]], so its singular values are 3 and 4.","together":"Find the singular values of [[0, 2], [1, 0]] together. Ask: What is AᵀA? What are its eigenvalues? Then take square roots together to get 2 and 1.","alone":"Have them find the singular values of [[3, 0], [0, −4]] alone (answer 4 and 3). Hint if stuck: singular values are never negative; take the absolute values of the diagonal entries."}},"practice":{"items":[{"prompt":"Every real matrix has a…","choices":["singular value decomposition","diagonalization","inverse"],"answer":"singular value decomposition","tier":2,"why":"Every real matrix, even rectangular or singular, has an SVD A = UΣVᵀ. Diagonalization needs enough independent eigenvectors, and an inverse needs a square matrix with nonzero determinant."},{"prompt":"Singular values of A are square roots of eigenvalues of","choices":["AᵀA","A + Aᵀ","A²"],"answer":"AᵀA","tier":2,"why":"The singular values are √(eigenvalues of AᵀA). AᵀA is symmetric with eigenvalues ≥ 0, so these square roots are real."},{"prompt":"In A = PDP⁻¹, the matrix D is","choices":["diagonal","orthogonal","zero"],"answer":"diagonal","tier":1,"why":"In A = PDP⁻¹, D is diagonal with the eigenvalues on its diagonal, and the columns of P are the matching eigenvectors."},{"prompt":"In A = UΣVᵀ, the singular values sit in","choices":["Σ","U","Vᵀ"],"answer":"Σ","tier":1,"why":"In the SVD, U and V are orthogonal (rotations or reflections), and Σ is the diagonal stretch matrix holding the singular values."},{"prompt":"Singular values of [[3, 0], [0, −4]]","choices":["4 and 3","3 and −4","9 and 16"],"answer":"4 and 3","tier":3,"why":"AᵀA = [[9, 0], [0, 16]], with eigenvalues 9 and 16, so the singular values are √16 = 4 and √9 = 3. Singular values are never negative, so −4 is wrong; 9 and 16 forget the square root."},{"prompt":"A 3×3 matrix with only 2 independent eigenvectors is","choices":["not diagonalizable","diagonalizable","always symmetric"],"answer":"not diagonalizable","tier":3,"why":"Diagonalizing a 3×3 matrix needs 3 independent eigenvectors to fill P. With only 2 there are not enough, so it is not diagonalizable."}]},"sightPaceSeconds":20},{"id":"de-separable","stage":"diffeq","part":1,"title":"Separable equations","summary":"Write dy/dx = g(x)h(y), separate, integrate both sides.","prerequisites":["c2-substitution"],"lesson":{"explanation":"Write dy/dx = g(x)h(y), separate, integrate both sides.","example":"dy/dx = ky → y = Ceᵏˣ","approaches":{"show":"Write dy/dx = ky and move terms: dy/y = k dx. Integrate both sides to get ln|y| = kx + C, then exponentiate to show y = Ce^(kx), the growth of a bank balance or bacteria.","together":"Solve dy/dx = 3y with y(0) = 2 together. Ask: How do you separate y and x? What do both sides integrate to? What does y(0) = 2 tell you about C? Then write y = 2e³ˣ together.","alone":"Have them solve dy/dx = y with y(0) = 5 and find y(ln 2) alone (answer 10). Hint if stuck: the solution is y = 5eˣ, and e^(ln 2) = 2."}},"practice":{"items":[{"prompt":"Solution of dy/dx = ky:","choices":["y = Ceᵏˣ","y = kx + C","y = Cxᵏ"],"answer":"y = Ceᵏˣ","tier":2,"why":"Separate: dy/y = k dx. Integrate: ln|y| = kx + c. Exponentiate: y = Ceᵏˣ. The rate of change is proportional to y itself, which means exponential growth or decay."},{"prompt":"dy/dx = 2x has solution","choices":["y = x² + C","y = 2x + C","y = e²ˣ"],"answer":"y = x² + C","tier":1,"why":"Integrate both sides: y = ∫2x dx = x² + C. Check: the derivative of x² + C is 2x."},{"prompt":"dy/dx = cos x has solution","choices":["y = sin x + C","y = −sin x + C","y = cos x + C"],"answer":"y = sin x + C","tier":1,"why":"Integrate: y = ∫cos x dx = sin x + C, because the derivative of sin x is cos x. (−sin x would give a derivative of −cos x.)"},{"prompt":"dy/dx = 3y, y(0) = 2. Solution:","choices":["y = 2e³ˣ","y = 3e²ˣ","y = e³ˣ + 1"],"answer":"y = 2e³ˣ","tier":2,"why":"dy/dx = 3y gives y = Ce³ˣ. Then y(0) = C = 2, so y = 2e³ˣ."},{"prompt":"dy/dx = xy, y(0) = 1. Solution:","choices":["y = e^(x²/2)","y = eˣ","y = x²/2 + 1"],"answer":"y = e^(x²/2)","tier":3,"why":"Separate: dy/y = x dx, so ln y = x²/2 + c and y = Ce^(x²/2). Then y(0) = C = 1, giving y = e^(x²/2)."},{"prompt":"dy/dx = y, y(0) = 5. y(ln 2) = ?","answer":"10","tier":3,"why":"y = 5eˣ, since y(0) = 5. Then y(ln 2) = 5e^(ln 2) = 5 × 2 = 10."}]},"sightPaceSeconds":20},{"id":"de-linear","stage":"diffeq","part":1,"title":"First-order linear equations","summary":"y′ + p(x)y = q(x): multiply by the integrating factor e^∫p.","prerequisites":["de-separable"],"lesson":{"explanation":"y′ + p(x)y = q(x): multiply by the integrating factor e^∫p.","example":"y′ + y = 0 → y = Ce⁻ˣ","approaches":{"show":"Write y′ + y = 0 and multiply both sides by eˣ. Show the left side becomes (eˣ y)′, so eˣ y = C and y = Ce⁻ˣ.","together":"Solve y′ + y = 1 with y(0) = 0 together. Ask: What is p(x)? What is the integrating factor? What is ∫ eˣ dx? Then use y(0) = 0 to reach y = 1 − e⁻ˣ together.","alone":"Have them find the integrating factor for y′ + 3y = x alone (answer e³ˣ). Hint if stuck: p(x) = 3, so integrate 3 and raise e to that power."}},"practice":{"items":[{"prompt":"The integrating factor for y′ + p(x)y = q(x) is","choices":["e^∫p(x)dx","∫p(x)dx","p(x)"],"answer":"e^∫p(x)dx","tier":1,"why":"Multiplying by μ = e^∫p(x)dx makes the left side μy′ + μpy, which is exactly (μy)′ by the product rule, so you can integrate directly."},{"prompt":"Solution of y′ + y = 0:","choices":["y = Ce⁻ˣ","y = Ceˣ","y = Cx"],"answer":"y = Ce⁻ˣ","tier":2,"why":"Here p = 1 and q = 0. This is also separable: dy/y = −dx, so ln|y| = −x + c and y = Ce⁻ˣ. Check: −Ce⁻ˣ + Ce⁻ˣ = 0."},{"prompt":"For y′ + 2y = 4, p(x) is","choices":["2","4","y"],"answer":"2","tier":1,"why":"Match the form y′ + p(x)y = q(x): the coefficient of y is 2, so p(x) = 2. The 4 is q(x)."},{"prompt":"Integrating factor for y′ + 3y = x:","choices":["e³ˣ","3x","e^(x³)"],"answer":"e³ˣ","tier":2,"why":"p(x) = 3, so the integrating factor is e^∫3 dx = e³ˣ."},{"prompt":"y′ + y = 1, y(0) = 0. Solution:","choices":["y = 1 − e⁻ˣ","y = e⁻ˣ","y = 1 + e⁻ˣ"],"answer":"y = 1 − e⁻ˣ","tier":3,"why":"The steady solution is y = 1, plus Ce⁻ˣ from the homogeneous part: y = 1 + Ce⁻ˣ. Then y(0) = 1 + C = 0 gives C = −1, so y = 1 − e⁻ˣ."},{"prompt":"y′ + 2y = 6. The value y settles to as x grows?","answer":"3","tier":3,"why":"The solution is y = 3 + Ce⁻²ˣ, and Ce⁻²ˣ dies away as x grows, leaving 3. Or set y′ = 0: 2y = 6, so y = 3."}]},"sightPaceSeconds":20},{"id":"de-second-order","stage":"diffeq","part":2,"title":"Second-order linear equations","summary":"For ay″ + by′ + cy = 0 solve ar² + br + c = 0; complex roots give sines and cosines.","prerequisites":["de-linear","alg1-quadformula"],"lesson":{"explanation":"For ay″ + by′ + cy = 0 solve ar² + br + c = 0; complex roots give sines and cosines.","example":"y″ + y = 0 → y = A cos x + B sin x","approaches":{"show":"Write y″ − 5y′ + 6y = 0 and guess y = e^(rx) to get r² − 5r + 6 = 0, roots 2 and 3, so y = Ae²ˣ + Be³ˣ. Then show y″ + y = 0 gives r = ±i and the solution A cos x + B sin x.","together":"Solve y″ + 4y = 0 together. Ask: What is the characteristic equation? What are the roots of r² + 4 = 0? What do roots ±2i turn into? Then write A cos 2x + B sin 2x together.","alone":"Have them solve y″ − y = 0 alone (answer Aeˣ + Be⁻ˣ). Hint if stuck: the characteristic equation is r² − 1 = 0."}},"practice":{"items":[{"prompt":"General solution of y″ + y = 0:","choices":["A cos x + B sin x","Aeˣ + Be⁻ˣ","Ax + B"],"answer":"A cos x + B sin x","tier":2,"why":"The characteristic equation r² + 1 = 0 gives r = ±i. Complex roots 0 ± 1i give cos x and sin x, so y = A cos x + B sin x."},{"prompt":"y″ − y = 0 has solutions","choices":["Aeˣ + Be⁻ˣ","A cos x + B sin x","Ax + B"],"answer":"Aeˣ + Be⁻ˣ","tier":2,"why":"The characteristic equation r² − 1 = 0 gives r = 1 and r = −1, two real roots, so y = Aeˣ + Be⁻ˣ."},{"prompt":"The characteristic equation of y″ − 5y′ + 6y = 0 is","choices":["r² − 5r + 6 = 0","r² + 5r + 6 = 0","r − 5 = 0"],"answer":"r² − 5r + 6 = 0","tier":1,"why":"Replace y″ with r², y′ with r, and y with 1: r² − 5r + 6 = 0. Signs and coefficients stay the same."},{"prompt":"Roots of r² − 5r + 6 = 0","choices":["2 and 3","−2 and −3","1 and 6"],"answer":"2 and 3","tier":1,"why":"Factor: r² − 5r + 6 = (r − 2)(r − 3), since 2 × 3 = 6 and 2 + 3 = 5. So r = 2 or 3."},{"prompt":"General solution of y″ + 4y = 0:","choices":["A cos 2x + B sin 2x","A cos 4x + B sin 4x","Ae²ˣ + Be⁻²ˣ"],"answer":"A cos 2x + B sin 2x","tier":3,"why":"r² + 4 = 0 gives r = ±2i, so y = A cos 2x + B sin 2x. The frequency is √4 = 2, not 4."},{"prompt":"General solution of y″ − 2y′ + y = 0:","choices":["(A + Bx)eˣ","Aeˣ + Be⁻ˣ","A cos x + B sin x"],"answer":"(A + Bx)eˣ","tier":3,"why":"r² − 2r + 1 = (r − 1)² = 0 has the repeated root r = 1. A repeated root gives eˣ and xeˣ, so y = (A + Bx)eˣ."}]},"sightPaceSeconds":20},{"id":"de-laplace","stage":"diffeq","part":2,"title":"Laplace transforms","summary":"ℒ{f}(s) = ∫₀^∞ e⁻ˢᵗ f(t) dt turns ODEs into algebra.","prerequisites":["de-second-order","c2-parts"],"lesson":{"explanation":"ℒ{f}(s) = ∫₀^∞ e⁻ˢᵗ f(t) dt turns ODEs into algebra.","example":"ℒ{1} = 1/s","approaches":{"show":"Compute ℒ{1} from the definition on paper: ∫ from 0 to ∞ of e^(−st) dt = 1/s. Then show how ℒ{f′} = sF(s) − f(0) turns y′ + y = 0, y(0) = 1 into the algebra sY − 1 + Y = 0.","together":"Find ℒ{e^(2t)} together. Ask: What is e^(−st) times e^(2t)? What do you get integrating e^(−(s − 2)t) from 0 to ∞? Then agree on 1/(s − 2).","alone":"Have them find ℒ{t} alone (answer 1/s²). Hint if stuck: integrate t e^(−st) by parts, or use ℒ{tⁿ} = n!/sⁿ⁺¹."}},"practice":{"items":[{"prompt":"ℒ{1} =","choices":["1/s","s","1"],"answer":"1/s","tier":1,"why":"ℒ{1} = ∫₀^∞ e⁻ˢᵗ dt = [−e⁻ˢᵗ/s] from 0 to ∞ = 0 − (−1/s) = 1/s, for s > 0."},{"prompt":"ℒ{eᵃᵗ} =","choices":["1/(s − a)","1/(s + a)","a/s"],"answer":"1/(s − a)","tier":2,"why":"ℒ{eᵃᵗ} = ∫₀^∞ e⁻⁽ˢ⁻ᵃ⁾ᵗ dt = 1/(s − a), for s > a. It is ℒ{1} = 1/s with s shifted to s − a."},{"prompt":"ℒ{f′} =","choices":["sF(s) − f(0)","F(s)/s","sF(s)"],"answer":"sF(s) − f(0)","tier":3,"why":"Integrate by parts: ∫₀^∞ e⁻ˢᵗ f′(t) dt = [e⁻ˢᵗ f(t)] from 0 to ∞ + s∫₀^∞ e⁻ˢᵗ f(t) dt = −f(0) + sF(s). Don't forget the initial value f(0)."},{"prompt":"Laplace transforms turn differential equations into…","choices":["algebra problems","harder integrals","geometry problems"],"answer":"algebra problems","tier":1,"why":"Derivatives become multiplication by s (plus initial values), so a differential equation becomes an algebra equation for F(s). Solve it, then transform back."},{"prompt":"ℒ{t} =","choices":["1/s²","1/s","s"],"answer":"1/s²","tier":2,"why":"Integrate by parts: ℒ{t} = (1/s) ℒ{1} = (1/s)(1/s) = 1/s². In general ℒ{tⁿ} = n!/sⁿ⁺¹."},{"prompt":"ℒ{sin t} =","choices":["1/(s² + 1)","s/(s² + 1)","1/(s − 1)"],"answer":"1/(s² + 1)","tier":3,"why":"ℒ{sin at} = a/(s² + a²); with a = 1 that is 1/(s² + 1). The choice s/(s² + 1) is the transform of cos t."}]},"sightPaceSeconds":20},{"id":"de-systems","stage":"diffeq","part":3,"title":"Systems of ODEs","summary":"x′ = Ax is solved with eigenvalues of A; their signs decide stability.","prerequisites":["de-second-order","la-eigen"],"lesson":{"explanation":"x′ = Ax is solved with eigenvalues of A; their signs decide stability.","example":"All eigenvalues negative → stable","approaches":{"show":"Sketch phase portraits for x′ = Ax with A = [[−1, 0], [0, −3]] (arrows flowing into the origin) and A = [[2, 0], [0, 5]] (arrows flowing out). Say: the signs of the eigenvalues decide which way the arrows go.","together":"Classify A = [[1, 0], [0, −2]] together. Ask: What are the eigenvalues? Do they have the same sign? What does one positive and one negative eigenvalue make? Then agree it is a saddle.","alone":"Have them classify eigenvalues −1 ± 2i alone (answer: stable spiral). Hint if stuck: the imaginary part makes it spin, and the real part's sign says in or out."}},"practice":{"items":[{"prompt":"x′ = Ax is asymptotically stable when all eigenvalues have","choices":["negative real part","positive real part","zero real part"],"answer":"negative real part","tier":2,"why":"Solutions are built from e^(λt). If every eigenvalue λ has negative real part, every term decays to 0, so all solutions approach the origin."},{"prompt":"Purely imaginary eigenvalues give a…","choices":["center (closed orbits)","stable node","saddle"],"answer":"center (closed orbits)","tier":2,"why":"λ = ±bi gives e^(±ibt), which is cos bt and sin bt: pure oscillation with no growth or decay, so solutions travel on closed orbits around a center."},{"prompt":"x′ = Ax with eigenvalues −1 and −3. The origin is","choices":["stable","unstable"],"answer":"stable","tier":1,"why":"Both eigenvalues are negative, so both e⁻ᵗ and e⁻³ᵗ decay to 0. Every solution moves into the origin: stable (a stable node)."},{"prompt":"x′ = Ax with eigenvalues 2 and 5. The origin is","choices":["unstable","stable"],"answer":"unstable","tier":1,"why":"Both eigenvalues are positive, so e²ᵗ and e⁵ᵗ grow without bound. Solutions move away from the origin: unstable."},{"prompt":"Eigenvalues −2 and 3 give a…","choices":["saddle","stable node","center"],"answer":"saddle","tier":3,"why":"One negative eigenvalue (pulls in along one direction) and one positive (pushes out along another) gives a saddle. It is unstable, because almost every solution escapes."},{"prompt":"Eigenvalues −1 ± 2i give a…","choices":["stable spiral","unstable spiral","center"],"answer":"stable spiral","tier":3,"why":"The imaginary part ±2i makes solutions rotate, and the real part −1 makes them shrink like e⁻ᵗ. Rotating while shrinking is a stable spiral."}]},"sightPaceSeconds":20},{"id":"dm-logic","stage":"discrete","part":1,"title":"Logic","summary":"Statements combine with and, or, not, implies.","prerequisites":["geo-proof"],"lesson":{"explanation":"Statements combine with and, or, not, implies. p → q is false only when p is true and q is false.","example":"¬(p ∧ q) ≡ ¬p ∨ ¬q","approaches":{"show":"Fill in a truth table for p → q using the promise: if it rains (p), I bring an umbrella (q). Show the only broken promise is rain with no umbrella, the row p true, q false.","together":"Negate 'every student passed' together. Ask: What would show the statement is wrong? Is one failing student enough? Then write it as: there exists a student who did not pass.","alone":"Have them write the contrapositive of p → q alone (answer ¬q → ¬p). Hint if stuck: swap the two parts and negate both."}},"practice":{"items":[{"prompt":"p → q is false when","choices":["p true, q false","p false, q true","both false"],"answer":"p true, q false","tier":1,"why":"An implication is a promise: if p then q. It is broken only when p happens (true) and q does not (false). When p is false the promise is not broken, so it counts as true."},{"prompt":"¬(p ∧ q) is equivalent to","choices":["¬p ∨ ¬q","¬p ∧ ¬q","p ∨ q"],"answer":"¬p ∨ ¬q","tier":2,"why":"De Morgan's law: 'not (p and q)' means at least one of them fails, which is ¬p ∨ ¬q. The choice ¬p ∧ ¬q is too strong; it says both fail."},{"prompt":"The negation of 'for all x, P(x)' is","choices":["there exists x with not P(x)","for all x, not P(x)","there is no x"],"answer":"there exists x with not P(x)","tier":3,"why":"To deny 'every x has P', you only need one x that fails: there exists x with not P(x). 'For all x, not P(x)' is too strong."},{"prompt":"p ∧ q is true when","choices":["both p and q are true","at least one is true","neither is true"],"answer":"both p and q are true","tier":1,"why":"'And' is true only when both parts are true. If either p or q is false, p ∧ q is false."},{"prompt":"The contrapositive of p → q is","choices":["¬q → ¬p","q → p","¬p → ¬q"],"answer":"¬q → ¬p","tier":2,"why":"The contrapositive flips and negates: ¬q → ¬p. It is always equivalent to p → q. The choice q → p is the converse, which is not equivalent."},{"prompt":"The negation of 'there exists x with P(x)' is","choices":["for all x, not P(x)","there exists x with not P(x)","for all x, P(x)"],"answer":"for all x, not P(x)","tier":3,"why":"To deny 'some x has P', you must say no x has P, which means every x fails: for all x, not P(x)."}]},"sightPaceSeconds":15},{"id":"dm-sets","stage":"discrete","part":1,"title":"Sets and functions","summary":"Union, intersection, complement.","prerequisites":["dm-logic"],"lesson":{"explanation":"Union, intersection, complement. A function is injective (one-to-one), surjective (onto) or both (bijective).","example":"|A ∪ B| = |A| + |B| − |A ∩ B|","approaches":{"show":"Draw a Venn diagram with A = {1, 2, 3, 4, 5} and B = {4, 5, 6, 7}. Count the union as 5 + 4 − 2 = 7, pointing out that 4 and 5 would otherwise be counted twice.","together":"Count the subsets of {a, b, c} together. Ask: Is a in or out? Is b in or out? Is c in or out? Then list all 8 together and connect it to 2³.","alone":"Have them count the functions from a 3-element set to a 2-element set alone (answer 8). Hint if stuck: each of the 3 inputs has 2 choices of output."}},"practice":{"items":[{"prompt":"|A| = 5, |B| = 4, |A ∩ B| = 2. |A ∪ B| = ?","answer":"7","tier":2,"why":"Adding |A| + |B| counts the shared elements twice, so subtract them once: 5 + 4 − 2 = 7."},{"prompt":"How ma
