 if stuck: only the tens change, 2 tens and 4 tens."}},"practice":{"items":[{"prompt":"34 + 20 = ?","answer":"54","tier":2,"why":"Only the tens change. 3 tens + 2 tens = 5 tens, and keep the 4 ones. So 34 + 20 = 54."},{"prompt":"47 + 30 = ?","answer":"77","tier":2,"why":"Only the tens change. 4 tens + 3 tens = 7 tens, and keep the 7 ones. So 47 + 30 = 77."},{"prompt":"15 + 60 = ?","answer":"75","tier":2,"why":"Only the tens change. 1 ten + 6 tens = 7 tens, and keep the 5 ones. So 15 + 60 = 75."},{"prompt":"52 + 40 = ?","answer":"92","tier":3,"why":"Only the tens change. 5 tens + 4 tens = 9 tens, and keep the 2 ones. So 52 + 40 = 92."},{"prompt":"28 + 50 = ?","answer":"78","tier":3,"why":"Only the tens change. 2 tens + 5 tens = 7 tens, and keep the 8 ones. So 28 + 50 = 78."},{"prompt":"61 + 30 = ?","answer":"91","tier":3,"why":"Only the tens change. 6 tens + 3 tens = 9 tens, and keep the 1 one. So 61 + 30 = 91."},{"prompt":"9 + 70 = ?","answer":"79","tier":1,"why":"9 has no tens, just 9 ones. 70 is 7 tens. Put them together: 7 tens and 9 ones is 79."},{"prompt":"13 + 10 = ?","answer":"23","tier":1,"why":"Adding 10 adds one more ten. 1 ten + 1 ten = 2 tens, keep the 3 ones. So 13 + 10 = 23."},{"prompt":"21 + 20 = ?","answer":"41","tier":1,"why":"Only the tens change. 2 tens + 2 tens = 4 tens, and keep the 1 one. So 21 + 20 = 41."}]},"reinforcement":"Mental math strategy for all larger numbers.","day":70,"subject":"Math","sightPaceSeconds":6},{"id":"r-syllables","stage":"q3","part":2,"title":"Syllables","summary":"Clap and read two-syllable words.","prerequisites":["r-compound"],"lesson":{"explanation":"A syllable is a beat with one vowel sound. Split long words into beats: rab-bit, nap-kin.","example":"rabbit, napkin, picnic","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Say 'rabbit' and clap twice: rab-bit. Write it and draw a line between the two b letters. Say: each beat has one vowel sound.","together":"Clap 'picnic' together. Ask: How many claps? Where does the word break? Read each part, pic and nic, then read the whole word together.","alone":"Have the child read 'basket' alone. Hint if stuck: cover the second part and read 'bas' first."}},"practice":{"items":[{"prompt":"Read aloud: rabbit, napkin, picnic","mode":"tutor","tier":2,"why":"Each word has two beats: rab-bit, nap-kin, pic-nic. Accept each word read as one smooth word, clapping or tapping two beats is a bonus."},{"prompt":"Read aloud: kitten, basket, pumpkin","mode":"tutor","tier":3,"why":"Each word has two beats: kit-ten, bas-ket, pump-kin. Accept each word read smoothly as one whole word."},{"prompt":"How many syllables in 'pumpkin'?","answer":"2","tier":2,"why":"Clap as you say it: pump-kin. That is two claps, so pumpkin has 2 syllables."},{"prompt":"How many syllables in 'cat'?","answer":"1","tier":1,"why":"Clap as you say cat. You only clap once, because it has one vowel sound. So cat has 1 syllable."},{"prompt":"How many syllables in 'dog'?","answer":"1","tier":1,"why":"Clap as you say dog. You only clap once, so dog has 1 syllable."},{"prompt":"How many syllables in 'rabbit'?","answer":"2","tier":2,"why":"Clap as you say it: rab-bit. That is two claps, so rabbit has 2 syllables."},{"prompt":"Which word has 2 syllables?","choices":["napkin","hat","sun"],"answer":"napkin","tier":3,"why":"Napkin has two beats: nap-kin. Hat and sun each have only one beat."}]},"reinforcement":"Decoding long words in grade 2.","day":71,"subject":"Reading","sightPaceSeconds":10},{"id":"m-sub-tens","stage":"q3","part":2,"title":"Subtract tens from two-digit numbers","summary":"Take away multiples of 10.","prerequisites":["m-add-2digit-tens"],"lesson":{"explanation":"Only the tens change: 75 − 30 → 7 tens − 3 tens = 4 tens, keep 5 ones → 45.","example":"68 − 40 = 28","tutorSteps":["Use a 120 chart: move up rows.","Use tens rods.","Practice."],"approaches":{"show":"Build 75 with 7 tens rods and 5 ones cubes. Take away 3 rods and say: 7 tens minus 3 tens is 4 tens, and the 5 ones stay. So 75 minus 30 is 45.","together":"Do 68 − 40 together on a 120 chart. Ask: Where is 68? Move up one row at a time, counting 58, 48, 38, 28. How many rows did we move? What number are we on?","alone":"Have them solve 83 − 50 alone. Hint if stuck: take 5 tens away from 8 tens and keep the 3 ones."}},"practice":{"items":[{"prompt":"75 − 30 = ?","answer":"45","tier":2,"why":"Only the tens change. 7 tens take away 3 tens is 4 tens, and keep the 5 ones. So 75 − 30 = 45."},{"prompt":"68 − 40 = ?","answer":"28","tier":2,"why":"Only the tens change. 6 tens take away 4 tens is 2 tens, and keep the 8 ones. So 68 − 40 = 28."},{"prompt":"92 − 50 = ?","answer":"42","tier":3,"why":"Only the tens change. 9 tens take away 5 tens is 4 tens, and keep the 2 ones. So 92 − 50 = 42."},{"prompt":"54 − 20 = ?","answer":"34","tier":2,"why":"Only the tens change. 5 tens take away 2 tens is 3 tens, and keep the 4 ones. So 54 − 20 = 34."},{"prompt":"81 − 60 = ?","answer":"21","tier":3,"why":"Only the tens change. 8 tens take away 6 tens is 2 tens, and keep the 1 one. So 81 − 60 = 21."},{"prompt":"47 − 10 = ?","answer":"37","tier":1,"why":"Taking away 10 takes away one ten. 4 tens become 3 tens, keep the 7 ones. So 47 − 10 = 37."},{"prompt":"99 − 90 = ?","answer":"9","tier":3,"why":"9 tens take away 9 tens leaves 0 tens. Only the 9 ones are left, so 99 − 90 = 9."},{"prompt":"25 − 10 = ?","answer":"15","tier":1,"why":"Taking away 10 takes away one ten. 2 tens become 1 ten, keep the 5 ones. So 25 − 10 = 15."},{"prompt":"36 − 10 = ?","answer":"26","tier":1,"why":"Taking away 10 takes away one ten. 3 tens become 2 tens, keep the 6 ones. So 36 − 10 = 26."}]},"reinforcement":"Leads to two-digit subtraction with regrouping.","day":72,"subject":"Math","sightPaceSeconds":6},{"id":"r-contractions","stage":"q3","part":2,"title":"Contractions","summary":"Read words like can't, I'm, it's.","prerequisites":["r-endings-s"],"lesson":{"explanation":"A contraction squeezes two words together; an apostrophe replaces the missing letters.","example":"do not → don't","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write 'do not' and then 'don't'. Cross out the o in 'not' and draw an apostrophe in its place. Read both and say: they mean the same thing.","together":"Make 'is not' into a contraction together. Ask: Which letter goes away? (the o) What mark takes its place? Then write isn't together and read it.","alone":"Have the child tell alone what 'can't' means. Hint if stuck: it is two words squeezed together, can and not."}},"practice":{"items":[{"prompt":"Read aloud: can't, don't, I'm","mode":"tutor","tier":1,"why":"Can't means can not, don't means do not, and I'm means I am. Accept each word read smoothly, saying the short form, not the two long words."},{"prompt":"Read aloud: it's, we're, isn't","mode":"tutor","tier":2,"why":"It's means it is, we're means we are, and isn't means is not. Accept each read smoothly as one word; we're sounds like weer, not like were."},{"prompt":"'is not' as a contraction:","choices":["isn't","is'nt","isnt"],"answer":"isn't","tier":3,"why":"Take out the o in not and put an apostrophe in its place: is not becomes isn't. The apostrophe goes where the o was, not before the n."},{"prompt":"What does 'I'm' mean?","choices":["I am","I will","I can"],"answer":"I am","tier":2,"why":"I'm is I and am squeezed together. The apostrophe takes the place of the letter a."},{"prompt":"What does 'don't' mean?","choices":["do not","did not"],"answer":"do not","tier":1,"why":"Don't is do and not squeezed together. The apostrophe takes the place of the o in not."},{"prompt":"Read aloud: I'm, can't","mode":"tutor","tier":1,"why":"Accept I'm read as one word meaning I am, and can't read as one word meaning can not."},{"prompt":"'we are' as a contraction:","choices":["we're","were","we'r"],"answer":"we're","tier":3,"why":"Take out the a in are and put an apostrophe there: we are becomes we're. Were without the apostrophe is a different word."}]},"reinforcement":"Writing dialogue later.","day":73,"subject":"Reading","sightPaceSeconds":10},{"id":"w-picture-sentence","stage":"q3","part":2,"title":"Write about a picture","summary":"Write two sentences about a picture.","prerequisites":["w-adjectives","w-spaces"],"lesson":{"explanation":"Look carefully. Tell who, what is happening, and one detail.","example":"The girl flies a kite. The kite is red.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Look at a picture of a girl flying a kite and think out loud: who is it, what is she doing, what detail do I see? Write: The girl flies a kite. The kite is red.","together":"Look at a picture of a dog in a park together. Ask: Who is in the picture? What is it doing? What color or size is something? Write the first sentence together; the child writes the second.","alone":"Have the child write two sentences about a picture of a cat on a bed alone. Hint if stuck: start with 'The cat'."}},"practice":{"items":[{"prompt":"Look at any picture book page. Write two sentences about it.","mode":"tutor","tier":3,"why":"Accept two complete sentences about the page, each starting with a capital letter and ending with a period, like: The dog runs. He has a red ball."},{"prompt":"Look at a picture. Tell who is in it out loud.","mode":"tutor","tier":1,"why":"Accept any answer that names who is in the picture, like: A girl and her dad. Pointing and naming each person or animal is enough."},{"prompt":"Look at a picture. Say one sentence about what is happening.","mode":"tutor","tier":1,"why":"Accept one full sentence that tells an action, like: The boy is kicking a ball. It should say who and what they are doing."},{"prompt":"Look at a picture. Write one sentence about who is in it.","mode":"tutor","tier":2,"why":"Accept one written sentence that names who is in the picture, like: There is a cat. It should start with a capital and end with a period."},{"prompt":"Look at a picture. Write one sentence with a describing word, like big or red.","mode":"tutor","tier":2,"why":"Accept one written sentence that uses a describing word, like: The big dog is brown. Check that the describing word fits the picture."},{"prompt":"Look at a family photo. Write two sentences: who is in it and one detail.","mode":"tutor","tier":3,"why":"Accept two sentences: one that tells who is in the photo and one that gives a detail, like: Mom and I are at the park. Mom has a blue hat."}]},"reinforcement":"Leads to paragraphs.","day":74,"subject":"Writing","sightPaceSeconds":60},{"id":"m-round-10","stage":"q3","part":3,"title":"Round to the nearest ten (challenge)","summary":"Round two-digit numbers to the nearest 10.","prerequisites":["m-place-value"],"lesson":{"explanation":"Look at the ones: 0–4 round down, 5–9 round up.","example":"47 → 50, 32 → 30, 65 → 70","tutorSteps":["Show the number on a number line between two tens.","Which ten is closer?","Practice."],"approaches":{"show":"Draw a number line from 40 to 50 and mark 47. Point out it is 3 steps from 50 and 7 steps from 40, so 47 rounds to 50. Say: the ones digit is 7, and 5 to 9 rounds up.","together":"Round 32 together. Ask: Which two tens is 32 between? (30 and 40) Look at the ones: is 2 in 0 to 4 or 5 to 9? So do we round down or up?","alone":"Have them round 65 to the nearest ten alone. Hint if stuck: 5 in the ones place rounds up."}},"practice":{"generator":"roundTen","params":{"max":100}},"reinforcement":"Estimating answers in every later grade.","day":75,"subject":"Math","sightPaceSeconds":6},{"id":"s-seasons","stage":"q3","part":3,"title":"Weather and seasons","summary":"Name the four seasons and weather.","prerequisites":["s-sky"],"lesson":{"explanation":"The four seasons are spring, summer, fall (autumn) and winter. Each has typical weather.","example":"Winter is the coldest season.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Show four pictures: a flower garden, a beach, falling leaves and snow. Name each season in order, spring, summer, fall, winter, and say one weather word for each: rainy, hot, cool, cold.","together":"Talk about winter together. Ask: What do we wear in winter? Is it hot or cold? What can fall from the sky? Then do the same for summer and compare.","alone":"Ask the child alone: which season is the hottest? Hint if stuck: think about when you go swimming outside."}},"practice":{"items":[{"prompt":"Which season is coldest?","choices":["Winter","Summer"],"answer":"Winter","tier":1,"why":"Winter has the coldest weather, with short days and sometimes snow. Summer is the hot season."},{"prompt":"How many seasons are there?","answer":"4","tier":2,"why":"The four seasons are spring, summer, fall and winter. Count them: 1, 2, 3, 4."},{"prompt":"Leaves fall from trees in…","choices":["Fall","Spring"],"answer":"Fall","tier":2,"why":"In fall, the weather gets cooler and many trees drop their leaves. That is why it is called fall."},{"prompt":"Which season is hottest?","choices":["Summer","Winter"],"answer":"Summer","tier":1,"why":"Summer has the hottest weather and long sunny days. Winter is the cold season."},{"prompt":"Flowers start to grow in…","choices":["Spring","Winter"],"answer":"Spring","tier":3,"why":"In spring, the weather gets warmer and there is more rain and sun, so flowers start to grow. In winter it is too cold."},{"prompt":"Which season comes after winter?","choices":["Spring","Fall","Summer"],"answer":"Spring","tier":3,"why":"The seasons go in order: spring, summer, fall, winter, and then spring again. So spring comes right after winter."}]},"reinforcement":"Weather and climate later.","day":76,"subject":"Science","sightPaceSeconds":15},{"id":"ss-symbols","stage":"q3","part":3,"title":"American symbols","summary":"Know the flag, bald eagle, Statue of Liberty and Liberty Bell.","prerequisites":["ss-rules"],"lesson":{"explanation":"Symbols stand for ideas. The U.S. flag has 50 stars (one for each state) and 13 stripes.","example":"The bald eagle is the national bird.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Show pictures of the American flag, a bald eagle, the Statue of Liberty and the Liberty Bell. Name each one, and count a few stars on the flag, saying there is one star for each of the 50 states.","together":"Look at a picture of the flag together. Ask: What colors do you see? Let's count the stripes together, 1, 2, 3... up to 13. What do the stars stand for?","alone":"Have the child name the national bird alone. Hint if stuck: it is a big bird with a white head."}},"practice":{"items":[{"prompt":"How many stars are on the U.S. flag?","answer":"50","tier":2,"why":"The American flag has one star for each state. There are 50 states, so there are 50 stars."},{"prompt":"How many stripes are on the U.S. flag?","answer":"13","tier":3,"why":"The American flag has 13 red and white stripes, one for each of the first 13 colonies that started the country."},{"prompt":"The national bird is the…","choices":["Bald eagle","Robin","Owl"],"answer":"Bald eagle","tier":1,"why":"The bald eagle was picked as the national bird of the United States because it stands for being strong and free."},{"prompt":"What colors are on the American flag?","choices":["Red, white and blue","Green and yellow"],"answer":"Red, white and blue","tier":1,"why":"The American flag has red and white stripes and white stars on a blue box. So its colors are red, white and blue."},{"prompt":"The big statue holding a torch is the…","choices":["Statue of Liberty","Liberty Bell"],"answer":"Statue of Liberty","tier":2,"why":"The Statue of Liberty is a huge statue of a lady holding a torch up high. The Liberty Bell is a bell, not a statue."},{"prompt":"Each star on the American flag stands for a…","choices":["State","Person","City"],"answer":"State","tier":3,"why":"There is one star for each of the 50 states. So each star stands for a state."}]},"reinforcement":"U.S. history later.","day":77,"subject":"Social Studies","sightPaceSeconds":15},{"id":"r-rhyme","stage":"q3","part":3,"title":"Rhyming words","summary":"Hear and make rhymes.","prerequisites":["r-cvc"],"lesson":{"explanation":"Rhyming words end with the same sound: cat, hat, bat.","example":"cake rhymes with lake","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Say 'cat, hat, bat' and stretch the ends: -at, -at, -at. Then say 'cat, dog' and shake your head: they do not end the same, so they do not rhyme.","together":"Find a rhyme for 'pig' together. Ask: What sound is at the end of pig? (-ig) Let's try new first sounds: w-ig, d-ig, b-ig. Which ones are real words?","alone":"Have the child say a word that rhymes with 'sun' alone. Hint if stuck: keep the -un and change the first sound."}},"practice":{"items":[{"prompt":"Read aloud: cat — hat — bat, pig — wig — dig","mode":"tutor","tier":1,"why":"Each group ends with the same sound: cat, hat, bat all end in at, and pig, wig, dig all end in ig. Accept each word read clearly."},{"prompt":"Which word rhymes with 'dog'?","choices":["log","dig","dot"],"answer":"log","tier":2,"why":"Dog and log both end with the sound og. Dig and dot start like dog but end differently."},{"prompt":"Which rhymes with 'cake'?","choices":["lake","luck","cook"],"answer":"lake","tier":2,"why":"Cake and lake both end with the sound ake. Luck and cook end with different sounds."},{"prompt":"Which rhymes with 'sun'?","choices":["fun","sin","sad"],"answer":"fun","tier":1,"why":"Sun and fun both end with the sound un. Sin and sad start like sun but end differently."},{"prompt":"Which rhymes with 'hat'?","choices":["bat","hot"],"answer":"bat","tier":1,"why":"Hat and bat both end with the sound at. Hot ends with ot, so it does not rhyme."},{"prompt":"Which rhymes with 'bed'?","choices":["red","bad","bib"],"answer":"red","tier":3,"why":"Bed and red both end with the sound ed. Bad and bib start like bed but end differently."},{"prompt":"Say two words that rhyme with 'pig'.","mode":"tutor","tier":3,"why":"Accept any two words that end with the ig sound, like big, dig, wig, fig or jig. Made-up words that rhyme can be fine too."}]},"reinforcement":"Word families help spelling.","day":78,"subject":"Reading","sightPaceSeconds":10},{"id":"m-length","stage":"q3","part":3,"title":"Measure length","summary":"Measure with same-size units laid end to end.","prerequisites":["m-count-20"],"lesson":{"explanation":"Line up units with no gaps or overlaps. Count how many units long.","example":"The pencil is 6 paper clips long.","tutorSteps":["Measure objects with paper clips or cubes.","Show gaps make wrong answers.","Record lengths."],"approaches":{"show":"Lay paper clips end to end along a pencil with no gaps, and count them: 6 paper clips long. Then spread the clips out with gaps and show that the count is now wrong.","together":"Measure a spoon with cubes together. Ask: Where do we start? Are there gaps? Are any cubes on top of each other? Count the cubes together and write the length.","alone":"Have the child measure a book with paper clips alone. Hint if stuck: start right at the edge and keep the clips touching."}},"practice":{"items":[{"prompt":"If a crayon is 4 cubes long and a marker is 6 cubes long, how many cubes longer is the marker?","answer":"2","tier":3,"why":"Find the difference: count on from 4 to 6, that is 5, 6, two more. So the marker is 2 cubes longer."},{"prompt":"When measuring, should units overlap?","choices":["Yes","No"],"answer":"No","tier":1,"why":"If units overlap, you count the same space twice and get too big a number. So units should not overlap."},{"prompt":"A book is 10 paper clips long. A notebook is 7. Which is longer?","choices":["Book","Notebook"],"answer":"Book","tier":2,"why":"10 paper clips is more than 7 paper clips, so the book is longer."},{"prompt":"Measure your table in hand spans. Tutor checks.","mode":"tutor","tier":3,"why":"Accept a count where the hands are placed end to end along the table with no gaps or overlaps, like: The table is 8 hand spans long."},{"prompt":"When measuring, should we leave gaps between units?","choices":["No","Yes"],"answer":"No","tier":1,"why":"If you leave gaps, you skip some length and get too small a number. So there should be no gaps."},{"prompt":"A spoon is 5 cubes long. A fork is 7 cubes long. How many cubes longer is the fork?","answer":"2","tier":2,"why":"Count on from 5 to 7: 6, 7. That is 2 more, so the fork is 2 cubes longer."}]},"reinforcement":"Rulers and inches/centimeters come in second grade.","day":79,"subject":"Math","sightPaceSeconds":15},{"id":"r-sight-1","stage":"q3","part":3,"title":"Sight words set 1","summary":"Read high-frequency words instantly.","prerequisites":["r-letter-sounds"],"lesson":{"explanation":"Sight words show up all the time. Read them by sight in under 2 seconds each.","example":"the, a, is","tutorSteps":["Flash each word card.","Slow words go in a 'practice' pile.","Re-flash the practice pile at the end."],"approaches":{"show":"Flash the card 'the' and read it right away without sounding it out. Say: we know this word by sight. Do the same with 'said' and point out it does not sound like its letters.","together":"Flash 'you' together. Ask: Do you know it right away? If not, say it together, then flash it again. Put any slow words in the practice pile and flash them again at the end.","alone":"Flash 'and' and have the child read it alone in under 2 seconds. Hint if stuck: it starts like 'an'."}},"practice":{"items":[{"prompt":"Read aloud: the","mode":"tutor","tier":1,"why":"Accept the word the read right away, in under 2 seconds, without sounding it out. It sounds like thuh."},{"prompt":"Read aloud: a","mode":"tutor","tier":1,"why":"Accept the word a read right away. It usually sounds like uh."},{"prompt":"Read aloud: is","mode":"tutor","tier":1,"why":"Accept is read right away, in under 2 seconds. It sounds like iz, with a z sound at the end."},{"prompt":"Read aloud: you","mode":"tutor","tier":2,"why":"Accept you read right away, in under 2 seconds. It sounds like yoo."},{"prompt":"Read aloud: to","mode":"tutor","tier":2,"why":"Accept to read right away, in under 2 seconds. It sounds like too."},{"prompt":"Read aloud: and","mode":"tutor","tier":2,"why":"Accept and read right away, in under 2 seconds, with the d at the end."},{"prompt":"Read aloud: we","mode":"tutor","tier":2,"why":"Accept we read right away, in under 2 seconds. It sounds like wee."},{"prompt":"Read aloud: it","mode":"tutor","tier":1,"why":"Accept it read right away, in under 2 seconds, with a short i sound."},{"prompt":"Read aloud: in","mode":"tutor","tier":1,"why":"Accept in read right away, in under 2 seconds, with a short i sound."},{"prompt":"Read aloud: said","mode":"tutor","tier":3,"why":"Accept said read right away; it sounds like sed, not say-id. It is a tricky word that does not sound like its letters."},{"prompt":"Read aloud: the, is, to, said","mode":"tutor","tier":3,"why":"Accept all four words read quickly, each in under 2 seconds: the, is, to, said. Said should sound like sed."}]},"reinforcement":"Reviewed in every reading lesson after this.","day":80,"subject":"Reading","sightPaceSeconds":2},{"id":"m-order-length","stage":"q3","part":3,"title":"Order by length","summary":"Put three objects in order from shortest to longest.","prerequisites":["m-length"],"lesson":{"explanation":"Compare two at a time. If A is longer than B and B is longer than C, A is longer than C.","example":"rope > ribbon > string","tutorSteps":["Compare three strips of paper.","Line them up at one end.","Name shortest and longest."],"approaches":{"show":"Cut three paper strips of different lengths. Line them up at one end and point: this one is shortest, this one is longest. Arrange them shortest to longest.","together":"Order a pencil, a crayon and a marker together. Ask: Line them up at the bottom. Which sticks out the most? Which is shortest? Where does the last one go?","alone":"Have the child put 3 strings in order from shortest to longest alone. Hint if stuck: line up the ends first."}},"practice":{"items":[{"prompt":"A pencil is longer than a crayon. The crayon is longer than an eraser. Which is shortest?","choices":["Pencil","Crayon","Eraser"],"answer":"Eraser","tier":2,"why":"The pencil is longer than the crayon, and the crayon is longer than the eraser. The eraser is shorter than both, so it is shortest."},{"prompt":"A snake is longer than a worm. A worm is longer than an ant. Which is longest?","choices":["Snake","Worm","Ant"],"answer":"Snake","tier":2,"why":"The snake is longer than the worm, and the worm is longer than the ant. So the snake is longer than both, which makes it longest."},{"prompt":"Order these lengths from shortest: 9, 3, 6","choices":["3, 6, 9","9, 6, 3","6, 3, 9"],"answer":"3, 6, 9","tier":3,"why":"Start with the smallest number, 3. Then comes 6, then 9. So the order is 3, 6, 9."},{"prompt":"Which is longer: a 5-cube strip or a 2-cube strip?","choices":["5 cubes","2 cubes"],"answer":"5 cubes","tier":1,"why":"5 is more than 2, so the strip with 5 cubes is longer."},{"prompt":"Which is shortest: 4 clips, 8 clips or 6 clips?","choices":["4 clips","8 clips","6 clips"],"answer":"4 clips","tier":1,"why":"4 is the smallest number of the three, so 4 clips is the shortest."},{"prompt":"Order these lengths from shortest: 7, 2, 5","choices":["2, 5, 7","7, 5, 2","5, 2, 7"],"answer":"2, 5, 7","tier":3,"why":"Start with the smallest number, 2. Then comes 5, then 7. So the order is 2, 5, 7."}]},"reinforcement":"Ordering returns with numbers, fractions and data.","day":81,"subject":"Math","sightPaceSeconds":10},{"id":"m-time","stage":"q3","part":3,"title":"Tell time to the hour and half hour","summary":"Read an analog clock.","prerequisites":["m-count-120","m-skip-5"],"lesson":{"explanation":"The short hand shows the hour. When the long hand points to 12 it is o'clock; to 6 it is half past.","example":"Short hand on 4, long hand on 12 → 4:00","tutorSteps":["Use a toy clock.","Move the hands together.","Read times through the day."],"approaches":{"show":"Set a toy clock to 4:00. Point to the short hand on 4 and say: this is the hour. Point to the long hand on 12 and say: 4 o'clock. Move the long hand to 6 and say: half past 4, 4:30.","together":"Set the clock to 7:30 together. Ask: Where should the long hand point for half past? (6) Where does the short hand go? (between 7 and 8) Read the time together.","alone":"Show 2:00 on a clock and have the child read it alone. Hint if stuck: look at the short hand first."}},"practice":{"generator":"time"},"reinforcement":"Quarter hours and minutes in second grade.","day":82,"subject":"Math","sightPaceSeconds":8},{"id":"r-sight-2","stage":"q3","part":3,"title":"Sight words set 2","summary":"Read high-frequency words instantly.","prerequisites":["r-sight-1"],"lesson":{"explanation":"Sight words show up all the time. Read them by sight in under 2 seconds each.","example":"was, for, he","tutorSteps":["Flash each word card.","Slow words go in a 'practice' pile.","Re-flash the practice pile at the end."],"approaches":{"show":"Flash the card 'was' and read it right away. Say: was does not sound like its letters, so we learn it by sight. Do the same with 'of' and 'they'.","together":"Flash 'she' together. Ask: Do you know it right away? If not, say it together and flash it again. Put slow words in the practice pile and flash them at the end.","alone":"Flash 'have' and have the child read it alone in under 2 seconds. Hint if stuck: it starts like 'hat'."}},"practice":{"items":[{"prompt":"Read aloud: was","mode":"tutor","tier":3,"why":"Accept was read right away, in under 2 seconds. It sounds like wuz, not like it is spelled."},{"prompt":"Read aloud: for","mode":"tutor","tier":1,"why":"Accept for read right away, in under 2 seconds. It sounds like the number four."},{"prompt":"Read aloud: he","mode":"tutor","tier":1,"why":"Accept he read right away, in under 2 seconds. It sounds like hee."},{"prompt":"Read aloud: she","mode":"tutor","tier":2,"why":"Accept she read right away, in under 2 seconds. It starts with the sh sound."},{"prompt":"Read aloud: of","mode":"tutor","tier":3,"why":"Accept of read right away; it sounds like uv, with a v sound at the end."},{"prompt":"Read aloud: have","mode":"tutor","tier":2,"why":"Accept have read right away; it sounds like hav, and the e at the end is quiet."},{"prompt":"Read aloud: are","mode":"tutor","tier":2,"why":"Accept are read right away, in under 2 seconds. It sounds like the letter r."},{"prompt":"Read aloud: they","mode":"tutor","tier":3,"why":"Accept they read right away; it sounds like thay, rhyming with day."},{"prompt":"Read aloud: with","mode":"tutor","tier":2,"why":"Accept with read right away, in under 2 seconds, ending with the th sound."},{"prompt":"Read aloud: my","mode":"tutor","tier":1,"why":"Accept my read right away, in under 2 seconds. It rhymes with by."},{"prompt":"Read aloud: he, my, for, are","mode":"tutor","tier":3,"why":"Accept all four words read quickly, each in under 2 seconds: he, my, for, are."}]},"reinforcement":"Reviewed in every reading lesson after this.","day":83,"subject":"Reading","sightPaceSeconds":2},{"id":"s-sound","stage":"q4","part":1,"title":"Sound and vibration","summary":"Sounds are made by vibrations.","prerequisites":["s-senses"],"lesson":{"explanation":"Sound happens when something vibrates (shakes quickly). Stronger vibrations are louder.","example":"A plucked rubber band vibrates and hums.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Stretch a rubber band over an open box and pluck it while the child watches and listens. Point to the blur and say: it is shaking fast, and that shaking is called vibration; the shaking makes the hum.","together":"Hum together with your hands on your throats. Ask: What do you feel? (shaking) Then tap a pot softly, then harder, and ask: Which was louder? Which shook more?","alone":"Have the child tap a drum or pot softly, then hard, and tell you which sound was louder and why. Hint if stuck: watch or touch the pot; a harder hit makes it shake more."}},"practice":{"items":[{"prompt":"Sound is made by…","choices":["Vibrations","Light","Color"],"answer":"Vibrations","tier":1,"why":"Sound is made when something shakes back and forth very fast. That shaking is called vibration. Light and color do not make sound."},{"prompt":"Hum and touch your throat. Your throat…","choices":["Shakes","Stays still"],"answer":"Shakes","tier":1,"why":"When you hum, parts inside your throat shake fast to make the sound. You can feel that shaking with your fingers."},{"prompt":"A drum hit harder sounds…","choices":["Louder","Quieter"],"answer":"Louder","tier":2,"why":"Hitting a drum harder makes it shake more strongly. Stronger shaking makes a louder sound."},{"prompt":"A soft tap on a drum sounds…","choices":["Quieter","Louder"],"answer":"Quieter","tier":2,"why":"A soft tap makes the drum shake only a little. Smaller shaking makes a quieter sound."},{"prompt":"Which one makes sound by vibrating?","choices":["A plucked guitar string","A rock sitting still"],"answer":"A plucked guitar string","tier":2,"why":"A plucked guitar string shakes back and forth fast, and that makes sound. A rock sitting still is not shaking, so it makes no sound."},{"prompt":"Stretch a rubber band over a box and pluck it. What do you see and hear?","mode":"tutor","tier":3,"why":"Accept an answer that says the rubber band moves or shakes fast, maybe looking blurry, and makes a humming or twangy sound."},{"prompt":"You hold a ringing bell so it stops shaking. What happens to the sound?","choices":["It stops","It gets louder"],"answer":"It stops","tier":3,"why":"Sound comes from shaking. When you hold the bell, it stops shaking, so the sound stops too."}]},"reinforcement":"Waves in physics later.","day":84,"subject":"Science","sightPaceSeconds":15},{"id":"ss-then-now","stage":"q4","part":1,"title":"Then and now","summary":"Compare life long ago and today.","prerequisites":["ss-family"],"lesson":{"explanation":"Life changes over time: how people travel, talk, cook and go to school.","example":"Long ago people wrote letters; now we text too.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Show a picture of a horse and wagon next to a picture of a car. Say: Long ago, people traveled by horse and wagon; today many people drive cars. Do the same with a letter and a phone.","together":"Talk about cooking together. Ask: How do we heat food today? (stove or microwave) How do you think people cooked long ago? (over a fire) Then ask: Which way is faster?","alone":"Have the child tell you one way school was different long ago. Hint if stuck: think about how many rooms the school had, or what children wrote on."}},"practice":{"items":[{"prompt":"Long ago, people often traveled by…","choices":["Horse and wagon","Airplane"],"answer":"Horse and wagon","tier":1,"why":"Long ago there were no cars or airplanes, so people rode horses or horse-drawn wagons to get places."},{"prompt":"Today, many people talk to faraway friends with…","choices":["A phone","A horse"],"answer":"A phone","tier":1,"why":"Today we have phones that let us talk to people who live far away. A horse can't carry your voice."},{"prompt":"Long ago, people cooked food over a…","choices":["Fire","Microwave"],"answer":"Fire","tier":2,"why":"Long ago there were no microwaves or electric stoves, so people cooked food over a fire."},{"prompt":"Long ago, many children went to school in…","choices":["A one-room schoolhouse","A spaceship"],"answer":"A one-room schoolhouse","tier":2,"why":"Long ago, many towns had one small school with one room, where children of all ages learned together. Spaceships are not schools."},{"prompt":"Ask a grandparent one thing that was different when they were 6.","mode":"tutor","tier":3,"why":"Accept any real change the child shares from the grandparent, like: Grandma had no computer at school, or Grandpa walked to school."},{"prompt":"Tell one way traveling is different now than long ago.","mode":"tutor","tier":3,"why":"Accept one true difference, like: Long ago people rode horses, and now we ride in cars, buses or airplanes."}]},"reinforcement":"History in every grade.","day":85,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-money","stage":"q4","part":1,"title":"Coins","summary":"Count pennies, nickels, dimes and quarters.","prerequisites":["m-skip-5","m-skip-10","m-add-2digit"],"lesson":{"explanation":"Penny 1¢, nickel 5¢, dime 10¢, quarter 25¢. Start counting with the biggest coins.","example":"1 dime + 2 nickels + 3 pennies = 23¢","tutorSteps":["Sort real coins.","Count biggest to smallest.","Play store."],"approaches":{"show":"Lay out 1 dime, 2 nickels and 3 pennies. Touch the biggest coin first and count aloud: 10, 15, 20, 21, 22, 23. Say: that is 23 cents.","together":"Count 1 quarter and 2 dimes together. Ask: Which coin is worth the most? Start there at 25. Then ask: What does a dime add? Count on together: 35, 45.","alone":"Have the child count 2 dimes, 1 nickel and 2 pennies alone. Hint if stuck: start with the dimes and count by tens: 10, 20."}},"practice":{"generator":"money"},"reinforcement":"Dollars and decimals later.","day":86,"subject":"Math","sightPaceSeconds":15},{"id":"r-sight-3","stage":"q4","part":1,"title":"Sight words set 3","summary":"Read high-frequency words instantly.","prerequisites":["r-sight-2"],"lesson":{"explanation":"Sight words show up all the time. Read them by sight in under 2 seconds each.","example":"what, there, out","tutorSteps":["Flash each word card.","Slow words go in a 'practice' pile.","Re-flash the practice pile at the end."],"approaches":{"show":"Flash the card \"what\" and read it right away, then say: I did not sound it out, I just know it. Do the same with \"there\" and \"were\".","together":"Take turns flashing cards: you flash \"from\" and the child reads it, then the child flashes \"some\" for you. Ask: Did you know it right away? Slow words go in the practice pile.","alone":"Flash \"your\" and have the child read it in under 2 seconds. Hint if stuck: it starts like \"you\" and ends with r, as in \"your hat\"."}},"practice":{"items":[{"prompt":"Read aloud: out","mode":"tutor","tier":1,"why":"Accept out read right away, in under 2 seconds. It rhymes with shout."},{"prompt":"Read aloud: this","mode":"tutor","tier":1,"why":"Accept this read right away, in under 2 seconds, starting with the th sound."},{"prompt":"Read aloud: do","mode":"tutor","tier":1,"why":"Accept do read right away; it sounds like doo, not like dough."},{"prompt":"Read aloud: what","mode":"tutor","tier":2,"why":"Accept what read right away; it sounds like wut. It is a tricky word."},{"prompt":"Read aloud: from","mode":"tutor","tier":2,"why":"Accept from read right away; it sounds like frum. It is a tricky word."},{"prompt":"Read aloud: some","mode":"tutor","tier":2,"why":"Accept some read right away; it sounds like sum, and the e is quiet."},{"prompt":"Read aloud: come","mode":"tutor","tier":2,"why":"Accept come read right away; it sounds like kum, and the e is quiet."},{"prompt":"Read aloud: there","mode":"tutor","tier":3,"why":"Accept there read right away; it sounds like thair, rhyming with hair."},{"prompt":"Read aloud: were","mode":"tutor","tier":3,"why":"Accept were read right away; it sounds like wer, rhyming with fur."},{"prompt":"Read aloud: your","mode":"tutor","tier":3,"why":"Accept your read right away; it sounds like yor, rhyming with more."},{"prompt":"Read aloud in a row, quickly: what, there, out, were, your","mode":"tutor","tier":3,"why":"Accept all five words read quickly in a row, each in under 2 seconds: what, there, out, were, your."}]},"reinforcement":"Reviewed in every reading lesson after this.","day":87,"subject":"Reading","sightPaceSeconds":2},{"id":"m-data","stage":"q4","part":1,"title":"Tally charts and picture graphs","summary":"Read and answer questions about simple data.","prerequisites":["m-compare-problems","m-skip-5"],"lesson":{"explanation":"A tally mark stands for 1; a bundle of 5 is drawn as four lines with one across.","example":"Dogs: 𝍸 ||| = 8","tutorSteps":["Survey family about favorite fruit.","Make tallies.","Ask: which has most? how many more?"],"approaches":{"show":"Ask three family members their favorite fruit and draw a tally mark for each vote while the child watches. Count the marks aloud and say: apples has 3, bananas has 1, so apples has the most.","together":"Use the list Apples 6, Bananas 4, Grapes 9. Ask: Which has the most? Which has the fewest? Then ask: How many more grapes than bananas? Count up from 4 to 9 together: 5 more.","alone":"Have the child answer alone: Red 5, Blue 3, Green 7. How many votes in all? Hint if stuck: add two numbers first, 5 + 3 = 8, then add 7."}},"practice":{"items":[{"prompt":"Apples 6, Bananas 4, Grapes 9. Which is the favorite?","choices":["Apples","Bananas","Grapes"],"answer":"Grapes","tier":1,"why":"Grapes got 9 votes. That is more than Apples with 6 and Bananas with 4, so Grapes is the favorite."},{"prompt":"Tally: Birds |||. How many birds?","answer":"3","tier":1,"why":"Each tally mark stands for 1. Count the marks: 1, 2, 3. So there are 3 birds."},{"prompt":"Tally: Cats |||| (4). Dogs: a bundle of 5 and ||. How many dogs?","answer":"7","tier":2,"why":"A bundle of tally marks is 5. Then count on the 2 extra marks: 6, 7. So there are 7 dogs."},{"prompt":"Red 5, Blue 3, Green 7. Which color got the fewest votes?","choices":["Red","Blue","Green"],"answer":"Blue","tier":2,"why":"Blue got 3 votes. That is less than Red with 5 and Green with 7, so Blue got the fewest."},{"prompt":"Picture graph (each ★ is 1 pet): Cats ★★★, Dogs ★★★★★. How many dogs?","answer":"5","tier":2,"why":"Each star is 1 pet. Count the stars next to Dogs: 1, 2, 3, 4, 5. So there are 5 dogs."},{"prompt":"Tally: Cats ||||. Dogs: a bundle of 5 and ||. How many more dogs than cats?","answer":"3","tier":3,"why":"Cats have 4 marks. Dogs have a bundle of 5 and 2 more, which is 7. Count up from 4 to 7: 5, 6, 7. That is 3 more dogs."},{"prompt":"Apples 6, Bananas 4, Grapes 9. How many votes in all?","answer":"19","tier":3,"why":"Add all the votes: 6 + 4 = 10, and 10 + 9 = 19. So there are 19 votes in all."},{"prompt":"Red 5, Blue 3, Green 7. How many more votes did Green get than Blue?","answer":"4","tier":3,"why":"Green got 7 and Blue got 3. Count up from 3 to 7: 4, 5, 6, 7. That is 4 more votes for Green."}]},"reinforcement":"Bar graphs and statistics later.","day":88,"subject":"Math","sightPaceSeconds":20},{"id":"r-sight-4","stage":"q4","part":1,"title":"Sight words set 4","summary":"Read high-frequency words instantly.","prerequisites":["r-sight-3"],"lesson":{"explanation":"Sight words show up all the time. Read them by sight in under 2 seconds each.","example":"could, would, should","tutorSteps":["Flash each word card.","Slow words go in a 'practice' pile.","Re-flash the practice pile at the end."],"approaches":{"show":"Flash \"could\", \"would\" and \"should\" one after another and read each instantly. Point out that all three end in -ould and say: these words are tricky, so we learn them by sight.","together":"Take turns: you flash \"who\" and the child reads it, then the child flashes \"where\" for you. Ask: Which one asks about a person? Which asks about a place? Slow words go in the practice pile.","alone":"Flash \"people\" and have the child read it in under 2 seconds. Hint if stuck: it starts like \"pea\" and ends like \"pull\": people."}},"practice":{"items":[{"prompt":"Read aloud: who","mode":"tutor","tier":1,"why":"The word who sounds like \"hoo\". The w is silent. Accept it read quickly and smoothly, in about 2 seconds."},{"prompt":"Read aloud: any","mode":"tutor","tier":1,"why":"The word any sounds like \"en-ee\", not \"an-ee\". Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: very","mode":"tutor","tier":1,"why":"The word very sounds like \"vair-ee\". Accept it read smoothly in about 2 seconds without sounding out."},{"prompt":"Read aloud: could","mode":"tutor","tier":2,"why":"The word could sounds like \"kood\". The l is silent. Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: would","mode":"tutor","tier":2,"why":"The word would sounds like \"wood\". The l is silent. Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: should","mode":"tutor","tier":2,"why":"The word should sounds like \"shood\". The l is silent. Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: many","mode":"tutor","tier":2,"why":"The word many sounds like \"men-ee\", not \"man-ee\". Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: people","mode":"tutor","tier":3,"why":"The word people sounds like \"pee-pul\". The o is silent. Accept it read smoothly in about 2 seconds."},{"prompt":"Read aloud: again","mode":"tutor","tier":3,"why":"The word again sounds like \"uh-gen\". Accept it read by sight in about 2 seconds without sounding out."},{"prompt":"Read aloud: where","mode":"tutor","tier":3,"why":"The word where sounds like \"wair\", rhyming with \"chair\". Accept it read by sight in about 2 seconds, not mixed up with \"were\"."},{"prompt":"Read aloud in a row, quickly: could, people, again, where, many","mode":"tutor","tier":3,"why":"Accept all five words read correctly in order, each in about 2 seconds, with no long stops: could, people, again, where, many."}]},"reinforcement":"Reviewed in every reading lesson after this.","day":89,"subject":"Reading","sightPaceSeconds":2},{"id":"w-opinion","stage":"q4","part":1,"title":"Opinion writing","summary":"Tell what you think and give a reason.","prerequisites":["w-picture-sentence"],"lesson":{"explanation":"State your opinion, give a reason with 'because', and end with a closing.","example":"Dogs are the best pets because they love to play.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write on paper while thinking aloud: \"Dogs are the best pets because they love to play. That is why I like dogs.\" Underline because and say: this word starts my reason.","together":"Write about the best snack together. Ask: What is your opinion? Write it. Ask: Why? Start the next part with because. Then ask: How can we finish? (That is why...)","alone":"Have the child write alone: What is the best season? Give one reason with because. Hint if stuck: start with \"I think summer is the best because...\""}},"practice":{"items":[{"prompt":"Which word gives a reason?","choices":["because","and","the"],"answer":"because","tier":1,"why":"The word because tells why. It gives a reason, like \"I like dogs because they are fun.\" The words and and the do not tell why."},{"prompt":"Which sentence tells an opinion?","choices":["Pizza is the best food.","Pizza is round."],"answer":"Pizza is the best food.","tier":1,"why":"\"Pizza is the best food\" is what someone thinks, so it is an opinion. Others may not agree. \"Pizza is round\" is a fact anyone can check."},{"prompt":"Finish it aloud: I like summer because…","mode":"tutor","tier":2,"why":"Accept any real reason about summer, like \"I like summer because I can swim.\" The reason should tell why the child likes summer."},{"prompt":"Cats are the best pets because…","choices":["they are soft and cuddly","the sky is blue"],"answer":"they are soft and cuddly","tier":2,"why":"A reason must tell why cats are good pets. Being soft and cuddly does that. The sky being blue has nothing to do with cats."},{"prompt":"Write: What is the best season? Give one reason with 'because'.","mode":"tutor","tier":3,"why":"Accept a sentence that names a season and gives a reason with because, like \"Winter is the best season because I can play in the snow.\""},{"prompt":"Write: What is the best game to play? Give a reason with 'because' and end with a closing sentence.","mode":"tutor","tier":3,"why":"Accept an opinion, a reason with because, and an ending. Example: \"Tag is the best game because it is fast. That is why I love tag.\""}]},"reinforcement":"Persuasive essays later.","day":90,"subject":"Writing","sightPaceSeconds":60},{"id":"m-shapes-2d","stage":"q4","part":1,"title":"2D shapes","summary":"Name shapes by sides and corners.","prerequisites":[],"lesson":{"explanation":"Triangle: 3 sides. Square: 4 equal sides. Rectangle: 4 sides, square corners. Hexagon: 6 sides.","example":"A hexagon has 6 sides and 6 corners.","tutorSteps":["Hunt for shapes in the house.","Count sides and corners.","Draw each shape."],"approaches":{"show":"Hold up a paper triangle and touch each side while counting 1, 2, 3, then each corner 1, 2, 3. Say: a triangle has 3 sides and 3 corners. Do the same with a hexagon pattern block: 6 and 6.","together":"Find a book (a rectangle) together. Ask: How many sides? Count them together. Ask: Are the corners square, like the corner of paper? Are all sides the same length? So it is a rectangle, not a square.","alone":"Have the child draw a hexagon alone and count its sides and corners. Hint if stuck: draw 6 dots in a ring first, then connect them."}},"practice":{"items":[{"prompt":"How many sides does a triangle have?","answer":"3","tier":1,"why":"A triangle has 3 straight sides. You can count them: 1, 2, 3. Tri means three."},{"prompt":"Which shape has no corners?","choices":["Circle","Square","Triangle"],"answer":"Circle","tier":1,"why":"A circle is round all the way around, so it has no corners. A square has 4 corners and a triangle has 3."},{"prompt":"How many sides does a hexagon have?","answer":"6","tier":2,"why":"A hexagon has 6 sides. Count them all the way around: 1, 2, 3, 4, 5, 6."},{"prompt":"A shape has 4 equal sides and 4 square corners. What is it?","choices":["Square","Triangle","Circle"],"answer":"Square","tier":2,"why":"A square has 4 sides that are all the same length and 4 square corners. A triangle has only 3 sides, and a circle has none."},{"prompt":"How many corners does a rectangle have?","answer":"4","tier":2,"why":"A rectangle has 4 sides, and a corner is where two sides meet. So it has 4 corners."},{"prompt":"A shape has 6 sides. How many corners does it have?","answer":"6","tier":3,"why":"Every side meets the next side at a corner. So a shape with 6 sides has 6 corners. It is a hexagon."},{"prompt":"A shape has 4 sides and 4 square corners. 2 sides are long and 2 are short. What is it?","choices":["Rectangle","Square","Hexagon"],"answer":"Rectangle","tier":3,"why":"A rectangle has 4 sides and square corners, with 2 long sides and 2 short sides. A square would need all 4 sides the same length."}]},"reinforcement":"Geometry and area later.","day":91,"subject":"Math","sightPaceSeconds":6},{"id":"r-sight-5","stage":"q4","part":1,"title":"Sight words set 5","summary":"Read high-frequency words instantly.","prerequisites":["r-sight-4"],"lesson":{"explanation":"Sight words show up all the time. Read them by sight in under 2 seconds each.","example":"because, friend, once","tutorSteps":["Flash each word card.","Slow words go in a 'practice' pile.","Re-flash the practice pile at the end."],"approaches":{"show":"Flash \"because\", \"friend\" and \"once\" and read each one instantly. Say: \"once\" does not sound like its letters, so we remember it by sight.","together":"Take turns: you flash \"before\" and the child reads it, then the child flashes \"after\" for you. Ask: What is the opposite of before? Slow words go in the practice pile.","alone":"Flash \"through\" and have the child read it in under 2 seconds. Hint if stuck: it sounds like \"threw\", as in walking through a door."}},"practice":{"items":[{"prompt":"Read aloud: around","mode":"tutor","tier":1,"why":"The word around sounds like \"uh-round\". Accept it read smoothly by sight in about 2 seconds."},{"prompt":"Read aloud: before","mode":"tutor","tier":1,"why":"The word before sounds like \"bee-for\". Accept it read by sight in about 2 seconds without sounding out."},{"prompt":"Read aloud: after","mode":"tutor","tier":1,"why":"The word after sounds like \"af-ter\". Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: because","mode":"tutor","tier":2,"why":"The word because sounds like \"bee-kuz\". Accept it read smoothly by sight in about 2 seconds."},{"prompt":"Read aloud: friend","mode":"tutor","tier":2,"why":"The word friend sounds like \"frend\". The i is silent. Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: every","mode":"tutor","tier":2,"why":"The word every sounds like \"ev-ree\". Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: know","mode":"tutor","tier":2,"why":"The word know sounds like \"no\". The k and w are silent. Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: once","mode":"tutor","tier":3,"why":"The word once sounds like \"wunss\". Accept it read by sight in about 2 seconds, not as \"ons\"."},{"prompt":"Read aloud: thought","mode":"tutor","tier":3,"why":"The word thought sounds like \"thawt\". The g and h are silent. Accept it read by sight in about 2 seconds."},{"prompt":"Read aloud: through","mode":"tutor","tier":3,"why":"The word through sounds like \"throo\". Accept it read by sight in about 2 seconds, not mixed up with \"though\"."},{"prompt":"Read aloud in a row, quickly: once, thought, through, friend, because","mode":"tutor","tier":3,"why":"Accept all five words read correctly in order, each in about 2 seconds, with no long stops: once, thought, through, friend, because."}]},"reinforcement":"Reviewed in every reading lesson after this.","day":92,"subject":"Reading","sightPaceSeconds":2},{"id":"m-shapes-3d","stage":"q4","part":2,"title":"3D shapes","summary":"Name cubes, spheres, cones, cylinders and prisms.","prerequisites":["m-shapes-2d"],"lesson":{"explanation":"3D shapes are solid. A cube has 6 square faces. A sphere is round like a ball.","example":"A can is a cylinder.","tutorSteps":["Collect household objects.","Sort by shape.","Count faces on a cube."],"approaches":{"show":"Set out a ball, a soup can, an ice cream cone and a toy block. Name each one: sphere, cylinder, cone, cube. Touch each face of the block and count to 6.","together":"Sort household objects together. Hold up a cereal box and ask: Is it flat or solid? Does it roll? How many faces? Then hold up a can and ask: Which shape is it, cylinder or cone?","alone":"Have the child count the faces on a cube alone. Hint if stuck: put a sticker on each face as you count so you do not count one twice."}},"practice":{"items":[{"prompt":"A ball is a…","choices":["Sphere","Cube","Cone"],"answer":"Sphere","tier":1,"why":"A ball is round all over, just like a sphere. A cube has flat square faces, and a cone has a point."},{"prompt":"An ice cream cone is shaped like a…","choices":["Cone","Cylinder","Cube"],"answer":"Cone","tier":1,"why":"An ice cream cone has a round opening and comes to a point at the bottom. That is a cone shape."},{"prompt":"A soup can is a…","choices":["Cylinder","Sphere","Cone"],"answer":"Cylinder","tier":2,"why":"A soup can has a flat circle on the top and the bottom, and a curved side. That is a cylinder."},{"prompt":"A toy block with 6 square faces is a…","choices":["Cube","Sphere","Cone"],"answer":"Cube","tier":2,"why":"A cube has 6 flat faces, and every face is a square. A toy block like that is a cube."},{"prompt":"Which shape can roll in any direction?","choices":["Sphere","Cube"],"answer":"Sphere","tier":2,"why":"A sphere is round everywhere, so it can roll any way you push it. A cube has flat faces, so it slides instead."},{"prompt":"How many faces does a cube have?","answer":"6","tier":3,"why":"A cube has 6 faces: top, bottom, front, back, left and right. Count them: 1, 2, 3, 4, 5, 6."},{"prompt":"What shape is each face of a cube?","choices":["Square","Triangle","Circle"],"answer":"Square","tier":3,"why":"Every face of a cube is a square. All its edges are the same length, so each face has 4 equal sides."},{"prompt":"Which shape has a point on top and a circle on the bottom?","choices":["Cone","Cylinder","Cube"],"answer":"Cone","tier":3,"why":"A cone has a flat circle on one end and comes to a point at the other. A cylinder has circles on both ends."}]},"reinforcement":"Volume and surface area later.","day":93,"subject":"Math","sightPaceSeconds":6},{"id":"s-light","stage":"q4","part":2,"title":"Light and shadows","summary":"Light lets us see; blocked light makes shadows.","prerequisites":["s-sound"],"lesson":{"explanation":"We need light to see. When an object blocks light, it makes a shadow.","example":"Your shadow is long in the evening.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Darken a room and shine a flashlight on the wall. Put your hand in front of the light and say: my hand blocks the light, so it makes a shadow.","together":"Make a shadow puppet together. Ask: What happens when I move my hand closer to the light? Is the shadow bigger or smaller? Then ask: What happens when I turn the flashlight off?","alone":"Have the child make a shadow of a toy alone with a flashlight. Hint if stuck: put the toy between the flashlight and the wall."}},"practice":{"items":[{"prompt":"We need ___ to see.","choices":["Light","Sound"],"answer":"Light","tier":1,"why":"Our eyes see things when light bounces off them. Sound helps us hear, not see."},{"prompt":"Can you see in a totally dark room?","choices":["No","Yes"],"answer":"No","tier":1,"why":"With no light at all, nothing bounces into our eyes, so we cannot see."},{"prompt":"A shadow forms when light is…","choices":["Blocked","Loud"],"answer":"Blocked","tier":2,"why":"A shadow is a dark spot where light cannot reach because something is in the way. Shadows are not about sound."},{"prompt":"Which gives off light?","choices":["The sun","A rock"],"answer":"The sun","tier":2,"why":"The sun makes its own light. A rock does not glow; we only see it when light shines on it."},{"prompt":"Which makes a shadow?","choices":["Your hand in front of a flashlight","Air"],"answer":"Your hand in front of a flashlight","tier":2,"why":"Your hand blocks the light from the flashlight, so a dark shape appears behind it. Air lets light pass through, so it makes no shadow."},{"prompt":"Use a flashlight to make a shadow puppet.","mode":"tutor","tier":3,"why":"Accept any shadow shape made by putting hands or an object between the flashlight and a wall. The child can say the hand blocks the light."},{"prompt":"Stand outside on a sunny day. Point to your shadow and tell what is blocking the light.","mode":"tutor","tier":3,"why":"Accept the child pointing to the dark shape on the ground and saying their body is blocking the sunlight."}]},"reinforcement":"Light and optics later.","day":94,"subject":"Science","sightPaceSeconds":15},{"id":"r-fluency","stage":"q4","part":2,"title":"Reading fluency","summary":"Read a short passage smoothly and with expression.","prerequisites":["r-sight-2","r-cvc"],"lesson":{"explanation":"Fluent reading sounds like talking: smooth, not too fast, with feeling at ! and ?","example":"\"Look out!\" said the cat.","tutorSteps":["Model reading a sentence with expression.","Child reads it back.","Re-read the passage three times; time the last read."],"approaches":{"show":"Read \"Can you see the bird in the tree? It is singing!\" with your voice going up at the question mark and excited at the exclamation mark. Then read it flat like a robot and ask which sounded better.","together":"Read \"The big dog ran to the park.\" yourself, then have the child echo it. Ask: Did you stop at the period? Read the next sentence together, then let the child read both alone.","alone":"Have the child read \"We like to play in the rain. Then we jump in the mud.\" alone three times, timing the last read. Hint if stuck: point under each word and read it like you are talking."}},"practice":{"items":[{"prompt":"Read aloud: The big dog ran to the park. He saw a red ball.","mode":"tutor","tier":1,"why":"Accept smooth reading with all words right and a short stop at each period. It should sound like talking, not word by word."},{"prompt":"Read aloud: I see a cat. The cat is fat.","mode":"tutor","tier":1,"why":"Accept smooth reading of all the words with a short stop after \"cat.\" It should sound like talking."},{"prompt":"Read aloud: We like to play in the rain. Then we jump in the mud.","mode":"tutor","tier":2,"why":"Accept smooth reading, a short stop at each period, and words like \"Then\" read without stopping to sound out."},{"prompt":"Read aloud: Mom and I went to the store. We got milk and eggs.","mode":"tutor","tier":2,"why":"Accept all words read right, with a short stop at each period, at a talking speed, not too fast."},{"prompt":"Read aloud: Can you see the bird in the tree? It is singing!","mode":"tutor","tier":3,"why":"Accept the first sentence read like a question, with the voice going up at the end, and \"It is singing!\" read with excitement."},{"prompt":"Read aloud with feeling: \"Look out!\" said the cat. \"Is that a big dog?\"","mode":"tutor","tier":3,"why":"Accept \"Look out!\" read with alarm, like a warning, and \"Is that a big dog?\" read like a question, with the voice going up."}]},"reinforcement":"Repeated reading builds speed for all later reading.","day":95,"subject":"Reading","sightPaceSeconds":30},{"id":"m-halves-fourths","stage":"q4","part":2,"title":"Halves and fourths","summary":"Split shapes into equal parts.","prerequisites":["m-shapes-2d"],"lesson":{"explanation":"Halves: 2 equal parts. Fourths (quarters): 4 equal parts. More parts means smaller parts.","example":"A pizza cut into 4 equal slices shows fourths.","tutorSteps":["Fold paper into halves and fourths.","Cut a sandwich into equal parts.","Compare a half and a fourth."],"approaches":{"show":"Fold a paper square in half, open it and show the 2 equal parts. Fold it again and show 4 equal parts. Hold one half next to one fourth and say: more parts means smaller parts.","together":"Cut a sandwich together. Ask: How can we cut it so we each get the same? (in half) Then ask: How many pieces if 4 people share? Are they bigger or smaller than halves?","alone":"Have the child fold a paper into fourths alone and color one fourth. Hint if stuck: fold it in half, then fold it in half again."}},"practice":{"items":[{"prompt":"How many equal parts make halves?","answer":"2","tier":1,"why":"Halves means a whole cut into 2 equal parts. Each part is one half."},{"prompt":"Fold a paper in half. How many parts do you see?","answer":"2","tier":1,"why":"When you fold a paper in half, the fold splits it into 2 equal parts."},{"prompt":"How many equal parts make fourths?","answer":"4","tier":2,"why":"Fourths means a whole cut into 4 equal parts. Each part is one fourth."},{"prompt":"A quarter of a pizza is the same as one…","choices":["Fourth","Half","Whole"],"answer":"Fourth","tier":2,"why":"A quarter and a fourth mean the same thing: one of 4 equal parts. A half would be one of 2 parts."},{"prompt":"Two halves make one…","choices":["Whole","Fourth","Third"],"answer":"Whole","tier":2,"why":"If you cut something into 2 equal parts, putting both halves back together makes the whole thing again."},{"prompt":"Which piece is bigger?","choices":["One half","One fourth"],"answer":"One half","tier":3,"why":"One half is 1 of 2 parts and one fourth is 1 of 4 parts. More parts means smaller pieces, so the half is bigger."},{"prompt":"How many fourths make one whole?","answer":"4","tier":3,"why":"Fourths come from cutting a whole into 4 equal parts. So it takes 4 fourths to make the whole again."},{"prompt":"A sandwich is cut into 2 parts: one big and one small. Is it cut into halves?","choices":["No","Yes"],"answer":"No","tier":3,"why":"Halves must be 2 equal parts, the same size. One big and one small piece are not equal, so they are not halves."}]},"reinforcement":"Fractions in third grade build directly on this.","day":96,"subject":"Math","sightPaceSeconds":6},{"id":"r-story-elements","stage":"q4","part":2,"title":"Characters and setting","summary":"Name who is in a story and where it happens.","prerequisites":["r-fluency"],"lesson":{"explanation":"Characters are the people or animals in a story. The setting is where and when it happens.","example":"In 'The Three Little Pigs', characters: pigs and wolf; setting: the countryside.","tutorSteps":["Read a short story together.","Ask who and where.","Draw the setting."],"approaches":{"show":"Read \"Max the cat napped on the warm porch.\" Point to Max and say: Max is the character, the one in the story. Point to the porch and say: the porch is the setting, where it happens.","together":"Read a short story such as \"The Three Little Pigs\" together. Ask: Who is in the story? (the pigs and the wolf) Then ask: Where does it happen? Draw the setting together.","alone":"Read \"At night, Pip the owl flew over the dark forest.\" and have the child name the character and the setting. Hint if stuck: ask who is doing something, then ask where it is happening."}},"practice":{"items":[{"prompt":"Story: Max the cat napped on the warm porch. Who is the character?","choices":["Max","the porch","the sun"],"answer":"Max","tier":1,"why":"A character is a person or animal in the story. Max is a cat, so Max is the character. The porch and the sun are things, not characters."},{"prompt":"Story: A frog hopped into the pond. Who is the character?","choices":["the frog","the pond","a hop"],"answer":"the frog","tier":1,"why":"A character is a person or animal in the story. The frog is an animal that does something: it hops. The pond is where it happens."},{"prompt":"Story: Max the cat napped on the warm porch. What is the setting?","choices":["the porch","Max","a nap"],"answer":"the porch","tier":2,"why":"The setting is where the story happens. Max napped on the porch, so the porch is the setting. Max is the character."},{"prompt":"Who are the characters in a story?","choices":["The people or animals in it","Where it happens","The title"],"answer":"The people or animals in it","tier":2,"why":"Characters are the people or animals in a story. Where it happens is the setting, not the characters."},{"prompt":"What is the setting of a story?","choices":["Where and when it happens","Who is in it","The title"],"answer":"Where and when it happens","tier":3,"why":"The setting tells where and when a story happens. Who is in it means the characters, not the setting."},{"prompt":"Story: At night, Pip the owl flew over the dark forest. What is the setting?","choices":["the dark forest at night","Pip","flying"],"answer":"the dark forest at night","tier":3,"why":"The setting is where and when. Where: the dark forest. When: at night. Pip is the character, and flying is what Pip does."}]},"reinforcement":"Story elements return in every grade.","day":97,"subject":"Reading","sightPaceSeconds":20},{"id":"m-equal-groups","stage":"q4","part":2,"title":"Equal groups (challenge)","summary":"See multiplication as equal groups.","prerequisites":["m-skip-2","m-skip-5","m-doubles"],"lesson":{"explanation":"3 groups of 4 is 4 + 4 + 4 = 12. Skip counting finds the total fast.","example":"2 groups of 5 = 10","tutorSteps":["Make equal groups of cubes.","Skip count the groups.","Write as repeated addition."],"approaches":{"show":"Make 3 piles of 4 cubes. Touch each pile and skip count: 4, 8, 12. Write 4 + 4 + 4 = 12 and say: 3 groups of 4 is 12.","together":"Make 2 groups of 5 together. Ask: How many groups? How many in each group? Then skip count by 5 together: 5, 10. Write 5 + 5 = 10.","alone":"Have the child find 4 groups of 3 alone with cubes or drawings. Hint if stuck: draw 4 circles, put 3 dots in each, then count by threes."}},"practice":{"items":[{"prompt":"3 groups of 2 = ?","answer":"6","tier":1,"why":"3 groups of 2 means 2 + 2 + 2. Skip count by 2s: 2, 4, 6. So it is 6."},{"prompt":"2 groups of 5 = ?","answer":"10","tier":1,"why":"2 groups of 5 means 5 + 5. Skip count by 5s: 5, 10. So it is 10."},{"prompt":"4 groups of 3 = ?","answer":"12","tier":2,"why":"4 groups of 3 means 3 + 3 + 3 + 3. Skip count by 3s: 3, 6, 9, 12. So it is 12."},{"prompt":"5 groups of 2 = ?","answer":"10","tier":2,"why":"5 groups of 2 means 2 + 2 + 2 + 2 + 2. Skip count by 2s: 2, 4, 6, 8, 10. So it is 10."},{"prompt":"3 groups of 10 = ?","answer":"30","tier":3,"why":"3 groups of 10 means 10 + 10 + 10. Skip count by 10s: 10, 20, 30. So it is 30."},{"prompt":"4 + 4 + 4 is how many groups of 4?","answer":"3","tier":3,"why":"Count how many 4s are being added: 4, 4, 4. There are three of them, so it is 3 groups of 4."},{"prompt":"2 + 2 + 2 + 2 + 2 is how many groups of 2?","answer":"5","tier":3,"why":"Count how many 2s are being added: 2, 2, 2, 2, 2. There are five of them, so it is 5 groups of 2."}]},"reinforcement":"Multiplication in second and third grade.","day":98,"subject":"Math","sightPaceSeconds":8},{"id":"r-sequence","stage":"q4","part":2,"title":"Beginning, middle, end","summary":"Retell events in order.","prerequisites":["r-story-elements"],"lesson":{"explanation":"Stories happen in order. Use first, next, then, last to retell.","example":"First the seed is planted, next it sprouts, last it flowers.","tutorSteps":["Read a story.","Put picture cards in order.","Retell with first/next/then/last."],"approaches":{"show":"Lay out three picture cards for planting a seed, growing a sprout and a flower blooming. Put them in order while saying: First the seed is planted, next it sprouts, last it flowers.","together":"Do the cake order together: mix the batter, bake the cake, eat the cake. Ask: What has to happen first? What comes next? What comes last? Retell it together with first, next, last.","alone":"Have the child retell a favorite book alone using first, next, then, last. Hint if stuck: ask what happened at the very start of the book."}},"practice":{"items":[{"prompt":"Which word tells the end?","choices":["Last","First","Next"],"answer":"Last","tier":1,"why":"Last tells what happens at the very end. First tells the beginning, and next tells what comes after."},{"prompt":"Which word tells the beginning?","choices":["First","Last","Then"],"answer":"First","tier":1,"why":"First tells what happens at the very beginning. Last and then come later."},{"prompt":"Order: (A) eat the cake (B) bake the cake (C) mix the batter. What comes first?","choices":["C","B","A"],"answer":"C","tier":2,"why":"You have to mix the batter before you can bake it, and bake the cake before you eat it. So mixing the batter, letter C, comes first."},{"prompt":"Order: (A) the chick hatches (B) the hen lays an egg (C) the chick grows up. What comes first?","choices":["B","A","C"],"answer":"B","tier":2,"why":"A chick comes from an egg, so the hen must lay the egg first. That is letter B. Then the chick hatches and grows up."},{"prompt":"Retell your favorite book using first, next, then, last.","mode":"tutor","tier":3,"why":"Accept a retelling in the right order that uses first, next, then and last, like \"First the bear lost his hat. Next he asked a fox...\""},{"prompt":"Retell 'The Three Little Pigs': what happened at the beginning, the middle and the end?","mode":"tutor","tier":3,"why":"Accept the right order. Beginning: the pigs build houses of straw, sticks and bricks. Middle: the wolf blows down two houses. End: he cannot blow down the brick house."}]},"reinforcement":"Used in writing stories (narratives).","day":99,"subject":"Reading","sightPaceSeconds":20},{"id":"w-narrative","stage":"q4","part":2,"title":"Write a story","summary":"Write a short story with a beginning, middle and end.","prerequisites":["w-picture-sentence","r-sequence"],"lesson":{"explanation":"Tell what happened first, next and last. Use words like first, then, finally.","example":"First we went to the zoo. Then we saw a lion. Finally we ate ice cream.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write while talking: \"First we went to the zoo. Then we saw a lion. Finally we ate ice cream.\" Circle first, then and finally and say: these words keep my story in order.","together":"Write about this morning together. Ask: What did you do first? Write it. Ask: What happened then? Write it. Ask: What did you do finally? Read the 3 sentences back together.","alone":"Have the child write 3 sentences alone about a trip to the park, using first, then, finally. Hint if stuck: say the story out loud first, then write one sentence at a time."}},"practice":{"items":[{"prompt":"Which word tells what happens first?","choices":["First","Finally"],"answer":"First","tier":1,"why":"First tells what happens at the start of a story. Finally tells the end."},{"prompt":"Tell aloud one thing you did today, starting with 'First'.","mode":"tutor","tier":1,"why":"Accept one sentence that begins with \"First\" and tells something real, like \"First I ate breakfast.\""},{"prompt":"Which word tells the end of a story?","choices":["Finally","First","Then"],"answer":"Finally","tier":2,"why":"Finally tells what happens at the very end. First is the start and then is the middle."},{"prompt":"Say 3 sentences aloud about your morning using first, then, finally.","mode":"tutor","tier":2,"why":"Accept 3 sentences in order: one starting with first, one with then, one with finally. Example: \"First I woke up. Then I ate. Finally I went to school.\""},{"prompt":"Write 3 sentences about something you did: first, then, finally.","mode":"tutor","tier":3,"why":"Accept 3 written sentences in order, using first, then and finally, each with a capital letter and an end mark."},{"prompt":"Write a story about a day at the park with a beginning, middle and end.","mode":"tutor","tier":3,"why":"Accept a story with a beginning, middle and end in order, like arriving at the park, playing on the slide, then going home."}]},"reinforcement":"Story writing every year.","day":100,"subject":"Writing","sightPaceSeconds":60},{"id":"ss-timeline","stage":"q4","part":2,"title":"Timelines","summary":"Put events in order on a timeline.","prerequisites":["ss-then-now","r-sequence"],"lesson":{"explanation":"A timeline shows events in the order they happened, from first to last.","example":"Baby → toddler → first grade","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Draw a line on paper with an arrow at the right end. Put baby on the left, then toddler, then first grade, and say: a timeline goes from first to last, left to right.","together":"Make a timeline of today together. Ask: What did you do first this morning? Draw it on the left. Ask: What came next? Keep going until bedtime is at the right end.","alone":"Have the child make a timeline of their life with 4 events alone. Hint if stuck: start with being born on the left and end with first grade on the right."}},"practice":{"items":[{"prompt":"Which came first?","choices":["Being a baby","Starting first grade"],"answer":"Being a baby","tier":1,"why":"Everyone is a baby first. You grow for years before you start first grade."},{"prompt":"Which happens first in a day?","choices":["Waking up","Going to bed"],"answer":"Waking up","tier":1,"why":"You wake up in the morning and go to bed at night. Morning comes first."},{"prompt":"A timeline shows events in order from…","choices":["First to last","Last to first"],"answer":"First to last","tier":2,"why":"A timeline starts with what happened first and moves to what happened last, like reading left to right."},{"prompt":"Put in order: toddler, baby, first grader. Which goes in the middle?","choices":["Toddler","Baby","First grader"],"answer":"Toddler","tier":2,"why":"The order is baby, then toddler, then first grader. Toddler is in the middle."},{"prompt":"Make a timeline of your life with 4 events.","mode":"tutor","tier":3,"why":"Accept 4 events from the child's life in the right order, like being born, learning to walk, starting school, first grade."},{"prompt":"Make a timeline of your day with 4 events, from morning to night.","mode":"tutor","tier":3,"why":"Accept 4 events in order from morning to night, like waking up, eating breakfast, going to school, going to bed."}]},"reinforcement":"Uses sequencing from reading.","day":101,"subject":"Social Studies","sightPaceSeconds":15},{"id":"w-how-to","stage":"q4","part":3,"title":"How-to writing","summary":"Write steps to do something.","prerequisites":["w-narrative"],"lesson":{"explanation":"Name the topic, list steps in order with first, next, last.","example":"How to brush teeth: First put on toothpaste. Next brush. Last rinse.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write while talking: \"How to brush teeth. First put on toothpaste. Next brush. Last rinse.\" Point to the title and the order words and say: the title names the topic, and the steps go in order.","together":"Write how to make a sandwich together. Ask: What is our title? What do you do first? (get bread) Next? (spread peanut butter) Last? (put the bread on top) Write each step as the child says it.","alone":"Have the child write 3 steps for washing hands alone. Hint if stuck: act it out at the sink and say each step as you do it."}},"practice":{"items":[{"prompt":"Which word tells the first step?","choices":["First","Last"],"answer":"First","tier":1,"why":"First tells the step you do at the start. Last tells the step at the end."},{"prompt":"Which word tells the last step?","choices":["Last","First","Next"],"answer":"Last","tier":1,"why":"Last tells the final step. First is the start, and next is a middle step."},{"prompt":"Write 3 steps for making a sandwich.","mode":"tutor","tier":2,"why":"Accept 3 steps in an order that works, like \"First get bread. Next add peanut butter. Last put the bread together.\""},{"prompt":"Say aloud 3 steps for washing your hands.","mode":"tutor","tier":2,"why":"Accept 3 steps in order, like \"First wet your hands. Next rub with soap. Last rinse and dry.\""},{"prompt":"Write how to brush your teeth: give it a title, then write steps with first, next, last.","mode":"tutor","tier":3,"why":"Accept a title like \"How to Brush Your Teeth\" and steps in order using first, next and last, like put on toothpaste, brush, rinse."},{"prompt":"Write how to plant a seed: give it a title, then write steps with first, next, last.","mode":"tutor","tier":3,"why":"Accept a title like \"How to Plant a Seed\" and steps in order using first, next and last, like dig a hole, put in the seed, add water."}]},"reinforcement":"Informational writing later.","day":102,"subject":"Writing","sightPaceSeconds":60},{"id":"m-mult-5","stage":"q4","part":3,"title":"Multiplication facts to 5 × 5 (challenge)","summary":"Multiply small numbers at sight pace.","prerequisites":["m-equal-groups"],"lesson":{"explanation":"× means 'groups of'. 3 × 4 means 3 groups of 4.","example":"4 × 5 = 20","tutorSteps":["Build arrays with cubes.","Skip count rows.","Flash practice."],"approaches":{"show":"Build 3 rows of 4 cubes. Point to each row and skip count 4, 8, 12. Write 3 × 4 = 12 and say: 3 groups of 4 is 12.","together":"Build 4 × 5 together. Ask: How many rows? How many in each row? Skip count by 5 together: 5, 10, 15, 20. So 4 × 5 = 20.","alone":"Have the child solve 2 × 5 alone. Hint if stuck: hold up 2 hands and count all the fingers by fives."}},"practice":{"generator":"mul","params":{"max":5}},"reinforcement":"Full times tables in third grade.","day":103,"subject":"Math","sightPaceSeconds":5},{"id":"s-materials","stage":"q4","part":3,"title":"Materials","summary":"Sort objects by what they are made of.","prerequisites":["s-senses"],"lesson":{"explanation":"Objects are made of materials like wood, metal, plastic, glass and cloth. Materials have properties: hard, soft, bendy, clear.","example":"A window is glass — it is clear.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Set out a metal spoon, a wooden block, a glass cup and a cloth sock. Name what each is made of and one property: the spoon is metal and hard, the sock is cloth and soft.","together":"Sort objects together. Hold up a window or a glass jar and ask: Can you see through it? What is it made of? Then hold up a sock and ask: Is it hard or soft? Bendy or stiff?","alone":"Have the child find something made of wood alone and tell one property. Hint if stuck: look at chairs, tables or pencils."}},"practice":{"items":[{"prompt":"A spoon is often made of…","choices":["Metal","Cloth"],"answer":"Metal","tier":1,"why":"Spoons are usually metal because metal is hard and strong. Cloth is soft and floppy, so it could not hold soup."},{"prompt":"Which can you see through?","choices":["Glass","Wood"],"answer":"Glass","tier":1,"why":"Glass is clear, so light goes through it and you can see through it. Wood blocks the light."},{"prompt":"Which is soft?","choices":["Cotton","Rock","Glass"],"answer":"Cotton","tier":2,"why":"Cotton feels soft and squis
