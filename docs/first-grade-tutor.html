<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a workbook page on faint graph paper; sticky title bar; big touch targets. */
:root {
  --paper: #f5f8fa;
  --grid: rgba(31, 79, 163, 0.06);
  --surface: #ffffff;
  --ink: #15232e;
  --muted: #5b6b78;
  --line: #dbe3ea;
  --accent: #1f4fa3;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefb;
  --pencil: #f2b705;
  --good: #23864f;
  --warn: #c8641a;
  --lv-new: #a3adb6;
  --lv-learning: #e07a1f;
  --lv-passing: #c9a400;
  --lv-mastered: #2e9d5b;
  --lv-sight: #6a4bd1;
  --font: "Lexend", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161c; --grid: rgba(111, 155, 255, 0.05); --surface: #17212a; --ink: #e7edf2; --muted: #93a3b0;
    --line: #26333e; --accent: #6f9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --pencil: #f2c230;
    --good: #4cc27f; --warn: #f0954a; --lv-new: #5d6b77; --lv-learning: #f0954a; --lv-passing: #e2c23a;
    --lv-mastered: #4cc27f; --lv-sight: #9a82ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161c; --grid: rgba(111, 155, 255, 0.05); --surface: #17212a; --ink: #e7edf2; --muted: #93a3b0;
  --line: #26333e; --accent: #6f9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --pencil: #f2c230;
  --good: #4cc27f; --warn: #f0954a; --lv-new: #5d6b77; --lv-learning: #f0954a; --lv-passing: #e2c23a;
  --lv-mastered: #4cc27f; --lv-sight: #9a82ff; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: minmax(80px, 1fr) auto minmax(80px, 1fr); align-items: center; gap: 8px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-title { margin: 0; font-size: 1.05rem; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.bar-right { justify-self: end; }
.nav-btn { background: none; border: 0; color: var(--accent); font-weight: 500; padding: 6px 2px; justify-self: start; }

/* Page */
.wrap { max-width: 640px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.center { text-align: center; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.block { display: block; }
.grow { flex: 1; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.warn { color: var(--warn); }
.pad { padding: 16px; }
h2, h3, h4 { margin: 0; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.display { font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
.eyebrow { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.notice { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; font-size: 0.9rem; }
.error { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.list > * + * { border-top: 1px solid var(--line); }
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 4px 8px; font-size: 0.82rem;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

/* Today card: the one emphasized object on each home screen */
.today { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--pencil); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.today .btn { align-self: stretch; margin-top: 6px; }
.intro { display: flex; flex-direction: column; gap: 6px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-align: center; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 54px; font-size: 1.1rem; padding: 10px 22px; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 0.88rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.wide { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.center-row { justify-content: center; }
.ok-btn { background: var(--good); border-color: var(--good); color: #fff; }
.warn-btn { color: var(--warn); border-color: var(--warn); }
.icon-btn { background: none; border: 0; color: var(--muted); width: 44px; height: 44px; border-radius: 10px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.link-row, .skill-row, .stage-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; min-height: 44px; }
.link-row { justify-content: space-between; border-top: 1px solid var(--line); }
.skill-row, .stage-row { padding: 12px 16px; }
.stage-row { flex-direction: column; align-items: stretch; gap: 6px; }
.stage-top { display: flex; justify-content: space-between; gap: 8px; }

.row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.meter { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; background: var(--lv-new); }
.dot.lv-learning { background: var(--lv-learning); }
.dot.lv-passing { background: var(--lv-passing); }
.dot.lv-mastered { background: var(--lv-mastered); }
.dot.lv-sight { background: var(--lv-sight); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Learners */
.learner { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 0; }
.learner-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; text-align: left; padding: 10px 16px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; flex: none; }
.confirm { display: flex; gap: 4px; }
.add-row { display: flex; gap: 10px; }
.add-row .field { flex: 1; min-width: 0; }
.field { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 44px; width: 100%; }
textarea.field { font-size: 0.8rem; font-family: ui-monospace, Menlo, monospace; resize: vertical; }

/* Lessons */
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.lesson h3 { font-size: 1.25rem; }
.lesson.compact { background: var(--accent-soft); border-color: transparent; align-self: stretch; }
.lesson.compact h3 { font-size: 1rem; }
.lesson ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.example { background: var(--paper); border-left: 3px solid var(--pencil); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.label { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.subj { color: var(--accent); }
.approaches { display: flex; flex-direction: column; gap: 8px; }
.approaches h4:empty { display: none; }
.approaches ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; }
.approach-now { background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.stage-approaches summary { cursor: pointer; min-height: 28px; }
.stage-approaches[open] summary { margin-bottom: 10px; }
.parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.part { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.part .small:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.terms { margin: 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface);
  display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; text-align: left; align-self: stretch; }
.terms div { display: flex; gap: 8px; }
.terms dt { font-weight: 600; flex: none; min-width: 3.2em; }
.terms dd { margin: 0; color: var(--muted); min-width: 0; }

/* Practice */
.practice { display: flex; flex-direction: column; gap: 16px; }
.practice-head { display: flex; align-items: center; gap: 12px; }
.practice-head > div { flex: 1; min-width: 0; }
.count { font-weight: 600; }
.timer { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.timer span { display: block; height: 100%; background: var(--good); transition: width 0.25s linear; }
.timer span.late { background: var(--pencil); }
.prompt { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 600; line-height: 1.25; text-align: center; white-space: pre-line; overflow-wrap: anywhere; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.choice { min-height: 64px; font-size: 1.35rem; font-weight: 500; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); padding: 8px; }
.choice:active, .key:active { background: var(--accent-soft); border-color: var(--accent); }
.answer-box { min-height: 64px; font-size: 2rem; font-weight: 600; text-align: center; border-bottom: 3px solid var(--accent); padding: 6px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; width: 100%; margin: 0 auto; }
.key { min-height: 48px; font-size: 1.5rem; font-weight: 500; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.key.alt { background: var(--accent-soft); }
.big-field { font-size: 1.5rem; text-align: center; }
.feedback { align-items: center; text-align: center; }
.feedback.good .display { color: var(--good); }
.feedback.miss .display { color: var(--warn); }
.answer-reveal { font-size: 1.25rem; }
.answer-reveal .given { color: var(--warn); }
.why { align-self: stretch; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pencil);
  border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.big-num { font-size: 1.6rem; font-weight: 600; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; max-width: calc(100% - 32px);
  transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .timer span, #toast { transition: none; } }

</style>
</head>

<script>window.CURRICULUM = {"id":"first-grade","title":"First Grade Tutor","version":1,"glossary":[{"term":"CVC","meaning":"consonant-vowel-consonant: a three-letter word with a vowel in the middle, like cat, dog or sun"}],"stages":[{"id":"q1","title":"Days 1–28","order":1,"level":"Grade 1","description":"First quarter","approaches":{"show":"Across days 1 to 28, keep a box of 20 counters, a 120 chart, a letter card for each sound and a few real objects (a plant, a globe, a ball) on the table. Before each new skill, model it once out loud: touch and count 14 counters, run your finger down the tens column of the 120 chart, or tap each sound in c-a-t and slide them together into cat.","together":"Each day, do the first problem of the new skill side by side, taking turns: you count to 7, the child counts on to 12; you say /sh/, the child reads ship. Ask one question at each step, such as: What number comes next? What sound does this letter make?","alone":"End each day with one task the child does alone, such as counting 18 buttons, reading pen, hen, ten, or writing The dog runs. with a capital and a period. Give at most one hint, then note any skill that needs another day before moving on."}},{"id":"q2","title":"Days 29–55","order":2,"level":"Grade 1","description":"Second quarter","approaches":{"show":"Across days 29 to 55, demonstrate each new idea with real things before asking for it: two ten frames and counters for doubles and make-ten, word cards like cap and cape to show silent e, and a bean plant in a cup for what plants need. Say each step out loud, for example: 8 plus 2 fills the ten, 3 more makes 13.","together":"Work one example side by side for each skill this quarter, taking turns. For 7 + 8, ask: Which double is close? 7 + 7 is 14, so what is one more? For the word boat, you point to oa and the child says the long o sound, then you blend it together.","alone":"Let the child try one item from each skill without help, such as reading rain, day, paint, writing a question that ends with ?, or solving 14 - 6. Offer one hint only if stuck, like: make a ten first, or: the first vowel says its name."}},{"id":"q3","title":"Days 56–83","order":3,"level":"Grade 1","description":"Third quarter","approaches":{"show":"Across days 56 to 83, demonstrate with real things before every new idea: tens rods and a 120 chart for adding and taking away tens, a toy clock for time, paper clips for measuring, and word cards for endings like -s, -ed and -ing. Think out loud, for example: 47 plus 30, only the tens change, 4 tens and 3 tens make 7 tens, so 77.","together":"Run each lesson this quarter as a shared problem: you do one step, the child does the next. For example, read 'jumped' together and ask which sound the -ed makes, or sort a toothbrush and a haircut into goods and services, asking 'Can you hold it?' before deciding.","alone":"End each lesson with one problem the child tries alone, such as 68 minus 40, spelling 'pig', or naming the coldest season. Give only one small hint if stuck, like 'cover the ones and look at the tens', then let the child finish on their own."}},{"id":"q4","title":"Days 84–110","order":4,"level":"Grade 1","description":"Fourth quarter","approaches":{"show":"Across days 84 to 110, demonstrate with real things: pluck a rubber band for sound, a flashlight for shadows, real coins, paper folding for halves and fourths, cubes in equal groups, and writing a model opinion, story or how-to on paper while talking.","together":"Do one example of each new skill side by side: count 1 dime and 2 nickels together, sort household objects into cubes and cylinders, read a short story and ask who and where, and write a first, then, finally story by taking turns on each sentence.","alone":"Let the child try each skill alone first: flash a sight word set, read a tally chart, name a hexagon's sides, write a journal entry. Give one hint only if stuck, such as \"start counting with the biggest coin\" or \"what thing is in every sentence?\""}}],"skills":[{"id":"m-count-20","stage":"q1","part":1,"title":"Count objects to 20","summary":"Count a group by touching each object once.","prerequisites":[],"lesson":{"explanation":"Each object gets exactly one number. The last number you say tells how many.","example":"● ● ● ● ● ● ● = 7","tutorSteps":["Lay out 5–20 small objects in a row.","Touch and count each one aloud.","Ask: how many in all? (the last number said)"],"approaches":{"show":"Line up 13 buttons. Touch each one as you say a number, sliding it to the side once counted, and stop at the last button. Say: The last number I said was 13, so there are 13 buttons.","together":"Count 9 pennies together. You touch and say 1, 2, 3, then the child touches and says 4, 5, 6, and you finish 7, 8, 9. Ask: Did we touch any penny twice? What was the last number? So how many pennies?","alone":"Have the child count a pile of 17 dried beans alone and say how many. Hint if stuck: move each bean into a cup as you count it so none get counted twice."}},"practice":{"generator":"count","params":{"max":20}},"reinforcement":"Used every day when counting dots, coins and tallies.","day":1,"subject":"Math","sightPaceSeconds":6},{"id":"r-letter-sounds","stage":"q1","part":1,"title":"Letter sounds review","summary":"Say the sound of every letter quickly.","prerequisites":[],"lesson":{"explanation":"Each letter stands for a sound. Knowing them by sight makes reading fast.","example":"b says /b/ as in bat","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Hold up the letter card b and say /b/ with a short, clipped sound (not buh), then say bat and point to the b. Do the same with m (/m/ in moon) and s (/s/ in sun).","together":"Go through the cards p, n, d together. For each card ask: What sound does this letter make? Then ask: Can you think of a word that starts with that sound? Say the sound together, then the word, such as /p/ pig.","alone":"Have the child read the cards c, h, j, k, r alone, saying only the sounds. Hint if stuck: say a word that starts with the sound, such as cat for c, and let them hear the first sound."}},"practice":{"items":[{"prompt":"Read aloud: m, s, t, b, f","mode":"tutor","tier":1,"why":"Each letter has its own sound: m says /m/, s says /s/, t says /t/, b says /b/, f says /f/. Accept the letter sounds, not the letter names, said clearly."},{"prompt":"Read aloud: p, n, d, g, l","mode":"tutor","tier":2,"why":"Listen for the sounds: p says /p/, n says /n/, d says /d/, g says /g/ as in goat, l says /l/. Accept quick, clear sounds, not letter names."},{"prompt":"Read aloud: c, h, j, k, r","mode":"tutor","tier":2,"why":"Listen for the sounds: c says /k/ as in cat, h says /h/, j says /j/, k says /k/, r says /r/. Accept a short, clean sound for each one."},{"prompt":"Read aloud: v, w, x, y, z","mode":"tutor","tier":3,"why":"Listen for the sounds: v says /v/, w says /w/, y says /y/ as in yes, z says /z/. The letter x usually says /ks/ as in fox, so accept /ks/ for x."},{"prompt":"Which word starts with the /m/ sound?","choices":["moon","sun","top"],"answer":"moon","tier":1,"why":"Moon starts with the /m/ sound: mmm-oon. Sun starts with /s/ and top starts with /t/, so moon is the only m word."},{"prompt":"Which word starts with the /s/ sound?","choices":["sun","map","top"],"answer":"sun","tier":1,"why":"Sun starts with /s/, like a snake hissing: sss-un. Map starts with /m/ and top starts with /t/."},{"prompt":"Read aloud as fast as you can: a, e, i, o, u, q","mode":"tutor","tier":3,"why":"These are the short vowel sounds: a as in apple, e as in egg, i as in itch, o as in octopus, u as in up. The letter q almost always comes with u and says /kw/ as in queen. Accept clear sounds said quickly."},{"prompt":"Read aloud fast: b, d, p, q, g","mode":"tutor","tier":3,"why":"These letters look alike, so go slowly at first: b says /b/, d says /d/, p says /p/, q says /kw/, g says /g/. Accept each sound correct with no mix-ups between b and d or p and q."}]},"reinforcement":"Every later reading skill uses these sounds.","day":2,"subject":"Reading","sightPaceSeconds":10},{"id":"w-letters","stage":"q1","part":1,"title":"Letter formation","summary":"Write every lowercase and capital letter correctly.","prerequisites":[],"lesson":{"explanation":"Start letters at the top. Tall letters touch the top line; tails go below.","example":"b d p q are different!","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"On lined paper, write a lowercase b slowly while you talk: Start at the top line, pull straight down, bounce back up and go around to make the tummy. Then write d and point out that d starts with the round part first.","together":"Write the capital T together: you draw the line down from the top while the child watches, then the child adds the line across the top. Ask: Where do we start? Does it touch the top line? Then switch: the child writes it whole while you watch.","alone":"Have the child write g, j, p, q, y alone. Hint if stuck: remind them that these letters have tails that hang below the bottom line."}},"practice":{"items":[{"prompt":"Write the lowercase alphabet. Tutor checks b/d/p/q.","mode":"tutor","tier":3,"why":"All 26 small letters, a to z, should start at the top. Check that b has its bump on the right, d has its bump on the left, and p and q have tails that go below the line."},{"prompt":"Write the capital alphabet.","mode":"tutor","tier":2,"why":"All 26 capital letters, A to Z, should be tall and touch the top line. Accept letters that start at the top and face the right way, like E and S not backwards."},{"prompt":"Write these capitals: L, T, H, E","mode":"tutor","tier":1,"why":"These capitals are made with straight lines that start at the top: L is down and across, T is across the top and down the middle, H is two tall lines and a bridge, E is a tall line and three across. Accept letters that stand tall and face the right way."},{"prompt":"Trace and then write: a, c, o","mode":"tutor","tier":1,"why":"The letters a, c and o all start with a round curve that begins near the top and goes around to the left, like a clock going backwards. Accept round, closed shapes for a and o and an open shape for c."},{"prompt":"Write these tall letters: b, d, h, k, l, t","mode":"tutor","tier":2,"why":"Tall letters reach up to the top line: b, d, h, k, l and t all have a tall stick. Accept letters where the stick touches the top line and the rest sits on the bottom line."},{"prompt":"Write these tail letters so the tails go below the line: g, j, p, q, y","mode":"tutor","tier":2,"why":"Tail letters hang below the line, like a monkey tail: g, j, p, q and y. Accept letters whose tails clearly dip under the bottom line."},{"prompt":"Write b, d, p, q side by side and tell how each one is different.","mode":"tutor","tier":3,"why":"All four use a stick and a circle, but they point different ways. A good answer sounds like: b has the bump on the right at the bottom, d has the bump on the left, p has a tail down with the bump on the right, q has a tail down with the bump on the left."}]},"reinforcement":"Neat letters are needed for all writing.","day":3,"subject":"Writing","sightPaceSeconds":60},{"id":"m-count-120","stage":"q1","part":1,"title":"Count to 120","summary":"Say the number before and after any number up to 120.","prerequisites":["m-count-20"],"lesson":{"explanation":"Numbers follow a pattern: after 9 comes a new ten. 29 → 30, 99 → 100, 109 → 110.","example":"Just after 59 is 60. Just before 100 is 99.","tutorSteps":["Count aloud from a starting number other than 1 (for example, 47).","Use a 120 chart and point.","Quiz: just before / just after."],"approaches":{"show":"Point to 47 on the 120 chart and count aloud as you move your finger: 47, 48, 49, 50. Stop at 49 and say: After 9 in the ones place comes a new ten, so 49 goes to 50.","together":"Count together from 96 to 104 on the 120 chart, taking turns saying one number each. At 99 ask: What comes after 99? Then at 100 ask: What is just before 100?","alone":"Ask the child alone: What number comes just after 109? Hint if stuck: put a finger on 109 on the 120 chart and slide one box to the right, or to the next row."}},"practice":{"generator":"numberAfter","params":{"max":120}},"reinforcement":"Comes back in place value and adding 10.","day":4,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-a","stage":"q1","part":1,"title":"Short a","summary":"Read words with the short a sound.","prerequisites":["r-letter-sounds"],"lesson":{"explanation":"Short a sounds like /a/ in apple.","example":"cat, map, ham","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Say /a/ like the start of apple, then write cat and run your finger under it: /c/ /a/ /t/, cat. Do the same with map and ham, stretching the middle /a/ each time.","together":"Read bag together. Ask: What is the first sound? (/b/) What sound does the a make? (/a/ like apple) What is the last sound? (/g/) Then slide the sounds together and say bag in a sentence.","alone":"Have the child read fan, tap, jam alone. Hint if stuck: point to the a and say: This says /a/ like in apple."}},"practice":{"items":[{"prompt":"Read aloud: cat, map, sad, ham","mode":"tutor","tier":2,"why":"Each word has short a in the middle, like in apple: c-a-t, m-a-p, s-a-d, h-a-m. Accept smooth blending with the /a/ sound, not the long a in cake."},{"prompt":"Read aloud: bag, fan, tap, jam","mode":"tutor","tier":2,"why":"Each word has the short a sound in the middle: b-a-g, f-a-n, t-a-p, j-a-m. Accept smooth blending without long stops between sounds."},{"prompt":"Which word has short a?","choices":["hat","hot","hit"],"answer":"hat","tier":1,"why":"Hat has the /a/ sound like in apple: h-a-t. Hot has an o sound and hit has an i sound."},{"prompt":"Which word has the /a/ sound like in apple?","choices":["cap","cup","cop"],"answer":"cap","tier":1,"why":"Cap has the /a/ sound like in apple: c-a-p. Cup has the /u/ sound and cop has the /o/ sound."},{"prompt":"Read aloud: ran, wag, pat, cab, lad","mode":"tutor","tier":3,"why":"Each word has short a in the middle: r-a-n, w-a-g, p-a-t, c-a-b, l-a-d. Accept all five read with the /a/ sound and smooth blending."},{"prompt":"Read this sentence aloud: The cat had a bag.","mode":"tutor","tier":3,"why":"Cat, had and bag all have short a, like in apple. Accept the whole sentence read smoothly, with the words The and a read by sight."}]},"reinforcement":"Short vowels return in every word family.","day":5,"subject":"Reading","sightPaceSeconds":10},{"id":"s-senses","stage":"q1","part":1,"title":"Five senses","summary":"Learn sight, hearing, smell, taste and touch.","prerequisites":[],"lesson":{"explanation":"We learn about the world with 5 senses: eyes see, ears hear, nose smells, tongue tastes, skin feels.","example":"We hear thunder with our ears.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Hold an orange. Say: I see it is orange with my eyes, I feel it is bumpy with my skin, I smell it with my nose. Peel a piece and say: I taste it is sweet with my tongue, and I hear the peel rip with my ears.","together":"Use a bell together. Ring it and ask: Which sense tells you it rang? Which body part? Then let the child hold it and ask: Is it cold or warm? Which sense told you that?","alone":"Have the child close their eyes while you hold a lemon under their nose and ask alone: Which sense are you using right now? Hint if stuck: ask which body part is doing the work."}},"practice":{"items":[{"prompt":"Which sense uses your nose?","choices":["Smell","Taste","Touch"],"answer":"Smell","tier":1,"why":"Your nose is how you smell things, like cookies baking. You taste with your tongue and touch with your skin."},{"prompt":"How many senses do we have?","answer":"5","tier":2,"why":"We have 5 senses: sight, hearing, smell, taste and touch. Count them on one hand, one finger for each."},{"prompt":"You feel a soft blanket with your sense of…","choices":["Touch","Sight","Hearing"],"answer":"Touch","tier":2,"why":"Your skin feels things, so touching tells you a blanket is soft. Sight is for seeing and hearing is for sounds."},{"prompt":"Which body part do you see with?","choices":["Eyes","Ears","Nose"],"answer":"Eyes","tier":1,"why":"Your eyes are what you see with. Ears are for hearing and your nose is for smelling."},{"prompt":"You hear a dog bark. Which sense are you using?","choices":["Hearing","Taste","Sight"],"answer":"Hearing","tier":2,"why":"A bark is a sound, and sounds come in through your ears, so you are using hearing. You could see the dog, but sight does not hear the bark."},{"prompt":"Which sense tells you a lemon is sour?","choices":["Taste","Hearing","Sight"],"answer":"Taste","tier":3,"why":"Sour is a taste, and you taste with your tongue. You could see that a lemon is yellow, but seeing cannot tell you it is sour."},{"prompt":"Name all five senses and the body part for each one.","mode":"tutor","tier":3,"why":"A full answer names five: sight with eyes, hearing with ears, smell with nose, taste with tongue, and touch with skin. Accept hands for touch too."}]},"reinforcement":"Used for observing in every experiment.","day":6,"subject":"Science","sightPaceSeconds":15},{"id":"ss-rules","stage":"q1","part":1,"title":"Rules and why we have them","summary":"Rules keep us safe and fair.","prerequisites":[],"lesson":{"explanation":"Rules tell us how to act. They keep people safe and treat everyone fairly.","example":"We walk in the hallway so no one gets hurt.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Tell about one real rule: We walk in the hallway. Then act it out: run a few steps and pretend to bump into a chair, and say: Running could hurt someone, so the rule keeps us safe.","together":"Talk through the rule Take turns on the swing together. Ask: What would happen if one child never got off? Is that fair? So why do we have this rule?","alone":"Ask the child alone: Why do we wash our hands before we eat? Hint if stuck: ask what germs could do if they get in our food."}},"practice":{"items":[{"prompt":"Why do we have rules?","choices":["To stay safe and be fair","To make people sad"],"answer":"To stay safe and be fair","tier":1,"why":"Rules help keep us safe and make things fair for everyone. Good rules are not made to make people sad."},{"prompt":"Name two rules at home.","mode":"tutor","tier":2,"why":"Accept any two real home rules, like brush your teeth, put your toys away, or no jumping on the bed. A strong answer also says why the rule helps."},{"prompt":"Which is a safe rule?","choices":["Walk in the hallway","Run with scissors"],"answer":"Walk in the hallway","tier":1,"why":"Walking in the hallway keeps people from bumping and falling. Running with scissors could hurt someone, so it is not safe."},{"prompt":"Which rule is fair?","choices":["Take turns on the slide","Only the biggest kid gets the slide"],"answer":"Take turns on the slide","tier":2,"why":"Taking turns lets everyone get a chance on the slide, which is fair. If only the biggest kid gets it, the others never get a turn."},{"prompt":"Tell why we wait for the walk sign before we cross the street.","mode":"tutor","tier":3,"why":"A good answer says the walk sign means cars should be stopped, so it is safe to cross. Waiting keeps us from being hit by a car."},{"prompt":"Make up a new rule for play time and tell how it keeps people safe or fair.","mode":"tutor","tier":3,"why":"Accept any rule that makes sense for play time, like take turns with the ball or stay where a grown-up can see you. The child should say how it keeps people safe or makes things fair."}]},"reinforcement":"Laws and government later.","day":7,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-skip-10","stage":"q1","part":1,"title":"Count by 10s","summary":"Skip count by tens to 120.","prerequisites":["m-count-120"],"lesson":{"explanation":"Counting by 10s jumps one whole row on the 120 chart: 10, 20, 30…","example":"40, 50, 60, 70","tutorSteps":["Count bundles of 10 straws.","Chant 10 to 120.","Start at a ten other than 10."],"approaches":{"show":"Lay out 6 bundles of 10 straws. Slide them over one at a time, saying 10, 20, 30, 40, 50, 60. Then point down the tens column of the 120 chart and say the same numbers.","together":"Count bundles of 10 straws together starting at 30, taking turns: you say 30, the child says 40, you say 50. Ask: How many straws did we add each time? What comes after 90?","alone":"Have the child count by 10s alone from 50 to 120. Hint if stuck: point to the tens column on the 120 chart and slide down one row at a time."}},"practice":{"generator":"countBy","params":{"step":10,"max":120}},"reinforcement":"Used for 10 more / 10 less and adding tens.","day":8,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-i","stage":"q1","part":1,"title":"Short i","summary":"Read words with the short i sound.","prerequisites":["r-short-a"],"lesson":{"explanation":"Short i sounds like /i/ in itch.","example":"pig, sit, win","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Say /i/ like the start of itch, then write pig and run your finger under it: /p/ /i/ /g/, pig. Do the same with sit and win.","together":"Read fix together. Ask: What is the first sound? (/f/) What does the i say? (/i/ like itch) What is the last sound? (/ks/) Slide the sounds together and use fix in a sentence.","alone":"Have the child read big, hid, mix alone. Hint if stuck: point to the i and scratch your arm as a reminder of /i/ in itch."}},"practice":{"items":[{"prompt":"Read aloud: pig, sit, win, lip","mode":"tutor","tier":2,"why":"Each word has short i in the middle, like in itch: p-i-g, s-i-t, w-i-n, l-i-p. Accept smooth blending with /i/, not the long i in bike."},{"prompt":"Read aloud: big, fix, hid, mix","mode":"tutor","tier":2,"why":"Each word has short i in the middle: b-i-g, f-i-x, h-i-d, m-i-x. In fix and mix, the x says /ks/ at the end. Accept smooth blending."},{"prompt":"Which word has short i?","choices":["pin","pan","pen"],"answer":"pin","tier":1,"why":"Pin has the /i/ sound like in itch: p-i-n. Pan has the a sound and pen has the e sound, which sounds close to i, so listen carefully."},{"prompt":"Which word has the /i/ sound like in itch?","choices":["sip","sap","sup"],"answer":"sip","tier":1,"why":"Sip has the /i/ sound like in itch: s-i-p. Sap has the /a/ sound and sup has the /u/ sound."},{"prompt":"Read aloud: rib, kit, dig, zip, wig","mode":"tutor","tier":3,"why":"Each word has short i in the middle: r-i-b, k-i-t, d-i-g, z-i-p, w-i-g. Accept all five read smoothly with the /i/ sound."},{"prompt":"Read this sentence aloud: The pig sits in a big pit.","mode":"tutor","tier":3,"why":"Pig, sits, big and pit all have short i. Accept the sentence read smoothly, with the s on the end of sits."}]},"reinforcement":"Compare with short e later.","day":9,"subject":"Reading","sightPaceSeconds":10},{"id":"m-skip-5","stage":"q1","part":1,"title":"Count by 5s","summary":"Skip count by fives to 100.","prerequisites":["m-skip-10"],"lesson":{"explanation":"Counting by 5s: every number ends in 5 or 0.","example":"15, 20, 25, 30","tutorSteps":["Count fingers on hands by 5s.","Count nickels by 5s.","Chant to 100."],"approaches":{"show":"Hold up your two hands and touch each one as you count by 5s: 5, 10. Then line up 6 nickels and slide them over, saying 5, 10, 15, 20, 25, 30, and point out that each number ends in 5 or 0.","together":"Count by 5s together on the 120 chart starting at 20, taking turns: you say 20, the child says 25, you say 30. Ask: What does each number end with? What comes after 45?","alone":"Have the child count by 5s alone from 50 to 100. Hint if stuck: remind them the ones digit goes 5, then 0, then 5, then 0."}},"practice":{"generator":"countBy","params":{"step":5,"max":100}},"reinforcement":"Used for nickels, clocks and multiplying by 5.","day":10,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-o","stage":"q1","part":2,"title":"Short o","summary":"Read words with the short o sound.","prerequisites":["r-short-i"],"lesson":{"explanation":"Short o sounds like /o/ in octopus.","example":"hot, dog, mop","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Open your mouth wide and say /o/ like the start of octopus, then write hot and run your finger under it: /h/ /o/ /t/, hot. Do the same with dog and mop.","together":"Read log together. Ask: What is the first sound? (/l/) What does the o say? (/o/ like octopus) What is the last sound? (/g/) Then slide them together and use log in a sentence.","alone":"Have the child read pot, rod, top alone. Hint if stuck: say: Open wide like a doctor visit and say /o/."}},"practice":{"items":[{"prompt":"Read aloud: hot, dog, mop, fox","mode":"tutor","tier":2,"why":"Each word has short o in the middle, like in octopus: h-o-t, d-o-g, m-o-p, f-o-x. Accept smooth blending, with x saying /ks/ in fox."},{"prompt":"Read aloud: log, pot, rod, top","mode":"tutor","tier":2,"why":"Each word has short o in the middle: l-o-g, p-o-t, r-o-d, t-o-p. Accept smooth blending with the /o/ sound."},{"prompt":"Which word has short o?","choices":["cot","cut","cat"],"answer":"cot","tier":1,"why":"Cot has the /o/ sound like in octopus: c-o-t. Cut has the /u/ sound and cat has the /a/ sound."},{"prompt":"Which word has the /o/ sound like in octopus?","choices":["hop","hip","hug"],"answer":"hop","tier":1,"why":"Hop has the /o/ sound like in octopus: h-o-p. Hip has the /i/ sound and hug has the /u/ sound."},{"prompt":"Read aloud: cob, nod, jot, hog, sob","mode":"tutor","tier":3,"why":"Each word has short o in the middle: c-o-b, n-o-d, j-o-t, h-o-g, s-o-b. Accept all five read smoothly with the /o/ sound."},{"prompt":"Read this sentence aloud: The dog got on top of the box.","mode":"tutor","tier":3,"why":"Dog, got, on, top and box all have short o. Accept the sentence read smoothly, with The, of and the read by sight."}]},"reinforcement":"Returns in blends and endings.","day":11,"subject":"Reading","sightPaceSeconds":10},{"id":"w-name-sentence","stage":"q1","part":2,"title":"Capital and period","summary":"A sentence starts with a capital and ends with a period.","prerequisites":["w-letters"],"lesson":{"explanation":"Every sentence begins with a capital letter and ends with a period (.), question mark (?) or exclamation mark (!).","example":"The dog runs.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write the dog runs on paper, then say: A sentence needs a capital at the start. Cross out the small t and write a capital T, then add a period at the end and say: The period tells the reader to stop.","together":"Fix my cat is fat together. Ask: What is the first letter? Should it be a capital? What goes at the very end? Let the child write the capital M while you write the period, then read it together.","alone":"Have the child copy and fix we can hop alone. Hint if stuck: ask them to check two things, the first letter and the last mark."}},"practice":{"items":[{"prompt":"Which is a correct sentence?","choices":["The cat sat.","the cat sat","The cat sat"],"answer":"The cat sat.","tier":1,"why":"A sentence needs a capital letter at the start and a mark at the end. The cat sat. has both; the other two are missing the capital or the period."},{"prompt":"Copy and fix: my dog is big","mode":"tutor","tier":2,"why":"The fixed sentence is: My dog is big. Accept it if My starts with a capital M and there is a period at the end."},{"prompt":"What mark goes at the end of a telling sentence?","choices":["A period (.)","A comma (,)","A dash (-)"],"answer":"A period (.)","tier":1,"why":"A telling sentence tells something, and it ends with a period, like: The dog runs. A comma goes in the middle of a sentence, not at the end."},{"prompt":"Which sentence is correct?","choices":["Can you hop?","can you hop?","Can you hop"],"answer":"Can you hop?","tier":2,"why":"Can you hop? starts with a capital C and ends with a question mark because it asks something. The others are missing the capital or the question mark."},{"prompt":"Copy and fix: is it time to eat","mode":"tutor","tier":3,"why":"This sentence asks something, so it ends with a question mark. Accept: Is it time to eat? with a capital I at the start."},{"prompt":"Write your own sentence about a pet or a toy. Tutor checks the capital and the end mark.","mode":"tutor","tier":3,"why":"Accept any sentence that starts with a capital letter and ends with a period, question mark or exclamation mark, like: My cat is soft."}]},"reinforcement":"Used in every sentence written after this.","day":12,"subject":"Writing","sightPaceSeconds":60},{"id":"m-skip-2","stage":"q1","part":2,"title":"Count by 2s","summary":"Skip count by twos to 50.","prerequisites":["m-count-120"],"lesson":{"explanation":"Counting by 2s skips every other number: 2, 4, 6, 8…","example":"12, 14, 16, 18","tutorSteps":["Count pairs of socks or shoes.","Chant by 2s.","Connect to even numbers."],"approaches":{"show":"Line up 5 pairs of socks. Slide one pair over at a time and say 2, 4, 6, 8, 10. Then point on the 120 chart, skipping every other box, and say: We jump over one number each time.","together":"Count pairs of shoes together starting at 12, taking turns: you say 12, the child says 14, you say 16. Ask: Which number did we skip? What comes after 18?","alone":"Have the child count by 2s alone from 30 to 50. Hint if stuck: whisper the skipped number and say the next one out loud: 31 (whisper), 32."}},"practice":{"generator":"countBy","params":{"step":2,"max":50}},"reinforcement":"Used for even/odd and doubles.","day":13,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-u","stage":"q1","part":2,"title":"Short u","summary":"Read words with the short u sound.","prerequisites":["r-short-o"],"lesson":{"explanation":"Short u sounds like /u/ in up.","example":"sun, cup, bug","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Say /u/ like the start of up while pointing up, then write sun and run your finger under it: /s/ /u/ /n/, sun. Do the same with cup and bug.","together":"Read mud together. Ask: What is the first sound? (/m/) What does the u say? (/u/ like up) What is the last sound? (/d/) Slide the sounds together and use mud in a sentence.","alone":"Have the child read hut, tub, gum alone. Hint if stuck: point up and say: u says /u/ like up."}},"practice":{"items":[{"prompt":"Read aloud: sun, cup, bug, run","mode":"tutor","tier":2,"why":"Each word has short u in the middle, like in up: s-u-n, c-u-p, b-u-g, r-u-n. Accept smooth blending with the /u/ sound."},{"prompt":"Read aloud: mud, hut, tub, gum","mode":"tutor","tier":2,"why":"Each word has short u in the middle: m-u-d, h-u-t, t-u-b, g-u-m. Accept smooth blending with the /u/ sound."},{"prompt":"Which word has short u?","choices":["bus","bis","bas"],"answer":"bus","tier":1,"why":"Bus has the /u/ sound like in up: b-u-s. Bis and bas are not real words, and they have the i and a sounds."},{"prompt":"Which word has the /u/ sound like in up?","choices":["cub","cab","cob"],"answer":"cub","tier":1,"why":"Cub has the /u/ sound like in up: c-u-b. Cab has the /a/ sound and cob has the /o/ sound."},{"prompt":"Read aloud: dug, nut, sub, pup, hug","mode":"tutor","tier":3,"why":"Each word has short u in the middle: d-u-g, n-u-t, s-u-b, p-u-p, h-u-g. Accept all five read smoothly with the /u/ sound."},{"prompt":"Read this sentence aloud: The pup dug in the mud.","mode":"tutor","tier":3,"why":"Pup, dug and mud all have short u. Accept the sentence read smoothly, with The, in and the read without stopping."}]},"reinforcement":"Returns in blends and endings.","day":14,"subject":"Reading","sightPaceSeconds":10},{"id":"s-living","stage":"q1","part":2,"title":"Living and nonliving","summary":"Tell living things from nonliving things.","prerequisites":["s-senses"],"lesson":{"explanation":"Living things grow, need food and water, and make more of their kind. Rocks and toys do not.","example":"A tree is living; a rock is not.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Set a potted plant and a rock side by side. Say: The plant grows, needs water and makes seeds, so it is living. The rock does not grow or need water, so it is nonliving.","together":"Sort a toy car and a pet fish together. For each one ask: Does it grow? Does it need food and water? Can it make more of its kind? Then decide together: living or nonliving.","alone":"Have the child decide alone whether a toy truck and a real kitten are living or nonliving. Hint if stuck: ask whether it needs food and water."}},"practice":{"items":[{"prompt":"Is a dog living?","choices":["Yes","No"],"answer":"Yes","tier":1,"why":"A dog is living because it grows, eats food, drinks water and can have puppies."},{"prompt":"Is a rock living?","choices":["Yes","No"],"answer":"No","tier":1,"why":"A rock is not living because it does not grow, eat, drink or have babies. It just stays a rock."},{"prompt":"Which is living?","choices":["Flower","Car","Chair"],"answer":"Flower","tier":2,"why":"A flower is living because it grows and needs water and sunlight. A car and a chair are made by people and do not grow."},{"prompt":"Which is nonliving?","choices":["Ball","Bird","Tree"],"answer":"Ball","tier":2,"why":"A ball is nonliving because it does not grow, eat or drink. A bird and a tree are both living things."},{"prompt":"Which one grows and needs food and water?","choices":["Kitten","Teddy bear","Rock"],"answer":"Kitten","tier":3,"why":"A kitten grows into a cat and needs food and water. A teddy bear and a rock never grow or eat."},{"prompt":"Name one living thing and one nonliving thing in your room and tell how you know.","mode":"tutor","tier":3,"why":"Accept one living thing, like a plant, a pet or a person, and one nonliving thing, like a bed or a book. The child should give a reason, like it grows and eats, or it does not grow."}]},"reinforcement":"Basis of life science.","day":15,"subject":"Science","sightPaceSeconds":15},{"id":"ss-family","stage":"q1","part":2,"title":"Families","summary":"Families are different and work together.","prerequisites":["ss-rules"],"lesson":{"explanation":"Families come in many sizes. Family members help each other and share jobs.","example":"Our family shares chores like setting the table.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Draw your own family as stick people and say each person's name and one job they do, such as: Grandma cooks dinner, I wash the dishes. Then say: Some families are big, some are small, and all of them help each other.","together":"Make a chore list for your home together. Ask: Who sets the table? Who feeds the pet? What job could you do? Write each name next to a job.","alone":"Ask the child alone: Tell one way a family can be different from yours. Hint if stuck: think of a friend's family and ask how many people live there."}},"practice":{"items":[{"prompt":"Name the people in your family and one job each does.","mode":"tutor","tier":3,"why":"Accept the real people in the child's family, big or small, with one job for each, like Mom cooks dinner or my brother feeds the dog. Every family looks different, so any family is fine."},{"prompt":"Are all families the same?","choices":["No","Yes"],"answer":"No","tier":1,"why":"Families come in many sizes and kinds. Some are big, some are small, and some have grandparents or one parent, so they are not all the same."},{"prompt":"Do family members help each other?","choices":["Yes","No"],"answer":"Yes","tier":1,"why":"Family members help each other, like sharing chores or caring for someone who is sick."},{"prompt":"Which is a chore a family can share at home?","choices":["Folding the laundry","Flying to the moon"],"answer":"Folding the laundry","tier":2,"why":"Folding the laundry is a real job at home that family members can share. Nobody can fly to the moon as a chore."},{"prompt":"Tell one job you do to help your family.","mode":"tutor","tier":2,"why":"Accept any real helping job, like setting the table, feeding a pet, or making the bed."},{"prompt":"Tell one way your family is the same as a friend's family and one way it is different.","mode":"tutor","tier":3,"why":"Accept one thing that is the same, like both families have a pet, and one thing that is different, like one family has more kids. Keep it kind; no family is better."}]},"reinforcement":"Community and culture next.","day":16,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-compare-20","stage":"q1","part":2,"title":"Compare numbers to 20","summary":"Use >, < and = to compare.","prerequisites":["m-count-20"],"lesson":{"explanation":"The open side of > or < faces the bigger number (the alligator eats the bigger one).","example":"14 > 9,  6 < 11,  8 = 8","tutorSteps":["Build both numbers with cubes.","Line them up to see which is longer.","Write the sign."],"approaches":{"show":"Build 14 and 9 with cube towers and stand them side by side. Say: 14 is taller, so the open mouth of the sign faces 14. Write 14 > 9 and read it: 14 is greater than 9.","together":"Compare 6 and 11 together. Build both with cubes and ask: Which tower is longer? Which way should the open side of the sign face? Then the child writes 6 < 11 and you read it together.","alone":"Have the child compare 17 and 12 alone and write the sign. Hint if stuck: build both with cubes and line them up."}},"practice":{"generator":"compare","params":{"max":20}},"reinforcement":"Used again with two-digit numbers and fractions later.","day":17,"subject":"Math","sightPaceSeconds":5},{"id":"r-short-e","stage":"q1","part":2,"title":"Short e","summary":"Read words with the short e sound.","prerequisites":["r-short-u"],"lesson":{"explanation":"Short e sounds like /e/ in egg. It is easy to mix up with short i.","example":"bed, pen, wet","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Say /e/ like the start of egg, then write bed and run your finger under it: /b/ /e/ /d/, bed. Then write pen and pin and read both, pointing out how /e/ and /i/ sound different.","together":"Read jet together. Ask: What is the first sound? (/j/) What does the e say? (/e/ like egg) What is the last sound? (/t/) Slide them together, then ask: Is it jet or jit?","alone":"Have the child read hen, ten, web alone. Hint if stuck: point to the e and say: e says /e/ like egg."}},"practice":{"items":[{"prompt":"Read aloud: bed, pen, wet, leg","mode":"tutor","tier":2,"why":"Each word has short e in the middle, like in egg: b-e-d, p-e-n, w-e-t, l-e-g. Accept the /e/ sound, not the long e in see."},{"prompt":"Read aloud: hen, jet, ten, web","mode":"tutor","tier":2,"why":"Each word has short e in the middle: h-e-n, j-e-t, t-e-n, w-e-b. Accept smooth blending with the /e/ sound."},{"prompt":"Which word has short e?","choices":["net","nut","not"],"answer":"net","tier":1,"why":"Net has the /e/ sound like in egg: n-e-t. Nut has the /u/ sound and not has the /o/ sound."},{"prompt":"Which word has short e?","choices":["pit","pet"],"answer":"pet","tier":3,"why":"Pet has the /e/ sound like in egg. Pit has short i, which sounds close, so listen: p-e-t has your mouth a bit more open."},{"prompt":"Which word has the /e/ sound like in egg?","choices":["red","rod","rug"],"answer":"red","tier":1,"why":"Red has the /e/ sound like in egg: r-e-d. Rod has the /o/ sound and rug has the /u/ sound."},{"prompt":"Read aloud: pen, pin, bed, bid, set, sit","mode":"tutor","tier":3,"why":"These come in pairs that change only the middle sound: pen and pin, bed and bid, set and sit. Accept each pair read with /e/ in the first word and /i/ in the second."},{"prompt":"Read this sentence aloud: Ten red hens get wet.","mode":"tutor","tier":3,"why":"Ten, red, hens, get and wet all have short e. Accept the sentence read smoothly, with the s on hens."}]},"reinforcement":"Returns in every two-syllable word.","day":18,"subject":"Reading","sightPaceSeconds":10},{"id":"m-even-odd","stage":"q1","part":2,"title":"Even and odd","summary":"Tell if a number is even or odd.","prerequisites":["m-skip-2"],"lesson":{"explanation":"Even numbers can be split into pairs with none left over. They end in 0, 2, 4, 6, 8.","example":"8 is even (4 pairs). 7 is odd (3 pairs + 1).","tutorSteps":["Pair up cubes.","Look at the ones digit.","Sort numbers into even/odd."],"approaches":{"show":"Take 8 cubes and pair them up into twos. Say: Every cube has a partner, so 8 is even. Then take 7 cubes, pair them, point to the leftover cube and say: 7 is odd.","together":"Check 12 together. Ask: What is the ones digit? (2) Is 2 one of 0, 2, 4, 6, 8? Then pair up 12 cubes together to see that none are left over.","alone":"Have the child decide alone whether 15 is even or odd. Hint if stuck: look at the ones digit and ask if it is 0, 2, 4, 6 or 8."}},"practice":{"generator":"evenOdd","params":{"max":50}},"reinforcement":"Comes back in doubles and division.","day":19,"subject":"Math","sightPaceSeconds":4},{"id":"w-spaces","stage":"q1","part":3,"title":"Finger spaces","summary":"Leave a space between words.","prerequisites":["w-letters"],"lesson":{"explanation":"Put a finger-width space between words so readers can tell where each word ends.","example":"I like cats.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write I like cats. on paper and put your pointer finger down after each word before writing the next one. Then write Ilikecats. and say: See how hard that is to read without spaces?","together":"Write We can run. together. You write We, the child puts a finger down for the space, then the child writes can. Ask: Where does the next word go? Did we leave a finger space?","alone":"Have the child write I see a big dog. alone. Hint if stuck: put your finger down on the paper after each word."}},"practice":{"items":[{"prompt":"Write: I see a red bird. Tutor checks spaces.","mode":"tutor","tier":2,"why":"Check for a finger-width space between each word: I, see, a, red, bird. Also check for a capital I and a period at the end."},{"prompt":"Which has spaces?","choices":["We can run.","Wecanrun."],"answer":"We can run.","tier":1,"why":"We can run. has a space between each word, so you can see the three words. Wecanrun. squashes them together."},{"prompt":"Which one is easy to read?","choices":["My cat is big.","Mycatisbig."],"answer":"My cat is big.","tier":1,"why":"My cat is big. is easy to read because spaces show where each word ends. Mycatisbig. is hard to read."},{"prompt":"Write: I can hop. Tutor checks spaces.","mode":"tutor","tier":2,"why":"Check for a space between each of the three words: I, can, hop. Accept it if the spaces are about one finger wide."},{"prompt":"Copy it with spaces between the words: Thesunishot.","mode":"tutor","tier":3,"why":"The words are The, sun, is, hot. Accept: The sun is hot. with a finger space between each word."},{"prompt":"Write your own sentence with four or more words. Tutor checks the finger spaces.","mode":"tutor","tier":3,"why":"Accept any sentence with four or more words, like: I like to play ball. Each word needs a finger-width space before the next one."}]},"reinforcement":"Readable writing.","day":20,"subject":"Writing","sightPaceSeconds":60},{"id":"r-cvc","stage":"q1","part":3,"title":"Blend CVC (consonant-vowel-consonant) words fast","summary":"Blend consonant-vowel-consonant words smoothly.","prerequisites":["r-short-e"],"lesson":{"explanation":"Say each sound, then slide them together without stopping.","example":"/s/ /u/ /n/ → sun","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write sun and touch each letter as you say /s/ /u/ /n/, then sweep your finger under the whole word and say sun quickly without stopping between sounds.","together":"Blend hop together. Tap each letter and ask: What sound is this? After the three sounds, ask: Now slide them together, what word is it? Say it slowly, then fast, together.","alone":"Have the child read jog alone. Hint if stuck: hold the first sound longer and slide into the next one, like /j/-/o/-/g/."}},"practice":{"items":[{"prompt":"Read aloud: sat, pin, hop, rug, wet","mode":"tutor","tier":2,"why":"Each word is CVC with a short vowel in the middle: sat, pin, hop, rug, wet. Accept smooth blending without long pauses between sounds."},{"prompt":"Read aloud: mad, fit, jog, hum, beg","mode":"tutor","tier":2,"why":"Each word is CVC with a short vowel in the middle: mad, fit, jog, hum, beg. Accept smooth blending without stopping between sounds."},{"prompt":"Blend /d/ /o/ /g/:","choices":["dog","dig","dug"],"answer":"dog","tier":1,"why":"Slide the sounds together: /d/ /o/ /g/ makes dog. Dig has /i/ in the middle and dug has /u/."},{"prompt":"Blend /c/ /a/ /t/:","choices":["cat","cot","cut"],"answer":"cat","tier":1,"why":"Slide the sounds together: /c/ /a/ /t/ makes cat. Cot has /o/ in the middle and cut has /u/."},{"prompt":"Read aloud fast: lid, vet, cub, nap, rot, wig","mode":"tutor","tier":3,"why":"All six are CVC words with a short vowel: lid, vet, cub, nap, rot, wig. Accept quick, smooth reading with each vowel sound correct."},{"prompt":"Read this sentence aloud fast: Sam had a red hat.","mode":"tutor","tier":3,"why":"Sam, had, red and hat are CVC words, and a is a sight word. Accept the sentence read smoothly and quickly, without sounding out each letter out loud."}]},"reinforcement":"The base of all decoding.","day":21,"subject":"Reading","sightPaceSeconds":10},{"id":"m-make-ten","stage":"q1","part":3,"title":"Make ten","summary":"Know the pairs that make 10 by sight.","prerequisites":["m-count-20"],"lesson":{"explanation":"Pairs that make ten: 0+10, 1+9, 2+8, 3+7, 4+6, 5+5. Learn them like sight words.","example":"7 + 3 = 10","tutorSteps":["Use a ten frame with counters.","Flash a number, child says its partner.","Race for sight pace (under 3 seconds)."],"approaches":{"show":"Put 7 counters on a ten frame and point to the 3 empty boxes. Say: 7 and 3 more fill the frame, so 7 and 3 make 10. Do the same with 4 and 6.","together":"Use the ten frame together with 2 counters. Ask: How many boxes are full? How many are empty? So 2 plus what makes 10? Fill the empty boxes together while counting 3, 4, 5, up to 10.","alone":"Ask the child alone: 6 and what make 10? Hint if stuck: put 6 counters on the ten frame and count the empty boxes."}},"practice":{"generator":"makeTen"},"reinforcement":"The key to adding and subtracting within 20.","day":22,"subject":"Math","sightPaceSeconds":3},{"id":"r-digraphs","stage":"q1","part":3,"title":"sh, ch, th, wh","summary":"Read the four main consonant digraphs.","prerequisites":["r-cvc"],"lesson":{"explanation":"Two letters can make one sound: sh (ship), ch (chin), th (thin, this), wh (when).","example":"shop, chat, thin, when","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write ship and draw a line under sh. Say: These two letters work together to make one sound, /sh/, like when we ask for quiet. Read ship, then do the same with chin (/ch/), thin (/th/) and when (/wh/).","together":"Read chop together. Ask: What two letters are at the start? What one sound do they make together? Then what is the rest of the word? Blend /ch/ /o/ /p/ together into chop.","alone":"Have the child read bath alone. Hint if stuck: cover the th and ask them to read ba, then show th and remind them it says /th/."}},"practice":{"items":[{"prompt":"Read aloud: ship, shop, fish","mode":"tutor","tier":2,"why":"The letters s and h work together to say one sound, /sh/, like a quiet sound: ship, shop, fish. Accept /sh/ at the start of ship and shop and at the end of fish."},{"prompt":"Read aloud: chin, chop, much","mode":"tutor","tier":2,"why":"The letters c and h work together to say /ch/, like a sneeze: chin, chop, much. Accept /ch/ at the start of chin and chop and at the end of much."},{"prompt":"Read aloud: thin, this, bath","mode":"tutor","tier":3,"why":"The letters t and h say /th/ with your tongue between your teeth. In thin and bath it is a quiet th; in this it is a buzzy th. Accept either th sound as long as it is not /t/ or /f/."},{"prompt":"Read aloud: when, whip, which","mode":"tutor","tier":3,"why":"The letters w and h say /w/ at the start: when, whip, which. Which also ends with /ch/. Accept /w/ at the start of each word."},{"prompt":"Which word starts with sh?","choices":["shell","chell","tell"],"answer":"shell","tier":1,"why":"Shell starts with s and h, which say /sh/. Chell is not a real word, and tell starts with /t/."},{"prompt":"Which word starts with ch?","choices":["chip","ship","tip"],"answer":"chip","tier":1,"why":"Chip starts with c and h, which say /ch/. Ship starts with /sh/ and tip starts with /t/."}]},"reinforcement":"Returns in spelling and long-vowel words.","day":23,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-10","stage":"q1","part":3,"title":"Addition facts to 10","summary":"Add two numbers with a sum up to 10 at sight pace.","prerequisites":["m-make-ten"],"lesson":{"explanation":"Adding means putting groups together. Start from the bigger number and count on.","example":"6 + 3: start at 6 → 7, 8, 9","tutorSteps":["Model with fingers or cubes.","Teach counting on from the bigger number.","Daily flash practice until instant."],"approaches":{"show":"Hold up 4 fingers on one hand and 2 on the other. Start at the bigger number and say: 4, then count on 5, 6 while touching the 2 fingers. Say: 4 plus 2 is 6.","together":"Do 3 + 5 together. Ask: Which number is bigger? (5) Start there. Then hold up 3 fingers and count on together: 6, 7, 8. Ask: So 3 plus 5 is?","alone":"Have the child solve 2 + 4 alone. Hint if stuck: start at 4 and count on 2."}},"practice":{"generator":"add","params":{"max":5}},"reinforcement":"Every later addition fact is built from these.","day":24,"subject":"Math","sightPaceSeconds":3},{"id":"s-plant-parts","stage":"q1","part":3,"title":"Parts of a plant","summary":"Name roots, stem, leaves and flowers.","prerequisites":["s-living"],"lesson":{"explanation":"Roots drink water, the stem holds the plant up, leaves make food from sunlight, flowers make seeds.","example":"Leaves catch sunlight.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Pull a weed or bean plant gently out of the soil and point to each part: Roots drink water from the soil, the stem holds the plant up, leaves catch sunlight to make food, and the flower makes seeds.","together":"Look at a real flower together. Point to the stem and ask: What does this part do? Then point to a leaf and ask: What do leaves need to make food? Let the child point to the roots and say what they do.","alone":"Ask the child alone: Which part of the plant makes seeds? Hint if stuck: look at a flower and point to where the seeds form in the middle."}},"practice":{"items":[{"prompt":"Which part takes in water from the soil?","choices":["Roots","Leaves","Flower"],"answer":"Roots","tier":2,"why":"The roots grow down into the soil and drink up water for the plant. Leaves and flowers are above the ground."},{"prompt":"Which part makes food from sunlight?","choices":["Leaves","Roots","Stem"],"answer":"Leaves","tier":2,"why":"Leaves catch sunlight and use it to make food for the plant. Roots drink water and the stem holds the plant up."},{"prompt":"Which part holds the plant up?","choices":["Stem","Flower","Seed"],"answer":"Stem","tier":1,"why":"The stem stands tall like a straw and holds the plant up. It also carries water from the roots to the leaves."},{"prompt":"Which part grows under the ground?","choices":["Roots","Flower"],"answer":"Roots","tier":1,"why":"The roots grow under the ground in the soil. The flower grows up high where bees can find it."},{"prompt":"Which part makes seeds?","choices":["Flower","Stem","Roots"],"answer":"Flower","tier":3,"why":"The flower makes seeds, and seeds grow into new plants. The stem holds the plant up and the roots drink water."},{"prompt":"Name the four plant parts and tell what each one does.","mode":"tutor","tier":3,"why":"A full answer: roots drink water, the stem holds the plant up, leaves make food from sunlight, and the flower makes seeds. Accept the four parts with one job each in the child's own words."}]},"reinforcement":"Plant needs and life cycles next.","day":25,"subject":"Science","sightPaceSeconds":15},{"id":"ss-maps","stage":"q1","part":3,"title":"Maps and globes","summary":"Use a map and a globe.","prerequisites":["ss-rules"],"lesson":{"explanation":"A map is a flat drawing of a place. A globe is a round model of Earth. Blue usually shows water.","example":"On a globe, blue is ocean and green or brown is land.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Set a globe next to a flat map of the world. Spin the globe and say: This is a round model of Earth. Then touch the map and say: This is a flat drawing. Point to blue on both and say: Blue shows water.","together":"Look at a map of your town together. Ask: Is this round or flat? What color shows the lake or river? Can you find our street? Trace a path from home to the park together.","alone":"Ask the child alone to find an ocean on the globe. Hint if stuck: remind them that blue usually means water."}},"practice":{"items":[{"prompt":"A round model of Earth is a…","choices":["Globe","Map","Graph"],"answer":"Globe","tier":2,"why":"A globe is round like a ball, just like Earth, so it is a model of Earth. A map is flat."},{"prompt":"On most maps, water is…","choices":["Blue","Red"],"answer":"Blue","tier":1,"why":"Maps use blue for water, like oceans, lakes and rivers. Red is not used for water."},{"prompt":"Draw a map of your bedroom.","mode":"tutor","tier":3,"why":"Accept a drawing that shows the room from above, with things like the bed, door and window in about the right places."},{"prompt":"Is a globe round or flat?","choices":["Round","Flat"],"answer":"Round","tier":1,"why":"A globe is round like a ball because Earth is round."},{"prompt":"A flat drawing of a place is a…","choices":["Map","Globe","Picture frame"],"answer":"Map","tier":2,"why":"A map is a flat drawing of a place. A globe is round, and a picture frame just holds a picture."},{"prompt":"On a globe, point to the blue ocean and to green or brown land.","mode":"tutor","tier":3,"why":"Accept pointing to any blue part for ocean and any green or brown part for land."}]},"reinforcement":"Geography in every grade.","day":26,"subject":"Social Studies","sightPaceSeconds":15},{"id":"r-ck","stage":"q1","part":3,"title":"-ck ending","summary":"Read words ending in ck.","prerequisites":["r-digraphs"],"lesson":{"explanation":"After a short vowel, the /k/ sound at the end is spelled ck.","example":"duck, back, sick","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write duck and underline ck. Say: After the short u, the /k/ sound at the end is spelled with two letters, c and k. Read duck, then back and sick the same way.","together":"Read neck together. Ask: What is the vowel sound? (/e/, a short vowel) What comes after a short vowel at the end for /k/? (ck) Then blend /n/ /e/ /k/ together into neck.","alone":"Have the child read lick and tuck alone. Hint if stuck: cover the ck, read the start, then remind them ck says /k/."}},"practice":{"items":[{"prompt":"Read aloud: duck, back, sick, rock","mode":"tutor","tier":2,"why":"Each word has a short vowel and ends in ck, which says one /k/ sound: duck, back, sick, rock. Accept smooth reading with one /k/ at the end, not two."},{"prompt":"Read aloud: pack, neck, lick, tuck","mode":"tutor","tier":2,"why":"Each word has a short vowel and ends in ck: pack, neck, lick, tuck. Accept smooth reading with one /k/ sound at the end."},{"prompt":"Which is spelled right?","choices":["duck","duk","duc"],"answer":"duck","tier":1,"why":"Duck has the short u sound, and after a short vowel the /k/ sound at the end is spelled ck. So duck is right, not duk or duc."},{"prompt":"Which word ends in ck?","choices":["sock","sun","sit"],"answer":"sock","tier":1,"why":"Sock ends with c and k together, which say /k/. Sun ends in n and sit ends in t."},{"prompt":"Pick the right spelling for the word that rhymes with back:","choices":["sack","sak","sac"],"answer":"sack","tier":3,"why":"Sack rhymes with back, and both have short a, so the /k/ at the end is spelled ck: s-a-c-k."},{"prompt":"Write the words back and neck. Tutor checks the ck.","mode":"tutor","tier":3,"why":"Accept back and neck spelled with c and k together at the end: b-a-c-k and n-e-c-k."}]},"reinforcement":"Spelling rule used in writing.","day":27,"subject":"Reading","sightPaceSeconds":10},{"id":"m-sub-10","stage":"q1","part":3,"title":"Subtraction facts to 10","summary":"Subtract within 10 at sight pace.","prerequisites":["m-add-10"],"lesson":{"explanation":"Subtracting takes away. Think of the addition fact: 9 − 4 = ? because 4 + 5 = 9.","example":"8 − 3 = 5","tutorSteps":["Take away cubes.","Connect to the matching addition fact.","Flash practice."],"approaches":{"show":"Set out 8 counters and slide 3 away while saying: 8 take away 3. Count the ones left: 5. Then say: 8 minus 3 is 5, because 3 plus 5 is 8.","together":"Do 9 minus 4 together. Ask: What number plus 4 makes 9? Hold up 4 fingers and count on together: 5, 6, 7, 8, 9. Ask: How many fingers did we add? So 9 minus 4 is 5.","alone":"Have the child solve 7 minus 2 alone. Hint if stuck: think 2 plus what makes 7."}},"practice":{"generator":"sub","params":{"max":10}},"reinforcement":"Pairs with addition in fact families.","day":28,"subject":"Math","sightPaceSeconds":3},{"id":"w-questions","stage":"q2","part":1,"title":"Questions and exclamations","summary":"Use ? and ! correctly.","prerequisites":["w-name-sentence"],"lesson":{"explanation":"Use ? for asking. Use ! for strong feeling.","example":"Where is my hat? I found it!","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write 'Where is my hat' and 'I found it' on paper. Read each aloud with your voice going up for the question and excited for the second, then add ? to the first and ! to the second while saying: asking gets a question mark, strong feeling gets an exclamation mark.","together":"Write 'Can we go to the park' together. Ask: Is this asking something or telling? Asking, so which mark goes at the end? Let the child write the ?, then read it aloud together with a rising voice.","alone":"Have the child write the right mark at the end of 'Look at that big dog' alone. Hint if stuck: say it as if you are surprised. Does that sound like strong feeling?"}},"practice":{"items":[{"prompt":"Which mark ends: Can you help me","choices":["?",".","!"],"answer":"?","tier":2,"why":"Can you help me is asking for something, so it ends with a question mark."},{"prompt":"Which mark ends: Watch out","choices":["!","?"],"answer":"!","tier":2,"why":"Watch out shows strong feeling, like a warning, so it ends with an exclamation mark. It is not asking anything."},{"prompt":"Write one question about animals.","mode":"tutor","tier":3,"why":"Accept any question about animals that starts with a capital letter and ends with a question mark, like: Do cats like milk?"},{"prompt":"Does this ask something? Do you like cake","choices":["Yes","No"],"answer":"Yes","tier":1,"why":"Do you like cake asks someone something, and it wants an answer, so yes, it is a question."},{"prompt":"Which one is a question?","choices":["Is it raining?","It is raining."],"answer":"Is it raining?","tier":1,"why":"Is it raining? asks something and ends with a question mark. It is raining. tells something, so it ends with a period."},{"prompt":"Which mark ends: What is your name","choices":["?","!"],"answer":"?","tier":2,"why":"What is your name asks something, so it ends with a question mark. Words like what often start a question."},{"prompt":"Which mark ends: Wow, I won","choices":["!","?","."],"answer":"!","tier":2,"why":"Wow, I won shows strong, happy feeling, so it ends with an exclamation mark."},{"prompt":"Write one sentence that shows strong feeling and ends with !","mode":"tutor","tier":3,"why":"Accept a sentence with strong feeling, a capital letter at the start, and an exclamation mark at the end, like: I love my dog!"}]},"reinforcement":"Dialogue and expressive reading.","day":29,"subject":"Writing","sightPaceSeconds":60},{"id":"m-doubles","stage":"q2","part":1,"title":"Doubles","summary":"Know doubles to 10 + 10 by sight.","prerequisites":["m-add-10","m-skip-2"],"lesson":{"explanation":"A double adds a number to itself: 6 + 6 = 12.","example":"8 + 8 = 16","tutorSteps":["Use mirror pictures or egg cartons.","Chant the doubles.","Flash practice."],"approaches":{"show":"Hold an egg carton with 6 eggs on each side. Point to each side and say: 6 and 6 is a double. Count all of them together: 12. Then say the fact out loud: 6 plus 6 is 12.","together":"Do 7 + 7 together with a mirror. Ask: How many blocks before the mirror? 7. How many in the mirror? Also 7. Count all of them together to 14, then chant: 7 plus 7 is 14.","alone":"Have the child answer 8 + 8 alone. Hint if stuck: think of the spider's 8 legs on each side, or skip count by 2 eight times."}},"practice":{"generator":"doubles","params":{"max":10}},"reinforcement":"Used for near-doubles and multiplying by 2.","day":30,"subject":"Math","sightPaceSeconds":3},{"id":"r-blends-start","stage":"q2","part":1,"title":"Beginning blends","summary":"Read words starting with two consonants.","prerequisites":["r-cvc"],"lesson":{"explanation":"In a blend you hear both sounds: bl, cl, fl, st, sp, tr, gr, fr.","example":"frog, stop, clap","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write frog on a card. Cover the og and say /f/ /r/, then slide the two sounds together: /fr/. Uncover and read frog slowly, then point out that you hear both the f and the r.","together":"Read stop together. Ask: What are the first two letters? s and t. What sound does each make? Say /st/ together, then add /o/ /p/ and blend: stop. Have the child use it in a sentence.","alone":"Have the child read clap alone. Hint if stuck: say the c and the l sounds quickly together, /cl/, before the rest."}},"practice":{"items":[{"prompt":"Read aloud: frog, stop, clap, grin","mode":"tutor","tier":2,"why":"Each word starts with a blend where you hear both sounds: fr-og, st-op, cl-ap, gr-in. Accept both starting sounds heard clearly."},{"prompt":"Read aloud: flag, spin, trip, plum","mode":"tutor","tier":3,"why":"Each word starts with a blend: fl-ag, sp-in, tr-ip, pl-um. Accept both starting sounds said, not just one."},{"prompt":"Which word starts with a blend?","choices":["stop","top","pop"],"answer":"stop","tier":1,"why":"Stop starts with s and t, and you hear both: /s/ /t/. Top and pop start with only one sound."},{"prompt":"Which one starts with two consonant sounds?","choices":["frog","fog","log"],"answer":"frog","tier":1,"why":"Frog starts with /f/ and /r/ together. Fog and log start with just one sound."},{"prompt":"Which blend starts the word clap?","choices":["cl","fl","bl"],"answer":"cl","tier":2,"why":"Say clap slowly: /c/ /l/ /a/ /p/. The first two sounds are c and l, so the blend is cl."},{"prompt":"Read aloud: drum, swim, brick, glad","mode":"tutor","tier":3,"why":"Each word starts with a blend: dr-um, sw-im, br-ick, gl-ad. Brick also ends in ck. Accept both starting sounds heard."},{"prompt":"Read aloud: slip, crab, step, blot","mode":"tutor","tier":2,"why":"Each word starts with a blend: sl-ip, cr-ab, st-ep, bl-ot. Accept both starting sounds heard and short vowels in the middle."}]},"reinforcement":"Returns in long-vowel and multi-syllable words.","day":31,"subject":"Reading","sightPaceSeconds":10},{"id":"m-near-doubles","stage":"q2","part":1,"title":"Near doubles","summary":"Use doubles to add numbers that are one apart.","prerequisites":["m-doubles"],"lesson":{"explanation":"If the numbers are next to each other, double the smaller one and add 1.","example":"7 + 8 = 7 + 7 + 1 = 15","tutorSteps":["Review doubles.","Show 6 + 7 as 6 + 6 + 1.","Practice spotting near doubles."],"approaches":{"show":"Build 6 + 7 with cubes: a tower of 6 and a tower of 7. Point out that the 7 tower is the 6 tower plus one cube. Say: 6 plus 6 is 12, and one m
