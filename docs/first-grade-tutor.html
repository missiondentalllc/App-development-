<script>
// TutorCore for the web: a line-by-line port of packages/TutorCore (Swift).
// Same rules as the iPhone apps: speed-weighted comprehension, gap-first repair,
// spaced review, placement test, question generators.
"use strict";

const DAY_MS = 86400000;

// ---------- Comprehension ----------
const Comprehension = {
  questionCapSeconds: 60,
  defaultSightPace: 5,
  smoothing: 0.3,
  passThreshold: 0.70,
  masteryThreshold: 0.85,
  sightThreshold: 0.95,
  minAttemptsForMastery: 5,

  speedScore(seconds, sightPace) {
    const pace = Math.max(1, sightPace);
    if (seconds <= pace) return 1;
    if (seconds >= this.questionCapSeconds) return 0;
    return (this.questionCapSeconds - seconds) / (this.questionCapSeconds - pace);
  },

  answerScore(correct, seconds, sightPace) {
    if (!correct) return 0;
    return 0.5 + 0.5 * this.speedScore(seconds, sightPace);
  },

  record(state, correct, seconds, sightPace, now = Date.now()) {
    const s = { ...newSkillState(), ...state };
    const pace = sightPace ?? this.defaultSightPace;
    const clamped = Math.min(Math.max(seconds, 0), this.questionCapSeconds);
    const score = this.answerScore(correct, clamped, pace);
    if (s.attempts === 0 || s.provisional) s.comprehension = score;
    else s.comprehension = this.smoothing * score + (1 - this.smoothing) * s.comprehension;
    s.provisional = false;
    s.attempts += 1;
    if (correct) s.correct += 1;
    s.averageSeconds = ((s.averageSeconds ?? clamped) * (s.attempts - 1) + clamped) / s.attempts;
    s.lastPracticed = now;
    Tiers.update(s, correct);
    return SpacedReview.schedule(s, correct, clamped <= pace * 1.5, now);
  },

  level(s) {
    s = s || newSkillState();
    if (s.attempts === 0 && !s.provisional) return "new";
    // Mastered and sight-level need the Challenge tier: the skill at full difficulty.
    const top = Tiers.current(s) === 3;
    if (top && s.comprehension >= this.sightThreshold && s.attempts >= this.minAttemptsForMastery) return "sight";
    if (top && s.comprehension >= this.masteryThreshold && (s.attempts >= this.minAttemptsForMastery || s.provisional)) return "mastered";
    if (s.comprehension >= this.passThreshold) return "passing";
    return "learning";
  },

  /** 100% mastered: sight-level (right, fast, at full difficulty). */
  isFullyMastered(s) { return this.level(s) === "sight"; },

  isPassed(s) { return (s?.comprehension ?? 0) >= this.passThreshold; },

  levelLabel: { new: "Not started", learning: "Learning", passing: "Passing", mastered: "Mastered", sight: "Sight-level" },
};

function newSkillState() {
  return { attempts: 0, correct: 0, comprehension: 0, provisional: false,
           lastPracticed: null, reviewBox: 0, nextReview: null, averageSeconds: null,
           tier: 1, rightStreak: 0, missStreak: 0 };
}

// ---------- Difficulty tiers ----------
// Every skill has three tiers: Starter, Core, Challenge (the skill at full difficulty).
// Two right in a row moves up a tier; two misses in a row moves down one.
const Tiers = {
  names: { 1: "Starter", 2: "Core", 3: "Challenge" },
  current(s) {
    if (!s) return 1;
    if (s.tier >= 1 && s.tier <= 3) return s.tier;
    // Progress saved before tiers existed: place by score.
    if (s.provisional) return 3;
    if (s.comprehension >= Comprehension.masteryThreshold) return 3;
    if (s.comprehension >= Comprehension.passThreshold) return 2;
    return 1;
  },
  update(s, correct) {
    let t = this.current(s);
    if (correct) {
      s.rightStreak = (s.rightStreak || 0) + 1; s.missStreak = 0;
      if (s.rightStreak >= 2 && t < 3) { t += 1; s.rightStreak = 0; }
    } else {
      s.missStreak = (s.missStreak || 0) + 1; s.rightStreak = 0;
      if (s.missStreak >= 2 && t > 1) { t -= 1; s.missStreak = 0; }
    }
    s.tier = t;
  },
};

// ---------- Parts of a level and teaching approaches ----------
const PartNames = { 1: "Foundations", 2: "Building", 3: "Mastery" };
const Approaches = [
  { key: "show", name: "Show", blurb: "You show it while they watch." },
  { key: "together", name: "Do together", blurb: "Do one together, taking turns." },
  { key: "alone", name: "Try alone", blurb: "They try one alone; you give one hint only if stuck." },
];

// ---------- Spaced review ----------
const SpacedReview = {
  intervalsInDays: [1, 2, 4, 8, 16, 32, 64],
  schedule(state, correct, fast, now) {
    const s = { ...state };
    if (!correct) s.reviewBox = 0;
    else if (fast) s.reviewBox = Math.min(s.reviewBox + 1, this.intervalsInDays.length - 1);
    const d = new Date(now);
    d.setDate(d.getDate() + this.intervalsInDays[s.reviewBox]);
    s.nextReview = d.getTime();
    return s;
  },
  isDue(s, now = Date.now()) {
    if (!s || s.attempts <= 0 || s.nextReview == null) return false;
    return s.nextReview <= now;
  },
};

// ---------- Curriculum helpers ----------
function hasPractice(skill) {
  return !!skill.practice?.generator || (skill.practice?.items || []).length > 0;
}

// ---------- Short forms (glossary) ----------
// Each curriculum lists its abbreviations with plain-English meanings. Any text
// shown to the learner is scanned so the meaning of every short form appears with it.
function shortFormsIn(curriculum, texts) {
  const list = curriculum.glossary || [];
  if (!curriculum._glossaryRe) {
    const escape = t => t.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&");
    curriculum._glossaryRe = list.map(g => new RegExp(`(?<![A-Za-z-])${escape(g.term)}s?(?![A-Za-z-])`));
  }
  const text = texts.filter(Boolean).join("\n");
  return list.filter((g, i) => curriculum._glossaryRe[i].test(text));
}

// ---------- Skill graph ----------
class SkillGraph {
  constructor(curriculum) {
    this.curriculum = curriculum;
    this.index = {};
    const deps = {};
    for (const s of curriculum.skills) {
      this.index[s.id] = s;
      for (const p of s.prerequisites || []) (deps[p] = deps[p] || []).push(s.id);
    }
    this.dependents = deps;
    this.impact = {};
    for (const s of curriculum.skills) {
      const seen = new Set();
      const stack = [...(deps[s.id] || [])];
      while (stack.length) {
        const next = stack.pop();
        if (!seen.has(next)) { seen.add(next); stack.push(...(deps[next] || [])); }
      }
      this.impact[s.id] = seen.size;
    }
    const stageOrder = Object.fromEntries(curriculum.stages.map(st => [st.id, st.order]));
    const position = Object.fromEntries(curriculum.skills.map((s, i) => [s.id, i]));
    this.ordered = [...curriculum.skills].sort((x, y) => {
      const a = stageOrder[x.stage] ?? 0, b = stageOrder[y.stage] ?? 0;
      if (a !== b) return a - b;
      if (x.day != null && y.day != null && x.day !== y.day) return x.day - y.day;
      return position[x.id] - position[y.id];
    });
    this.stagesSorted = [...curriculum.stages].sort((a, b) => a.order - b.order);
  }
  skill(id) { return this.index[id]; }
  stage(id) { return this.curriculum.stages.find(s => s.id === id); }
  skillsIn(stageId) { return this.curriculum.skills.filter(s => s.stage === stageId); }
  /** The level's three parts. Uses each skill's "part"; otherwise splits the level into thirds. */
  partsOf(stageId) {
    const skills = this.ordered.filter(s => s.stage === stageId);
    const partOf = (s, i) => s.part || Math.min(3, Math.floor((i * 3) / Math.max(skills.length, 1)) + 1);
    return [1, 2, 3].map(n => ({ n, name: PartNames[n], skills: skills.filter((s, i) => partOf(s, i) === n) }));
  }
  partOfSkill(skill) {
    return this.partsOf(skill.stage).find(p => p.skills.includes(skill))?.n || 1;
  }
  isUnlocked(skill, states) {
    return (skill.prerequisites || []).every(p => Comprehension.isPassed(states[p]));
  }
}

// ---------- Skill picker ----------
const ReasonLabel = { repair: "Fixing a gap", review: "Memory review", advance: "New skill", done: "All caught up" };

class SkillPicker {
  constructor(graph) { this.graph = graph; }

  next(states, now = Date.now(), excluding = new Set()) {
    const st = id => states[id] || newSkillState();
    const practicable = this.graph.ordered.filter(s => hasPractice(s) && !excluding.has(s.id));

    const weak = practicable.filter(s => {
      const x = st(s.id);
      return x.attempts >= 3 && !x.provisional && x.comprehension < Comprehension.passThreshold;
    });
    if (weak.length) {
      let worst = weak[0];
      for (const s of weak) if (this.priority(s, states) > this.priority(worst, states)) worst = s;
      return { skill: this.deepestWeakRoot(worst, states, excluding), reason: "repair" };
    }

    const due = practicable.filter(s => SpacedReview.isDue(st(s.id), now))
      .sort((a, b) => (st(a.id).nextReview ?? now) - (st(b.id).nextReview ?? now));
    if (due.length) return { skill: due[0], reason: "review" };

    const unlocked = practicable.filter(s => this.graph.isUnlocked(s, states));
    const inProgress = unlocked.find(s => {
      const x = st(s.id), l = Comprehension.level(x);
      return x.attempts > 0 && (l === "learning" || l === "passing");
    });
    if (inProgress) return { skill: inProgress, reason: "advance" };
    const fresh = unlocked.find(s => Comprehension.level(st(s.id)) === "new");
    if (fresh) return { skill: fresh, reason: "advance" };
    return { skill: null, reason: "done" };
  }

  priority(skill, states) {
    const c = states[skill.id]?.comprehension ?? 0;
    return ((this.graph.impact[skill.id] ?? 0) + 1) * (1 - c);
  }

  deepestWeakRoot(skill, states, excluding) {
    let current = skill;
    const visited = new Set();
    while (!visited.has(current.id)) {
      visited.add(current.id);
      const w = (current.prerequisites || []).map(id => this.graph.skill(id)).filter(Boolean)
        .filter(s => hasPractice(s) && !excluding.has(s.id))
        .find(s => {
          const x = states[s.id] || newSkillState();
          return x.attempts > 0 && x.comprehension < Comprehension.passThreshold;
        });
      if (!w) break;
      current = w;
    }
    return current;
  }

  biggestGaps(states, limit = 5) {
    return this.graph.curriculum.skills
      .filter(s => {
        const x = states[s.id] || newSkillState();
        return x.attempts >= 3 && !x.provisional && x.comprehension < Comprehension.passThreshold;
      })
      .sort((a, b) => this.priority(b, states) - this.priority(a, states))
      .slice(0, limit);
  }
}

// ---------- Placement test ----------
class Diagnostic {
  constructor(graph, questionsPerStage = 4) {
    this.graph = graph;
    this.questionsPerStage = questionsPerStage;
    this.stages = graph.stagesSorted;
    this.stageIndex = 0;
    this.finished = false;
    this.passedStages = [];
    this.stageResults = [];
    this.stageQueue = [];
    this.loadStage();
  }
  get currentStage() { return this.stages[this.stageIndex] || null; }
  nextSkill() {
    while (!this.finished && this.stageQueue.length === 0) this.skipStage();
    if (this.finished) return null;
    return this.stageQueue[this.stageResults.length % this.stageQueue.length];
  }
  skipStage() {
    this.stageIndex += 1;
    if (this.stageIndex >= this.stages.length) this.finished = true; else this.loadStage();
  }
  record(skill, correct, seconds) {
    const pace = skill.sightPaceSeconds ?? Comprehension.defaultSightPace;
    this.stageResults.push(correct && seconds <= pace * 3);
    if (this.stageResults.length >= this.questionsPerStage) {
      const passes = this.stageResults.filter(Boolean).length;
      this.advance(passes / this.questionsPerStage >= 0.75);
    }
  }
  apply(states) {
    const out = { ...states };
    for (const stageId of this.passedStages) {
      for (const skill of this.graph.skillsIn(stageId)) {
        const s = { ...newSkillState(), ...(out[skill.id] || {}) };
        if (s.attempts !== 0) continue;
        s.comprehension = Comprehension.masteryThreshold;
        s.provisional = true;
        s.tier = 3;
        out[skill.id] = s;
      }
    }
    return out;
  }
  advance(passed) {
    if (passed && this.currentStage) {
      this.passedStages.push(this.currentStage.id);
      this.stageIndex += 1;
      if (this.stageIndex >= this.stages.length) this.finished = true; else this.loadStage();
    } else {
      this.finished = true;
    }
  }
  loadStage() {
    this.stageResults = [];
    const stage = this.currentStage;
    if (!stage) { this.finished = true; return; }
    const skills = this.graph.skillsIn(stage.id).filter(hasPractice);
    const generated = skills.filter(s => s.practice.generator);
    const pool = generated.length ? generated : skills;
    if (pool.length <= this.questionsPerStage) this.stageQueue = pool;
    else {
      const step = pool.length / this.questionsPerStage;
      this.stageQueue = Array.from({ length: this.questionsPerStage }, (_, i) => pool[Math.floor(i * step)]);
    }
  }
}

// ---------- Answer checking ----------
const AnswerChecker = {
  matches(given, expected) {
    const g = this.normalize(given), e = this.normalize(expected);
    if (g === e) return true;
    const a = this.number(g), b = this.number(e);
    return a != null && b != null && Math.abs(a - b) < 1e-9;
  },
  normalize(s) {
    return String(s).toLowerCase().replace(/ /g, "").replace(/−/g, "-").replace(/,/g, "").trim();
  },
  number(s) {
    if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/.test(s)) return Number(s);
    const parts = s.split("/");
    if (parts.length === 2) {
      const n = this.number(parts[0]), d = this.number(parts[1]);
      if (n != null && d != null && d !== 0) return n / d;
    }
    return null;
  },
};

// ---------- Dice ----------
const Dice = {
  int(lo, hi) { return lo >= hi ? lo : lo + Math.floor(Math.random() * (hi - lo + 1)); },
  bool() { return Math.random() < 0.5; },
  pick(items) { return items[this.int(0, items.length - 1)]; },
  shuffled(items) {
    const a = [...items];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  },
};

// ---------- Question generators ----------
const G = {
  gcd(a, b) { return b === 0 ? Math.abs(a) : G.gcd(b, a % b); },
  choose(n, k) {
    if (k < 0 || k > n) return 0;
    let r = 1;
    for (let i = 0; i < Math.min(k, n - k); i++) r = r * (n - i) / (i + 1);
    return Math.round(r);
  },
  term(c, v) { return c === 1 ? v : c === -1 ? `-${v}` : `${c}${v}`; },
  signedTerm(c, v) {
    if (c === 0) return "";
    const body = Math.abs(c) === 1 ? v : `${Math.abs(c)}${v}`;
    return c > 0 ? ` + ${body}` : ` − ${body}`;
  },
  signed(n) { return n === 0 ? "" : n > 0 ? ` + ${n}` : ` − ${-n}`; },
  tenths(t) { return `${Math.trunc(t / 10)}.${t % 10}`; },
  half(a, d) { return a % d === 0 ? `${a / d}` : `${a / G.gcd(a, d)}/${d / G.gcd(a, d)}`; },
  sub(n) { return String(n).replace(/\d/g, c => "₀₁₂₃₄₅₆₇₈₉"[c]); },
  mod(a, n) { return ((a % n) + n) % n; },
};

// Size settings each generator uses, with its defaults. Starter and Core shrink these;
// Challenge uses the skill's own settings (the full skill).
const GeneratorSizes = {
  count: { max: 20 }, countBy: { max: 100 }, numberAfter: { max: 120 }, compare: { max: 100 },
  placeValue: { digits: 2 }, tenMore: { max: 100 }, evenOdd: { max: 50 }, roundTen: { max: 100 },
  add: { max: 10 }, add3: { max: 9 }, sub: { max: 10 }, missingAddend: { max: 10 }, doubles: { max: 10 },
  factFamily: { max: 10 }, wordAdd: { max: 10 }, mul: { max: 10 }, div: { max: 10 }, fractionOf: { maxDen: 10 },
  fractionAdd: { maxDen: 12 }, integerAdd: { max: 20 }, integerMul: { max: 12 }, exponent: { maxBase: 6 },
  sqrt: { max: 15 }, linearEq: { max: 10 }, binomial: { max: 10 }, mod: { max: 13 },
};

function tierParams(key, params, tier) {
  const out = { ...(params || {}) };
  if (tier >= 3) return out;
  const sizes = GeneratorSizes[key] || {};
  for (const [name, fallback] of Object.entries(sizes)) {
    const full = out[name] ?? fallback;
    if (name === "digits") { out.digits = Math.max(2, full - (3 - tier)); continue; }
    let floor = name === "max" ? 3 : 2;
    if (key === "countBy") floor = Math.max(floor, (out.step || 1) * 4);
    if (out.min != null) floor = Math.max(floor, out.min + 1);
    out[name] = Math.min(full, Math.max(floor, Math.round(full * (tier === 1 ? 0.4 : 0.7))));
  }
  return out;
}

function makeGenerated(key, params, skillId, tier = 3) {
  const d = Dice;
  const p = (name, fb) => (params && params[name] != null ? params[name] : fb);
  const q = (prompt, answer) => ({ skillId, prompt, answer: String(answer) });
  const mc = (prompt, choices, answer) => ({ skillId, prompt, choices, answer });

  switch (key) {
    // Counting and number sense
    case "count": {
      const n = d.int(1, p("max", 20));
      const dots = Array.from({ length: n }, (_, i) => (i > 0 && i % 5 === 0 ? " ●" : "●")).join("");
      return q(`How many dots?\n${dots}`, n);
    }
    case "countBy": {
      const step = p("step", 1);
      const start = step * d.int(0, Math.max(0, Math.floor(p("max", 100) / step) - 3));
      return q(`What comes next?\n${start}, ${start + step}, ${start + 2 * step}, __`, start + 3 * step);
    }
    case "numberAfter": {
      const n = d.int(1, p("max", 120));
      return d.bool() ? q(`What number comes just after ${n}?`, n + 1) : q(`What number comes just before ${n}?`, n - 1);
    }
    case "compare": {
      const a = d.int(0, p("max", 100));
      let b = d.int(0, p("max", 100));
      if (d.int(0, 5) === 0) b = a;
      return mc(`Which sign goes in the blank?\n${a} __ ${b}`, [">", "<", "="], a > b ? ">" : a < b ? "<" : "=");
    }
    case "placeValue": {
      const digits = Math.max(2, Math.min(4, p("digits", 2)));
      const n = d.int(10 ** (digits - 1), 10 ** digits - 1);
      const places = ["ones", "tens", "hundreds", "thousands"];
      const i = d.int(0, digits - 1);
      return q(`What digit is in the ${places[i]} place of ${n}?`, Math.floor(n / 10 ** i) % 10);
    }
    case "tenMore": {
      const n = d.int(10, Math.max(10, p("max", 100) - 10));
      return d.bool() ? q(`What is 10 more than ${n}?`, n + 10) : q(`What is 10 less than ${n}?`, n - 10);
    }
    case "evenOdd": {
      const n = d.int(0, p("max", 50));
      return mc(`Is ${n} even or odd?`, ["Even", "Odd"], n % 2 === 0 ? "Even" : "Odd");
    }
    case "roundTen": {
      const n = d.int(0, p("max", 100));
      return q(`Round ${n} to the nearest ten.`, Math.round(n / 10) * 10);
    }

    // Addition and subtraction
    case "add": { const m = p("max", 10), a = d.int(0, m), b = d.int(0, m); return q(`${a} + ${b} = ?`, a + b); }
    case "add3": { const m = p("max", 9), a = d.int(0, m), b = d.int(0, m), c = d.int(0, m); return q(`${a} + ${b} + ${c} = ?`, a + b + c); }
    case "sub": { const a = d.int(0, p("max", 10)), b = d.int(0, a); return q(`${a} − ${b} = ?`, a - b); }
    case "missingAddend": { const c = d.int(0, p("max", 10)), a = d.int(0, c); return q(`${a} + ? = ${c}`, c - a); }
    case "makeTen": { const a = d.int(0, 10); return q(`${a} + ? = 10`, 10 - a); }
    case "doubles": { const n = d.int(0, p("max", 10)); return q(`${n} + ${n} = ?`, 2 * n); }
    case "factFamily": {
      const m = p("max", 10), a = d.int(1, m), b = d.int(1, m);
      return q(`If ${a} + ${b} = ${a + b}, what is ${a + b} − ${b}?`, a);
    }
    case "wordAdd": {
      const m = p("max", 10), a = d.int(1, m), b = d.int(1, m);
      const thing = d.pick(["apples", "stickers", "blocks", "shells", "crayons"]);
      if (d.bool()) return q(`Sam has ${a} ${thing}. Sam gets ${b} more. How many ${thing} now?`, a + b);
      return q(`Sam has ${a + b} ${thing}. Sam gives away ${b}. How many ${thing} are left?`, a);
    }
    case "money": {
      // Starter: dimes and pennies only. Core adds nickels. Challenge adds quarters.
      const qu = tier >= 3 ? d.int(0, 3) : 0, di = d.int(0, 4), ni = tier >= 2 ? d.int(0, 3) : 0, pe = d.int(0, 4);
      const coins = [[qu, "quarter", "quarters"], [di, "dime", "dimes"], [ni, "nickel", "nickels"], [pe, "penny", "pennies"]];
      const parts = coins.filter(c => c[0] > 0).map(c => (c[0] === 1 ? `1 ${c[1]}` : `${c[0]} ${c[2]}`));
      if (!parts.length) return q("How many cents is 1 dime?", 10);
      return q(`How many cents?\n${parts.join(", ")}`, qu * 25 + di * 10 + ni * 5 + pe);
    }
    case "time": {
      const h = d.int(1, 12);
      if (tier === 1 || d.bool()) return q(`The short hand points to ${h}. The long hand points to 12. What time is it?`, `${h}:00`);
      const nh = h === 12 ? 1 : h + 1;
      return q(`The short hand is between ${h} and ${nh}. The long hand points to 6. What time is it?`, `${h}:30`);
    }

    // Multiplication, division, fractions, decimals
    case "mul": { const a = d.int(p("min", 0), p("max", 10)), b = d.int(p("min", 0), p("max", 10)); return q(`${a} × ${b} = ?`, a * b); }
    case "div": { const b = d.int(1, p("max", 10)), x = d.int(0, p("max", 10)); return q(`${b * x} ÷ ${b} = ?`, x); }
    case "orderOps": {
      const a = d.int(1, 9), b = d.int(1, 9), c = d.int(1, 9);
      return d.bool() ? q(`${a} + ${b} × ${c} = ?`, a + b * c) : q(`(${a} + ${b}) × ${c} = ?`, (a + b) * c);
    }
    case "fractionOf": { const den = d.int(2, p("maxDen", 10)), n = den * d.int(1, 10); return q(`What is 1/${den} of ${n}?`, n / den); }
    case "fractionAdd": { const den = d.int(2, p("maxDen", 12)), a = d.int(1, den), b = d.int(1, den); return q(`${a}/${den} + ${b}/${den} = ?`, `${a + b}/${den}`); }
    case "fractionCompare": {
      const d1 = d.int(2, 12), d2 = d.int(2, 12), n1 = d.int(1, d1), n2 = d.int(1, d2);
      if (n1 * d2 === n2 * d1) return mc("Which is greater?", [`${n1}/${d1}`, `${n1 + 1}/${d1}`], `${n1 + 1}/${d1}`);
      return mc("Which is greater?", [`${n1}/${d1}`, `${n2}/${d2}`], n1 * d2 > n2 * d1 ? `${n1}/${d1}` : `${n2}/${d2}`);
    }
    case "decimalAdd": { const a = d.int(1, 99), b = d.int(1, 99); return q(`${G.tenths(a)} + ${G.tenths(b)} = ?`, G.tenths(a + b)); }
    case "percent": { const pct = d.pick([10, 20, 25, 50, 75]), n = 20 * d.int(1, 10); return q(`What is ${pct}% of ${n}?`, pct * n / 100); }

    // Integers, powers, roots
    case "integerAdd": { const m = p("max", 20), a = d.int(-m, m), b = d.int(-m, m); return q(`(${a}) + (${b}) = ?`, a + b); }
    case "integerMul": { const m = p("max", 12), a = d.int(-m, m), b = d.int(-m, m); return q(`(${a}) × (${b}) = ?`, a * b); }
    case "exponent": { const base = d.int(2, p("maxBase", 6)), e = d.int(2, base <= 3 ? 5 : 3); return q(`${base}^${e} = ?`, base ** e); }
    case "sqrt": { const n = d.int(1, p("max", 15)); return q(`√${n * n} = ?`, n); }

    // Algebra
    case "linearEq": {
      const m = p("max", 10);
      let a = d.int(1, 9); if (d.bool()) a = -a;
      const x = d.int(-m, m), b = d.int(-m, m);
      return q(`Solve for x:\n${G.term(a, "x")}${G.signed(b)} = ${a * x + b}`, x);
    }
    case "proportion": { const a = d.int(1, 9), b = d.int(2, 9), k = d.int(2, 6); return q(`${a}/${b} = x/${b * k}. What is x?`, a * k); }
    case "slope": {
      const x1 = d.int(-5, 5), dx = d.int(1, 5), m = d.int(-4, 4), y1 = d.int(-5, 5);
      return q(`What is the slope of the line through (${x1}, ${y1}) and (${x1 + dx}, ${y1 + m * dx})?`, m);
    }
    case "evalPoly": {
      const a = d.int(1, 4), b = d.int(-5, 5), c = d.int(-9, 9), k = d.int(-3, 3);
      return q(`f(x) = ${G.term(a, "x²")}${G.signedTerm(b, "x")}${G.signed(c)}. What is f(${k})?`, a * k * k + b * k + c);
    }
    case "quadraticRoots": {
      const r = d.int(-9, 9); let s = d.int(-9, 9); if (s === r) s += 1;
      return q(`Solve x²${G.signedTerm(-(r + s), "x")}${G.signed(r * s)} = 0.\nGive the larger solution.`, Math.max(r, s));
    }

    // Statistics and probability
    case "mean": {
      const n = tier === 1 ? 3 : d.int(3, 5);
      const values = Array.from({ length: n - 1 }, () => d.int(1, 20));
      const target = d.int(5, 15);
      values.push(target * n - values.reduce((a, b) => a + b, 0));
      if (values[values.length - 1] < 0) return q("Mean of 2, 4, 6?", 4);
      return q(`What is the mean of ${d.shuffled(values).join(", ")}?`, target);
    }
    case "median": {
      const values = Array.from({ length: tier === 1 ? 3 : 2 * d.int(1, 3) + 1 }, () => d.int(1, 50));
      return q(`What is the median of ${values.join(", ")}?`, [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)]);
    }
    case "probabilityDie": { const k = d.int(1, 5); return q(`A fair die is rolled. What is the probability of rolling a number greater than ${k}? (fraction)`, `${6 - k}/6`); }
    case "binomial": { const n = d.int(2, p("max", 10)), k = d.int(0, n); return q(`How many ways to choose ${k} items from ${n}? (${n} choose ${k})`, G.choose(n, k)); }

    // Number theory
    case "gcd": { const g = d.int(1, 12), a = g * d.int(1, 12), b = g * d.int(1, 12); return q(`gcd(${a}, ${b}) = ?`, G.gcd(a, b)); }
    case "lcm": { const a = d.int(2, 15), b = d.int(2, 15); return q(`lcm(${a}, ${b}) = ?`, a / G.gcd(a, b) * b); }
    case "mod": { const n = d.int(2, p("max", 13)), a = d.int(0, 200); return q(`${a} mod ${n} = ?`, a % n); }
    case "modInverse": {
      const prime = d.pick([5, 7, 11, 13]), a = d.int(1, prime - 1);
      let inv = 1; for (let i = 1; i < prime; i++) if ((a * i) % prime === 1) { inv = i; break; }
      return q(`Find the inverse of ${a} modulo ${prime} (a number from 1 to ${prime - 1}).`, inv);
    }
    case "eulerPhi": {
      const n = d.int(2, 40);
      let c = 0; for (let i = 1; i <= n; i++) if (G.gcd(i, n) === 1) c++;
      return q(`φ(${n}) = ? (how many numbers from 1 to ${n} share no factor with ${n})`, c);
    }
    case "groupOrder": { const n = d.int(4, 24), k = d.int(1, n - 1); return q(`In the group ℤ${G.sub(n)} under addition, what is the order of ${k}?`, n / G.gcd(n, k)); }

    // Calculus and series
    case "logBase": { const base = d.pick([2, 3, 5, 10]), e = d.int(0, 4); return q(`log base ${base} of ${base ** e} = ?`, e); }
    case "derivative": {
      const a = d.int(1, 5), n = d.int(2, 4), b = d.int(-6, 6), k = d.int(-2, 2);
      return q(`f(x) = ${G.term(a, `x^${n}`)}${G.signedTerm(b, "x")}. What is f′(${k})?`, a * n * k ** (n - 1) + b);
    }
    case "integral": { const a = d.int(1, 6), k = d.int(1, 5); return q(`Evaluate the integral from 0 to ${k} of ${2 * a}x dx.`, a * k * k); }
    case "limit": { const a = d.int(-6, 6); return q(`lim as x → ${a} of (x² − ${a * a}) / (x${G.signed(-a)}) = ?`, 2 * a); }
    case "geometricSeries": { const a = d.int(1, 20) * 2; return q(`${a} + ${a / 2} + ${G.half(a, 4)} + ${G.half(a, 8)} + … (forever) = ?`, 2 * a); }

    // Linear algebra and complex numbers
    case "det2": { const v = Array.from({ length: 4 }, () => d.int(-6, 6)); return q(`det [[${v[0]}, ${v[1]}], [${v[2]}, ${v[3]}]] = ?`, v[0] * v[3] - v[1] * v[2]); }
    case "dot": {
      const u = Array.from({ length: 3 }, () => d.int(-5, 5)), w = Array.from({ length: 3 }, () => d.int(-5, 5));
      return q(`(${u.join(", ")}) · (${w.join(", ")}) = ?`, u.reduce((s, x, i) => s + x * w[i], 0));
    }
    case "eigenTriangular": {
      const a = d.int(-6, 6), b = d.int(-6, 6); let dd = d.int(-6, 6); if (dd === a) dd += 1;
      return q(`The matrix [[${a}, ${b}], [0, ${dd}]] has two eigenvalues. What is the larger one?`, Math.max(a, dd));
    }
    case "complexModulus": { const t = d.pick([[3, 4, 5], [5, 12, 13], [6, 8, 10], [8, 15, 17], [7, 24, 25]]); return q(`|${t[0]} + ${t[1]}i| = ?`, t[2]); }

    default: return null;
  }
}

// ---------- Question factory ----------
class QuestionFactory {
  constructor() { this.recent = {}; }
  question(skill, tier = 3) {
    if (skill.practice?.generator) {
      const key = skill.practice.generator;
      const g = makeGenerated(key, tierParams(key, skill.practice.params, tier), skill.id, tier);
      if (g) return { ...g, tier };
    }
    const all = skill.practice?.items || [];
    if (!all.length) return null;
    // Items for this tier; if none, the closest tier (easier first). Untagged items fit any tier.
    let items = [];
    for (const t of [tier, tier - 1, tier + 1, tier - 2, tier + 2]) {
      items = all.filter(i => i.tier == null || i.tier === t);
      if (items.length) break;
    }
    const recent = this.recent[skill.id] || [];
    const fresh = items.filter(i => !recent.includes(i.prompt));
    const item = Dice.pick(fresh.length ? fresh : items);
    const updated = [...recent, item.prompt];
    if (updated.length > Math.max(1, items.length - 1)) updated.shift();
    this.recent[skill.id] = updated;
    return {
      skillId: skill.id,
      prompt: item.prompt,
      choices: item.choices ? Dice.shuffled(item.choices) : null,
      answer: item.answer ?? null,
      tutorJudged: item.mode === "tutor",
      tier,
    };
  }
}

function checkAnswer(question, given) {
  return question.answer != null && AnswerChecker.matches(given, question.answer);
}

// ---------- Profiles (saved in this browser) ----------
const STORE_KEY = "tutor.profiles.v1";

function uuid() {
  if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
  return "p-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

const ProfileStore = {
  profiles: [],
  available: true,
  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      this.profiles = raw ? JSON.parse(raw) : [];
    } catch (e) {
      this.profiles = [];
      this.available = false;
    }
  },
  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.profiles)); this.available = true; }
    catch (e) { this.available = false; }
  },
  get(id) { return this.profiles.find(p => p.id === id); },
  add(name) {
    const p = { id: uuid(), name, createdAt: Date.now(), progress: {}, currentDay: {}, sessions: [] };
    this.profiles.push(p);
    this.save();
    return p;
  },
  remove(id) { this.profiles = this.profiles.filter(p => p.id !== id); this.save(); },
  exportText() {
    return JSON.stringify({ kind: "tutor-progress", version: 1, exportedAt: new Date().toISOString(), profiles: this.profiles }, null, 1);
  },
  // Merge a backup in: learners with the same id are replaced, new ones added.
  importText(text) {
    const data = JSON.parse(text);
    const list = Array.isArray(data) ? data : data.profiles;
    if (!Array.isArray(list)) throw new Error("That text isn't a progress backup.");
    let count = 0;
    for (const p of list) {
      if (!p || !p.id || !p.name) continue;
      const clean = { progress: {}, currentDay: {}, sessions: [], createdAt: Date.now(), ...p };
      const i = this.profiles.findIndex(x => x.id === p.id);
      if (i >= 0) this.profiles[i] = clean; else this.profiles.push(clean);
      count++;
    }
    this.save();
    return count;
  },
};

function stateOf(profile, curriculumId, skillId) {
  return profile.progress?.[curriculumId]?.[skillId] || newSkillState();
}
function statesOf(profile, curriculumId) { return profile.progress?.[curriculumId] || {}; }

function studySecondsOn(profile, day = new Date()) {
  const start = new Date(day); start.setHours(0, 0, 0, 0);
  const end = start.getTime() + DAY_MS;
  return (profile.sessions || [])
    .filter(s => s.startedAt >= start.getTime() && s.startedAt < end)
    .reduce((t, s) => t + (s.activeSeconds || 0), 0);
}

// ---------- Practice session ----------
// mode: {type:"adaptive"} | {type:"focus", skillIds, reviewCount} | {type:"diagnostic"}
// The placement test asks Challenge questions; practice asks at the learner's tier.
class PracticeSession {
  constructor(curriculum, graph, profile, mode, goal = 20) {
    this.curriculum = curriculum;
    this.graph = graph;
    this.profile = profile;
    this.mode = mode;
    this.picker = new SkillPicker(graph);
    this.factory = new QuestionFactory();
    this.plan = [];
    this.diagnostic = null;
    this.goal = goal;

    if (mode.type === "focus") {
      const focus = mode.skillIds.filter(id => graph.skill(id) && hasPractice(graph.skill(id)));
      const per = focus.length ? Math.max(1, Math.floor(goal / focus.length)) : 0;
      for (let i = 0; i < per; i++) this.plan.push(...focus);
      this.plan.push(...PracticeSession.reviewSkills(mode.reviewCount, new Set(mode.skillIds), graph, profile, curriculum.id));
      this.goal = this.plan.length;
    } else if (mode.type === "diagnostic") {
      this.diagnostic = new Diagnostic(graph);
      this.goal = curriculum.stages.length * this.diagnostic.questionsPerStage;
    }

    this.session = { id: uuid(), curriculumId: curriculum.id, startedAt: Date.now(), endedAt: null, activeSeconds: 0, attempts: [] };
    this.question = null;
    this.currentSkill = null;
    this.missesBySkill = {};
    this.approach = null;
    this.reason = "advance";
    this.feedback = null;
    this.lessonToShow = null;
    this.isPaused = false;
    this.answered = 0;
    this.correct = 0;
    this.finished = false;
    this.questionStartedAt = 0;
    this.pausedDuringQuestion = 0;
    this.pausedAt = null;
    this.activeSince = null;
  }

  start() { this.activeSince = Date.now(); this.advance(); }

  submit(given) {
    if (!this.question || this.feedback || this.isPaused) return;
    this.record(given, checkAnswer(this.question, given), this.elapsed());
  }
  judge(isCorrect) {
    if (!this.question || this.feedback || this.isPaused || !this.question.tutorJudged) return;
    this.record(isCorrect ? "tutor: correct" : "tutor: incorrect", isCorrect, this.elapsed());
  }
  timeUp() {
    if (!this.question || this.feedback || this.isPaused) return;
    this.record("(time up)", false, Comprehension.questionCapSeconds);
  }
  next() { this.feedback = null; this.lessonToShow = null; this.approach = null; this.advance(); }

  pause() {
    if (this.isPaused || this.finished) return;
    this.isPaused = true;
    const now = Date.now();
    this.pausedAt = now;
    if (this.activeSince) this.session.activeSeconds += (now - this.activeSince) / 1000;
    this.activeSince = null;
    this.persist();
  }
  resume() {
    if (!this.isPaused) return;
    this.isPaused = false;
    const now = Date.now();
    if (this.pausedAt) this.pausedDuringQuestion += (now - this.pausedAt) / 1000;
    this.pausedAt = null;
    this.activeSince = now;
  }
  end() {
    if (this.finished) return;
    if (this.activeSince) this.session.activeSeconds += (Date.now() - this.activeSince) / 1000;
    this.activeSince = null;
    this.session.endedAt = Date.now();
    if (this.diagnostic) {
      this.profile.progress[this.curriculum.id] = this.diagnostic.apply(statesOf(this.profile, this.curriculum.id));
    }
    this.finished = true;
    this.question = null;
    this.persist();
  }

  elapsed(now = Date.now()) {
    const paused = this.pausedDuringQuestion + (this.pausedAt ? (now - this.pausedAt) / 1000 : 0);
    return Math.max(0, (now - this.questionStartedAt) / 1000 - paused);
  }
  get activeSeconds() {
    return this.session.activeSeconds + (this.activeSince ? (Date.now() - this.activeSince) / 1000 : 0);
  }

  record(given, isCorrect, seconds) {
    const q = this.question, skill = this.currentSkill;
    if (!q || !skill) return;
    const secs = Math.min(seconds, Comprehension.questionCapSeconds);
    const cid = this.curriculum.id;
    const updated = Comprehension.record(stateOf(this.profile, cid, skill.id), isCorrect, secs, skill.sightPaceSeconds);
    this.profile.progress[cid] = { ...statesOf(this.profile, cid), [skill.id]: updated };
    this.session.attempts.push({ skillId: skill.id, prompt: q.prompt, given, correct: isCorrect, seconds: secs, at: Date.now() });
    if (this.diagnostic) this.diagnostic.record(skill, isCorrect, secs);
    this.answered += 1;
    if (isCorrect) this.correct += 1;
    const pace = skill.sightPaceSeconds ?? Comprehension.defaultSightPace;
    this.feedback = { correct: isCorrect, expected: q.tutorJudged ? null : q.answer, seconds: secs, sightPace: isCorrect && secs <= pace };
    if (!isCorrect && !this.diagnostic) {
      this.lessonToShow = skill;
      // Each miss on a skill brings the next teaching approach: Show, Do together, Try alone.
      const n = (this.missesBySkill[skill.id] = (this.missesBySkill[skill.id] || 0) + 1);
      this.approach = { index: (n - 1) % 3, ...Approaches[(n - 1) % 3] };
    }
    this.persist();
  }

  advance() {
    const skill = this.nextSkill();
    const tier = !skill ? 1 : this.diagnostic ? 3 : Tiers.current(stateOf(this.profile, this.curriculum.id, skill.id));
    const q = skill ? this.factory.question(skill, tier) : null;
    if (!skill || !q) { this.end(); return; }
    this.currentSkill = skill;
    this.question = q;
    this.questionStartedAt = Date.now();
    this.pausedDuringQuestion = 0;
  }

  nextSkill() {
    if (this.mode.type === "adaptive") {
      if (this.answered >= this.goal) return null;
      const pick = this.picker.next(statesOf(this.profile, this.curriculum.id));
      this.reason = pick.reason;
      return pick.skill;
    }
    if (this.mode.type === "focus") {
      if (this.answered >= this.plan.length) return null;
      const tail = Math.min(this.mode.reviewCount, this.plan.length);
      this.reason = this.answered < this.plan.length - tail ? "advance" : "review";
      return this.graph.skill(this.plan[this.answered]);
    }
    if (!this.diagnostic || this.diagnostic.finished) return null;
    this.reason = "advance";
    return this.diagnostic.nextSkill();
  }

  persist() {
    const snap = { ...this.session, attempts: [...this.session.attempts], activeSeconds: this.activeSeconds };
    const list = this.profile.sessions || (this.profile.sessions = []);
    const i = list.findIndex(s => s.id === snap.id);
    if (i >= 0) list[i] = snap;
    else if (snap.attempts.length || snap.activeSeconds > 0) list.push(snap);
    ProfileStore.save();
  }

  static reviewSkills(count, excluding, graph, profile, cid) {
    if (count <= 0) return [];
    const practiced = graph.ordered.filter(s => !excluding.has(s.id) && hasPractice(s) && stateOf(profile, cid, s.id).attempts > 0);
    const due = practiced.filter(s => SpacedReview.isDue(stateOf(profile, cid, s.id)));
    const weakest = [...practiced].sort((a, b) => stateOf(profile, cid, a.id).comprehension - stateOf(profile, cid, b.id).comprehension);
    const picks = [];
    for (const s of [...due, ...weakest]) {
      if (!picks.includes(s.id)) picks.push(s.id);
      if (picks.length === count) break;
    }
    return picks;
  }
}

if (typeof module !== "undefined") {
  module.exports = { Comprehension, SpacedReview, SkillGraph, SkillPicker, Diagnostic, AnswerChecker,
    makeGenerated, tierParams, QuestionFactory, shortFormsIn, Tiers, PartNames, Approaches, PracticeSession, ProfileStore, hasPractice, newSkillState, ReasonLabel };
}

</script>
<script>
// Screens for the web tutor. One file runs either app:
// APP_CONFIG.kind = "first-grade" (daily lessons) or "math-ladder" (adaptive ladder).
"use strict";

const App = {
  kind: (window.APP_CONFIG && window.APP_CONFIG.kind) || "math-ladder",
  curriculum: null,
  graph: null,
  picker: null,
  profileId: null,
  stack: [],
  session: null,
  typed: "",
  sessionDone: null,
  confirmDelete: null,
  backupOpen: false,
  toastTimer: null,
};

const $root = () => document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => `${Math.round((x || 0) * 100)}%`;
const mins = secs => `${Math.floor(secs / 60)} min`;

// ---------- Boot ----------
async function boot() {
  ProfileStore.load();
  try {
    App.curriculum = window.CURRICULUM || await (await fetch("curriculum.json")).json();
  } catch (e) {
    $root().innerHTML = `<div class="wrap"><p class="error">The lessons didn't load. Close and reopen the page.</p></div>`;
    return;
  }
  App.graph = new SkillGraph(App.curriculum);
  App.picker = new SkillPicker(App.graph);
  document.title = App.curriculum.title;
  let last = null;
  try { last = localStorage.getItem(`tutor.last.${App.kind}`); } catch (e) {}
  if (last && ProfileStore.get(last)) { App.profileId = last; App.stack = [{ screen: "home" }]; }
  else App.stack = [{ screen: "learners" }];

  document.addEventListener("click", onClick);
  document.addEventListener("keydown", onKey);
  document.addEventListener("input", e => { if (e.target.id === "answer-input") App.typed = e.target.value; });
  document.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "add-learner") addLearner(); if (e.target.id === "answer-form") sendTyped(); });
  document.addEventListener("change", e => { if (e.target.id === "restore-file") restoreFromFile(e.target); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && App.session && !App.session.finished && !App.session.isPaused) { App.session.pause(); render(); }
  });
  setInterval(tick, 250);
  render();
}

// ---------- Navigation ----------
const current = () => App.stack[App.stack.length - 1];
function go(screen, params = {}) { App.stack.push({ screen, ...params }); render(true); }
function back() {
  const cur = current();
  if (cur.screen === "session" && App.session && !App.session.finished) App.session.end();
  if (cur.screen === "session") { App.session = null; App.sessionDone = null; }
  if (App.stack.length > 1) App.stack.pop();
  render(true);
}
function goHome() { App.session = null; App.stack = [{ screen: "home" }]; render(true); }

const profile = () => ProfileStore.get(App.profileId);
const states = () => statesOf(profile(), App.curriculum.id);

// ---------- Rendering ----------
function render(scroll) {
  const cur = current();
  const views = { learners: viewLearners, home: App.kind === "first-grade" ? viewHomeFG : viewHomeML,
    lesson: viewLesson, result: viewResult, session: viewSession, map: viewMap,
    stages: viewStages, stage: viewStage, skill: viewSkill };
  if (cur.screen !== "learners" && !profile()) { App.stack = [{ screen: "learners" }]; return render(true); }
  $root().innerHTML = (views[cur.screen] || viewLearners)(cur);
  if (scroll) window.scrollTo(0, 0);
  const input = document.getElementById("answer-input");
  if (input) { input.value = App.typed; input.focus({ preventScroll: true }); }
}

function bar(title, opts = {}) {
  const left = App.stack.length > 1
    ? `<button class="nav-btn" data-action="back" aria-label="Back">‹ Back</button>`
    : opts.learners ? `<button class="nav-btn" data-action="learners">Learners</button>` : `<span></span>`;
  return `<header class="bar"><div class="bar-in">${left}<h1 class="bar-title">${esc(title)}</h1><span class="bar-right">${opts.right || ""}</span></div></header>`;
}

function dot(level) { return `<span class="dot lv-${level}" aria-hidden="true"></span>`; }
function levelChip(s) {
  const l = Comprehension.level(s);
  const tier = s.attempts > 0 ? ` · ${Tiers.names[Tiers.current(s)]} tier` : "";
  return `<span class="chip lv-${l}">${dot(l)}${Comprehension.levelLabel[l]}${s.attempts > 0 || s.provisional ? ` · ${pct(s.comprehension)}` : ""}${tier}${s.provisional ? " (placement)" : ""}</span>`;
}

// The three teaching approaches, in order: Show, Do together, Try alone.
function approachesList(a, heading) {
  if (!a) return "";
  return `<section class="approaches"><h4>${esc(heading)}</h4><ol>${Approaches.map(x => a[x.key] ? `<li><strong>${x.name}.</strong> <span class="muted small">${x.blurb}</span><br>${esc(a[x.key])}</li>` : "").join("")}</ol></section>`;
}

function stageFullyMastered(stageId) {
  const st = states();
  return App.graph.skillsIn(stageId).every(s => Comprehension.isFullyMastered(st[s.id]));
}

function stageApproaches(stage) {
  if (!stage.approaches || stageFullyMastered(stage.id)) return "";
  return `<details class="card pad stage-approaches"><summary><strong>Three ways to teach this level</strong></summary>
    ${approachesList(stage.approaches, "")}</details>`;
}

function partProgress(stageId) {
  const st = states();
  return `<div class="parts">${App.graph.partsOf(stageId).map(p => {
    const m = p.skills.filter(s => ["mastered", "sight"].includes(Comprehension.level(st[s.id]))).length;
    return `<div class="part"><span class="small"><strong>Part ${p.n}</strong> ${p.name}</span>${meter(m, Math.max(p.skills.length, 1))}<span class="small muted num">${m}/${p.skills.length}</span></div>`;
  }).join("")}</div>`;
}
function meter(value, total) {
  const w = total > 0 ? Math.min(100, Math.max(0, (value / total) * 100)) : 0;
  return `<div class="meter" role="progressbar" aria-valuenow="${value}" aria-valuemax="${total}"><span style="width:${w}%"></span></div>`;
}
function row(label, value) { return `<div class="row"><span>${esc(label)}</span><span class="num">${esc(value)}</span></div>`; }

function skillTexts(skill) {
  const L = skill.lesson || {};
  return [skill.title, skill.summary, L.explanation, L.example, ...(L.tutorSteps || []), skill.reinforcement];
}

// "What the short forms mean": shown wherever an abbreviation appears.
function termsBox(texts) {
  const found = shortFormsIn(App.curriculum, texts);
  if (!found.length) return "";
  return `<dl class="terms"><p class="label">What the short forms mean</p>${found.map(g =>
    `<div><dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}</dd></div>`).join("")}</dl>`;
}

function lessonCard(skill, compact = false, extraTexts = [], approach = null) {
  const L = skill.lesson || {};
  let html = `<article class="lesson ${compact ? "compact" : ""}"><h3>${esc(skill.title)}</h3><p>${esc(L.explanation)}</p>`;
  if (L.example) html += `<p class="example"><span class="label">Example</span>${esc(L.example)}</p>`;
  if (!compact && L.tutorSteps?.length) {
    html += `<h4>Tutor steps</h4><ol>${L.tutorSteps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
  }
  if (!compact && skill.reinforcement) html += `<p class="muted small">Keep it fresh: ${esc(skill.reinforcement)}</p>`;
  const a = L.approaches;
  const extra = [];
  if (compact && approach && a?.[approach.key]) {
    html += `<div class="approach-now"><span class="label">New way to teach it · ${approach.index + 1} of 3</span>
      <p><strong>${approach.name}.</strong> ${esc(a[approach.key])}</p></div>`;
    extra.push(a[approach.key]);
  } else if (!compact && a && !Comprehension.isFullyMastered(stateOf(profile(), App.curriculum.id, skill.id))) {
    html += approachesList(a, "Three ways to teach this");
    extra.push(...Approaches.map(x => a[x.key]));
  }
  const texts = compact ? [skill.title, L.explanation, L.example] : skillTexts(skill);
  return html + termsBox([...texts, ...extra, ...extraTexts]) + `</article>`;
}

function masteredCount() {
  const st = states();
  return App.curriculum.skills.filter(s => ["mastered", "sight"].includes(Comprehension.level(st[s.id]))).length;
}

// ---------- Learners ----------
function viewLearners() {
  const list = ProfileStore.profiles;
  let html = bar(App.curriculum.title);
  html += `<main class="wrap stack">`;
  html += `<section class="intro"><p class="eyebrow">${App.kind === "first-grade" ? "110 daily lessons" : "Grade 1 to doctoral · 33 levels"}</p>
    <h2 class="display">Who's learning today?</h2></section>`;
  if (!ProfileStore.available) html += `<p class="notice">This browser isn't saving progress (private browsing or blocked storage). Open the link in Safari or Chrome normally to keep progress.</p>`;
  html += `<section class="card list">`;
  if (!list.length) html += `<p class="muted pad">No learners yet. Add the first one below.</p>`;
  for (const p of list) {
    const confirming = App.confirmDelete === p.id;
    html += `<div class="learner">
      <button class="learner-main" data-action="pick" data-id="${esc(p.id)}"><span class="avatar">${esc(p.name.slice(0, 1).toUpperCase())}</span>
      <span><strong>${esc(p.name)}</strong><span class="muted small block">${learnerLine(p)}</span></span></button>
      ${confirming
        ? `<span class="confirm"><button class="btn small danger" data-action="delete-yes" data-id="${esc(p.id)}">Delete</button><button class="btn small ghost" data-action="delete-no">Keep</button></span>`
        : `<button class="icon-btn" data-action="delete" data-id="${esc(p.id)}" aria-label="Delete ${esc(p.name)}">✕</button>`}
    </div>`;
  }
  html += `</section>
    <form id="add-learner" class="add-row" autocomplete="off">
      <label for="learner-name" class="sr-only">Learner's name</label>
      <input id="learner-name" class="field" placeholder="Learner's name" maxlength="40">
      <button class="btn primary" type="submit">Add learner</button>
    </form>`;
  html += backupSection();
  html += `<p class="muted small">Progress is saved in this browser on this device. Use “Back up progress” to move it to another phone.</p></main>`;
  return html;
}

function learnerLine(p) {
  if (App.kind === "first-grade") {
    const day = p.currentDay?.[App.curriculum.id] || 1;
    return `Day ${day} of ${App.curriculum.skills.length}`;
  }
  const st = statesOf(p, App.curriculum.id);
  const m = App.curriculum.skills.filter(s => ["mastered", "sight"].includes(Comprehension.level(st[s.id]))).length;
  return `${m} of ${App.curriculum.skills.length} skills mastered`;
}

function backupSection() {
  if (!App.backupOpen) return `<button class="btn ghost wide" data-action="backup-open">Back up or restore progress</button>`;
  const inFrame = window.self !== window.top;
  return `<section class="card pad stack-sm" id="backup">
    <h3>Back up progress</h3>
    <p class="small muted">Copy the backup and paste it into a note, email or text to yourself. To move progress to another phone, open the app there and paste it under Restore.</p>
    <div class="btn-row"><button class="btn primary" data-action="backup-copy">Copy backup</button>
    ${inFrame ? "" : `<button class="btn" data-action="backup-download">Save backup file</button>`}</div>
    <h3>Restore</h3>
    <label for="restore-text" class="small muted">Paste a backup here</label>
    <textarea id="restore-text" class="field" rows="3" spellcheck="false"></textarea>
    <div class="btn-row"><button class="btn" data-action="restore-paste">Restore from pasted text</button>
    <label class="btn ghost file-btn">Choose backup file<input type="file" id="restore-file" accept=".json,application/json,text/plain"></label></div>
    <button class="btn ghost small" data-action="backup-close">Close</button>
  </section>`;
}

// ---------- First Grade home ----------
function fgDay(p = profile()) {
  const total = App.curriculum.skills.length;
  return Math.min(Math.max(p.currentDay?.[App.curriculum.id] || 1, 1), total);
}

function viewHomeFG() {
  const p = profile(), total = App.curriculum.skills.length, day = fgDay(p);
  const skill = App.curriculum.skills.find(s => s.day === day);
  let html = bar(p.name, { learners: true });
  html += `<main class="wrap stack">`;
  if (skill) {
    const s = stateOf(p, App.curriculum.id, skill.id);
    html += `<section class="today">
      <p class="eyebrow">Day ${day} of ${total} · <span class="subj">${esc(skill.subject || "")}</span> · Part ${App.graph.partOfSkill(skill)}: ${PartNames[App.graph.partOfSkill(skill)]}</p>
      <h2 class="display">${esc(skill.title)}</h2>
      <p>${esc(skill.summary)}</p>
      ${levelChip(s)}
      <button class="btn primary big" data-action="lesson" data-id="${esc(skill.id)}">Start today's lesson</button>
    </section>`;
  } else {
    html += `<section class="today"><h2 class="display">All ${total} days complete!</h2></section>`;
  }
  if (skill) {
    const stage = App.graph.stage(skill.stage);
    html += `<section class="card pad stack-sm"><h3>This level: ${esc(stage.title)}</h3>${partProgress(stage.id)}</section>${stageApproaches(stage)}`;
  }
  html += `<section class="card pad stack-sm"><h3>Tutor controls</h3>
    <div class="stepper"><button class="btn" data-action="day" data-delta="-1" ${day <= 1 ? "disabled" : ""} aria-label="Previous day">−</button>
    <span class="num">Day ${day}</span>
    <button class="btn" data-action="day" data-delta="1" ${day >= total ? "disabled" : ""} aria-label="Next day">+</button></div>
    <button class="link-row" data-action="review">Memory review <span class="muted">earlier topics ›</span></button>
    <button class="link-row" data-action="map">Skill map <span class="muted">all ${total} topics ›</span></button>
  </section>`;
  html += `<section class="card pad stack-sm"><h3>Progress</h3>
    ${row("Study time today", mins(studySecondsOn(p)))}
    ${row("Topics mastered", `${masteredCount()} of ${total}`)}
    ${meter(day - 1, total)}
    <p class="small muted">Subtract study time from screen time. Paused time doesn't count.</p>
  </section></main>`;
  return html;
}

// ---------- Math Ladder home ----------
function viewHomeML() {
  const p = profile(), st = states();
  const pick = App.picker.next(st);
  const stage = pick.skill ? App.graph.stage(pick.skill.stage) : null;
  const gaps = App.picker.biggestGaps(st);
  let html = bar(p.name, { learners: true });
  html += `<main class="wrap stack">`;
  html += `<section class="today">
    <p class="eyebrow">Up next · ${ReasonLabel[pick.reason]}</p>
    <h2 class="display">${esc(pick.skill?.title || "Everything available is mastered")}</h2>
    ${stage ? `<p class="muted">${esc(stage.title)}</p>` : ""}
    <button class="btn primary big" data-action="adaptive">Continue practice · 20 questions</button>
  </section>`;
  html += `<section class="card pad stack-sm"><h3>Placement test</h3>
    <p class="small muted">Climbs the ladder a few questions per level and stops where it gets hard. Practice later confirms or corrects the placement.</p>
    <button class="btn" data-action="placement">Take placement test</button></section>`;
  html += `<section class="card pad stack-sm"><h3>Biggest gaps</h3>`;

  for (const g of gaps) html += `<button class="link-row" data-action="skill" data-id="${esc(g.id)}">${esc(g.title)}<span class="num warn">${pct(st[g.id]?.comprehension)}</span></button>`;
  html += `</section>`;
  html += `<section class="card pad stack-sm"><h3>The ladder</h3>
    <button class="link-row" data-action="stages">Browse all levels <span class="muted">›</span></button>
    <button class="link-row" data-action="map">Skill map <span class="muted">›</span></button>
    ${row("Highest level passed", highestStage())}
    ${row("Skills mastered", `${masteredCount()} of ${App.curriculum.skills.length}`)}
  </section>`;
  html += `<section class="card pad stack-sm"><h3>Time</h3>${row("Study time today", mins(studySecondsOn(p)))}
    <p class="small muted">Subtract this from screen time. Paused time doesn't count.</p></section></main>`;

}

function highestStage() {
  const st = states();
  let best = null;
  for (const stage of App.graph.stagesSorted) {
    const skills = App.graph.skillsIn(stage.id);
    if (skills.length && skills.every(s => Comprehension.isPassed(st[s.id]))) best = stage;
  }
  return best ? best.title : "Just starting";
}

// ---------- Lesson flow (First Grade) ----------
function viewLesson(cur) {
  const skill = App.graph.skill(cur.id);
  const earlier = (skill.prerequisites || []).map(id => App.graph.skill(id)?.title).filter(Boolean);
  return bar(`Day ${skill.day ?? ""}`) + `<main class="wrap stack">
    <p class="eyebrow">${esc(skill.subject || "")}</p>
    ${lessonCard(skill)}
    ${earlier.length ? `<p class="small muted">Builds on: ${esc(earlier.join(", "))}</p>` : ""}
    <button class="btn primary big" data-action="lesson-practice" data-id="${esc(skill.id)}">Start practice</button>
  </main>`;
}

function viewResult(cur) {
  const skill = App.graph.skill(cur.id);
  const s = stateOf(profile(), App.curriculum.id, skill.id);
  const passed = Comprehension.isPassed(s);
  const last = App.curriculum.skills.length;
  return bar(skill.title) + `<main class="wrap stack center">
    <h2 class="display">${esc(skill.title)}</h2>
    ${levelChip(s)}
    ${s.averageSeconds != null ? `<p class="muted">Average ${s.averageSeconds.toFixed(1)} s per question</p>` : ""}
    <p>${passed ? "Ready for the next day." : "Not passed yet. Practice again tomorrow, or move on if you're sure."}</p>
    <div class="stack-sm">
    ${skill.day && skill.day < last ? `<button class="btn primary big" data-action="move-on" data-day="${skill.day + 1}">${passed ? `Go to Day ${skill.day + 1}` : "Move on anyway"}</button>` : ""}
    <button class="btn" data-action="lesson-practice" data-id="${esc(skill.id)}">Practice again</button>
    <button class="btn ghost" data-action="home">Back to home</button></div>
  </main>`;
}

// ---------- Ladder browsing (Math Ladder) ----------
function viewStages() {
  const st = states();
  const levels = [];
  for (const s of App.graph.stagesSorted) { const l = s.level || "Other"; if (!levels.includes(l)) levels.push(l); }
  let html = bar("The ladder") + `<main class="wrap stack">`;
  for (const level of levels) {
    html += `<section><h3 class="section-h">${esc(level)}</h3><div class="card list">`;
    for (const stage of App.graph.stagesSorted.filter(s => (s.level || "Other") === level)) {
      const skills = App.graph.skillsIn(stage.id);
      const passed = skills.filter(s => Comprehension.isPassed(st[s.id])).length;
      html += `<button class="stage-row" data-action="stage" data-id="${esc(stage.id)}">
        <span class="stage-top"><strong>${esc(stage.title)}</strong><span class="num muted">${passed}/${skills.length}</span></span>
        ${stage.description ? `<span class="small muted">${esc(stage.description)}</span>` : ""}
        ${partProgress(stage.id)}</button>`;
    }
    html += `</div></section>`;
  }
  return html + `</main>`;
}

function viewStage(cur) {
  const stage = App.graph.stage(cur.id), st = states();
  let html = bar(stage.title) + `<main class="wrap stack">
    ${stage.description ? `<p class="muted">${esc(stage.description)}</p>` : ""}
    <button class="btn primary big" data-action="stage-practice" data-id="${esc(stage.id)}">Practice this level</button>
    ${stageApproaches(stage)}`;
  for (const part of App.graph.partsOf(stage.id)) {
    if (!part.skills.length) continue;
    const m = part.skills.filter(s => ["mastered", "sight"].includes(Comprehension.level(st[s.id]))).length;
    html += `<section><h3 class="section-h"><span>Part ${part.n} · ${part.name}</span><span class="num small">${m}/${part.skills.length} mastered</span></h3><div class="card list">`;
    for (const s of part.skills) {
      const x = st[s.id], l = Comprehension.level(x);
      const tier = x?.attempts ? ` · ${Tiers.names[Tiers.current(x)]}` : "";
      html += `<button class="skill-row" data-action="skill" data-id="${esc(s.id)}">${dot(l)}<span class="grow">${esc(s.title)}</span><span class="small muted">${Comprehension.levelLabel[l]}${tier}</span></button>`;
    }
    html += `</div><button class="btn ghost small" data-action="stage-practice" data-id="${esc(stage.id)}" data-part="${part.n}">Practice Part ${part.n}</button></section>`;
  }
  return html + `</main>`;
}

function viewSkill(cur) {
  const skill = App.graph.skill(cur.id), s = stateOf(profile(), App.curriculum.id, skill.id);
  const prereqs = (skill.prerequisites || []).map(id => App.graph.skill(id)).filter(Boolean);
  const stage = App.graph.stage(skill.stage), part = App.graph.partOfSkill(skill);
  let html = bar(skill.title) + `<main class="wrap stack">
    <p class="eyebrow">${esc(stage.title)} · Part ${part}: ${PartNames[part]}</p>${lessonCard(skill)}
    <div>${levelChip(s)}${s.attempts ? ` <span class="small muted">${s.attempts} answered</span>` : ""}</div>`;
  if (prereqs.length) {
    html += `<section class="card pad stack-sm"><h3>Builds on</h3>${prereqs.map(p => `<button class="link-row" data-action="skill" data-id="${esc(p.id)}">${dot(Comprehension.level(states()[p.id]))}<span class="grow">${esc(p.title)}</span><span class="muted">›</span></button>`).join("")}</section>`;
  }
  if (hasPractice(skill)) html += `<button class="btn primary big" data-action="skill-practice" data-id="${esc(skill.id)}">Practice this skill</button>`;
  else html += `<p class="muted small">Practice for this skill is coming soon.</p>`;
  return html + `</main>`;
}

// ---------- Skill map ----------
function viewMap() {
  const st = states();
  let sections;
  if (App.kind === "first-grade") {
    const subjects = [...new Set(App.curriculum.skills.map(s => s.subject).filter(Boolean))].sort();
    sections = subjects.map(sub => ({ title: sub, skills: App.curriculum.skills.filter(s => s.subject === sub).sort((a, b) => (a.day ?? 0) - (b.day ?? 0)) }));
  } else {
    sections = App.graph.stagesSorted.map(stage => ({ title: stage.title, skills: App.graph.skillsIn(stage.id) }));
  }
  let html = bar("Skill map") + `<main class="wrap stack">
    <div class="legend">${["new", "learning", "passing", "mastered", "sight"].map(l => `<span>${dot(l)}${Comprehension.levelLabel[l]}</span>`).join("")}</div>`;
  for (const sec of sections) {
    const m = sec.skills.filter(s => ["mastered", "sight"].includes(Comprehension.level(st[s.id]))).length;
    html += `<section><h3 class="section-h"><span>${esc(sec.title)}</span><span class="num muted small">${m}/${sec.skills.length} mastered</span></h3><div class="card list">`;
    for (const s of sec.skills) {
      const x = st[s.id] || newSkillState(), l = Comprehension.level(x);
      const right = !hasPractice(s) ? `<span class="small muted">coming soon</span>` : (x.attempts > 0 || x.provisional) ? `<span class="num">${pct(x.comprehension)}</span>` : "";
      html += `<button class="skill-row" data-action="skill" data-id="${esc(s.id)}">${dot(l)}<span class="grow">${s.day ? `<span class="muted small num">Day ${s.day}</span> ` : ""}${esc(s.title)}</span>${right}</button>`;
    }
    html += `</div></section>`;
  }
  return html + `</main>`;
}

// ---------- Practice session ----------
function startSession(mode, goal, title, onDone) {
  App.session = new PracticeSession(App.curriculum, App.graph, profile(), mode, goal);
  App.sessionDone = onDone || null;
  App.typed = "";
  App.session.start();
  go("session", { title });
}

const keypadOK = q => !q.choices && !q.tutorJudged && q.answer != null && /^[-−\d\/:.]+$/.test(q.answer);

function viewSession(cur) {
  const s = App.session;
  if (!s) return bar(cur.title) + `<main class="wrap"><p class="muted">Session ended.</p></main>`;
  const right = s.finished ? "" : `<button class="nav-btn" data-action="${s.isPaused ? "resume" : "pause"}">${s.isPaused ? "Resume" : "Pause"}</button>`;
  let html = bar(cur.title, { right });
  html += `<main class="wrap practice">`;
  if (!s.finished) {
    html += `<div class="practice-head"><div><strong>${esc(s.currentSkill?.title || "")}</strong>
      <span class="small muted block">${ReasonLabel[s.reason]}${s.question?.tier && !s.diagnostic ? ` · ${Tiers.names[s.question.tier]} tier` : ""}</span></div>
      <span class="num count">${Math.min(s.answered + (s.feedback ? 0 : 1), Math.max(s.goal, 1))}/${s.goal}</span>
      <button class="btn small ghost" data-action="end">End</button></div>`;
  }
  if (s.finished) html += summaryView(s);
  else if (s.isPaused) html += `<section class="center stack"><h2 class="display">Paused</h2><p class="muted">The clock is stopped. Progress so far is saved.</p><button class="btn primary big" data-action="resume">Resume</button></section>`;
  else if (s.feedback) html += feedbackView(s);
  else if (s.question) html += questionView(s.question);
  return html + `</main>`;
}

function questionView(q) {
  const left = Math.max(0, Comprehension.questionCapSeconds - App.session.elapsed());
  let html = `<div class="timer" aria-hidden="true"><span id="timer-fill" class="${left > 15 ? "" : "late"}" style="width:${(left / 60) * 100}%"></span></div>
    <p class="prompt">${esc(q.prompt)}</p>
    ${termsBox([q.prompt, ...(q.choices || [])])}`;
  if (q.choices) {
    html += `<div class="choices">${q.choices.map(c => `<button class="choice" data-action="choose" data-value="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  } else if (q.tutorJudged) {
    html += `<p class="small muted center">Tutor: mark the answer</p><div class="btn-row center-row">
      <button class="btn big warn-btn" data-action="judge" data-ok="0">Not yet</button>
      <button class="btn big ok-btn" data-action="judge" data-ok="1">Correct</button></div>`;
  } else if (keypadOK(q)) {
    const keys = ["7", "8", "9", "4", "5", "6", "1", "2", "3", "-", "0", "⌫"];
    const extra = [];
    if (/\//.test(q.answer)) extra.push("/");
    if (/:/.test(q.answer)) extra.push(":");
    if (/\./.test(q.answer)) extra.push(".");
    html += `<div class="answer-box num" aria-live="polite">${esc(App.typed) || `<span class="muted">?</span>`}</div>
      <div class="keypad">${keys.map(k => `<button class="key" data-action="key" data-key="${k}">${k}</button>`).join("")}
      ${extra.map(k => `<button class="key alt" data-action="key" data-key="${k}">${k}</button>`).join("")}</div>
      <button class="btn primary big wide" data-action="check" ${App.typed ? "" : "disabled"}>Check</button>`;
  } else {
    html += `<form id="answer-form" class="add-row" autocomplete="off">
      <label for="answer-input" class="sr-only">Answer</label>
      <input id="answer-input" class="field big-field" placeholder="Answer" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn primary" type="submit">Check</button></form>`;
  }
  return html;
}

function feedbackView(s) {
  const fb = s.feedback;
  return `<section class="feedback stack ${fb.correct ? "good" : "miss"}">
    <h2 class="display">${fb.correct ? (fb.sightPace ? "Right, at sight pace!" : "Right!") : "Not quite"}</h2>
    ${!fb.correct && fb.expected ? `<p class="answer-reveal">Answer: <strong>${esc(fb.expected)}</strong></p>` : ""}
    <p class="muted num">${fb.seconds.toFixed(1)} seconds</p>
    ${s.lessonToShow ? lessonCard(s.lessonToShow, true, [s.question?.prompt, fb.expected], s.approach)
                     : termsBox([s.question?.prompt, fb.expected])}
    <button class="btn primary big" data-action="next" id="next-btn">${s.lessonToShow ? "Got it, try another" : "Next"}</button>
  </section>`;
}

function summaryView(s) {
  const secs = Math.round(s.activeSeconds);
  let placed = "";
  if (s.diagnostic) {
    const last = s.diagnostic.passedStages[s.diagnostic.passedStages.length - 1];
    placed = `<p>Placed through: <strong>${esc(last ? App.graph.stage(last).title : "the start")}</strong></p>`;
  }
  return `<section class="center stack"><h2 class="display">Session done</h2>
    <p class="big-num num">${s.correct} of ${s.answered} right</p>
    <p class="muted">Study time: ${Math.floor(secs / 60)} min ${secs % 60} s</p>${placed}
    <button class="btn primary big" data-action="session-done">Done</button></section>`;
}

function sendTyped() {
  const a = App.typed.trim();
  if (!a || !App.session) return;
  App.session.submit(a);
  App.typed = "";
  render();
}

function tick() {
  const s = App.session;
  if (!s || current().screen !== "session" || s.finished || s.isPaused || s.feedback || !s.question) return;
  const left = Math.max(0, Comprehension.questionCapSeconds - s.elapsed());
  const fill = document.getElementById("timer-fill");
  if (fill) { fill.style.width = `${(left / 60) * 100}%`; fill.classList.toggle("late", left <= 15); }
  if (left <= 0) { s.timeUp(); render(); }
}

// ---------- Events ----------
function onClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const s = App.session;
  switch (a) {
    case "back": return back();
    case "home": return goHome();
    case "learners": App.confirmDelete = null; App.stack = [{ screen: "learners" }]; return render(true);
    case "pick":
      App.profileId = id;
      try { localStorage.setItem(`tutor.last.${App.kind}`, id); } catch (err) {}
      return goHome();
    case "delete": App.confirmDelete = id; return render();
    case "delete-no": App.confirmDelete = null; return render();
    case "delete-yes": ProfileStore.remove(id); App.confirmDelete = null; return render();
    case "backup-open": App.backupOpen = true; render(); return document.getElementById("backup")?.scrollIntoView({ block: "start" });
    case "backup-close": App.backupOpen = false; return render();
    case "backup-copy": return copyBackup();
    case "backup-download": return downloadBackup();
    case "restore-paste": return restoreFrom(document.getElementById("restore-text").value);

    case "day": {
      const p = profile(); const total = App.curriculum.skills.length;
      p.currentDay = p.currentDay || {};
      p.currentDay[App.curriculum.id] = Math.min(total, Math.max(1, fgDay(p) + Number(el.dataset.delta)));
      ProfileStore.save(); return render();
    }
    case "lesson": return go("lesson", { id });
    case "lesson-practice": {
      const skill = App.graph.skill(id);
      // Replace the lesson/result screen so Back returns home.
      if (["lesson", "result"].includes(current().screen)) App.stack.pop();
      App.stack.push({ screen: "lesson", id });
      return startSession({ type: "focus", skillIds: [id], reviewCount: 4 }, 8, `Day ${skill.day ?? ""}`, () => {
        App.session = null; App.stack.pop(); App.stack.pop(); App.stack.push({ screen: "result", id }); render(true);
      });
    }
    case "move-on": {
      const p = profile(); p.currentDay = p.currentDay || {};
      p.currentDay[App.curriculum.id] = Number(el.dataset.day); ProfileStore.save(); return goHome();
    }
    case "review": return startSession({ type: "focus", skillIds: [], reviewCount: 10 }, 20, "Memory review");
    case "map": return go("map");
    case "adaptive": return startSession({ type: "adaptive" }, 20, "Practice");
    case "placement": return startSession({ type: "diagnostic" }, 20, "Placement test");
    case "stages": return go("stages");
    case "stage": return go("stage", { id });
    case "skill": return go("skill", { id });
    case "stage-practice": {
      const part = Number(el.dataset.part) || 0;
      const skills = part ? App.graph.partsOf(id)[part - 1].skills : App.graph.skillsIn(id);
      const ids = skills.map(x => x.id);
      const title = App.graph.stage(id).title + (part ? ` · Part ${part}` : "");
      return startSession({ type: "focus", skillIds: ids, reviewCount: 3 }, Math.max(ids.length * 2, 12), title);
    }
    case "skill-practice": return startSession({ type: "focus", skillIds: [id], reviewCount: 2 }, 10, App.graph.skill(id).title);

    case "pause": s?.pause(); return render();
    case "resume": s?.resume(); return render();
    case "end": s?.end(); return render();
    case "choose": s?.submit(el.dataset.value); return render();
    case "judge": s?.judge(el.dataset.ok === "1"); return render();
    case "key": return pressKey(el.dataset.key);
    case "check": return sendTyped();
    case "next": App.typed = ""; s?.next(); return render();
    case "session-done": {
      const done = App.sessionDone; App.sessionDone = null;
      if (done) return done();
      App.session = null; App.stack.pop(); return render(true);
    }
  }
}

function pressKey(k) {
  if (k === "⌫" || k === "Backspace") App.typed = App.typed.slice(0, -1);
  else if (App.typed.length < 12) App.typed += k;
  render();
}

function onKey(e) {
  const s = App.session;
  if (!s || current().screen !== "session" || s.finished || s.isPaused) return;
  if (s.feedback) {
    if (e.key === "Enter") { e.preventDefault(); App.typed = ""; s.next(); render(); }
    return;
  }
  const q = s.question;
  if (!q || !keypadOK(q) || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (/^[0-9\-\/:.]$/.test(e.key)) { e.preventDefault(); pressKey(e.key); }
  else if (e.key === "Backspace") { e.preventDefault(); pressKey("⌫"); }
  else if (e.key === "Enter") { e.preventDefault(); sendTyped(); }
}

function addLearner() {
  const input = document.getElementById("learner-name");
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  ProfileStore.add(name);
  render();
}

// ---------- Backup ----------
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(App.toastTimer);
  App.toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function copyBackup() {
  const text = ProfileStore.exportText();
  const fallback = () => {
    const ta = document.getElementById("restore-text");
    ta.value = text; ta.focus(); ta.select();
    toast("Backup selected below. Tap Copy.");
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast("Backup copied. Paste it somewhere safe."), fallback);
  } catch (e) { fallback(); }
}

function downloadBackup() {
  const blob = new Blob([ProfileStore.exportText()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `tutor-progress-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function restoreFrom(text) {
  if (!text || !text.trim()) { toast("Paste a backup first."); return; }
  try {
    const n = ProfileStore.importText(text.trim());
    App.backupOpen = false;
    render();
    toast(`Restored ${n} learner${n === 1 ? "" : "s"}.`);
  } catch (e) {
    toast("That isn't a progress backup. Copy the whole backup and try again.");
  }
}

function restoreFromFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => restoreFrom(String(r.result));
  r.readAsText(f);
}

boot();

</script>
