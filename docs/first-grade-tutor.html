<style>
/* Layout: one narrow column like a workbook page on faint graph paper; sticky title bar; big touch targets. */
:root {
  --paper: #f5f8fa;
  --grid: rgba(31, 79, 163, 0.06);
  --surface: #ffffff;
  --ink: #15232e;
  --muted: #5b6b78;
  --line: #dbe3ea;
  --accent: #1f4fa3;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefb;
  --pencil: #f2b705;
  --good: #23864f;
  --warn: #c8641a;
  --lv-new: #a3adb6;
  --lv-learning: #e07a1f;
  --lv-passing: #c9a400;
  --lv-mastered: #2e9d5b;
  --lv-sight: #6a4bd1;
  --font: "Lexend", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161c; --grid: rgba(111, 155, 255, 0.05); --surface: #17212a; --ink: #e7edf2; --muted: #93a3b0;
    --line: #26333e; --accent: #6f9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --pencil: #f2c230;
    --good: #4cc27f; --warn: #f0954a; --lv-new: #5d6b77; --lv-learning: #f0954a; --lv-passing: #e2c23a;
    --lv-mastered: #4cc27f; --lv-sight: #9a82ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161c; --grid: rgba(111, 155, 255, 0.05); --surface: #17212a; --ink: #e7edf2; --muted: #93a3b0;
  --line: #26333e; --accent: #6f9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --pencil: #f2c230;
  --good: #4cc27f; --warn: #f0954a; --lv-new: #5d6b77; --lv-learning: #f0954a; --lv-passing: #e2c23a;
  --lv-mastered: #4cc27f; --lv-sight: #9a82ff; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: minmax(80px, 1fr) auto minmax(80px, 1fr); align-items: center; gap: 8px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-title { margin: 0; font-size: 1.05rem; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.bar-right { justify-self: end; }
.nav-btn { background: none; border: 0; color: var(--accent); font-weight: 500; padding: 6px 2px; justify-self: start; }

/* Page */
.wrap { max-width: 640px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.center { text-align: center; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.block { display: block; }
.grow { flex: 1; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.warn { color: var(--warn); }
.pad { padding: 16px; }
h2, h3, h4 { margin: 0; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.display { font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
.eyebrow { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.notice { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; font-size: 0.9rem; }
.error { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.list > * + * { border-top: 1px solid var(--line); }
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 4px 8px; font-size: 0.82rem;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

/* Today card: the one emphasized object on each home screen */
.today { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--pencil); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.today .btn { align-self: stretch; margin-top: 6px; }
.intro { display: flex; flex-direction: column; gap: 6px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-align: center; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 54px; font-size: 1.1rem; padding: 10px 22px; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 0.88rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.wide { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.center-row { justify-content: center; }
.ok-btn { background: var(--good); border-color: var(--good); color: #fff; }
.warn-btn { color: var(--warn); border-color: var(--warn); }
.icon-btn { background: none; border: 0; color: var(--muted); width: 44px; height: 44px; border-radius: 10px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.link-row, .skill-row, .stage-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; min-height: 44px; }
.link-row { justify-content: space-between; border-top: 1px solid var(--line); }
.skill-row, .stage-row { padding: 12px 16px; }
.stage-row { flex-direction: column; align-items: stretch; gap: 6px; }
.stage-top { display: flex; justify-content: space-between; gap: 8px; }

.row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.meter { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; background: var(--lv-new); }
.dot.lv-learning { background: var(--lv-learning); }
.dot.lv-passing { background: var(--lv-passing); }
.dot.lv-mastered { background: var(--lv-mastered); }
.dot.lv-sight { background: var(--lv-sight); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Learners */
.learner { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 0; }
.learner-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; text-align: left; padding: 10px 16px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; flex: none; }
.confirm { display: flex; gap: 4px; }
.add-row { display: flex; gap: 10px; }
.add-row .field { flex: 1; min-width: 0; }
.field { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 44px; width: 100%; }
textarea.field { font-size: 0.8rem; font-family: ui-monospace, Menlo, monospace; resize: vertical; }

/* Lessons */
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.lesson h3 { font-size: 1.25rem; }
.lesson.compact { background: var(--accent-soft); border-color: transparent; align-self: stretch; }
.lesson.compact h3 { font-size: 1rem; }
.lesson ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.example { background: var(--paper); border-left: 3px solid var(--pencil); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.label { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.subj { color: var(--accent); }
.approaches { display: flex; flex-direction: column; gap: 8px; }
.approaches h4:empty { display: none; }
.approaches ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; }
.approach-now { background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.stage-approaches summary { cursor: pointer; min-height: 28px; }
.stage-approaches[open] summary { margin-bottom: 10px; }
.parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.part { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.part .small:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.terms { margin: 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface);
  display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; text-align: left; align-self: stretch; }
.terms div { display: flex; gap: 8px; }
.terms dt { font-weight: 600; flex: none; min-width: 3.2em; }
.terms dd { margin: 0; color: var(--muted); min-width: 0; }

/* Practice */
.practice { display: flex; flex-direction: column; gap: 16px; }
.practice-head { display: flex; align-items: center; gap: 12px; }
.practice-head > div { flex: 1; min-width: 0; }
.count { font-weight: 600; }
.timer { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.timer span { display: block; height: 100%; background: var(--good); transition: width 0.25s linear; }
.timer span.late { background: var(--pencil); }
.prompt { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 600; line-height: 1.25; text-align: center; white-space: pre-line; overflow-wrap: anywhere; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.choice { min-height: 64px; font-size: 1.35rem; font-weight: 500; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); padding: 8px; }
.choice:active, .key:active { background: var(--accent-soft); border-color: var(--accent); }
.answer-box { min-height: 64px; font-size: 2rem; font-weight: 600; text-align: center; border-bottom: 3px solid var(--accent); padding: 6px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; width: 100%; margin: 0 auto; }
.key { min-height: 48px; font-size: 1.5rem; font-weight: 500; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.key.alt { background: var(--accent-soft); }
.big-field { font-size: 1.5rem; text-align: center; }
.feedback { align-items: center; text-align: center; }
.feedback.good .display { color: var(--good); }
.feedback.miss .display { color: var(--warn); }
.answer-reveal { font-size: 1.4rem; }
.big-num { font-size: 1.6rem; font-weight: 600; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; max-width: calc(100% - 32px);
  transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .timer span, #toast { transition: none; } }

</style>
</head>

<script>window.CURRICULUM = {"id":"first-grade","title":"First Grade Tutor","version":1,"glossary":[{"term":"CVC","meaning":"consonant-vowel-consonant: a three-letter word with a vowel in the middle, like cat, dog or sun"}],"stages":[{"id":"q1","title":"Days 1–28","order":1,"level":"Grade 1","description":"First quarter"},{"id":"q2","title":"Days 29–55","order":2,"level":"Grade 1","description":"Second quarter"},{"id":"q3","title":"Days 56–83","order":3,"level":"Grade 1","description":"Third quarter"},{"id":"q4","title":"Days 84–110","order":4,"level":"Grade 1","description":"Fourth quarter"}],"skills":[{"id":"m-count-20","stage":"q1","title":"Count objects to 20","summary":"Count a group by touching each object once.","prerequisites":[],"lesson":{"explanation":"Each object gets exactly one number. The last number you say tells how many.","example":"● ● ● ● ● ● ● = 7","tutorSteps":["Lay out 5–20 small objects in a row.","Touch and count each one aloud.","Ask: how many in all? (the last number said)"]},"practice":{"generator":"count","params":{"max":20}},"reinforcement":"Used every day when counting dots, coins and tallies.","day":1,"subject":"Math","sightPaceSeconds":6},{"id":"r-letter-sounds","stage":"q1","title":"Letter sounds review","summary":"Say the sound of every letter quickly.","prerequisites":[],"lesson":{"explanation":"Each letter stands for a sound. Knowing them by sight makes reading fast.","example":"b says /b/ as in bat","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: m, s, t, b, f","mode":"tutor"},{"prompt":"Read aloud: p, n, d, g, l","mode":"tutor"},{"prompt":"Read aloud: c, h, j, k, r","mode":"tutor"},{"prompt":"Read aloud: v, w, x, y, z","mode":"tutor"},{"prompt":"What sound does 'm' start?","choices":["moon","sun","top"],"answer":"moon"}]},"reinforcement":"Every later reading skill uses these sounds.","day":2,"subject":"Reading","sightPaceSeconds":10},{"id":"w-letters","stage":"q1","title":"Letter formation","summary":"Write every lowercase and capital letter correctly.","prerequisites":[],"lesson":{"explanation":"Start letters at the top. Tall letters touch the top line; tails go below.","example":"b d p q are different!","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Write the lowercase alphabet. Tutor checks b/d/p/q.","mode":"tutor"},{"prompt":"Write the capital alphabet.","mode":"tutor"}]},"reinforcement":"Neat letters are needed for all writing.","day":3,"subject":"Writing","sightPaceSeconds":60},{"id":"m-count-120","stage":"q1","title":"Count to 120","summary":"Say the number before and after any number up to 120.","prerequisites":["m-count-20"],"lesson":{"explanation":"Numbers follow a pattern: after 9 comes a new ten. 29 → 30, 99 → 100, 109 → 110.","example":"Just after 59 is 60. Just before 100 is 99.","tutorSteps":["Count aloud from a starting number other than 1 (for example, 47).","Use a 120 chart and point.","Quiz: just before / just after."]},"practice":{"generator":"numberAfter","params":{"max":120}},"reinforcement":"Comes back in place value and adding 10.","day":4,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-a","stage":"q1","title":"Short a","summary":"Read words with the short a sound.","prerequisites":["r-letter-sounds"],"lesson":{"explanation":"Short a sounds like /a/ in apple.","example":"cat, map, ham","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: cat, map, sad, ham","mode":"tutor"},{"prompt":"Read aloud: bag, fan, tap, jam","mode":"tutor"},{"prompt":"Which word has short a?","choices":["hat","hot","hit"],"answer":"hat"}]},"reinforcement":"Short vowels return in every word family.","day":5,"subject":"Reading","sightPaceSeconds":10},{"id":"s-senses","stage":"q1","title":"Five senses","summary":"Learn sight, hearing, smell, taste and touch.","prerequisites":[],"lesson":{"explanation":"We learn about the world with 5 senses: eyes see, ears hear, nose smells, tongue tastes, skin feels.","example":"We hear thunder with our ears.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Which sense uses your nose?","choices":["Smell","Taste","Touch"],"answer":"Smell"},{"prompt":"How many senses do we have?","answer":"5"},{"prompt":"You feel a soft blanket with your sense of…","choices":["Touch","Sight","Hearing"],"answer":"Touch"}]},"reinforcement":"Used for observing in every experiment.","day":6,"subject":"Science","sightPaceSeconds":15},{"id":"ss-rules","stage":"q1","title":"Rules and why we have them","summary":"Rules keep us safe and fair.","prerequisites":[],"lesson":{"explanation":"Rules tell us how to act. They keep people safe and treat everyone fairly.","example":"We walk in the hallway so no one gets hurt.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Why do we have rules?","choices":["To stay safe and be fair","To make people sad"],"answer":"To stay safe and be fair"},{"prompt":"Name two rules at home.","mode":"tutor"}]},"reinforcement":"Laws and government later.","day":7,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-skip-10","stage":"q1","title":"Count by 10s","summary":"Skip count by tens to 120.","prerequisites":["m-count-120"],"lesson":{"explanation":"Counting by 10s jumps one whole row on the 120 chart: 10, 20, 30…","example":"40, 50, 60, 70","tutorSteps":["Count bundles of 10 straws.","Chant 10 to 120.","Start at a ten other than 10."]},"practice":{"generator":"countBy","params":{"step":10,"max":120}},"reinforcement":"Used for 10 more / 10 less and adding tens.","day":8,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-i","stage":"q1","title":"Short i","summary":"Read words with the short i sound.","prerequisites":["r-short-a"],"lesson":{"explanation":"Short i sounds like /i/ in itch.","example":"pig, sit, win","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: pig, sit, win, lip","mode":"tutor"},{"prompt":"Read aloud: big, fix, hid, mix","mode":"tutor"},{"prompt":"Which word has short i?","choices":["pin","pan","pen"],"answer":"pin"}]},"reinforcement":"Compare with short e later.","day":9,"subject":"Reading","sightPaceSeconds":10},{"id":"m-skip-5","stage":"q1","title":"Count by 5s","summary":"Skip count by fives to 100.","prerequisites":["m-skip-10"],"lesson":{"explanation":"Counting by 5s: every number ends in 5 or 0.","example":"15, 20, 25, 30","tutorSteps":["Count fingers on hands by 5s.","Count nickels by 5s.","Chant to 100."]},"practice":{"generator":"countBy","params":{"step":5,"max":100}},"reinforcement":"Used for nickels, clocks and multiplying by 5.","day":10,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-o","stage":"q1","title":"Short o","summary":"Read words with the short o sound.","prerequisites":["r-short-i"],"lesson":{"explanation":"Short o sounds like /o/ in octopus.","example":"hot, dog, mop","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: hot, dog, mop, fox","mode":"tutor"},{"prompt":"Read aloud: log, pot, rod, top","mode":"tutor"},{"prompt":"Which word has short o?","choices":["cot","cut","cat"],"answer":"cot"}]},"reinforcement":"Returns in blends and endings.","day":11,"subject":"Reading","sightPaceSeconds":10},{"id":"w-name-sentence","stage":"q1","title":"Capital and period","summary":"A sentence starts with a capital and ends with a period.","prerequisites":["w-letters"],"lesson":{"explanation":"Every sentence begins with a capital letter and ends with a period (.), question mark (?) or exclamation mark (!).","example":"The dog runs.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Which is a correct sentence?","choices":["The cat sat.","the cat sat","The cat sat"],"answer":"The cat sat."},{"prompt":"Copy and fix: my dog is big","mode":"tutor"}]},"reinforcement":"Used in every sentence written after this.","day":12,"subject":"Writing","sightPaceSeconds":60},{"id":"m-skip-2","stage":"q1","title":"Count by 2s","summary":"Skip count by twos to 50.","prerequisites":["m-count-120"],"lesson":{"explanation":"Counting by 2s skips every other number: 2, 4, 6, 8…","example":"12, 14, 16, 18","tutorSteps":["Count pairs of socks or shoes.","Chant by 2s.","Connect to even numbers."]},"practice":{"generator":"countBy","params":{"step":2,"max":50}},"reinforcement":"Used for even/odd and doubles.","day":13,"subject":"Math","sightPaceSeconds":4},{"id":"r-short-u","stage":"q1","title":"Short u","summary":"Read words with the short u sound.","prerequisites":["r-short-o"],"lesson":{"explanation":"Short u sounds like /u/ in up.","example":"sun, cup, bug","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: sun, cup, bug, run","mode":"tutor"},{"prompt":"Read aloud: mud, hut, tub, gum","mode":"tutor"},{"prompt":"Which word has short u?","choices":["bus","bis","bas"],"answer":"bus"}]},"reinforcement":"Returns in blends and endings.","day":14,"subject":"Reading","sightPaceSeconds":10},{"id":"s-living","stage":"q1","title":"Living and nonliving","summary":"Tell living things from nonliving things.","prerequisites":["s-senses"],"lesson":{"explanation":"Living things grow, need food and water, and make more of their kind. Rocks and toys do not.","example":"A tree is living; a rock is not.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Is a dog living?","choices":["Yes","No"],"answer":"Yes"},{"prompt":"Is a rock living?","choices":["Yes","No"],"answer":"No"},{"prompt":"Which is living?","choices":["Flower","Car","Chair"],"answer":"Flower"}]},"reinforcement":"Basis of life science.","day":15,"subject":"Science","sightPaceSeconds":15},{"id":"ss-family","stage":"q1","title":"Families","summary":"Families are different and work together.","prerequisites":["ss-rules"],"lesson":{"explanation":"Families come in many sizes. Family members help each other and share jobs.","example":"Our family shares chores like setting the table.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Name the people in your family and one job each does.","mode":"tutor"},{"prompt":"Are all families the same?","choices":["No","Yes"],"answer":"No"}]},"reinforcement":"Community and culture next.","day":16,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-compare-20","stage":"q1","title":"Compare numbers to 20","summary":"Use >, < and = to compare.","prerequisites":["m-count-20"],"lesson":{"explanation":"The open side of > or < faces the bigger number (the alligator eats the bigger one).","example":"14 > 9,  6 < 11,  8 = 8","tutorSteps":["Build both numbers with cubes.","Line them up to see which is longer.","Write the sign."]},"practice":{"generator":"compare","params":{"max":20}},"reinforcement":"Used again with two-digit numbers and fractions later.","day":17,"subject":"Math","sightPaceSeconds":5},{"id":"r-short-e","stage":"q1","title":"Short e","summary":"Read words with the short e sound.","prerequisites":["r-short-u"],"lesson":{"explanation":"Short e sounds like /e/ in egg. It is easy to mix up with short i.","example":"bed, pen, wet","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: bed, pen, wet, leg","mode":"tutor"},{"prompt":"Read aloud: hen, jet, ten, web","mode":"tutor"},{"prompt":"Which word has short e?","choices":["net","nut","not"],"answer":"net"},{"prompt":"Which word has short e?","choices":["pit","pet"],"answer":"pet"}]},"reinforcement":"Returns in every two-syllable word.","day":18,"subject":"Reading","sightPaceSeconds":10},{"id":"m-even-odd","stage":"q1","title":"Even and odd","summary":"Tell if a number is even or odd.","prerequisites":["m-skip-2"],"lesson":{"explanation":"Even numbers can be split into pairs with none left over. They end in 0, 2, 4, 6, 8.","example":"8 is even (4 pairs). 7 is odd (3 pairs + 1).","tutorSteps":["Pair up cubes.","Look at the ones digit.","Sort numbers into even/odd."]},"practice":{"generator":"evenOdd","params":{"max":50}},"reinforcement":"Comes back in doubles and division.","day":19,"subject":"Math","sightPaceSeconds":4},{"id":"w-spaces","stage":"q1","title":"Finger spaces","summary":"Leave a space between words.","prerequisites":["w-letters"],"lesson":{"explanation":"Put a finger-width space between words so readers can tell where each word ends.","example":"I like cats.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Write: I see a red bird. Tutor checks spaces.","mode":"tutor"},{"prompt":"Which has spaces?","choices":["We can run.","Wecanrun."],"answer":"We can run."}]},"reinforcement":"Readable writing.","day":20,"subject":"Writing","sightPaceSeconds":60},{"id":"r-cvc","stage":"q1","title":"Blend CVC (consonant-vowel-consonant) words fast","summary":"Blend consonant-vowel-consonant words smoothly.","prerequisites":["r-short-e"],"lesson":{"explanation":"Say each sound, then slide them together without stopping.","example":"/s/ /u/ /n/ → sun","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: sat, pin, hop, rug, wet","mode":"tutor"},{"prompt":"Read aloud: mad, fit, jog, hum, beg","mode":"tutor"},{"prompt":"Blend /d/ /o/ /g/:","choices":["dog","dig","dug"],"answer":"dog"}]},"reinforcement":"The base of all decoding.","day":21,"subject":"Reading","sightPaceSeconds":10},{"id":"m-make-ten","stage":"q1","title":"Make ten","summary":"Know the pairs that make 10 by sight.","prerequisites":["m-count-20"],"lesson":{"explanation":"Pairs that make ten: 0+10, 1+9, 2+8, 3+7, 4+6, 5+5. Learn them like sight words.","example":"7 + 3 = 10","tutorSteps":["Use a ten frame with counters.","Flash a number, child says its partner.","Race for sight pace (under 3 seconds)."]},"practice":{"generator":"makeTen"},"reinforcement":"The key to adding and subtracting within 20.","day":22,"subject":"Math","sightPaceSeconds":3},{"id":"r-digraphs","stage":"q1","title":"sh, ch, th, wh","summary":"Read the four main consonant digraphs.","prerequisites":["r-cvc"],"lesson":{"explanation":"Two letters can make one sound: sh (ship), ch (chin), th (thin, this), wh (when).","example":"shop, chat, thin, when","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: ship, shop, fish","mode":"tutor"},{"prompt":"Read aloud: chin, chop, much","mode":"tutor"},{"prompt":"Read aloud: thin, this, bath","mode":"tutor"},{"prompt":"Read aloud: when, whip, which","mode":"tutor"},{"prompt":"Which word starts with sh?","choices":["shell","chell","tell"],"answer":"shell"}]},"reinforcement":"Returns in spelling and long-vowel words.","day":23,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-10","stage":"q1","title":"Addition facts to 10","summary":"Add two numbers with a sum up to 10 at sight pace.","prerequisites":["m-make-ten"],"lesson":{"explanation":"Adding means putting groups together. Start from the bigger number and count on.","example":"6 + 3: start at 6 → 7, 8, 9","tutorSteps":["Model with fingers or cubes.","Teach counting on from the bigger number.","Daily flash practice until instant."]},"practice":{"generator":"add","params":{"max":5}},"reinforcement":"Every later addition fact is built from these.","day":24,"subject":"Math","sightPaceSeconds":3},{"id":"s-plant-parts","stage":"q1","title":"Parts of a plant","summary":"Name roots, stem, leaves and flowers.","prerequisites":["s-living"],"lesson":{"explanation":"Roots drink water, the stem holds the plant up, leaves make food from sunlight, flowers make seeds.","example":"Leaves catch sunlight.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Which part takes in water from the soil?","choices":["Roots","Leaves","Flower"],"answer":"Roots"},{"prompt":"Which part makes food from sunlight?","choices":["Leaves","Roots","Stem"],"answer":"Leaves"},{"prompt":"Which part holds the plant up?","choices":["Stem","Flower","Seed"],"answer":"Stem"}]},"reinforcement":"Plant needs and life cycles next.","day":25,"subject":"Science","sightPaceSeconds":15},{"id":"ss-maps","stage":"q1","title":"Maps and globes","summary":"Use a map and a globe.","prerequisites":["ss-rules"],"lesson":{"explanation":"A map is a flat drawing of a place. A globe is a round model of Earth. Blue usually shows water.","example":"On a globe, blue is ocean and green or brown is land.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"A round model of Earth is a…","choices":["Globe","Map","Graph"],"answer":"Globe"},{"prompt":"On most maps, water is…","choices":["Blue","Red"],"answer":"Blue"},{"prompt":"Draw a map of your bedroom.","mode":"tutor"}]},"reinforcement":"Geography in every grade.","day":26,"subject":"Social Studies","sightPaceSeconds":15},{"id":"r-ck","stage":"q1","title":"-ck ending","summary":"Read words ending in ck.","prerequisites":["r-digraphs"],"lesson":{"explanation":"After a short vowel, the /k/ sound at the end is spelled ck.","example":"duck, back, sick","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: duck, back, sick, rock","mode":"tutor"},{"prompt":"Read aloud: pack, neck, lick, tuck","mode":"tutor"},{"prompt":"Which is spelled right?","choices":["duck","duk","duc"],"answer":"duck"}]},"reinforcement":"Spelling rule used in writing.","day":27,"subject":"Reading","sightPaceSeconds":10},{"id":"m-sub-10","stage":"q1","title":"Subtraction facts to 10","summary":"Subtract within 10 at sight pace.","prerequisites":["m-add-10"],"lesson":{"explanation":"Subtracting takes away. Think of the addition fact: 9 − 4 = ? because 4 + 5 = 9.","example":"8 − 3 = 5","tutorSteps":["Take away cubes.","Connect to the matching addition fact.","Flash practice."]},"practice":{"generator":"sub","params":{"max":10}},"reinforcement":"Pairs with addition in fact families.","day":28,"subject":"Math","sightPaceSeconds":3},{"id":"w-questions","stage":"q2","title":"Questions and exclamations","summary":"Use ? and ! correctly.","prerequisites":["w-name-sentence"],"lesson":{"explanation":"Use ? for asking. Use ! for strong feeling.","example":"Where is my hat? I found it!","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Which mark ends: Can you help me","choices":["?",".","!"],"answer":"?"},{"prompt":"Which mark ends: Watch out","choices":["!","?"],"answer":"!"},{"prompt":"Write one question about animals.","mode":"tutor"}]},"reinforcement":"Dialogue and expressive reading.","day":29,"subject":"Writing","sightPaceSeconds":60},{"id":"m-doubles","stage":"q2","title":"Doubles","summary":"Know doubles to 10 + 10 by sight.","prerequisites":["m-add-10","m-skip-2"],"lesson":{"explanation":"A double adds a number to itself: 6 + 6 = 12.","example":"8 + 8 = 16","tutorSteps":["Use mirror pictures or egg cartons.","Chant the doubles.","Flash practice."]},"practice":{"generator":"doubles","params":{"max":10}},"reinforcement":"Used for near-doubles and multiplying by 2.","day":30,"subject":"Math","sightPaceSeconds":3},{"id":"r-blends-start","stage":"q2","title":"Beginning blends","summary":"Read words starting with two consonants.","prerequisites":["r-cvc"],"lesson":{"explanation":"In a blend you hear both sounds: bl, cl, fl, st, sp, tr, gr, fr.","example":"frog, stop, clap","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: frog, stop, clap, grin","mode":"tutor"},{"prompt":"Read aloud: flag, spin, trip, plum","mode":"tutor"},{"prompt":"Which word starts with a blend?","choices":["stop","top","pop"],"answer":"stop"}]},"reinforcement":"Returns in long-vowel and multi-syllable words.","day":31,"subject":"Reading","sightPaceSeconds":10},{"id":"m-near-doubles","stage":"q2","title":"Near doubles","summary":"Use doubles to add numbers that are one apart.","prerequisites":["m-doubles"],"lesson":{"explanation":"If the numbers are next to each other, double the smaller one and add 1.","example":"7 + 8 = 7 + 7 + 1 = 15","tutorSteps":["Review doubles.","Show 6 + 7 as 6 + 6 + 1.","Practice spotting near doubles."]},"practice":{"items":[{"prompt":"6 + 7 = ?","answer":"13"},{"prompt":"5 + 6 = ?","answer":"11"},{"prompt":"8 + 9 = ?","answer":"17"},{"prompt":"4 + 5 = ?","answer":"9"},{"prompt":"7 + 8 = ?","answer":"15"},{"prompt":"9 + 10 = ?","answer":"19"},{"prompt":"Which double helps with 7 + 8?","choices":["7 + 7","8 + 9","5 + 5"],"answer":"7 + 7"}]},"reinforcement":"A strategy reused for mental math with bigger numbers.","day":32,"subject":"Math","sightPaceSeconds":5},{"id":"r-blends-end","stage":"q2","title":"Ending blends","summary":"Read words ending in two consonants.","prerequisites":["r-blends-start"],"lesson":{"explanation":"Ending blends: st, mp, nd, nt, lt, sk.","example":"jump, hand, fast","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: jump, hand, fast, tent","mode":"tutor"},{"prompt":"Read aloud: milk, desk, belt, pond","mode":"tutor"},{"prompt":"Which word ends in a blend?","choices":["lamp","lap","lab"],"answer":"lamp"}]},"reinforcement":"Returns in -ed and -ing words.","day":33,"subject":"Reading","sightPaceSeconds":10},{"id":"s-plant-needs","stage":"q2","title":"What plants need","summary":"Plants need water, light, air and space.","prerequisites":["s-plant-parts"],"lesson":{"explanation":"Plants need sunlight, water, air and room to grow. Without them they wilt.","example":"A plant in a dark closet turns yellow.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Do plants need sunlight?","choices":["Yes","No"],"answer":"Yes"},{"prompt":"Which does a plant NOT need?","choices":["Candy","Water","Light"],"answer":"Candy"},{"prompt":"Plant a bean in a cup and record growth each day.","mode":"tutor"}]},"reinforcement":"Habitats and food chains later.","day":34,"subject":"Science","sightPaceSeconds":15},{"id":"m-missing-addend","stage":"q2","title":"Missing numbers","summary":"Find the unknown in 4 + ? = 10.","prerequisites":["m-sub-10"],"lesson":{"explanation":"Ask: what do I add to the first number to reach the total? Count up, or subtract.","example":"5 + ? = 9 → 4","tutorSteps":["Hide some cubes under a cup.","Count up from the part to the whole.","Write the matching subtraction."]},"practice":{"generator":"missingAddend","params":{"max":10}},"reinforcement":"The start of algebra (solving for x).","day":35,"subject":"Math","sightPaceSeconds":5},{"id":"w-nouns","stage":"q2","title":"Nouns","summary":"Find and use naming words.","prerequisites":["w-name-sentence"],"lesson":{"explanation":"A noun names a person, place or thing. Names of people and places start with a capital.","example":"girl, park, ball, Charlotte","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Which word is a noun?","choices":["apple","run","happy"],"answer":"apple"},{"prompt":"Which word is a noun?","choices":["school","jump","blue"],"answer":"school"},{"prompt":"Write three nouns in your room.","mode":"tutor"}]},"reinforcement":"Grammar in every grade.","day":36,"subject":"Writing","sightPaceSeconds":60},{"id":"r-ng-nk","stage":"q2","title":"-ng and -nk","summary":"Read words with ng and nk.","prerequisites":["r-blends-end"],"lesson":{"explanation":"ng says /ng/ (ring). nk says /ngk/ (pink).","example":"sing, bank, long","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: sing, ring, long, hung","mode":"tutor"},{"prompt":"Read aloud: pink, bank, sunk, think","mode":"tutor"},{"prompt":"Which word ends with -nk?","choices":["sink","sing","sit"],"answer":"sink"}]},"reinforcement":"Used with -ing endings.","day":37,"subject":"Reading","sightPaceSeconds":10},{"id":"m-fact-family","stage":"q2","title":"Fact families","summary":"See how +, − link three numbers.","prerequisites":["m-missing-addend"],"lesson":{"explanation":"3, 5 and 8 make a family: 3 + 5 = 8, 5 + 3 = 8, 8 − 5 = 3, 8 − 3 = 5.","example":"If 6 + 4 = 10 then 10 − 4 = 6","tutorSteps":["Draw a number bond (whole on top, parts below).","Write all four facts.","Quiz the related fact."]},"practice":{"generator":"factFamily","params":{"max":10}},"reinforcement":"Becomes multiplication/division families later.","day":38,"subject":"Math","sightPaceSeconds":5},{"id":"r-silent-e-a","stage":"q2","title":"Silent e: a_e","summary":"Read long a words with a silent e.","prerequisites":["r-cvc","r-digraphs"],"lesson":{"explanation":"A silent e at the end makes the vowel say its name: cap → cape.","example":"cake, name, gate","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: cake, name, gate, same","mode":"tutor"},{"prompt":"Read aloud: cap / cape, tap / tape, mad / made","mode":"tutor"},{"prompt":"Which word has long a?","choices":["tape","tap"],"answer":"tape"}]},"reinforcement":"Same rule for i, o, u next.","day":39,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-20","stage":"q2","title":"Addition facts to 20","summary":"Add within 20 at sight pace using make-ten.","prerequisites":["m-add-10","m-make-ten","m-doubles"],"lesson":{"explanation":"Make a ten first: 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.","example":"9 + 6 = 15","tutorSteps":["Use two ten frames.","Move counters to fill one ten.","Flash practice until instant."]},"practice":{"generator":"add","params":{"max":10}},"reinforcement":"Used in every two-digit addition.","day":40,"subject":"Math","sightPaceSeconds":4},{"id":"r-silent-e-iou","stage":"q2","title":"Silent e: i_e, o_e, u_e","summary":"Read long i, o and u with silent e.","prerequisites":["r-silent-e-a"],"lesson":{"explanation":"The silent e rule works with every vowel: kit → kite, hop → hope, cub → cube.","example":"bike, home, cute","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: bike, time, ride, five","mode":"tutor"},{"prompt":"Read aloud: home, rope, note, bone","mode":"tutor"},{"prompt":"Read aloud: cute, cube, mule, tune","mode":"tutor"},{"prompt":"Which word has long o?","choices":["hope","hop"],"answer":"hope"},{"prompt":"Which word has long i?","choices":["pin","pine"],"answer":"pine"}]},"reinforcement":"Spelling long vowels in writing.","day":41,"subject":"Reading","sightPaceSeconds":10},{"id":"w-verbs","stage":"q2","title":"Verbs","summary":"Find and use action words.","prerequisites":["w-nouns"],"lesson":{"explanation":"A verb tells what someone or something does: run, eat, sing.","example":"The bird sings.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Which word is a verb?","choices":["jump","dog","red"],"answer":"jump"},{"prompt":"Which word is a verb?","choices":["swim","pool","wet"],"answer":"swim"},{"prompt":"Write a sentence with a verb. Tutor underlines it.","mode":"tutor"}]},"reinforcement":"Past tense with -ed connects here.","day":42,"subject":"Writing","sightPaceSeconds":60},{"id":"m-sub-20","stage":"q2","title":"Subtraction facts to 20","summary":"Subtract within 20 at sight pace.","prerequisites":["m-sub-10","m-add-20"],"lesson":{"explanation":"Go back to ten: 14 − 6 = 14 − 4 − 2 = 10 − 2 = 8. Or think addition: 6 + ? = 14.","example":"15 − 7 = 8","tutorSteps":["Model on two ten frames.","Use the related addition fact.","Flash practice."]},"practice":{"generator":"sub","params":{"max":20}},"reinforcement":"Used in every two-digit subtraction.","day":43,"subject":"Math","sightPaceSeconds":4},{"id":"s-animals","stage":"q2","title":"Animals and their young","summary":"Animals and babies look alike and parents help them.","prerequisites":["s-living"],"lesson":{"explanation":"Young animals look like their parents. Many parents feed and protect their babies.","example":"A baby cat is a kitten.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"A baby dog is a…","choices":["Puppy","Calf","Chick"],"answer":"Puppy"},{"prompt":"A baby cow is a…","choices":["Calf","Kitten","Cub"],"answer":"Calf"},{"prompt":"A baby bird hatches from an…","choices":["Egg","Seed","Leaf"],"answer":"Egg"}]},"reinforcement":"Life cycles and traits later.","day":44,"subject":"Science","sightPaceSeconds":15},{"id":"ss-helpers","stage":"q2","title":"Community helpers","summary":"Name jobs that help a community.","prerequisites":["ss-family"],"lesson":{"explanation":"Community helpers include firefighters, doctors, dentists, teachers, mail carriers and police officers.","example":"A dentist helps keep teeth healthy.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Who helps keep teeth healthy?","choices":["Dentist","Pilot","Chef"],"answer":"Dentist"},{"prompt":"Who puts out fires?","choices":["Firefighter","Teacher"],"answer":"Firefighter"},{"prompt":"Who delivers letters?","choices":["Mail carrier","Baker"],"answer":"Mail carrier"}]},"reinforcement":"Economics and jobs later.","day":45,"subject":"Social Studies","sightPaceSeconds":15},{"id":"r-ee-ea","stage":"q2","title":"ee and ea","summary":"Read long e vowel teams.","prerequisites":["r-silent-e-iou"],"lesson":{"explanation":"When two vowels go walking, the first one does the talking: ee and ea say long e.","example":"tree, seat, beach","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: tree, see, feet, green","mode":"tutor"},{"prompt":"Read aloud: seat, beach, read, team","mode":"tutor"},{"prompt":"Which word has long e?","choices":["sheep","ship"],"answer":"sheep"}]},"reinforcement":"Vowel teams return in second grade.","day":46,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-three","stage":"q2","title":"Add three numbers","summary":"Add three numbers by finding an easy pair first.","prerequisites":["m-add-20"],"lesson":{"explanation":"You can add in any order. Look for a ten or a double first.","example":"4 + 7 + 6 = (4 + 6) + 7 = 17","tutorSteps":["Show the same total in different orders.","Circle a pair that makes 10.","Practice."]},"practice":{"generator":"add3","params":{"max":6}},"reinforcement":"Grouping (the associative property) is used all through algebra.","day":47,"subject":"Math","sightPaceSeconds":8},{"id":"r-ai-ay","stage":"q2","title":"ai and ay","summary":"Read long a vowel teams.","prerequisites":["r-ee-ea"],"lesson":{"explanation":"ai is used in the middle of a word (rain); ay at the end (play).","example":"rain, day, paint","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: rain, tail, paint, wait","mode":"tutor"},{"prompt":"Read aloud: day, play, stay, gray","mode":"tutor"},{"prompt":"Which spelling ends a word?","choices":["ay","ai"],"answer":"ay"}]},"reinforcement":"Spelling choices in writing.","day":48,"subject":"Reading","sightPaceSeconds":10},{"id":"m-word-problems","stage":"q2","title":"Word problems: add and subtract","summary":"Decide whether to add or subtract in a story.","prerequisites":["m-add-20","m-sub-20"],"lesson":{"explanation":"Read the story, picture it, then decide: are things joining (add) or leaving (subtract)?","example":"Sam has 7 shells and finds 5 more → 7 + 5 = 12","tutorSteps":["Read the problem aloud together.","Act it out or draw it.","Write the number sentence, then solve."]},"practice":{"generator":"wordAdd","params":{"max":10}},"reinforcement":"Every math level uses word problems.","day":49,"subject":"Math","sightPaceSeconds":15},{"id":"w-adjectives","stage":"q2","title":"Adjectives","summary":"Describe nouns with adjectives.","prerequisites":["w-verbs"],"lesson":{"explanation":"An adjective describes a noun: color, size, shape, how it feels.","example":"a big, soft, brown bear","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Which word is an adjective?","choices":["fuzzy","hop","cat"],"answer":"fuzzy"},{"prompt":"Which word describes?","choices":["tiny","run","boy"],"answer":"tiny"},{"prompt":"Describe an apple with three adjectives.","mode":"tutor"}]},"reinforcement":"Detailed writing in later grades.","day":50,"subject":"Writing","sightPaceSeconds":60},{"id":"r-oa-ow","stage":"q2","title":"oa and ow","summary":"Read long o vowel teams.","prerequisites":["r-ai-ay"],"lesson":{"explanation":"oa (boat) and ow (snow) can both say long o.","example":"boat, coat, snow, grow","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: boat, coat, road, soap","mode":"tutor"},{"prompt":"Read aloud: snow, grow, show, slow","mode":"tutor"},{"prompt":"Which word has long o?","choices":["goat","got"],"answer":"goat"}]},"reinforcement":"ow also says /ow/ in cow — compare in grade 2.","day":51,"subject":"Reading","sightPaceSeconds":10},{"id":"m-compare-problems","stage":"q2","title":"Word problems: how many more?","summary":"Solve comparison stories.","prerequisites":["m-word-problems"],"lesson":{"explanation":"'How many more' means find the difference between two amounts: subtract the smaller from the bigger.","example":"Ana has 9 cards, Ben has 5. Ana has 4 more.","tutorSteps":["Line up two rows of cubes.","Count the extra ones.","Write it as subtraction."]},"practice":{"items":[{"prompt":"Ana has 9 cards. Ben has 5. How many more cards does Ana have?","answer":"4"},{"prompt":"A red tower has 12 blocks. A blue tower has 8. How many fewer blocks does the blue tower have?","answer":"4"},{"prompt":"Mia read 7 books. Leo read 10. How many more books did Leo read?","answer":"3"},{"prompt":"There are 15 birds and 9 nests. How many birds have no nest?","answer":"6"},{"prompt":"Jo has 6 stickers. She needs 11. How many more does she need?","answer":"5"}]},"reinforcement":"Difference thinking returns in measurement and data.","day":52,"subject":"Math","sightPaceSeconds":20},{"id":"m-place-value","stage":"q2","title":"Tens and ones","summary":"Know a two-digit number is tens and ones.","prerequisites":["m-count-120","m-skip-10"],"lesson":{"explanation":"In 47, the 4 means 4 tens (40) and the 7 means 7 ones.","example":"63 = 6 tens + 3 ones","tutorSteps":["Bundle straws into tens.","Build numbers with tens rods and ones cubes.","Ask what each digit is worth."]},"practice":{"generator":"placeValue","params":{"digits":2}},"reinforcement":"The foundation of all multi-digit math.","day":53,"subject":"Math","sightPaceSeconds":5},{"id":"r-r-controlled","stage":"q2","title":"ar, or, er, ir, ur","summary":"Read bossy-r vowels.","prerequisites":["r-oa-ow"],"lesson":{"explanation":"When r follows a vowel it changes the sound: ar (car), or (fork), er/ir/ur (her, bird, fur).","example":"car, fork, bird","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: car, star, park, farm","mode":"tutor"},{"prompt":"Read aloud: fork, corn, storm, short","mode":"tutor"},{"prompt":"Read aloud: her, bird, fur, turn","mode":"tutor"},{"prompt":"Which word has 'ar'?","choices":["barn","born","burn"],"answer":"barn"}]},"reinforcement":"Returns in multi-syllable words.","day":54,"subject":"Reading","sightPaceSeconds":10},{"id":"s-animal-parts","stage":"q2","title":"How animals use body parts","summary":"Animal parts help them survive.","prerequisites":["s-animals"],"lesson":{"explanation":"Animals use parts to eat, move and stay safe: beaks, claws, shells, fins, wings.","example":"A turtle hides in its shell.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Which helps a fish swim?","choices":["Fins","Wings","Paws"],"answer":"Fins"},{"prompt":"A bird uses its ___ to eat.","choices":["Beak","Tail","Feathers"],"answer":"Beak"},{"prompt":"What protects a turtle?","choices":["Shell","Fur","Fins"],"answer":"Shell"}]},"reinforcement":"Adaptations in later grades.","day":55,"subject":"Science","sightPaceSeconds":15},{"id":"ss-needs-wants","stage":"q3","title":"Needs and wants","summary":"Tell needs from wants.","prerequisites":["ss-helpers"],"lesson":{"explanation":"Needs are things we must have to live: food, water, shelter, clothes. Wants are nice to have.","example":"Water is a need; a toy is a want.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Is food a need or a want?","choices":["Need","Want"],"answer":"Need"},{"prompt":"Is a video game a need or a want?","choices":["Want","Need"],"answer":"Want"},{"prompt":"Which is a need?","choices":["Shelter","Candy","Toys"],"answer":"Shelter"}]},"reinforcement":"Saving and spending (money math).","day":56,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-ten-more","stage":"q3","title":"10 more and 10 less","summary":"Add or take 10 without counting.","prerequisites":["m-place-value"],"lesson":{"explanation":"Adding 10 changes only the tens digit: 34 → 44. Taking 10 away: 34 → 24.","example":"10 more than 58 is 68","tutorSteps":["Use a 120 chart: move down or up one row.","Use tens rods.","Practice mentally."]},"practice":{"generator":"tenMore","params":{"max":100}},"reinforcement":"Mental math with tens in second grade.","day":57,"subject":"Math","sightPaceSeconds":4},{"id":"r-endings-s","stage":"q3","title":"Endings -s and -es","summary":"Read plural and verb endings.","prerequisites":["r-digraphs"],"lesson":{"explanation":"Add -s to most words. Add -es after s, x, sh, ch.","example":"cats, boxes, wishes","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: cats, dogs, runs, hops","mode":"tutor"},{"prompt":"Read aloud: boxes, wishes, lunches, buses","mode":"tutor"},{"prompt":"Which is right?","choices":["foxes","foxs"],"answer":"foxes"}]},"reinforcement":"Plural nouns in writing.","day":58,"subject":"Reading","sightPaceSeconds":10},{"id":"w-plurals","stage":"q3","title":"Plural nouns","summary":"Write more than one with -s or -es.","prerequisites":["w-nouns","r-endings-s"],"lesson":{"explanation":"Add -s to most nouns, -es after s, x, sh, ch.","example":"one fox, two foxes","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"More than one bus:","choices":["buses","buss"],"answer":"buses"},{"prompt":"More than one cat:","choices":["cats","cates"],"answer":"cats"},{"prompt":"More than one dish:","choices":["dishes","dishs"],"answer":"dishes"}]},"reinforcement":"Spelling in all writing.","day":59,"subject":"Writing","sightPaceSeconds":60},{"id":"m-compare-100","stage":"q3","title":"Compare two-digit numbers","summary":"Compare by tens first, then ones.","prerequisites":["m-place-value","m-compare-20"],"lesson":{"explanation":"Look at the tens first. If the tens match, compare the ones.","example":"52 > 48 because 5 tens > 4 tens","tutorSteps":["Build both with tens and ones.","Compare tens, then ones.","Write the sign."]},"practice":{"generator":"compare","params":{"max":100}},"reinforcement":"Ordering numbers and decimals later.","day":60,"subject":"Math","sightPaceSeconds":5},{"id":"r-endings-ed","stage":"q3","title":"Ending -ed","summary":"Read past tense -ed words.","prerequisites":["r-endings-s","r-blends-end"],"lesson":{"explanation":"-ed can sound like /t/ (jumped), /d/ (played) or /ed/ (wanted).","example":"jumped, played, wanted","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: jumped, helped, kicked","mode":"tutor"},{"prompt":"Read aloud: played, filled, smiled","mode":"tutor"},{"prompt":"Read aloud: wanted, landed, melted","mode":"tutor"},{"prompt":"Which word tells about the past?","choices":["walked","walks","walking"],"answer":"walked"}]},"reinforcement":"Past tense in writing.","day":61,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-tens","stage":"q3","title":"Add and subtract tens","summary":"Add or subtract multiples of 10.","prerequisites":["m-ten-more"],"lesson":{"explanation":"Add the tens like ones: 3 tens + 4 tens = 7 tens = 70.","example":"50 + 30 = 80, 90 − 40 = 50","tutorSteps":["Use tens rods.","Say it as tens: 5 tens + 3 tens.","Practice."]},"practice":{"items":[{"prompt":"30 + 40 = ?","answer":"70"},{"prompt":"50 + 20 = ?","answer":"70"},{"prompt":"60 + 30 = ?","answer":"90"},{"prompt":"80 − 50 = ?","answer":"30"},{"prompt":"90 − 60 = ?","answer":"30"},{"prompt":"40 + 40 = ?","answer":"80"},{"prompt":"70 − 20 = ?","answer":"50"},{"prompt":"10 + 80 = ?","answer":"90"}]},"reinforcement":"Used in two-digit adding and in rounding.","day":62,"subject":"Math","sightPaceSeconds":5},{"id":"r-endings-ing","stage":"q3","title":"Ending -ing","summary":"Read -ing words.","prerequisites":["r-endings-ed","r-ng-nk"],"lesson":{"explanation":"-ing means something is happening now. Short vowel words often double the last letter: run → running.","example":"jumping, running, sitting","tutorSteps":["Say the sound or pattern and show it in a word.","C t on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Tutor says: dog, sun, pig, bed, cat. Child writes them.","mode":"tutor"},{"prompt":"Tutor says: fish, chop, duck. Child writes them.","mode":"tutor"}]},"reinforcement":"Spelling grows with each phonics lesson.","day":68,"subject":"Writing","sightPaceSeconds":60},{"id":"r-compound","stage":"q3","title":"Compound words","summary":"Read words made of two smaller words.","prerequisites":["r-blends-start"],"lesson":{"explanation":"A compound word joins two words: sun + set = sunset.","example":"cupcake, rainbow, football","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: sunset, cupcake, rainbow","mode":"tutor"},{"prompt":"Read aloud: football, bedroom, starfish","mode":"tutor"},{"prompt":"Which is a compound word?","choices":["backpack","basket","button"],"answer":"backpack"},{"prompt":"bed + time = ?","answer":"bedtime"}]},"reinforcement":"Breaking long words into parts.","day":69,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-2digit-tens","stage":"q3","title":"Add tens to a two-digit number","summary":"Add a multiple of 10 to any two-digit number.","prerequisites":["m-add-tens"],"lesson":{"explanation":"Only the tens change: 34 + 20 → 3 tens + 2 tens = 5 tens, keep 4 ones → 54.","example":"47 + 30 = 77","tutorSteps":["Use a 120 chart: move down rows.","Use tens rods.","Practice."]},"practice":{"items":[{"prompt":"34 + 20 = ?","answer":"54"},{"prompt":"47 + 30 = ?","answer":"77"},{"prompt":"15 + 60 = ?","answer":"75"},{"prompt":"52 + 40 = ?","answer":"92"},{"prompt":"28 + 50 = ?","answer":"78"},{"prompt":"61 + 30 = ?","answer":"91"},{"prompt":"9 + 70 = ?","answer":"79"}]},"reinforcement":"Mental math strategy for all larger numbers.","day":70,"subject":"Math","sightPaceSeconds":6},{"id":"r-syllables","stage":"q3","title":"Syllables","summary":"Clap and read two-syllable words.","prerequisites":["r-compound"],"lesson":{"explanation":"A syllable is a beat with one vowel sound. Split long words into beats: rab-bit, nap-kin.","example":"rabbit, napkin, picnic","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"prompt":"Read aloud: rabbit, napkin, picnic","mode":"tutor"},{"prompt":"Read aloud: kitten, basket, pumpkin","mode":"tutor"},{"prompt":"How many syllables in 'pumpkin'?","answer":"2"},{"prompt":"How many syllables in 'cat'?","answer":"1"}]},"reinforcement":"Decoding long words in grade 2.","day":71,"subject":"Reading","sightPaceSeconds":10},{"id":"m-sub-tens","stage":"q3","title":"Subtract tens from two-digit numbers","summary":"Take away multiples of 10.","prerequisites":["m-add-2digit-tens"],"lesson":{"explanation":"Only the tens change: 75 − 30 → 7 tens − 3 tens = 4 tens, keep 5 ones → 45.","example":"68 − 40 = 28","tutorSteps":["Use a 120 chart: move up rows.","Use tens rods.","Practice."]},"practice":{"items":[{"prompt":"75 − 30 = ?","answer":"45"},{"prompt":"68 − 40 = ?","answer":"28"},{"prompt":"92 − 50 = ?","answer":"42"},{"prompt":"54 − 20 = ?","answer":"34"},{"prompt":"81 − 60 = ?","answer":"21"},{"prompt":"47 − 10 = ?","answer":"37"},{"prompt":"99 − 90 = ?","answer":"9"}]},"reinforcement":"Leads to two-digit subtraction with regrouping.","day":72,"subject":"Math","sightPaceSeconds":6},{"id":"r-contractions","stage":"q3","title":"Contractions","summary":"Read words like can't, I'm, it's.","prerequisites":["r-endings-s"],"lesson":{"explanation":"A contraction squeezes two words together; an apostrophe replaces the missing letters.","example":"do not → don't","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."]},"practice":{"items":[{"promp ure with same-size units laid end to end.","prerequisites":["m-count-20"],"lesson":{"explanation":"Line up units with no gaps or overlaps. Count how many units long.","example":"The pencil is 6 paper clips long.","tutorSteps":["Measure objects with paper clips or cubes.","Show gaps make wrong answers.","Record lengths."]},"practice":{"items":[{"prompt":"If a crayon is 4 cubes long and a marker is 6 cubes long, how many cubes longer is the marker?","answer":"2"},{"prompt":"When measuring, should units overlap?","choices":["Yes","No"],"answer":"No"},{"prompt":"A book is 10 paper clips long. A notebook is 7. Which is longer?","choices":["Book","Notebook"],"answer":"Book"},{"prompt":"Measure your table in hand spans. Tutor checks.","mode":"tutor"}]},"reinforcement":"Rulers and inches/centimeters come in second grade.","day":79,"subject":"Math","sightPaceSeconds":15},{"id":"r-sight-1","stage":"q3","title":"Sight words set 1","summary":"Read high-frequency words instantly.","prerequisites":["r-letter-sounds"],"lesson":{"explanation":"Sight words show up all the time. Read them by sight in under 2 seconds each.","example":"the, a, is","tutorSteps":["Flash each word card.","Slow words go in a 'practice' pile.","Re-flash the practice pile at the end."]},"practice":{"items":[{"prompt":"Read aloud: the","mode":"tutor"},{"prompt":"Read aloud: a","mode":"tutor"},{"prompt":"Read aloud: is","mode":"tutor"},{"prompt":"Read aloud: you","mode":"tutor"},{"prompt":"Read aloud: to","mode":"tutor"},{"prompt":"Read aloud: and","mode":"tutor"},{"prompt":"Read aloud: we","mode":"tutor"},{"prompt":"Read aloud: it","mode":"tutor"},{"prompt":"Read aloud: in","mode":"tutor"},{"prompt":"Read aloud: said","mode":"tutor"}]},"reinforcement":"Reviewed in every reading lesson after this.","day":80,"subject":"Reading","sightPaceSeconds":2},{"id":"m-order-length","stage":"q3","title":"Order by length","summary":"Put three objects in order from shortest to longest.","prerequisites":["m-length"],"lesson" es, spheres, cones, cylinders and prisms.","prerequisites":["m-shapes-2d"],"lesson":{"explanation":"3D shapes are solid. A cube has 6 square faces. A sphere is round like a ball.","example":"A can is a cylinder.","tutorSteps":["Collect household objects.","Sort by shape.","Count faces on a cube."]},"practice":{"items":[{"prompt":"A ball is a…","choices":["Sphere","Cube","Cone"],"answer":"Sphere"},{"prompt":"How many faces does a cube have?","answer":"6"},{"prompt":"An ice cream cone is shaped like a…","choices":["Cone","Cylinder","Cube"],"answer":"Cone"},{"prompt":"A soup can is a…","choices":["Cylinder","Sphere","Cone"],"answer":"Cylinder"}]},"reinforcement":"Volume and surface area later.","day":93,"subject":"Math","sightPaceSeconds":6},{"id":"s-light","stage":"q4","title":"Light and shadows","summary":"Light lets us see; blocked light makes shadows.","prerequisites":["s-sound"],"lesson":{"explanation":"We need light to see. When an object blocks light, it makes a shadow.","example":"Your shadow is long in the evening.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"We need ___ to see.","choices":["Light","Sound"],"answer":"Light"},{"prompt":"A shadow forms when light is…","choices":["Blocked","Loud"],"answer":"Blocked"},{"prompt":"Use a flashlight to make a shadow puppet.","mode":"tutor"}]},"reinforcement":"Light and optics later.","day":94,"subject":"Science","sightPaceSeconds":15},{"id":"r-fluency","stage":"q4","title":"Reading fluency","summary":"Read a short passage smoothly and with expression.","prerequisites":["r-sight-2","r-cvc"],"lesson":{"explanation":"Fluent reading sounds like talking: smooth, not too fast, with feeling at ! and ?","example":"\"Look out!\" said the cat.","tutorSteps":["Model reading a sentence with expression.","Child reads it back.","Re-read the passage three times; time the last read."]},"practice":{"items":[{"prompt":"Read aloud: The "sightPaceSeconds":20},{"id":"w-narrative","stage":"q4","title":"Write a story","summary":"Write a short story with a beginning, middle and end.","prerequisites":["w-picture-sentence","r-sequence"],"lesson":{"explanation":"Tell what happened first, next and last. Use words like first, then, finally.","example":"First we went to the zoo. Then we saw a lion. Finally we ate ice cream.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Write 3 sentences about something you did: first, then, finally.","mode":"tutor"}]},"reinforcement":"Story writing every year.","day":100,"subject":"Writing","sightPaceSeconds":60},{"id":"ss-timeline","stage":"q4","title":"Timelines","summary":"Put events in order on a timeline.","prerequisites":["ss-then-now","r-sequence"],"lesson":{"explanation":"A timeline shows events in the order they happened, from first to last.","example":"Baby → toddler → first grade","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."]},"practice":{"items":[{"prompt":"Make a timeline of your life with 4 events.","mode":"tutor"},{"prompt":"Which came first?","choices":["Being a baby","Starting first grade"],"answer":"Being a baby"}]},"reinforcement":"Uses sequencing from reading.","day":101,"subject":"Social Studies","sightPaceSeconds":15},{"id":"w-how-to","stage":"q4","title":"How-to writing","summary":"Write steps to do something.","prerequisites":["w-narrative"],"lesson":{"explanation":"Name the topic, list steps in order with first, next, last.","example":"How to brush teeth: First put on toothpaste. Next brush. Last rinse.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."]},"practice":{"items":[{"prompt":"Write 3 steps for making a sandwich.","mode":"tutor"}]},"reinforcement":"Informational writing later.","day":102,"subj
