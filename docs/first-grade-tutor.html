ore is 13.","together":"Do 8 + 9 together. Ask: Which number is smaller? 8. What is 8 + 8? 16. Is 9 one more than 8? Yes, so add one more together: 17.","alone":"Have the child solve 5 + 6 alone. Hint if stuck: start with 5 + 5 first, then add 1."}},"practice":{"items":[{"prompt":"6 + 7 = ?","answer":"13","tier":2,"why":"6 and 7 are next to each other. Double the smaller: 6 + 6 = 12, then add 1 more to get 13."},{"prompt":"5 + 6 = ?","answer":"11","tier":1,"why":"5 and 6 are next to each other. Double the smaller: 5 + 5 = 10, then add 1 more to get 11."},{"prompt":"8 + 9 = ?","answer":"17","tier":3,"why":"8 and 9 are next to each other. Double the smaller: 8 + 8 = 16, then add 1 more to get 17."},{"prompt":"4 + 5 = ?","answer":"9","tier":1,"why":"4 and 5 are next to each other. Double the smaller: 4 + 4 = 8, then add 1 more to get 9."},{"prompt":"7 + 8 = ?","answer":"15","tier":2,"why":"7 and 8 are next to each other. Double the smaller: 7 + 7 = 14, then add 1 more to get 15."},{"prompt":"9 + 10 = ?","answer":"19","tier":3,"why":"9 and 10 are next to each other. Double the smaller: 9 + 9 = 18, then add 1 more to get 19."},{"prompt":"Which double helps with 7 + 8?","choices":["7 + 7","8 + 9","5 + 5"],"answer":"7 + 7","tier":1,"why":"7 is the smaller number, so double it: 7 + 7 = 14. Then 7 + 8 is just 1 more, which is 15."},{"prompt":"Which double helps with 6 + 7?","choices":["6 + 6","3 + 3","7 + 8"],"answer":"6 + 6","tier":1,"why":"6 is the smaller number, so double it: 6 + 6 = 12. Then 6 + 7 is just 1 more, which is 13."},{"prompt":"3 + 4 = ?","answer":"7","tier":2,"why":"3 and 4 are next to each other. Double the smaller: 3 + 3 = 6, then add 1 more to get 7."}]},"reinforcement":"A strategy reused for mental math with bigger numbers.","day":32,"subject":"Math","sightPaceSeconds":5},{"id":"r-blends-end","stage":"q2","part":1,"title":"Ending blends","summary":"Read words ending in two consonants.","prerequisites":["r-blends-start"],"lesson":{"explanation":"Ending blends: st, mp, nd, nt, lt, sk.","example":"jump, hand, fast","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write jump on a card. Cover the j and u and say /m/ /p/, then blend them: /mp/. Read the whole word slowly, stretching the ending so the child hears both m and p.","together":"Read hand together. Ask: What are the last two letters? n and d. Say /nd/ together. Now start at the front: /h/ /a/ /nd/, hand. Have the child say a sentence with hand.","alone":"Have the child read fast alone. Hint if stuck: cover the f and read just ast first."}},"practice":{"items":[{"prompt":"Read aloud: jump, hand, fast, tent","mode":"tutor","tier":2,"why":"Each word ends with a blend where you hear both sounds: ju-mp, ha-nd, fa-st, te-nt. Accept both ending sounds heard clearly."},{"prompt":"Read aloud: milk, desk, belt, pond","mode":"tutor","tier":3,"why":"Each word ends with two sounds: mi-lk, de-sk, be-lt, po-nd. Accept both ending sounds said, not just the last one."},{"prompt":"Which word ends in a blend?","choices":["lamp","lap","lab"],"answer":"lamp","tier":1,"why":"Lamp ends with m and p, and you hear both: /m/ /p/. Lap and lab end with just one sound."},{"prompt":"Which one ends with two consonant sounds?","choices":["best","bet","bed"],"answer":"best","tier":1,"why":"Best ends with /s/ and /t/ together. Bet and bed end with just one sound."},{"prompt":"Which blend ends the word tent?","choices":["nt","nd","st"],"answer":"nt","tier":2,"why":"Say tent slowly: /t/ /e/ /n/ /t/. The last two sounds are n and t, so the blend is nt, not nd."},{"prompt":"Read aloud: lump, sand, mask, gift","mode":"tutor","tier":2,"why":"Each word ends with a blend: lu-mp, sa-nd, ma-sk, gi-ft. Accept both ending sounds heard clearly."},{"prompt":"Read aloud: stamp, blend, crust, felt","mode":"tutor","tier":3,"why":"These words have blends at both ends: st-a-mp, bl-e-nd, cr-u-st, and felt ends in lt. Accept all the sounds heard, with none dropped."}]},"reinforcement":"Returns in -ed and -ing words.","day":33,"subject":"Reading","sightPaceSeconds":10},{"id":"s-plant-needs","stage":"q2","part":1,"title":"What plants need","summary":"Plants need water, light, air and space.","prerequisites":["s-plant-parts"],"lesson":{"explanation":"Plants need sunlight, water, air and room to grow. Without them they wilt.","example":"A plant in a dark closet turns yellow.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Show two bean plants: one that got water and light, and one kept in a dark closet without water. Point to the yellow, droopy one and say: this plant had no light and no water, so it wilted.","together":"Look at a houseplant together. Ask: Where does it get light? The window. Where does it get water? We pour it. Is there room for the roots to grow? Name the four needs together: sunlight, water, air and space.","alone":"Ask the child alone: What would happen to a plant with no water for two weeks? Hint if stuck: think about the yellow plant in the dark closet."}},"practice":{"items":[{"prompt":"Do plants need sunlight?","choices":["Yes","No"],"answer":"Yes","tier":1,"why":"Plants need sunlight to make their food, so yes. Without light, a plant turns yellow and gets weak."},{"prompt":"Which does a plant NOT need?","choices":["Candy","Water","Light"],"answer":"Candy","tier":2,"why":"Plants need water and light to grow, but they do not need candy. Candy is a treat for people."},{"prompt":"Plant a bean in a cup and record growth each day.","mode":"tutor","tier":3,"why":"Accept a cup with a bean planted in soil, watered and kept in light, plus a simple daily record like a drawing, a mark, or how tall it grew."},{"prompt":"Do plants need water?","choices":["Yes","No"],"answer":"Yes","tier":1,"why":"Plants need water to live and grow, so yes. Without water, a plant wilts and droops."},{"prompt":"A plant kept in a dark closet will probably…","choices":["Turn yellow","Grow bigger","Make candy"],"answer":"Turn yellow","tier":2,"why":"In a dark closet the plant gets no sunlight, so it cannot make food and turns yellow. It will not grow bigger without light."},{"prompt":"Which one is something plants need?","choices":["Air","Toys","Shoes"],"answer":"Air","tier":2,"why":"Plants need air, just like we do. Toys and shoes are things people use, and plants do not need them."},{"prompt":"Name the four things a plant needs to grow.","mode":"tutor","tier":3,"why":"A full answer names sunlight, water, air and room to grow. Accept these four in any order."}]},"reinforcement":"Habitats and food chains later.","day":34,"subject":"Science","sightPaceSeconds":15},{"id":"m-missing-addend","stage":"q2","part":1,"title":"Missing numbers","summary":"Find the unknown in 4 + ? = 10.","prerequisites":["m-sub-10"],"lesson":{"explanation":"Ask: what do I add to the first number to reach the total? Count up, or subtract.","example":"5 + ? = 9 → 4","tutorSteps":["Hide some cubes under a cup.","Count up from the part to the whole.","Write the matching subtraction."],"approaches":{"show":"Put 9 cubes on the table, then hide some under a cup so 5 show. Say: 5 plus how many makes 9? Count up from 5 while lifting the cup: 6, 7, 8, 9. That is 4 hiding, so 5 + 4 = 9.","together":"Do 6 + ? = 10 together. Ask: What number do we start at? 6. Where do we stop? 10. Count up together on your fingers: 7, 8, 9, 10. How many fingers? 4.","alone":"Have the child solve 3 + ? = 8 alone. Hint if stuck: start at 3 and count up to 8, keeping track on your fingers."}},"practice":{"generator":"missingAddend","params":{"max":10}},"reinforcement":"The start of algebra (solving for x).","day":35,"subject":"Math","sightPaceSeconds":5},{"id":"w-nouns","stage":"q2","part":1,"title":"Nouns","summary":"Find and use naming words.","prerequisites":["w-name-sentence"],"lesson":{"explanation":"A noun names a person, place or thing. Names of people and places start with a capital.","example":"girl, park, ball, Charlotte","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write 'The girl kicks a ball at the park.' Circle girl, ball and park while saying: girl is a person, ball is a thing, park is a place, so they are all nouns.","together":"Look around the kitchen together. Ask: Can you name a thing you see? Cup. Is cup a person, place or thing? A thing, so it is a noun. Take turns naming nouns and writing them on a list.","alone":"Have the child find the noun in 'The dog runs fast' alone. Hint if stuck: which word names a person, place or thing you could point to?"}},"practice":{"items":[{"prompt":"Which word is a noun?","choices":["apple","run","happy"],"answer":"apple","tier":1,"why":"An apple is a thing you can hold and eat, so apple is a noun. Run is something you do, and happy tells how you feel."},{"prompt":"Which word is a noun?","choices":["school","jump","blue"],"answer":"school","tier":2,"why":"A school is a place, and a noun names a person, place or thing. Jump is something you do, and blue is a color."},{"prompt":"Write three nouns in your room.","mode":"tutor","tier":3,"why":"Accept any three things you can see or touch in a room, like bed, lamp, book or rug. Each one names a thing, so each one is a noun."},{"prompt":"Which word names a thing?","choices":["cat","sit"],"answer":"cat","tier":1,"why":"A cat is a thing you can see and pet, so cat names a thing. Sit is something you do."},{"prompt":"Which word names a place?","choices":["park","sing","soft"],"answer":"park","tier":2,"why":"A park is a place you can go to play, so park names a place. Sing is something you do, and soft tells how something feels."},{"prompt":"Which noun should start with a capital letter?","choices":["charlotte","girl","ball"],"answer":"charlotte","tier":2,"why":"Charlotte is a girl's own name, and names of people start with a capital letter. Girl and ball are not special names, so they stay small."},{"prompt":"Write a sentence with two nouns. Tutor circles them.","mode":"tutor","tier":3,"why":"Accept any sentence with two words that name people, places or things, like \"The dog ran to the park.\" Here dog and park are the nouns to circle."}]},"reinforcement":"Grammar in every grade.","day":36,"subject":"Writing","sightPaceSeconds":60},{"id":"r-ng-nk","stage":"q2","part":1,"title":"-ng and -nk","summary":"Read words with ng and nk.","prerequisites":["r-blends-end"],"lesson":{"explanation":"ng says /ng/ (ring). nk says /ngk/ (pink).","example":"sing, bank, long","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write ring and pink on cards. Read ring, holding the /ng/ sound at the end like a humming bell. Then read pink and point out the extra /k/ at the end: /ngk/.","together":"Read bank together. Ask: What two letters are at the end? n and k. What sound do they make together? /ngk/. Now start at the front: /b/ /a/ /ngk/, bank. Then do the same with sang.","alone":"Have the child read think alone. Hint if stuck: th says /th/, then read the ink part like pink."}},"practice":{"items":[{"prompt":"Read aloud: sing, ring, long, hung","mode":"tutor","tier":2,"why":"Each word ends with ng, which makes one sound like at the end of ring: sing, ring, long, hung. Accept the ng sound said smoothly, not as a separate n and g."},{"prompt":"Read aloud: pink, bank, sunk, think","mode":"tutor","tier":3,"why":"Each word ends with nk, which sounds like ng plus a k: pink, bank, sunk, think. Listen for th at the start of think and a clear k sound at the end of each word."},{"prompt":"Which word ends with -nk?","choices":["sink","sing","sit"],"answer":"sink","tier":1,"why":"Sink ends with the letters n and k, so it ends with -nk. Sing ends with -ng instead, and sit has no n at all."},{"prompt":"Which word has -ng at the end?","choices":["king","kit","kick"],"answer":"king","tier":1,"why":"King ends with the letters n and g, so it has -ng at the end. Kit ends with t, and kick ends with ck."},{"prompt":"Which word ends with -ng?","choices":["wing","wink","win"],"answer":"wing","tier":2,"why":"Wing ends with n and g, so it ends with -ng. Wink is tricky because it ends with -nk, and win ends with just n."},{"prompt":"Read aloud: song, wink, bring, trunk","mode":"tutor","tier":3,"why":"Song and bring end with ng, like ring. Wink and trunk end with nk, like pink. Accept each word blended smoothly with the right ending sound."},{"prompt":"Read aloud: sang, honk, lung, ink","mode":"tutor","tier":2,"why":"Sang and lung end with ng, like ring. Honk and ink end with nk, like pink. Accept each word read smoothly with a clear ending."}]},"reinforcement":"Used with -ing endings.","day":37,"subject":"Reading","sightPaceSeconds":10},{"id":"m-fact-family","stage":"q2","part":2,"title":"Fact families","summary":"See how +, − link three numbers.","prerequisites":["m-missing-addend"],"lesson":{"explanation":"3, 5 and 8 make a family: 3 + 5 = 8, 5 + 3 = 8, 8 − 5 = 3, 8 − 3 = 5.","example":"If 6 + 4 = 10 then 10 − 4 = 6","tutorSteps":["Draw a number bond (whole on top, parts below).","Write all four facts.","Quiz the related fact."],"approaches":{"show":"Draw a number bond with 8 on top and 3 and 5 below. Write all four facts while pointing at the numbers: 3 + 5 = 8, 5 + 3 = 8, 8 - 5 = 3, 8 - 3 = 5. Say: same three numbers, four facts.","together":"Make a family with 6, 4 and 10 together. Ask: Which is the whole? 10. Put it on top. What are the parts? 6 and 4. You write 6 + 4 = 10, then ask the child to write the turn-around fact and the two take-away facts.","alone":"Have the child write all four facts for 2, 7 and 9 alone. Hint if stuck: the biggest number is the whole, and subtraction facts start with the whole."}},"practice":{"generator":"factFamily","params":{"max":10}},"reinforcement":"Becomes multiplication/division families later.","day":38,"subject":"Math","sightPaceSeconds":5},{"id":"r-silent-e-a","stage":"q2","part":2,"title":"Silent e: a_e","summary":"Read long a words with a silent e.","prerequisites":["r-cvc","r-digraphs"],"lesson":{"explanation":"A silent e at the end makes the vowel say its name: cap → cape.","example":"cake, name, gate","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write cap on a card and read it. Add an e at the end and say: the e is silent, but it makes the a say its name. Read cape slowly, pointing at the a.","together":"Read tap and tape together. Ask: Does tap have an e at the end? No, so the a is short. Does tape? Yes, so what does the a say? Its name, /ā/. Read both together, then use tape in a sentence.","alone":"Have the child read made alone. Hint if stuck: look for the e at the end, then let the a say its name."}},"practice":{"items":[{"prompt":"Read aloud: cake, name, gate, same","mode":"tutor","tier":2,"why":"Each word has a silent e at the end, so the a says its name, like in cake, name, gate, same. Accept the long a sound and a quiet e."},{"prompt":"Read aloud: cap / cape, tap / tape, mad / made","mode":"tutor","tier":3,"why":"In each pair the first word has a short a, and the e at the end makes the a say its name: cap and cape, tap and tape, mad and made. Accept a clear change in the a sound."},{"prompt":"Which word has long a?","choices":["tape","tap"],"answer":"tape","tier":1,"why":"Tape has a silent e at the end, so the a says its name. Tap has no e, so its a is short, like in apple."},{"prompt":"Which word says its long a sound?","choices":["can","cane"],"answer":"cane","tier":1,"why":"Cane has a silent e at the end, so the a says its name. Can has no e, so its a is short."},{"prompt":"Add a silent e to hat. What word do you get?","choices":["hate","hat","heat"],"answer":"hate","tier":2,"why":"Put an e at the end of hat and the a says its name: h-a-t-e, hate. Heat has an extra letter and a different vowel sound."},{"prompt":"Read aloud: lake, game, wave, plate","mode":"tutor","tier":2,"why":"Each word ends with a silent e, so the a says its name: lake, game, wave, plate. Accept the long a sound and both sounds of the pl blend at the start of plate."},{"prompt":"Read aloud: pan / pane, rat / rate, plan / plane","mode":"tutor","tier":3,"why":"In each pair the e at the end makes the short a turn into a long a: pan and pane, rat and rate, plan and plane. Accept a clear change from short a to long a."}]},"reinforcement":"Same rule for i, o, u next.","day":39,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-20","stage":"q2","part":2,"title":"Addition facts to 20","summary":"Add within 20 at sight pace using make-ten.","prerequisites":["m-add-10","m-make-ten","m-doubles"],"lesson":{"explanation":"Make a ten first: 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.","example":"9 + 6 = 15","tutorSteps":["Use two ten frames.","Move counters to fill one ten.","Flash practice until instant."],"approaches":{"show":"Put 8 counters on one ten frame and 5 on another. Move 2 from the 5 to fill the first frame, saying: 8 and 2 make 10. There are 3 left, so 10 and 3 is 13. So 8 + 5 = 13.","together":"Do 9 + 6 together on two ten frames. Ask: How many does 9 need to make 10? 1. Move 1 counter together. How many are left on the other frame? 5. What is 10 + 5? 15.","alone":"Have the child solve 7 + 5 alone. Hint if stuck: give 3 to the 7 to make 10, then see what is left."}},"practice":{"generator":"add","params":{"max":10}},"reinforcement":"Used in every two-digit addition.","day":40,"subject":"Math","sightPaceSeconds":4},{"id":"r-silent-e-iou","stage":"q2","part":2,"title":"Silent e: i_e, o_e, u_e","summary":"Read long i, o and u with silent e.","prerequisites":["r-silent-e-a"],"lesson":{"explanation":"The silent e rule works with every vowel: kit → kite, hop → hope, cub → cube.","example":"bike, home, cute","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write kit, hop and cub on cards. Read each, then add an e to make kite, hope and cube, saying: the silent e makes the vowel say its name.","together":"Read rope together. Ask: Is there an e at the end? Yes. So what does the o say? Its name, /ō/. Blend /r/ /ō/ /p/ together: rope. Then try the child's turn with pine.","alone":"Have the child read mule alone. Hint if stuck: the e at the end is quiet, so the u says its name, /ū/."}},"practice":{"items":[{"prompt":"Read aloud: bike, time, ride, five","mode":"tutor","tier":2,"why":"Each word ends with a silent e, so the i says its name: bike, time, ride, five. Accept the long i sound, like in ice, and a quiet e."},{"prompt":"Read aloud: home, rope, note, bone","mode":"tutor","tier":2,"why":"Each word ends with a silent e, so the o says its name: home, rope, note, bone. Accept the long o sound, like in open, and a quiet e."},{"prompt":"Read aloud: cute, cube, mule, tune","mode":"tutor","tier":3,"why":"Each word ends with a silent e, so the u says its name: cute, cube, mule, tune. Accept the long u sound, like you or oo, and a quiet e."},{"prompt":"Which word has long o?","choices":["hope","hop"],"answer":"hope","tier":1,"why":"Hope has a silent e at the end, so the o says its name. Hop has no e, so its o is short."},{"prompt":"Which word has long i?","choices":["pin","pine"],"answer":"pine","tier":1,"why":"Pine has a silent e at the end, so the i says its name. Pin has no e, so its i is short."},{"prompt":"Which word has long u?","choices":["cub","cube"],"answer":"cube","tier":2,"why":"Cube has a silent e at the end, so the u says its name, like you. Cub has no e, so its u is short, like in up."},{"prompt":"Read aloud: kit / kite, hop / hope, cub / cube","mode":"tutor","tier":3,"why":"In each pair the e at the end makes the vowel say its name: kit and kite, hop and hope, cub and cube. Accept a clear change from the short sound to the long sound."}]},"reinforcement":"Spelling long vowels in writing.","day":41,"subject":"Reading","sightPaceSeconds":10},{"id":"w-verbs","stage":"q2","part":2,"title":"Verbs","summary":"Find and use action words.","prerequisites":["w-nouns"],"lesson":{"explanation":"A verb tells what someone or something does: run, eat, sing.","example":"The bird sings.","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Write 'The bird sings.' Act out singing, then underline sings and say: sings tells what the bird does, so it is a verb.","together":"Play an action game together. You hop and ask: What am I doing? Hopping. Is hop something you do? Yes, so it is a verb. Then the child does an action and you name the verb together and write it down.","alone":"Have the child find the verb in 'The frog jumps in the pond' alone. Hint if stuck: which word could you act out?"}},"practice":{"items":[{"prompt":"Which word is a verb?","choices":["jump","dog","red"],"answer":"jump","tier":2,"why":"Jump is something you can do, so jump is a verb. Dog names an animal, and red is a color."},{"prompt":"Which word is a verb?","choices":["swim","pool","wet"],"answer":"swim","tier":2,"why":"Swim is something you can do in the water, so swim is a verb. Pool names a place, and wet tells how something feels."},{"prompt":"Write a sentence with a verb. Tutor underlines it.","mode":"tutor","tier":3,"why":"Accept any sentence that tells what someone or something does, like \"The dog runs.\" The verb to underline is the action word, here runs."},{"prompt":"Which word is something you can do?","choices":["eat","cup"],"answer":"eat","tier":1,"why":"Eat is something you can do, so eat is the action word. A cup is a thing, not something you do."},{"prompt":"Which word is an action?","choices":["run","hat"],"answer":"run","tier":1,"why":"Run is something you can do with your legs, so run is an action. A hat is a thing you wear."},{"prompt":"Find the verb: The cat sleeps.","choices":["sleeps","cat","The"],"answer":"sleeps","tier":3,"why":"Sleeps tells what the cat does, so sleeps is the verb. Cat names the animal, and the word The just points to it."}]},"reinforcement":"Past tense with -ed connects here.","day":42,"subject":"Writing","sightPaceSeconds":60},{"id":"m-sub-20","stage":"q2","part":2,"title":"Subtraction facts to 20","summary":"Subtract within 20 at sight pace.","prerequisites":["m-sub-10","m-add-20"],"lesson":{"explanation":"Go back to ten: 14 − 6 = 14 − 4 − 2 = 10 − 2 = 8. Or think addition: 6 + ? = 14.","example":"15 − 7 = 8","tutorSteps":["Model on two ten frames.","Use the related addition fact.","Flash practice."],"approaches":{"show":"Show 14 on two ten frames: one full frame and 4 more. Take away 4 to get to 10, then 2 more from the full frame, saying: 14 take away 6 is 14 minus 4, then minus 2, which is 8.","together":"Do 15 - 7 together. Ask: What addition fact can help? 7 plus what makes 15? Count up together: 7 to 10 is 3, 10 to 15 is 5, and 3 plus 5 is 8. So 15 - 7 = 8.","alone":"Have the child solve 13 - 5 alone. Hint if stuck: take away 3 first to get to 10, then take away 2 more."}},"practice":{"generator":"sub","params":{"max":20}},"reinforcement":"Used in every two-digit subtraction.","day":43,"subject":"Math","sightPaceSeconds":4},{"id":"s-animals","stage":"q2","part":2,"title":"Animals and their young","summary":"Animals and babies look alike and parents help them.","prerequisites":["s-living"],"lesson":{"explanation":"Young animals look like their parents. Many parents feed and protect their babies.","example":"A baby cat is a kitten.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Show pictures of a cat and a kitten side by side. Point to the ears, whiskers and tail on both and say: a baby cat is a kitten, and it looks like its mother. The mother feeds it milk and keeps it safe.","together":"Look at pictures of a cow and a calf together. Ask: What is the baby called? Calf. How does it look like its mother? Same spots, hooves and tail. How might the mother help it? Feeding it milk.","alone":"Ask the child alone: What is a baby dog called, and how does its mother help it? Hint if stuck: think of the word that sounds like a little dog's name, pup."}},"practice":{"items":[{"prompt":"A baby dog is a…","choices":["Puppy","Calf","Chick"],"answer":"Puppy","tier":1,"why":"A baby dog is called a puppy. A calf is a baby cow, and a chick is a baby bird."},{"prompt":"A baby cow is a…","choices":["Calf","Kitten","Cub"],"answer":"Calf","tier":2,"why":"A baby cow is called a calf. A kitten is a baby cat, and a cub is a baby bear or lion."},{"prompt":"A baby bird hatches from an…","choices":["Egg","Seed","Leaf"],"answer":"Egg","tier":2,"why":"A mother bird lays eggs, and the baby bird grows inside and then hatches out. Seeds grow into plants, not birds."},{"prompt":"A baby cat is a…","choices":["Kitten","Puppy"],"answer":"Kitten","tier":1,"why":"A baby cat is called a kitten. A puppy is a baby dog."},{"prompt":"Does a baby duck look like its parent?","choices":["Yes","No"],"answer":"Yes","tier":1,"why":"A baby duck has a bill, webbed feet and feathers just like its parent, so it looks like a small duck. Its feathers just look fluffier at first."},{"prompt":"How does a mother bird help her chicks?","choices":["She brings them food","She paints them","She hides them in sand"],"answer":"She brings them food","tier":3,"why":"A mother bird flies off to find food and brings it back to feed her chicks. Birds do not paint their chicks or hide them in sand."},{"prompt":"Name one baby animal and tell how its parent takes care of it.","mode":"tutor","tier":3,"why":"Accept any baby animal and a real way its parent helps, like \"A puppy drinks milk from its mother\" or \"A mother bird brings worms to her chicks.\""}]},"reinforcement":"Life cycles and traits later.","day":44,"subject":"Science","sightPaceSeconds":15},{"id":"ss-helpers","stage":"q2","part":2,"title":"Community helpers","summary":"Name jobs that help a community.","prerequisites":["ss-family"],"lesson":{"explanation":"Community helpers include firefighters, doctors, dentists, teachers, mail carriers and police officers.","example":"A dentist helps keep teeth healthy.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Show a picture of a firefighter, a dentist and a mail carrier. Point to each and say what they do: the firefighter puts out fires, the dentist keeps teeth healthy, the mail carrier brings letters to our home.","together":"Talk about the child's last visit to the doctor together. Ask: Who helped you? The doctor. What did the doctor do? Checked if I was healthy. How does that help our community? Take turns naming another helper you have met.","alone":"Ask the child alone: Who teaches children at school? Hint if stuck: think of the person at the front of your classroom."}},"practice":{"items":[{"prompt":"Who helps keep teeth healthy?","choices":["Dentist","Pilot","Chef"],"answer":"Dentist","tier":2,"why":"A dentist checks and cleans our teeth to keep them healthy. A pilot flies planes, and a chef cooks food."},{"prompt":"Who puts out fires?","choices":["Firefighter","Teacher"],"answer":"Firefighter","tier":1,"why":"A firefighter uses hoses and water to put out fires. A teacher helps children learn."},{"prompt":"Who delivers letters?","choices":["Mail carrier","Baker"],"answer":"Mail carrier","tier":1,"why":"A mail carrier brings letters and packages to our homes. A baker makes bread and cakes."},{"prompt":"Who helps you when you are sick?","choices":["Doctor","Mail carrier","Firefighter"],"answer":"Doctor","tier":2,"why":"A doctor helps you feel better when you are sick. A mail carrier brings letters, and a firefighter puts out fires."},{"prompt":"Who teaches children at school?","choices":["Teacher","Dentist","Police officer"],"answer":"Teacher","tier":2,"why":"A teacher helps children learn at school. A dentist takes care of teeth, and a police officer helps keep people safe."},{"prompt":"Name a community helper and tell how they help people.","mode":"tutor","tier":3,"why":"Accept any community helper with a true way they help, like \"A police officer keeps people safe\" or \"A doctor helps sick people get better.\""},{"prompt":"Draw a community helper at work and tell about the picture.","mode":"tutor","tier":3,"why":"Accept a drawing of any community helper doing their job, with a sentence or two about it, like \"This is a firefighter spraying water on a fire.\""}]},"reinforcement":"Economics and jobs later.","day":45,"subject":"Social Studies","sightPaceSeconds":15},{"id":"r-ee-ea","stage":"q2","part":2,"title":"ee and ea","summary":"Read long e vowel teams.","prerequisites":["r-silent-e-iou"],"lesson":{"explanation":"When two vowels go walking, the first one does the talking: ee and ea say long e.","example":"tree, seat, beach","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write tree and seat on cards. Point to ee and ea and say: when two vowels go walking, the first one does the talking. The e says its name: /ē/. Read tree and seat slowly.","together":"Read beach together. Ask: Which two vowels are walking? e and a. Which one talks? The first one, e, so it says /ē/. Blend /b/ /ē/ /ch/ together: beach. Then try feet.","alone":"Have the child read green alone. Hint if stuck: the two e's together say /ē/, like in tree."}},"practice":{"items":[{"prompt":"Read aloud: tree, see, feet, green","mode":"tutor","tier":2,"why":"Each word has ee, and ee says long e, like in see: tree, see, feet, green. Accept the long e sound in every word."},{"prompt":"Read aloud: seat, beach, read, team","mode":"tutor","tier":3,"why":"Each word has ea, and here ea says long e: seat, beach, read, team. Read can also be said like red when it means already read, so accept either."},{"prompt":"Which word has long e?","choices":["sheep","ship"],"answer":"sheep","tier":1,"why":"Sheep has ee, and ee says long e. Ship has just one i, so it has a short i sound."},{"prompt":"Which word says long e?","choices":["bed","bead"],"answer":"bead","tier":1,"why":"Bead has ea, and ea says long e. Bed has only one vowel, so its e is short."},{"prompt":"Which letters make long e in the word meat?","choices":["ea","me","at"],"answer":"ea","tier":2,"why":"In meat, the two vowels e and a sit together, and the first one does the talking, so ea says long e. The letters m and t are just the start and end sounds."},{"prompt":"Read aloud: keep, leaf, sweet, peach","mode":"tutor","tier":3,"why":"Keep and sweet have ee, and leaf and peach have ea. Both spellings say long e, so accept the long e sound in every word."},{"prompt":"Read aloud: bee, eat, week, sea","mode":"tutor","tier":2,"why":"Bee and week have ee, and eat and sea have ea. Both spellings say long e, so accept the long e sound in every word."}]},"reinforcement":"Vowel teams return in second grade.","day":46,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-three","stage":"q2","part":3,"title":"Add three numbers","summary":"Add three numbers by finding an easy pair first.","prerequisites":["m-add-20"],"lesson":{"explanation":"You can add in any order. Look for a ten or a double first.","example":"4 + 7 + 6 = (4 + 6) + 7 = 17","tutorSteps":["Show the same total in different orders.","Circle a pair that makes 10.","Practice."],"approaches":{"show":"Write 4 + 7 + 6. Circle the 4 and the 6 and say: these make 10. Then add the 7: 10 plus 7 is 17. Show that adding 4 + 7 first also gives 17, just harder.","together":"Do 3 + 5 + 5 together. Ask: Do you see a double or a ten? 5 + 5 is a double, 10. What is left? 3. What is 10 + 3? 13.","alone":"Have the child solve 2 + 6 + 8 alone. Hint if stuck: look for two numbers that make 10."}},"practice":{"generator":"add3","params":{"max":6}},"reinforcement":"Grouping (the associative property) is used all through algebra.","day":47,"subject":"Math","sightPaceSeconds":8},{"id":"r-ai-ay","stage":"q2","part":3,"title":"ai and ay","summary":"Read long a vowel teams.","prerequisites":["r-ee-ea"],"lesson":{"explanation":"ai is used in the middle of a word (rain); ay at the end (play).","example":"rain, day, paint","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write rain and play on cards. Underline ai in rain and ay in play, and say: both say long a. ai goes in the middle of a word, ay goes at the end. Read each slowly.","together":"Read paint together. Ask: Where is the long a sound, the middle or the end? The middle. So which spelling do we see? ai. Blend /p/ /ā/ /n/ /t/ together: paint. Then try stay.","alone":"Have the child read tail alone. Hint if stuck: ai says /ā/, like in rain."}},"practice":{"items":[{"prompt":"Read aloud: rain, tail, paint, wait","mode":"tutor","tier":2,"why":"Each word has ai in the middle, and ai says long a: rain, tail, paint, wait. Accept the long a sound, like the letter name A."},{"prompt":"Read aloud: day, play, stay, gray","mode":"tutor","tier":2,"why":"Each word ends with ay, and ay says long a: day, play, stay, gray. Accept the long a sound at the end of each word."},{"prompt":"Which spelling ends a word?","choices":["ay","ai"],"answer":"ay","tier":3,"why":"We use ay at the end of a word, like in play and day. We use ai in the middle, like in rain."},{"prompt":"Which word says long a?","choices":["rain","ran"],"answer":"rain","tier":1,"why":"Rain has ai, and ai says long a. Ran has just one a, so it has a short a sound."},{"prompt":"Which word has the long a sound?","choices":["pay","pan"],"answer":"pay","tier":1,"why":"Pay ends with ay, and ay says long a. Pan has just one a, so its a is short."},{"prompt":"Which is spelled correctly?","choices":["train","trayn"],"answer":"train","tier":3,"why":"The long a sound is in the middle of train, and we spell long a in the middle with ai. We save ay for the end of a word."},{"prompt":"Read aloud: mail, may, snail, tray","mode":"tutor","tier":3,"why":"Mail and snail have ai in the middle, and may and tray have ay at the end. Both spellings say long a, so accept the long a sound in every word."}]},"reinforcement":"Spelling choices in writing.","day":48,"subject":"Reading","sightPaceSeconds":10},{"id":"m-word-problems","stage":"q2","part":3,"title":"Word problems: add and subtract","summary":"Decide whether to add or subtract in a story.","prerequisites":["m-add-20","m-sub-20"],"lesson":{"explanation":"Read the story, picture it, then decide: are things joining (add) or leaving (subtract)?","example":"Sam has 7 shells and finds 5 more → 7 + 5 = 12","tutorSteps":["Read the problem aloud together.","Act it out or draw it.","Write the number sentence, then solve."],"approaches":{"show":"Read aloud: Sam has 7 shells and finds 5 more. Act it out with 7 shells or buttons, then push in 5 more, saying: things are joining, so I add. Write 7 + 5 = 12.","together":"Do this one together: There are 10 birds and 4 fly away. Ask: Are birds joining or leaving? Leaving, so do we add or subtract? Subtract. Draw 10 birds, cross out 4, and count what is left together: 6.","alone":"Have the child solve alone: Mia has 6 apples and gets 3 more. How many now? Hint if stuck: are the apples joining or leaving?"}},"practice":{"generator":"wordAdd","params":{"max":10}},"reinforcement":"Every math level uses word problems.","day":49,"subject":"Math","sightPaceSeconds":15},{"id":"w-adjectives","stage":"q2","part":3,"title":"Adjectives","summary":"Describe nouns with adjectives.","prerequisites":["w-verbs"],"lesson":{"explanation":"An adjective describes a noun: color, size, shape, how it feels.","example":"a big, soft, brown bear","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Hold up a teddy bear and write 'a big, soft, brown bear.' Point to each describing word and say: big tells size, soft tells how it feels, brown tells color. These are adjectives.","together":"Look at a ball together. Ask: What color is it? Red. What size? Small. How does it feel? Bumpy. Write 'a small, red, bumpy ball' together, taking turns adding each adjective.","alone":"Have the child find the adjective in 'The tall tree' alone. Hint if stuck: which word tells what the tree looks like?"}},"practice":{"items":[{"prompt":"Which word is an adjective?","choices":["fuzzy","hop","cat"],"answer":"fuzzy","tier":2,"why":"Fuzzy tells how something feels, like a fuzzy blanket, so fuzzy is an adjective. Hop is something you do, and cat names an animal."},{"prompt":"Which word describes?","choices":["tiny","run","boy"],"answer":"tiny","tier":2,"why":"Tiny tells the size of something, like a tiny bug, so tiny describes. Run is something you do, and boy names a person."},{"prompt":"Describe an apple with three adjectives.","mode":"tutor","tier":3,"why":"Accept three describing words that fit an apple, like red, round and crunchy, or sweet, shiny and juicy. Each word should tell color, size, shape, taste or feel."},{"prompt":"Which word tells a color?","choices":["green","jump"],"answer":"green","tier":1,"why":"Green is a color, like green grass. Jump is something you do."},{"prompt":"Which word describes a size?","choices":["big","dog"],"answer":"big","tier":1,"why":"Big tells how large something is, so big describes a size. Dog names an animal."},{"prompt":"Write a sentence about your pet or toy with two adjectives.","mode":"tutor","tier":3,"why":"Accept a sentence with two describing words, like \"My dog is small and fluffy\" or \"I have a soft, brown bear.\""}]},"reinforcement":"Detailed writing in later grades.","day":50,"subject":"Writing","sightPaceSeconds":60},{"id":"r-oa-ow","stage":"q2","part":3,"title":"oa and ow","summary":"Read long o vowel teams.","prerequisites":["r-ai-ay"],"lesson":{"explanation":"oa (boat) and ow (snow) can both say long o.","example":"boat, coat, snow, grow","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write boat and snow on cards. Underline oa and ow and say: both of these say long o, /ō/. Read each word slowly, pointing at the vowel team.","together":"Read coat together. Ask: Which two letters make the vowel sound? oa. What do they say? /ō/. Blend /c/ /ō/ /t/ together: coat. Then try grow and find the ow.","alone":"Have the child read soap alone. Hint if stuck: oa says /ō/, like in boat."}},"practice":{"items":[{"prompt":"Read aloud: boat, coat, road, soap","mode":"tutor","tier":2,"why":"Each word has oa, and oa says long o, like in boat: boat, coat, road, soap. Accept the long o sound in every word."},{"prompt":"Read aloud: snow, grow, show, slow","mode":"tutor","tier":2,"why":"Each word ends with ow, and here ow says long o: snow, grow, show, slow. Accept the long o sound, not the ow sound in cow."},{"prompt":"Which word has long o?","choices":["goat","got"],"answer":"goat","tier":1,"why":"Goat has oa, and oa says long o. Got has just one o, so its o is short."},{"prompt":"Which word says long o?","choices":["rod","road"],"answer":"road","tier":1,"why":"Road has oa, and oa says long o. Rod has just one o, so its o is short."},{"prompt":"Which letters make long o in the word bowl?","choices":["ow","bo","wl"],"answer":"ow","tier":3,"why":"In bowl, the letters o and w work together to say long o. The b and l are the start and end sounds."},{"prompt":"Read aloud: toad, blow, float, crow","mode":"tutor","tier":3,"why":"Toad and float have oa, and blow and crow have ow. Both say long o, so accept the long o sound in every word."}]},"reinforcement":"ow also says /ow/ in cow — compare in grade 2.","day":51,"subject":"Reading","sightPaceSeconds":10},{"id":"m-compare-problems","stage":"q2","part":3,"title":"Word problems: how many more?","summary":"Solve comparison stories.","prerequisites":["m-word-problems"],"lesson":{"explanation":"'How many more' means find the difference between two amounts: subtract the smaller from the bigger.","example":"Ana has 9 cards, Ben has 5. Ana has 4 more.","tutorSteps":["Line up two rows of cubes.","Count the extra ones.","Write it as subtraction."],"approaches":{"show":"Make a row of 9 red cubes for Ana and a row of 5 blue cubes for Ben, lined up one above the other. Point to the 4 red cubes with no partner and say: Ana has 4 more. 9 - 5 = 4.","together":"Do this together: Mia read 7 books and Leo read 10. Ask: Who read more? Leo. Line up 7 and 10 cubes. How many of Leo's have no partner? Count them together: 3. Write 10 - 7 = 3.","alone":"Have the child solve alone: Jo has 8 marbles and Kim has 5. How many more does Jo have? Hint if stuck: line up 8 and 5 cubes and count the extra ones."}},"practice":{"items":[{"prompt":"Ana has 9 cards. Ben has 5. How many more cards does Ana have?","answer":"4","tier":2,"why":"Ana has 9 and Ben has 5. Take away the smaller from the bigger: 9 − 5 = 4. So Ana has 4 more cards."},{"prompt":"A red tower has 12 blocks. A blue tower has 8. How many fewer blocks does the blue tower have?","answer":"4","tier":3,"why":"The red tower has 12 and the blue tower has 8. Find the difference: 12 − 8 = 4. So the blue tower has 4 fewer blocks."},{"prompt":"Mia read 7 books. Leo read 10. How many more books did Leo read?","answer":"3","tier":2,"why":"Leo read 10 and Mia read 7. Count up from 7 to 10: 8, 9, 10. That is 3, so Leo read 3 more books."},{"prompt":"There are 15 birds and 9 nests. How many birds have no nest?","answer":"6","tier":3,"why":"Put one bird in each of the 9 nests. Then 15 − 9 = 6 birds are left with no nest."},{"prompt":"Jo has 6 stickers. She needs 11. How many more does she need?","answer":"5","tier":3,"why":"Jo has 6 and needs 11. Count up from 6 to 11: 7, 8, 9, 10, 11. That is 5 more stickers."},{"prompt":"Tom has 4 cars. Sue has 2 cars. How many more cars does Tom have?","answer":"2","tier":1,"why":"Tom has 4 and Sue has 2. Take away the smaller from the bigger: 4 − 2 = 2. So Tom has 2 more cars."},{"prompt":"Kim has 5 apples. Max has 3 apples. Who has more?","choices":["Kim","Max"],"answer":"Kim","tier":1,"why":"Kim has 5 apples and Max has 3. Five is bigger than 3, so Kim has more."},{"prompt":"There are 6 cups and 4 lids. How many cups have no lid?","answer":"2","tier":1,"why":"Put one lid on each cup. The 4 lids cover 4 cups, and 6 − 4 = 2 cups have no lid."}]},"reinforcement":"Difference thinking returns in measurement and data.","day":52,"subject":"Math","sightPaceSeconds":20},{"id":"m-place-value","stage":"q2","part":3,"title":"Tens and ones","summary":"Know a two-digit number is tens and ones.","prerequisites":["m-count-120","m-skip-10"],"lesson":{"explanation":"In 47, the 4 means 4 tens (40) and the 7 means 7 ones.","example":"63 = 6 tens + 3 ones","tutorSteps":["Bundle straws into tens.","Build numbers with tens rods and ones cubes.","Ask what each digit is worth."],"approaches":{"show":"Bundle 40 straws into 4 groups of ten with rubber bands and set 7 loose straws beside them. Point and say: 4 tens is 40, and 7 ones, so this is 47. Write 47 and point to the 4 and the 7.","together":"Build 63 together with tens rods and ones cubes. Ask: How many tens do we need? 6. Lay them down together. How many ones? 3. Now point to the 6 in 63 and ask: What is this digit worth? 60.","alone":"Have the child tell how many tens and ones are in 58 alone. Hint if stuck: the first digit tells the tens, the second digit tells the ones."}},"practice":{"generator":"placeValue","params":{"digits":2}},"reinforcement":"The foundation of all multi-digit math.","day":53,"subject":"Math","sightPaceSeconds":5},{"id":"r-r-controlled","stage":"q2","part":3,"title":"ar, or, er, ir, ur","summary":"Read bossy-r vowels.","prerequisites":["r-oa-ow"],"lesson":{"explanation":"When r follows a vowel it changes the sound: ar (car), or (fork), er/ir/ur (her, bird, fur).","example":"car, fork, bird","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write car, fork and bird on cards. Underline ar, or and ir and say: the r is bossy, it changes the vowel sound. Read each slowly: /ar/ in car, /or/ in fork, /er/ in bird.","together":"Read farm together. Ask: Which vowel is next to the r? a. What do a and r say together? /ar/. Blend /f/ /ar/ /m/: farm. Then try turn, and talk about how ur sounds like er.","alone":"Have the child read storm alone. Hint if stuck: or says /or/, like in fork."}},"practice":{"items":[{"prompt":"Read aloud: car, star, park, farm","mode":"tutor","tier":2,"why":"Each word has ar, which says the sound in car: car, star, park, farm. Accept the ar sound, not a short a."},{"prompt":"Read aloud: fork, corn, storm, short","mode":"tutor","tier":2,"why":"Each word has or, which says the sound in fork: fork, corn, storm, short. Accept the or sound in every word."},{"prompt":"Read aloud: her, bird, fur, turn","mode":"tutor","tier":3,"why":"Er, ir and ur all make the same sound, like in her: her, bird, fur, turn. Accept that same sound in every word."},{"prompt":"Which word has 'ar'?","choices":["barn","born","burn"],"answer":"barn","tier":3,"why":"Barn has the letters a and r together, so it has ar. Born has or, and burn has ur."},{"prompt":"Which word has 'or'?","choices":["corn","can"],"answer":"corn","tier":1,"why":"Corn has the letters o and r together, so it has or. Can has no r at all."},{"prompt":"Which word has 'ir'?","choices":["girl","gal"],"answer":"girl","tier":1,"why":"Girl has the letters i and r together, so it has ir. Gal has no r at all."},{"prompt":"Read aloud: shark, sport, shirt, hurt","mode":"tutor","tier":3,"why":"Shark has ar, sport has or, shirt has ir, and hurt has ur. Accept the sh sound at the start of the first three words and the right r sound in each."}]},"reinforcement":"Returns in multi-syllable words.","day":54,"subject":"Reading","sightPaceSeconds":10},{"id":"s-animal-parts","stage":"q2","part":3,"title":"How animals use body parts","summary":"Animal parts help them survive.","prerequisites":["s-animals"],"lesson":{"explanation":"Animals use parts to eat, move and stay safe: beaks, claws, shells, fins, wings.","example":"A turtle hides in its shell.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Show a picture of a turtle and point to its shell. Say: when the turtle is scared it pulls into its hard shell to stay safe. Then point to a bird's beak and say: the bird uses its beak to pick up food.","together":"Look at a picture of a duck together. Ask: What helps it swim? Its webbed feet. What helps it fly? Its wings. What does it eat with? Its bill. Take turns pointing to a part and telling its job.","alone":"Ask the child alone: How does an eagle use its sharp claws? Hint if stuck: think about how an eagle catches and holds its food."}},"practice":{"items":[{"prompt":"Which helps a fish swim?","choices":["Fins","Wings","Paws"],"answer":"Fins","tier":1,"why":"Fish move their fins back and forth to push through the water. Birds have wings, and dogs have paws."},{"prompt":"A bird uses its ___ to eat.","choices":["Beak","Tail","Feathers"],"answer":"Beak","tier":2,"why":"A bird picks up and cracks its food with its beak. Its tail and feathers help it fly, not eat."},{"prompt":"What protects a turtle?","choices":["Shell","Fur","Fins"],"answer":"Shell","tier":2,"why":"A turtle can pull its head and legs into its hard shell to stay safe. Turtles do not have fur or fins on their backs."},{"prompt":"Which helps a bird fly?","choices":["Wings","Shell"],"answer":"Wings","tier":1,"why":"A bird flaps its wings to fly. A shell is hard and heavy and helps animals like turtles stay safe."},{"prompt":"What does an eagle use to grab its food?","choices":["Claws","Fins","Shell"],"answer":"Claws","tier":3,"why":"An eagle grabs its food with the sharp claws on its feet. Fins are for swimming, and a shell is for hiding."},{"prompt":"Pick an animal and tell how one of its body parts helps it eat, move or stay safe.","mode":"tutor","tier":3,"why":"Accept any animal with a true use of a body part, like \"A duck uses its webbed feet to swim\" or \"A turtle hides in its shell to stay safe.\""}]},"reinforcement":"Adaptations in later grades.","day":55,"subject":"Science","sightPaceSeconds":15},{"id":"ss-needs-wants","stage":"q3","part":1,"title":"Needs and wants","summary":"Tell needs from wants.","prerequisites":["ss-helpers"],"lesson":{"explanation":"Needs are things we must have to live: food, water, shelter, clothes. Wants are nice to have.","example":"Water is a need; a toy is a want.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Put a cup of water and a toy car on the table. Hold up the water and say: I must have water to live, so it is a need. Hold up the car and say: a car is fun, but I can live without it, so it is a want.","together":"Sort a coat and a lollipop together. Ask: Could you stay safe in the snow without a coat? Could you live without a lollipop? Then decide together which pile each one goes in: need or want.","alone":"Have the child decide alone whether a bed to sleep in is a need or a want. Hint if stuck: ask yourself, could I live without it?"}},"practice":{"items":[{"prompt":"Is food a need or a want?","choices":["Need","Want"],"answer":"Need","tier":1,"why":"We must eat food to live and grow, so food is a need."},{"prompt":"Is a video game a need or a want?","choices":["Want","Need"],"answer":"Want","tier":1,"why":"A video game is fun, but we can live without it, so it is a want."},{"prompt":"Which is a need?","choices":["Shelter","Candy","Toys"],"answer":"Shelter","tier":2,"why":"Shelter is a home that keeps us safe and warm, and we need it to live. Candy and toys are nice, but we can live without them."},{"prompt":"Is water a need or a want?","choices":["Need","Want"],"answer":"Need","tier":1,"why":"Our bodies must have water to live, so water is a need."},{"prompt":"Is a balloon a need or a want?","choices":["Want","Need"],"answer":"Want","tier":2,"why":"A balloon is fun to play with, but we can live without it, so it is a want."},{"prompt":"Pick the want:","choices":["Toy robot","Water","Coat"],"answer":"Toy robot","tier":2,"why":"A toy robot is fun, but we can live without it, so it is a want. Water and a coat help keep us alive and warm, so they are needs."},{"prompt":"Pick the need:","choices":["Clothes","Stickers","Bubble gum"],"answer":"Clothes","tier":3,"why":"Clothes keep our bodies warm and safe, so they are a need. Stickers and bubble gum are fun, but we can live without them."},{"prompt":"Which one is a want?","choices":["Bed","Food","Bike"],"answer":"Bike","tier":3,"why":"A bike is fun to ride, but we can live without it, so it is a want. A bed and food are needs."}]},"reinforcement":"Saving and spending (money math).","day":56,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-ten-more","stage":"q3","part":1,"title":"10 more and 10 less","summary":"Add or take 10 without counting.","prerequisites":["m-place-value"],"lesson":{"explanation":"Adding 10 changes only the tens digit: 34 → 44. Taking 10 away: 34 → 24.","example":"10 more than 58 is 68","tutorSteps":["Use a 120 chart: move down or up one row.","Use tens rods.","Practice mentally."],"approaches":{"show":"On a 120 chart, put your finger on 34. Slide down one row and say: 10 more is 44. Slide back up two rows and say: 10 less than 44 is 34, and 10 less than 34 is 24. Point out that only the tens digit changed.","together":"Do 10 more than 58 together. Ask: How many tens are in 58? Add one more tens rod: how many tens now? Keep the 8 ones. So what number is it? Say 68 together.","alone":"Have them find 10 less than 72 alone. Hint if stuck: take away one ten and keep the 2 ones."}},"practice":{"generator":"tenMore","params":{"max":100}},"reinforcement":"Mental math with tens in second grade.","day":57,"subject":"Math","sightPaceSeconds":4},{"id":"r-endings-s","stage":"q3","part":1,"title":"Endings -s and -es","summary":"Read plural and verb endings.","prerequisites":["r-digraphs"],"lesson":{"explanation":"Add -s to most words. Add -es after s, x, sh, ch.","example":"cats, boxes, wishes","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write 'cat' and then 'cats', and read both, tapping the s. Then write 'box' and 'boxes' and say: after x we add -es, and it makes an extra beat, box-es.","together":"Read 'wishes' together. Ask: What is the base word? (wish) What sound is at the end of wish? (sh) So which ending do we add, -s or -es? Then read the whole word together.","alone":"Have the child read 'lunches' alone. Hint if stuck: cover the -es, read 'lunch', then add the ending."}},"practice":{"items":[{"prompt":"Read aloud: cats, dogs, runs, hops","mode":"tutor","tier":1,"why":"Each word is a short word plus an s: cat-s, dog-s, run-s, hop-s. Accept an s sound in cats and hops and a z-like sound in dogs and runs."},{"prompt":"Read aloud: boxes, wishes, lunches, buses","mode":"tutor","tier":2,"why":"Each word ends in s, x, sh or ch, so it gets -es, which adds an extra beat: box-es, wish-es, lunch-es, bus-es. Accept two beats in each word."},{"prompt":"Which is right?","choices":["foxes","foxs"],"answer":"foxes","tier":2,"why":"Fox ends with x, and words ending in x get -es. So the right word is foxes."},{"prompt":"Read aloud: hats, pigs","mode":"tutor","tier":1,"why":"Each word is a short word plus s: hat-s, pig-s. Accept an s sound at the end of hats and a z-like sound at the end of pigs."},{"prompt":"Which is right for more than one dog?","choices":["dogs","doges"],"answer":"dogs","tier":1,"why":"Dog does not end in s, x, sh or ch, so we just add s: dogs."},{"prompt":"Which is right for more than one dish?","choices":["dishes","dishs"],"answer":"dishes","tier":3,"why":"Dish ends with sh, and words ending in sh get -es. So the right word is dishes."},{"prompt":"Read aloud: foxes, benches, glasses, bushes","mode":"tutor","tier":3,"why":"Each word ends in x, ch, s or sh, so it gets -es with an extra beat: fox-es, bench-es, glass-es, bush-es. Accept two beats in each word."}]},"reinforcement":"Plural nouns in writing.","day":58,"subject":"Reading","sightPaceSeconds":10},{"id":"w-plurals","stage":"q3","part":1,"title":"Plural nouns","summary":"Write more than one with -s or -es.","prerequisites":["w-nouns","r-endings-s"],"lesson":{"explanation":"Add -s to most nouns, -es after s, x, sh, ch.","example":"one fox, two foxes","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"On paper, write 'one dog, two dogs' and say: most words just get an s. Then write 'one fox, two foxes' and say: fox ends in x, so I add -es. Underline each ending.","together":"Write the plural of 'dish' together. Ask: What is the last sound in dish? Is it s, x, sh or ch? So do we add -s or -es? Let the child write the ending while you watch.","alone":"Have the child write 'more than one box' alone. Hint if stuck: box ends with x, so check the rule for x."}},"practice":{"items":[{"prompt":"More than one bus:","choices":["buses","buss"],"answer":"buses","tier":2,"why":"Bus ends with s, and words ending in s get -es. So more than one bus is buses."},{"prompt":"More than one cat:","choices":["cats","cates"],"answer":"cats","tier":1,"why":"Cat does not end in s, x, sh or ch, so we just add s: cats. Cates is not a word."},{"prompt":"More than one dish:","choices":["dishes","dishs"],"answer":"dishes","tier":3,"why":"Dish ends with sh, so we add -es. More than one dish is dishes."},{"prompt":"More than one hat:","choices":["hats","hates"],"answer":"hats","tier":1,"why":"Hat does not end in s, x, sh or ch, so we just add s: hats. Hates is a different word that means not liking something."},{"prompt":"More than one fox:","choices":["foxes","foxs"],"answer":"foxes","tier":2,"why":"Fox ends with x, so we add -es. More than one fox is foxes."},{"prompt":"More than one bench:","choices":["benches","benchs"],"answer":"benches","tier":3,"why":"Bench ends with ch, so we add -es. More than one bench is benches."},{"prompt":"Write more than one: pig, box, wish","mode":"tutor","tier":3,"why":"Accept pigs, boxes and wishes. Pig just gets s, but box ends with x and wish ends with sh, so they get -es."}]},"reinforcement":"Spelling in all writing.","day":59,"subject":"Writing","sightPaceSeconds":60},{"id":"m-compare-100","stage":"q3","part":1,"title":"Compare two-digit numbers","summary":"Compare by tens first, then ones.","prerequisites":["m-place-value","m-compare-20"],"lesson":{"explanation":"Look at the tens first. If the tens match, compare the ones.","example":"52 > 48 because 5 tens > 4 tens","tutorSteps":["Build both with tens and ones.","Compare tens, then ones.","Write the sign."],"approaches":{"show":"Build 52 and 48 with tens rods and ones cubes. Point to the tens: 5 tens and 4 tens, so 52 is bigger. Write 52 > 48 and show that the open side faces the bigger number.","together":"Compare 63 and 67 together. Ask: How many tens in each? Are the tens the same? Then look at the ones: 3 or 7, which is more? Write 63 < 67 together.","alone":"Have them compare 81 and 79 alone and write the sign. Hint if stuck: look at the tens first."}},"practice":{"generator":"compare","params":{"max":100}},"reinforcement":"Ordering numbers and decimals later.","day":60,"subject":"Math","sightPaceSeconds":5},{"id":"r-endings-ed","stage":"q3","part":1,"title":"Ending -ed","summary":"Read past tense -ed words.","prerequisites":["r-endings-s","r-blends-end"],"lesson":{"explanation":"-ed can sound like /t/ (jumped), /d/ (played) or /ed/ (wanted).","example":"jumped, played, wanted","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Read 'jumped', 'played' and 'wanted' slowly. Say: in jumped the -ed sounds like t, in played it sounds like d, and in wanted it is its own beat, ed. Clap the beats in wanted: want-ed.","together":"Read 'helped' together. Ask: What is the base word? (help) Say help, then add the ending. Does it sound like t, d or ed? Then use it in a sentence: I helped my mom.","alone":"Have the child read 'landed' alone. Hint if stuck: read 'land' first, then add the -ed beat."}},"practice":{"items":[{"prompt":"Read aloud: jumped, helped, kicked","mode":"tutor","tier":1,"why":"In each word the -ed sounds like t: jumpt, helpt, kickt. Accept a quick t sound at the end, with no extra beat."},{"prompt":"Read aloud: played, filled, smiled","mode":"tutor","tier":2,"why":"In each word the -ed sounds like d: playd, filld, smiled. Accept a soft d sound at the end, with no extra beat."},{"prompt":"Read aloud: wanted, landed, melted","mode":"tutor","tier":3,"why":"Each word ends in t or d before the -ed, so -ed adds an extra beat: want-ed, land-ed, melt-ed. Accept two beats in each word."},{"prompt":"Which word tells about the past?","choices":["walked","walks","walking"],"answer":"walked","tier":1,"why":"The -ed ending tells that something already happened, so walked is about the past. Walks and walking are about now."},{"prompt":"Read aloud: kicked, filled","mode":"tutor","tier":1,"why":"Kicked ends with a t sound, like kickt. Filled ends with a d sound, like filld. Accept each with no extra beat."},{"prompt":"Which word tells about yesterday?","choices":["jumps","jumped","jumping"],"answer":"jumped","tier":2,"why":"Jumped has the -ed ending, which tells that it already happened, like yesterday. Jumps and jumping are about now."},{"prompt":"Read aloud: melted, smiled, helped, wanted","mode":"tutor","tier":3,"why":"Melted and wanted end with an extra beat, like ed. Smiled ends with a d sound, and helped ends with a t sound. Accept these three different endings."}]},"reinforcement":"Past tense in writing.","day":61,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-tens","stage":"q3","part":1,"title":"Add and subtract tens","summary":"Add or subtract multiples of 10.","prerequisites":["m-ten-more"],"lesson":{"explanation":"Add the tens like ones: 3 tens + 4 tens = 7 tens = 70.","example":"50 + 30 = 80, 90 − 40 = 50","tutorSteps":["Use tens rods.","Say it as tens: 5 tens + 3 tens.","Practice."],"approaches":{"show":"Lay out 5 tens rods and then 3 more. Count the rods: 1, 2, ... 8 tens. Say: 5 tens plus 3 tens is 8 tens, so 50 plus 30 is 80.","together":"Do 90 minus 40 together. Ask: How many tens rods make 90? Take away 4 rods together. How many tens are left? So what is 90 minus 40?","alone":"Have them solve 60 + 20 alone. Hint if stuck: say it as tens, 6 tens plus 2 tens."}},"practice":{"items":[{"prompt":"30 + 40 = ?","answer":"70","tier":2,"why":"30 is 3 tens and 40 is 4 tens. 3 tens + 4 tens = 7 tens, which is 70."},{"prompt":"50 + 20 = ?","answer":"70","tier":2,"why":"50 is 5 tens and 20 is 2 tens. 5 tens + 2 tens = 7 tens, which is 70."},{"prompt":"60 + 30 = ?","answer":"90","tier":2,"why":"60 is 6 tens and 30 is 3 tens. 6 tens + 3 tens = 9 tens, which is 90."},{"prompt":"80 − 50 = ?","answer":"30","tier":3,"why":"80 is 8 tens and 50 is 5 tens. 8 tens take away 5 tens leaves 3 tens, which is 30."},{"prompt":"90 − 60 = ?","answer":"30","tier":3,"why":"90 is 9 tens and 60 is 6 tens. 9 tens take away 6 tens leaves 3 tens, which is 30."},{"prompt":"40 + 40 = ?","answer":"80","tier":2,"why":"40 is 4 tens. 4 tens + 4 tens = 8 tens, which is 80."},{"prompt":"70 − 20 = ?","answer":"50","tier":3,"why":"70 is 7 tens and 20 is 2 tens. 7 tens take away 2 tens leaves 5 tens, which is 50."},{"prompt":"10 + 80 = ?","answer":"90","tier":2,"why":"10 is 1 ten and 80 is 8 tens. 1 ten + 8 tens = 9 tens, which is 90."},{"prompt":"10 + 10 = ?","answer":"20","tier":1,"why":"10 is 1 ten. 1 ten + 1 ten = 2 tens, which is 20."},{"prompt":"20 + 10 = ?","answer":"30","tier":1,"why":"20 is 2 tens and 10 is 1 ten. 2 tens + 1 ten = 3 tens, which is 30."},{"prompt":"30 − 10 = ?","answer":"20","tier":1,"why":"30 is 3 tens and 10 is 1 ten. 3 tens take away 1 ten leaves 2 tens, which is 20."}]},"reinforcement":"Used in two-digit adding and in rounding.","day":62,"subject":"Math","sightPaceSeconds":5},{"id":"r-endings-ing","stage":"q3","part":1,"title":"Ending -ing","summary":"Read -ing words.","prerequisites":["r-endings-ed","r-ng-nk"],"lesson":{"explanation":"-ing means something is happening now. Short vowel words often double the last letter: run → running.","example":"jumping, running, sitting","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write 'jump' and 'jumping' and read both. Then write 'run' and 'running' and say: run has a short u, so I double the n before -ing. Circle the two n letters.","together":"Read 'sitting' together. Ask: What is the base word? (sit) Is the vowel short? Why are there two t letters? Then read sit-ting together, clapping each beat.","alone":"Have the child read 'hopping' alone. Hint if stuck: cover the -ping and read 'hop' first."}},"practice":{"items":[{"prompt":"Read aloud: jumping, reading, playing","mode":"tutor","tier":1,"why":"Each word is a word plus -ing: jump-ing, read-ing, play-ing. Accept the base word read smoothly with the ing sound at the end."},{"prompt":"Read aloud: running, sitting, hopping","mode":"tutor","tier":2,"why":"Each word has a short vowel, so the last letter doubles before -ing: run-ning, sit-ting, hop-ping. Accept a short vowel sound in each word."},{"prompt":"Which is spelled right?","choices":["running","runing"],"answer":"running","tier":3,"why":"Run has a short u and ends with one n, so we double the n before adding -ing: running."},{"prompt":"Read aloud: going, eating","mode":"tutor","tier":1,"why":"Each word is a word plus -ing: go-ing, eat-ing. Accept the base word said clearly with ing at the end."},{"prompt":"Which -ing word is spelled right?","choices":["playing","plaing"],"answer":"playing","tier":1,"why":"Play keeps all its letters, and we just add -ing: play-ing. Dropping the y makes the wrong spelling plaing."},{"prompt":"Read aloud: swimming, digging, napping","mode":"tutor","tier":2,"why":"Each word has a short vowel, so the last letter doubles before -ing: swim-ming, dig-ging, nap-ping. Accept a short vowel sound in each word."},{"prompt":"Pick the right spelling:","choices":["siting","sitting"],"answer":"sitting","tier":3,"why":"Sit has a short i and ends with one t, so we double the t before adding -ing: sitting. Siting with one t would make the i say its name."}]},"reinforcement":"Used in writing stories.","day":63,"subject":"Reading","sightPaceSeconds":10},{"id":"s-sky","stage":"q3","part":1,"title":"Sun, moon and stars","summary":"Notice patterns in the sky.","prerequisites":["s-senses"],"lesson":{"explanation":"The sun seems to rise in the east and set in the west. The moon's shape seems to change. Stars come out at night.","example":"The sun rises in the morning.","tutorSteps":["Talk about it with a real object or picture.","Do the small activity.","Ask the check questions."],"approaches":{"show":"In the morning, stand with the child facing where the sun comes up and say: that is east, the sun rises here. In the evening, point to where it sets and say: that is west. Show a picture of a full moon and a thin crescent moon.","together":"Look out a window together at night. Ask: Is the sun in the sky? What can we see instead? Is the moon round tonight or thin? Draw the moon together in a notebook.","alone":"Ask the child alone: where does the sun set? Hint if stuck: it sets on the opposite side from where it rises."}},"practice":{"items":[{"prompt":"Where does the sun rise?","choices":["East","West"],"answer":"East","tier":1,"why":"Each morning the sun comes up in the east. It goes down in the west."},{"prompt":"When can we see most stars?","choices":["Night","Noon"],"answer":"Night","tier":1,"why":"Stars are in the sky all the time, but the sun is so bright in the day that we can only see them at night."},{"prompt":"Draw the moon each night for a week.","mode":"tutor","tier":3,"why":"Accept seven drawings, one for each night, that show the moon's shape changing, like getting a little bigger or smaller. Cloudy nights can be marked as cloudy."},{"prompt":"When do we see the sun?","choices":["Day","Night"],"answer":"Day","tier":2,"why":"We see the sun in the day, and that is what makes it light outside. At night our side of Earth is turned away from the sun."},{"prompt":"Where does the sun set?","choices":["West","East"],"answer":"West","tier":2,"why":"The sun goes down in the west each evening. It comes up in the east in the morning."},{"prompt":"Does the moon always look the same shape?","choices":["No","Yes"],"answer":"No","tier":3,"why":"The moon's shape seems to change from night to night. Sometimes it looks round and full, and sometimes it looks like a thin curve."}]},"reinforcement":"Earth and space science later.","day":64,"subject":"Science","sightPaceSeconds":15},{"id":"ss-directions","stage":"q3","part":1,"title":"North, south, east, west","summary":"Use the four cardinal directions.","prerequisites":["ss-maps","s-sky"],"lesson":{"explanation":"North is up on most maps, south is down, east is right, west is left. A compass rose shows them.","example":"Never Eat Soggy Waffles: N, E, S, W clockwise.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Draw a compass rose on paper with north at the top. Point and say: north up, east right, south down, west left. Say 'Never Eat Soggy Waffles' while touching each point going clockwise.","together":"Find east together: ask, where does the sun rise in the morning? Stand facing that way. Then ask: if you face east, which way is behind you? Turn together to face west.","alone":"Show a map and have the child point to south alone. Hint if stuck: south is the opposite of north, which is up."}},"practice":{"items":[{"prompt":"On most maps, north is…","choices":["Up","Down"],"answer":"Up","tier":1,"why":"Maps are drawn with north at the top. So when you look at a map, north is up."},{"prompt":"The sun sets in the…","choices":["West","East"],"answer":"West","tier":2,"why":"The sun comes up in the east in the morning and goes down in the west at night. So the sun sets in the west."},{"prompt":"Which direction is opposite of north?","choices":["South","East"],"answer":"South","tier":2,"why":"North and south point opposite ways. On a map, north is up and south is down."},{"prompt":"On most maps, south is…","choices":["Down","Up"],"answer":"Down","tier":1,"why":"South is the opposite of north. North is at the top of a map, so south is at the bottom, which is down."},{"prompt":"On most maps, east is on the…","choices":["Right","Left"],"answer":"Right","tier":3,"why":"Think of the words Never Eat Soggy Waffles going around clockwise: north is up, then east comes next on the right side."},{"prompt":"Which direction is opposite of east?","choices":["West","North"],"answer":"West","tier":3,"why":"East and west point opposite ways. East is on the right of a map and west is on the left."}]},"reinforcement":"Map reading later.","day":65,"subject":"Social Studies","sightPaceSeconds":15},{"id":"ss-goods-services","stage":"q3","part":2,"title":"Goods and services","summary":"Goods are things; services are work done for you.","prerequisites":["ss-needs-wants"],"lesson":{"explanation":"Goods are things you can buy and hold. Services are jobs people do for you, like a haircut or a dental cleaning.","example":"A teeth cleaning is a service; a toothbrush is a good.","tutorSteps":["Talk about it using the child's own life.","Do the small activity.","Ask the check questions."],"approaches":{"show":"Hold up a toothbrush and say: I can hold this and buy it, so it is a good. Then pretend to brush a doll's hair and say: a hairdresser does this work for you, so it is a service.","together":"Sort a pair of shoes and fixing a car together. Ask: Can you hold it in your hands? Is someone doing a job for you? Put each one in the goods pile or the services pile.","alone":"Have the child decide alone whether a doctor checkup is a good or a service. Hint if stuck: is it a thing you hold or work someone does for you?"}},"practice":{"items":[{"prompt":"A toothbrush is a…","choices":["Good","Service"],"answer":"Good","tier":1,"why":"A toothbrush is a thing you can buy and hold in your hand. Things you can hold are goods."},{"prompt":"A haircut is a…","choices":["Service","Good"],"answer":"Service","tier":2,"why":"A haircut is a job someone does for you. You can't hold it, so it is a service."},{"prompt":"A loaf of bread is a…","choices":["Good","Service"],"answer":"Good","tier":1,"why":"A loaf of bread is a thing you can buy, hold and eat. That makes it a good."},{"prompt":"A book is a…","choices":["Good","Service"],"answer":"Good","tier":2,"why":"You can buy a book and hold it in your hands. Things you can hold are goods."},{"prompt":"Fixing a car is a…","choices":["Service","Good"],"answer":"Service","tier":3,"why":"When a mechanic fixes a car, they are doing a job for you. A job someone does for you is a service."},{"prompt":"Which is a service?","choices":["Mowing a lawn","A ball","An apple"],"answer":"Mowing a lawn","tier":3,"why":"Mowing a lawn is a job someone does for you, so it is a service. A ball and an apple are things you can hold, so they are goods."}]},"reinforcement":"Economics later.","day":66,"subject":"Social Studies","sightPaceSeconds":15},{"id":"m-add-2digit","stage":"q3","part":2,"title":"Add a two-digit and one-digit number","summary":"Add ones to ones; make a new ten if needed.","prerequisites":["m-add-20","m-place-value"],"lesson":{"explanation":"Add the ones first. If they make 10 or more, that makes a new ten.","example":"36 + 7 = 36 + 4 + 3 = 43","tutorSteps":["Build with tens and ones.","Combine ones; trade 10 ones for a ten.","Record the answer."],"approaches":{"show":"Build 36 with 3 tens rods and 6 ones cubes, then add 7 cubes. Move 4 cubes over to make 10 ones and trade them for a ten rod. Count: 4 tens and 3 ones, 43.","together":"Do 58 + 4 together. Ask: How many ones does 58 have? How many more make 10? (2) Trade for a ten. How many ones are left? (2) So 58 + 4 is 62.","alone":"Have them solve 45 + 8 alone. Hint if stuck: add 5 to get to 50, then add the 3 left."}},"practice":{"items":[{"prompt":"24 + 5 = ?","answer":"29","tier":1,"why":"Add the ones: 4 + 5 = 9. Keep the 2 tens. So 24 + 5 = 29."},{"prompt":"36 + 7 = ?","answer":"43","tier":2,"why":"Split 7 into 4 and 3. 36 + 4 = 40, then 40 + 3 = 43."},{"prompt":"58 + 4 = ?","answer":"62","tier":3,"why":"Split 4 into 2 and 2. 58 + 2 = 60, then 60 + 2 = 62."},{"prompt":"71 + 9 = ?","answer":"80","tier":2,"why":"Add the ones: 1 + 9 = 10. That makes a new ten, so 7 tens and 1 more ten is 8 tens. 71 + 9 = 80."},{"prompt":"45 + 8 = ?","answer":"53","tier":3,"why":"Split 8 into 5 and 3. 45 + 5 = 50, then 50 + 3 = 53."},{"prompt":"63 + 6 = ?","answer":"69","tier":1,"why":"Add the ones: 3 + 6 = 9. Keep the 6 tens. So 63 + 6 = 69."},{"prompt":"29 + 3 = ?","answer":"32","tier":2,"why":"Split 3 into 1 and 2. 29 + 1 = 30, then 30 + 2 = 32."},{"prompt":"87 + 5 = ?","answer":"92","tier":3,"why":"Split 5 into 3 and 2. 87 + 3 = 90, then 90 + 2 = 92."},{"prompt":"12 + 3 = ?","answer":"15","tier":1,"why":"Add the ones: 2 + 3 = 5. Keep the 1 ten. So 12 + 3 = 15."}]},"reinforcement":"Leads to two-digit plus two-digit addition.","day":67,"subject":"Math","sightPaceSeconds":8},{"id":"w-spell-cvc","stage":"q3","part":2,"title":"Spell CVC (consonant-vowel-consonant) words","summary":"Spell short-vowel words by sound.","prerequisites":["w-letters","r-cvc"],"lesson":{"explanation":"Stretch the word slowly and write a letter for each sound.","example":"/m/ /a/ /p/ → map","tutorSteps":["Model it on paper while talking through it.","Child tries it.","Check with the checklist and fix one thing."],"approaches":{"show":"Say 'map' slowly, holding up a finger for each sound: /m/ /a/ /p/. Write one letter for each finger while saying the sound, then read the word back.","together":"Spell 'sun' together. Ask: What is the first sound? Write it. What sound is in the middle? Write it. What is the last sound? Then read it together to check.","alone":"Say 'bed' and have the child write it alone. Hint if stuck: stretch it slowly and listen for the middle sound."}},"practice":{"items":[{"prompt":"Tutor says: dog, sun, pig, bed, cat. Child writes them.","mode":"tutor","tier":2,"why":"Each word has three sounds and one letter for each: d-o-g, s-u-n, p-i-g, b-e-d, c-a-t. Accept all five spelled exactly; letters may be a little wobbly."},{"prompt":"Tutor says: fish, chop, duck. Child writes them.","mode":"tutor","tier":3,"why":"Each word has a two-letter team: fish ends with s-h, chop starts with c-h, and duck ends with c-k. Accept f-i-s-h, c-h-o-p and d-u-c-k."},{"prompt":"Tutor says: cat, sit. Child writes them.","mode":"tutor","tier":1,"why":"Stretch each word and write a letter for each sound: c-a-t and s-i-t. Accept both words spelled exactly."},{"prompt":"Tutor says: mat, hop. Child writes them.","mode":"tutor","tier":1,"why":"Stretch each word and write a letter for each sound: m-a-t and h-o-p. Accept both words spelled exactly."},{"prompt":"Tutor says: rug, ten, fox, lip. Child writes them.","mode":"tutor","tier":2,"why":"Each word has three sounds with a short vowel in the middle: r-u-g, t-e-n, f-o-x, l-i-p. Accept all four spelled exactly."},{"prompt":"Tutor says: shop, chin, rock. Child writes them.","mode":"tutor","tier":3,"why":"These words have two-letter teams: shop starts with s-h, chin starts with c-h, and rock ends with c-k. Accept s-h-o-p, c-h-i-n and r-o-c-k."}]},"reinforcement":"Spelling grows with each phonics lesson.","day":68,"subject":"Writing","sightPaceSeconds":60},{"id":"r-compound","stage":"q3","part":2,"title":"Compound words","summary":"Read words made of two smaller words.","prerequisites":["r-blends-start"],"lesson":{"explanation":"A compound word joins two words: sun + set = sunset.","example":"cupcake, rainbow, football","tutorSteps":["Say the sound or pattern and show it in a word.","Child reads each word aloud; tutor marks it.","Use each word in a sentence."],"approaches":{"show":"Write 'sun' and 'set' on two cards. Push them together and read: sunset. Then cover 'cup' in 'cupcake' and show that 'cake' is a word too.","together":"Read 'football' together. Ask: What small word do you see first? (foot) What word is left? (ball) Put them together and say it together: football.","alone":"Have the child read 'starfish' alone. Hint if stuck: cover 'fish' and read the first word."}},"practice":{"items":[{"prompt":"Read aloud: sunset, cupcake, rainbow","mode":"tutor","tier":2,"why":"Each word is two small words joined together: sun-set, cup-cake, rain-bow. Accept each word read smoothly as one word, without a long stop in the middle."},{"prompt":"Read aloud: football, bedroom, starfish","mode":"tutor","tier":3,"why":"Each word is two small words joined together: foot-ball, bed-room, star-fish. Accept each word read smoothly as one word."},{"prompt":"Which is a compound word?","choices":["backpack","basket","button"],"answer":"backpack","tier":2,"why":"Backpack is made of two words, back and pack. Basket and button are not made of two real words."},{"prompt":"bed + time = ?","answer":"bedtime","tier":1,"why":"Put the two words together with no space: bed + time makes bedtime, the time you go to bed."},{"prompt":"cup + cake = ?","answer":"cupcake","tier":1,"why":"Put the two words together with no space: cup + cake makes cupcake, a little cake made in a cup."},{"prompt":"Which word is made of two smaller words?","choices":["rainbow","rabbit","rain"],"answer":"rainbow","tier":2,"why":"Rainbow is made of rain and bow. Rabbit is not two words, and rain is only one word."},{"prompt":"Read aloud: pancake, sailboat, doghouse, snowman","mode":"tutor","tier":3,"why":"Each word is two small words joined: pan-cake, sail-boat, dog-house, snow-man. Accept all four read smoothly as whole words."}]},"reinforcement":"Breaking long words into parts.","day":69,"subject":"Reading","sightPaceSeconds":10},{"id":"m-add-2digit-tens","stage":"q3","part":2,"title":"Add tens to a two-digit number","summary":"Add a multiple of 10 to any two-digit number.","prerequisites":["m-add-tens"],"lesson":{"explanation":"Only the tens change: 34 + 20 → 3 tens + 2 tens = 5 tens, keep 4 ones → 54.","example":"47 + 30 = 77","tutorSteps":["Use a 120 chart: move down rows.","Use tens rods.","Practice."],"approaches":{"show":"Put a finger on 34 on a 120 chart. Move down two rows, saying 44, 54. Say: I added 2 tens, so 34 + 20 is 54. The 4 ones stayed the same.","together":"Do 47 + 30 together with tens rods. Ask: How many tens in 47? Add 3 more rods: how many tens now? How many ones? (still 7) So what is the answer?","alone":"Have them solve 26 + 40 alone. Hint
